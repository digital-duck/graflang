<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --ink: #1c2330; --muted: #5b6678; --paper: #fbfbfa; --line: #dfe3ea;
    --blue: #4f8df5; --gray: #8a919c; --green: #2e9e6b; --orange: #e8913a; --red: #d8473f;
    --code-bg: #0f1623; --code-ink: #dbe4f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9ebef; color: var(--ink);
    font: 26px/1.42 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .deck { position: fixed; inset: 0 0 4.5vh 0; display: grid; place-items: center; }
  .slide { display: none; width: min(96vw, 158vh); height: min(54vw, 89vh); background: var(--paper);
    border-radius: 14px; box-shadow: 0 8px 40px rgba(20,30,50,.18); padding: 4.2% 5.5% 3.5%;
    flex-direction: column; overflow: hidden; position: relative; }
  .slide.on { display: flex; }
  h1 { font-size: 2.5em; line-height: 1.1; margin: 0 0 .3em; letter-spacing: -.02em; }
  h2 { font-size: 1.7em; margin: 0 0 .5em; letter-spacing: -.01em; }
  h2::after { content: ""; display: block; width: 64px; height: 4px; background: var(--blue); border-radius: 2px; margin-top: .25em; }
  h3 { font-size: 1.05em; margin: 0 0 .3em; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0 0 .6em; }
  ul { margin: 0; padding-left: 1.1em; }
  li { margin: .3em 0; }
  li > ul { font-size: .82em; margin-top: .1em; }
  li::marker { color: var(--blue); }
  .sub { color: var(--muted); font-size: 1.15em; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3%; align-items: start; flex: 1; min-height: 0; }
  .cols.wide-left { grid-template-columns: 1.25fr 1fr; }
  .cols.wide-right { grid-template-columns: 1fr 1.25fr; }
  pre, code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code { background: #eef0f4; padding: .05em .35em; border-radius: 4px; font-size: .88em; }
  pre { background: var(--code-bg); color: var(--code-ink); padding: .7em .9em; border-radius: 10px; font-size: .66em; line-height: 1.45;
    margin: 0 0 .6em; overflow: hidden; white-space: pre; }
  pre .c { color: #7d8ba3; } pre .k { color: #8cc4ff; } pre .s { color: #a5e3b4; } pre .h { color: #ffcf7a; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: .6em .9em; }
  .tag { display: inline-block; font-size: .62em; font-weight: 700; padding: .12em .6em; border-radius: 99px; color: #fff; vertical-align: middle; }
  .t-gen { background: var(--blue); } .t-io { background: var(--gray); } .t-sol { background: var(--green); }
  .t-ctl { background: var(--orange); } .t-safe { background: var(--red); }
  table { border-collapse: collapse; width: 100%; font-size: .92em; }
  th, td { text-align: left; padding: .35em .6em; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .85em; text-transform: uppercase; letter-spacing: .05em; }
  .big { font-size: 1.5em; line-height: 1.3; }
  .center { text-align: center; }
  .grow { flex: 1; min-height: 0; }
  .foot { position: absolute; left: 5.5%; right: 5.5%; bottom: 1.8%; display: flex; justify-content: space-between;
    color: #9aa3b2; font-size: .5em; }
  .foot a { color: inherit; text-decoration: underline; }
  .refs a { color: var(--blue); display: block; }
  .refs li { font-size: .78em; }
  .quiet { color: var(--muted); }
  .good { color: var(--green); font-weight: 600; } .bad { color: var(--red); font-weight: 600; }
  .demo { border-left: 6px solid var(--orange); background: #fff6ea; border-radius: 0 10px 10px 0; padding: .5em .9em; margin-bottom: .7em; font-size: .85em; }
  .demo b { color: var(--orange); letter-spacing: .06em; font-size: .8em; text-transform: uppercase; }
  .stack > * { margin-bottom: .45em; }
  svg { max-width: 100%; height: auto; }
  svg text { font: 600 13px system-ui, sans-serif; }
  #bar { position: fixed; left: 0; top: 0; height: 4px; background: var(--blue); width: 0; transition: width .2s; z-index: 5; }
  #nav { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; z-index: 6; }
  #nav button { font: 600 14px system-ui, sans-serif; min-width: 44px; padding: 6px 12px; border-radius: 8px; border: 1px solid #c9ced8;
    background: #fff; color: var(--ink); cursor: pointer; }
  #nav button:hover { background: #eef2fb; border-color: var(--blue); }
  #nav button:disabled { opacity: .4; cursor: default; background: #fff; border-color: #c9ced8; }
  #nav #pdf { margin-left: 10px; }
  #nav #tocbtn { margin-right: 10px; }
  #hud { position: fixed; right: 14px; bottom: 10px; font-size: 13px; color: #7d8696; z-index: 5; }
  .toc { columns: 3; column-gap: 3%; list-style: none; margin: 0; padding: 0; font-size: .8em; }
  .toc li { break-inside: avoid; margin: .22em 0; padding: .12em .3em; border-radius: 6px; cursor: pointer; display: flex; gap: .6em; }
  .toc li:hover { background: #eef2fb; }
  .toc .n { color: var(--blue); font-weight: 700; min-width: 1.6em; text-align: right; }
  .notes { display: none; }
  #notes-box { display: none; }
  body.show-notes #notes-box { display: block; position: fixed; left: 0; right: 0; bottom: 0; max-height: 34vh; overflow: auto;
    background: #141a26; color: #d7deeb; padding: 14px 6vw; font-size: 17px; line-height: 1.5; z-index: 9; }
  @page { size: 13.333in 7.5in; margin: 0; }
  @media print {
    html, body { background: #fff; height: auto; font-size: 24px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .deck { position: static; display: block; }
    .slide { display: flex !important; width: 13.333in; height: 7.5in; border-radius: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    pre { font-size: .58em; }       /* the page is smaller than the screen: keep code lines inside their box */
    #bar, #hud, #nav, .notes, #notes-box { display: none !important; }
  }
</style>
</head>
<body data-title="{{TITLE}}">
<div id="bar"></div>
<div id="nav">
  <button id="tocbtn" title="Outline (T)">TOC</button>
  <button id="first" title="First slide (Home)">&lt;&lt;</button>
  <button id="prev" title="Previous slide (←)">&lt;</button>
  <button id="next" title="Next slide (→ or space)">&gt;</button>
  <button id="last" title="Last slide (End)">&gt;&gt;</button>
  <button id="pdf" title="Opens the print dialog: choose Save as PDF, landscape, margins None, and tick Background graphics">PDF</button>
</div>
<div id="hud">← → or space · T outline · F fullscreen · N notes · O overview</div>
<div class="deck" id="deck">
{{SLIDES}}
</div>

<script>
(function () {
  // the outline slide is built from the other slides' titles, so it cannot drift when a slide is added or renamed
  (function () {
    const all = [...document.querySelectorAll('.slide')], toc = document.getElementById('toc');
    if (!toc) return;
    all.forEach((sl, k) => {
      const h = sl.querySelector('h2');
      if (!h || sl === toc.closest('.slide')) return;
      const li = document.createElement('li');
      li.innerHTML = '<span class="n">' + (k + 1) + '</span><span>' + h.innerHTML + '</span>';
      li.onclick = e => { e.stopPropagation(); window.__show && window.__show(k); };
      toc.appendChild(li);
    });
  })();
  const slides = [...document.querySelectorAll('.slide')];
  const bar = document.getElementById('bar');
  let i = Math.min(Math.max(parseInt(location.hash.slice(1), 10) - 1 || 0, 0), slides.length - 1);
  let overview = false;

  function notesBox() {
    let box = document.getElementById('notes-box');
    if (!box) { box = document.createElement('div'); box.id = 'notes-box'; document.body.appendChild(box); }
    const aside = slides[i].querySelector('.notes');
    box.innerHTML = aside ? aside.innerHTML : '';
  }
  function show(n) {
    i = Math.min(Math.max(n, 0), slides.length - 1);
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    ['first', 'prev'].forEach(id => document.getElementById(id).disabled = i === 0);
    ['next', 'last'].forEach(id => document.getElementById(id).disabled = i === slides.length - 1);
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    history.replaceState(null, '', '#' + (i + 1));
    notesBox();
    // page number in the corner of every slide but the first
    slides.forEach((s, k) => {
      let f = s.querySelector('.foot');
      if (!f && k > 0) { f = document.createElement('div'); f.className = 'foot'; f.innerHTML = '<span></span><span></span>'; f.firstElementChild.textContent = document.body.dataset.title; s.appendChild(f); }
      if (f && k > 0) f.lastElementChild.textContent = (k + 1) + ' / ' + slides.length;
    });
  }
  window.__show = show;
  function toggleOverview() {
    overview = !overview;
    const deck = document.getElementById('deck');
    if (overview) {
      deck.style.cssText = 'position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;place-items:start';
      slides.forEach((s, k) => { s.classList.add('on'); s.style.cssText = 'width:100%;height:auto;aspect-ratio:16/9;font-size:9px;cursor:pointer'; s.onclick = () => { toggleOverview(); show(k); }; });
      document.documentElement.style.overflow = 'auto'; document.body.style.overflow = 'auto';
    } else {
      deck.style.cssText = '';
      slides.forEach(s => { s.style.cssText = ''; s.onclick = null; });
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      show(i);
    }
  }
  const go = (id, f) => document.getElementById(id).addEventListener('click', e => { e.stopPropagation(); if (!overview) f(); });
  const outline = Math.max(0, slides.findIndex(s => s.id === 'outline'));
  go('tocbtn', () => show(outline)); go('first', () => show(0)); go('prev', () => show(i - 1)); go('next', () => show(i + 1)); go('last', () => show(slides.length - 1));
  document.getElementById('pdf').addEventListener('click', () => { if (overview) toggleOverview(); window.print(); });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); if (!overview) show(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); if (!overview) show(i - 1); }
    else if (e.key === 't' || e.key === 'T') { if (!overview) show(outline); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
    else if (e.key === 'o' || e.key === 'O' || e.key === 'Escape' && overview) toggleOverview();
  });
  document.addEventListener('click', e => {
    if (overview || e.target.closest('a, button, pre')) return;
    show(e.clientX > innerWidth / 2 ? i + 1 : i - 1);
  });
  show(i);
})();
</script>
</body>
</html>
