    target: tool_4.trigger
    type: triggers
  - source: tool_3.complete
    target: tool_4.trigger
    type: triggers
  - source: eval_2.fail
    target: tool_4.trigger
    type: triggers
  - source: wf_entry.out_use_solver
    target: tool_4.in_use_solver
    type: binds
  - source: tool_4.complete
    target: eval_3.trigger
    type: triggers
  - source: tool_4.out_use_solver
    target: eval_3.in_use_solver
    type: binds
  - source: eval_3.pass
    target: tool_5.trigger
    type: triggers
  - source: tool_2.out_policy_json
    target: tool_5.in_policy_json
