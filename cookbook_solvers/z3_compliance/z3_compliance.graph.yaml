  - source: tool_1.complete
    target: eval_1.trigger
    type: triggers
  - source: tool_1.out_use_default
    target: eval_1.in_subject
    type: binds
  - source: eval_1.pass
    target: tool_2.trigger
    type: triggers
  - source: eval_1.fail
    target: eval_2.trigger
    type: triggers
  - source: tool_1.out_use_default
    target: eval_2.in_subject
    type: binds
  - source: eval_2.pass
    target: gen_1.trigger
    type: triggers
  - source: wf_entry.out_policy_text
    target: gen_1.in_policy_text
    type: binds
  - source: gen_1.complete
    target: tool_3.trigger
    type: triggers
  - source: gen_1.out_policy_json_raw
    target: tool_3.in_policy_json_raw
