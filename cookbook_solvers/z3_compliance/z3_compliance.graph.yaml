  - source: tool_6.out_tool_6
    target: assert_1.in_tool_6
    type: binds
  - source: assert_1.pass
    target: tool_7.trigger
    type: triggers
  - source: assert_1.fail
    target: tool_7.trigger
    type: triggers
  - source: tool_5.out_z3_result
    target: tool_7.in_z3_result
    type: binds
  - source: tool_2.out_policy_json
    target: tool_7.in_policy_json
    type: binds
  - source: tool_3.out_policy_json
    target: tool_7.in_policy_json
    type: binds
  - source: tool_7.complete
    target: tool_8.trigger
    type: triggers
  - source: tool_5.out_z3_result
    target: tool_8.in_z3_result
    type: binds
  - source: tool_8.complete
    target: gen_2.trigger
    type: triggers
