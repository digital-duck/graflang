  - id: tool_12
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@problem'
        - '@code'
        - '@solution'
        - '@narrative'
        - '@roundtrip'
      code: |
        def format_report(problem: str, code: str, solution_json: str,
                          narrative: str, roundtrip: str) -> str:
            import json
            try:
                sol = json.loads(solution_json)
            except Exception:
                sol = {}
            lines = [
                "# Physics Conservation Check Report",
                "",
                f"**Problem:** {problem.strip()}",
                "",
                f"**Verifier status:** `{sol.get('status', 'Unknown')}`",
                f"**Final velocity (object 1):** `{sol.get('answer', '?')} {sol.get('unit', '')}`",
                f"**Momentum conserved:** `{sol.get('momentum_conserved', '?')}` "
                f"({sol.get('p_before', '?')} -> {sol.get('p_after', '?')})",
                f"**Energy conserved:** `{sol.get('energy_conserved', '?')}` "
                f"({sol.get('ke_before', '?')} -> {sol.get('ke_after', '?')})",
                f"**Round-trip check:** `{roundtrip}`",
                "",
                "## Interpretation", "", narrative.strip(),
                "", "## Solver Code (LLM-generated, NumPy)", "",
                "```python", code.strip(), "```",
            ]
            return "\n".join(lines)
        _spl_result = format_report(problem, code, solution, narrative, roundtrip)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - code
        - solution_json
        - narrative
        - roundtrip
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_code
      - in_solution
      - in_narrative
      - in_roundtrip
      - out_report
  - id: tool_13
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/physics_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/physics_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_out_dir
      - in_ts_safe
      - in_report
      - out_out_path
  - id: tool_14
    type: SOLVE
    config:
      tool: time_elapsed
      backend: kernel
      arguments:
        - '@t_start'
      code: |
        def time_elapsed(start_ts: str) -> str:
            """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
            float string from time_monotonic())."""
            import time as _time
            try:
                return f'{_time.monotonic() - float(start_ts):.1f}'
            except Exception:
                return '?'
        _spl_result = time_elapsed(t_start)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - start_ts
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_t_start
      - out_elapsed
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
