      - complete
      - in_problem_description
      - out_llm_guess
  - id: tool_10
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@llm_guess'
      code: |
        def format_report_solver_off(llm_guess: str) -> str:
            return f'=== Bayesian Optimization (r113) | solver=OFF ===\n\n── LLM CRO Heuristics ──────────────────────────────────────\n{llm_guess}\n\nNote: LLM guesses without modeling uncertainty. Run --param use_solver=true\nto use Bayesian GP+EI to find the optimum efficiently.'
        _spl_result = format_report_solver_off(llm_guess)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - llm_guess
      tool_returns: TEXT
    ports:
