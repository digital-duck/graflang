  - id: gen_1
    type: GENERATE
    config:
      function: explain_bayesian_prompt
      params:
        - bayesian_report
        - problem_description
      prompt_inline: |-
        You are a CRO analyst. scikit-optimize just ran a 25-trial Bayesian optimization.

        PROBLEM:
        {{in_problem_description}}

        BAYESIAN RESULT:
        {{in_bayesian_report}}

        Explain (≤150 words):
        1. Why did Bayesian optimization outperform random search with the same 25-trial budget?
        2. What does "Expected Improvement" mean — how does it decide where to sample next?
        3. The true optimum is at (0.75, 0.85, 0.60) — not at the extremes. Why does CRO often work this way?
        4. When would you use Bayesian optimization vs Optuna TPE (r112)?
      arguments:
        - '@bayesian_report'
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_bayesian_report
      - in_problem_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@bayesian_report'
        - '@explanation'
      code: |
        def format_report_solver_on(bayesian_report: str, explanation: str) -> str:
            return f'=== Bayesian Optimization (r113) | solver=ON ===\n\n{bayesian_report}\n\n── Analyst Explanation ─────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(bayesian_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - bayesian_report
        - explanation
      tool_returns: TEXT
    ports:
