                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(result_json, 'global_obj')
      result: _spl_result
      out_type: TEXT
      tool_params:
