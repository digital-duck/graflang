  - id: gen_1
    type: GENERATE
    config:
      function: explain_global_result_prompt
      params:
        - result_report
        - problem_description
      prompt_inline: |-
        You are an optimization analyst explaining global MINLP results.

        PROBLEM:
        {{in_problem_description}}

        GLOBAL SOLVER RESULT:
        {{in_result_report}}

        Explain (≤200 words):
        1. What is spatial branch-and-bound, and how does it certify a global optimum
           (unlike scipy which only certifies a local one)?
        2. Why did the local solver (scipy) land at a suboptimal solution?
           What made the yield surface non-convex?
        3. What is the "optimality gap" shown in the report, and when is it safe to stop?
        4. Name two real industrial processes where certifying the global optimum
           (not just a local one) is worth the extra compute cost.
      arguments:
        - '@result_report'
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_result_report
      - in_problem_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@result_report'
        - '@explanation'
      code: |
        def format_report_solver_on(result_report: str, explanation: str) -> str:
            return f'=== Global MINLP — Reactor Optimization (r122) | solver=ON ===\n\n{result_report}\n\n── Analyst Explanation ─────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(result_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_report
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result_report
      - in_explanation
      - out_report
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''false'''
      branch: 2
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_2
    type: GENERATE
    config:
      function: reactor_design_prompt
      params:
        - problem_description
      prompt_inline: |-
        You are a chemical process engineer advising on reactor design.

        OPTIMIZATION PROBLEM:
        {{in_problem_description}}

        Without running any optimization algorithm:
        1. Should the catalyst be used? Why or why not (consider yield boost vs cost)?
        2. What temperature would you recommend (300–750 K)? Consider the Arrhenius tradeoff:
           higher T increases reaction rate but also drives competing side reactions.
        3. What concentration would you choose (0.1–2.0 mol/L)?
        4. Estimate the net yield (reaction yield minus energy and catalyst cost) you expect.
        5. What makes this problem hard for local optimization methods?

        Be specific with parameter values and reasoning.
      arguments:
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_problem_description
      - out_llm_guess
  - id: tool_10
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@llm_guess'
      code: |
        def format_report_solver_off(llm_guess: str) -> str:
            return f'=== Global MINLP — Reactor Optimization (r122) | solver=OFF ===\n\n── LLM Chemical Engineering Intuition ──────────────────────\n{llm_guess}\n\nNote: LLM reasoning cannot certify global optimality on non-convex surfaces.\nRun --param use_solver=true for Couenne/Bonmin global certification.'
        _spl_result = format_report_solver_off(llm_guess)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - llm_guess
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_llm_guess
      - out_report
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
