  - id: tool_11
    type: SOLVE
    config:
      tool: result_ok
      backend: kernel
      arguments:
        - '@solution'
      code: |
        import json

        def result_ok(result_json: str) -> bool:
            """RESULT_OK(result_json) — ASSERT gate: True only when result_json's
            'status' field is exactly "OK"."""
            try:
                return json.loads(result_json).get('status') == 'OK'
            except Exception:
                return False
        _spl_result = result_ok(solution)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - result_json
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_solution
      - out_tool_11
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_11'
    ports:
      - trigger
      - pass
      - fail
      - in_solution
      - in_tool_11
  - id: tool_12
    type: SOLVE
    config:
      tool: classify_roundtrip
      backend: kernel
      arguments:
        - '@solution'
      code: |
        def classify_roundtrip(result_json: str) -> str:
            """Round-trip check: does the LLM's SQL result set row-diff-match
            (order-insensitive, float-tolerant) an independently-authored
            ground-truth query over the same seeded data?

            Returns 'match' / 'mismatch' / 'unverifiable'.
            """
            import json
            try:
                d = json.loads(result_json)
            except Exception:
                return "unverifiable"
            if "row_match" not in d:
                return "unverifiable"
            return "match" if d["row_match"] else "mismatch"
        _spl_result = classify_roundtrip(solution)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_solution
      - out_roundtrip
  - id: gen_4
    type: GENERATE
    config:
      function: interpret_sql_result
      params:
        - question
        - solution_json
      prompt_inline: |-
        You are a data engineer. Interpret this VERIFIED, quality-gated SQL
        result for a general audience.

        Question: {{in_question}}

        Verified result (JSON — referential integrity confirmed, the same
        statistic independently recomputed two structurally different ways
        and confirmed to agree, and the result set row-diffed against an
        independently-authored ground-truth query — trust it completely, do
        not re-derive it):
        {{in_solution_json}}

        Provide a concise interpretation (under 100 words):
        1. Restate what the question asks
        2. State the answer, referencing the exact rows/values from the JSON
        3. One sentence on why the two-independent-ways and referential-
           integrity checks matter for trusting this number in production

        End your response with a line in EXACTLY this format (no extra words):
        Final answer: verified
      arguments:
        - '@question'
        - '@solution'
    ports:
      - trigger
      - complete
      - in_question
      - in_solution_json
      - out_narrative
  - id: tool_13
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@question'
        - '@sql'
        - '@solution'
        - '@narrative'
        - '@roundtrip'
      code: |
        def format_report(problem: str, sql: str, solution_json: str,
                          narrative: str, roundtrip: str) -> str:
            import json
            try:
                sol = json.loads(solution_json)
            except Exception:
                sol = {}
            lines = [
                "# Text-to-SQL with Data-Quality Gates Report",
                "",
                f"**Question:** {problem.strip()}",
                "",
                f"**Verifier status:** `{sol.get('status', 'Unknown')}`",
                f"**Rows returned:** `{sol.get('answer', '?')}`",
                f"**Referential integrity:** `{sol.get('referential_ok', '?')}`",
                f"**Two-independent-ways stat agreement:** `{sol.get('two_way_ok', '?')}` "
                f"(AVG={sol.get('stat_a', '?')}, SUM/COUNT={sol.get('stat_b', '?')})",
                f"**Row-level round-trip vs ground truth:** `{roundtrip}`",
                "",
                "## Interpretation", "", narrative.strip(),
                "", "## Generated SQL (LLM)", "",
                "```sql", sql.strip(), "```",
            ]
            return "\n".join(lines)
        _spl_result = format_report(question, sql, solution, narrative, roundtrip)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - sql
        - solution_json
        - narrative
        - roundtrip
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_question
      - in_sql
      - in_solution
      - in_narrative
      - in_roundtrip
      - out_report
  - id: tool_14
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/text2sql_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/text2sql_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_out_dir
      - in_ts_safe
      - in_report
      - out_out_path
  - id: tool_15
    type: SOLVE
    config:
      tool: time_elapsed
      backend: kernel
      arguments:
        - '@t_start'
      code: |
        def time_elapsed(start_ts: str) -> str:
            """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
            float string from time_monotonic())."""
            import time as _time
            try:
                return f'{_time.monotonic() - float(start_ts):.1f}'
            except Exception:
                return '?'
        _spl_result = time_elapsed(t_start)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - start_ts
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_t_start
      - out_elapsed
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
