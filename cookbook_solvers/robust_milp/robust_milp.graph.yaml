  - id: tool_10
    type: SOLVE
    config:
      tool: verify_robust_off
      backend: kernel
      arguments:
        - '@problem_json'
        - '@heuristic_json'
      code: |
        import json

        def verify_robust_off(problem_json: str, solution_json: str) -> str:
            """Verify that the heuristic solution satisfies all scenario constraints."""
            try:
                data = json.loads(problem_json)
                sol = json.loads(solution_json)
            except Exception as e:
                return json.dumps({'verdict': 'ERROR', 'error': str(e)})
            cap_own = float(data['capacity_own'])
            cap_lease = float(data.get('capacity_lease', cap_own * 0.5))
            build = sol.get('build_factory', 0)
            capacity = cap_own if build else cap_lease
            plans = sol.get('scenario_plans', [])
            violations = []
            for p in plans:
                prod = float(p.get('production', 0))
                emerg = float(p.get('emergency', 0))
                demand = float(p.get('demand', 0))
                if prod > capacity + 1e-06:
                    violations.append(f"{p['scenario']}: production {prod:.1f} > capacity {capacity:.1f}")
                if prod + emerg < demand - 1e-06:
                    violations.append(f"{p['scenario']}: supply {prod + emerg:.1f} < demand {demand:.1f}")
            if violations:
                return json.dumps({'verdict': 'FAIL', 'notes': '; '.join(violations)})
            return json.dumps({'verdict': 'PASS', 'notes': f'All {len(plans)} scenario constraints satisfied'})
        _spl_result = verify_robust_off(problem_json, heuristic_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
        - solution_json
      tool_returns: TEXT
    ports:
