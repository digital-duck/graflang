        import json

        def format_scenario_report(solution_json: str) -> str:
            """Format scenario plans as a markdown table."""
            try:
                data = json.loads(solution_json)
                plans = data.get('scenario_plans', [])
                build = data.get('build_factory', '?')
                cap = data.get('capacity_used', '?')
                fixed = data.get('fixed_cost', 0)
                exp_op = data.get('expected_op_cost', '?')
                exp = data.get('expected_cost', '?')
                decision = f'**Build own factory** (capacity {cap} units, fixed cost ${fixed:,.0f})' if build else f'**Lease facility** (capacity {cap} units, no fixed cost)'
                lines = [f'Decision: {decision}', '', '| Scenario | Prob | Demand | Own/Lease prod | Emergency | Scenario cost |', '|---|---|---|---|---|---|']
                for p in plans:
                    lines.append(f"| {p['scenario']} | {p['probability']:.0%} | {p['demand']:.0f} | {p['production']:.0f} | {p['emergency']:.0f} | ${p['scenario_cost']:,.0f} |")
                lines += ['', f'**Fixed cost:** ${fixed:,.0f}  ', f'**Expected operational cost:** ${exp_op:,.0f}  ', f'**Total expected cost:** ${exp:,.0f}']
                return '\n'.join(lines)
            except Exception as e:
                return f'Error formatting report: {e}'
        _spl_result = format_scenario_report(solution_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - solution_json
      tool_returns: TEXT
