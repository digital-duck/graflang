            m = Model('robust_supply')
            m.verbose = 0
            y = m.add_var(name='build', var_type=BINARY)
            x = [m.add_var(name=f'produce_s{i}', lb=0, ub=cap_own, var_type=CONTINUOUS) for i in range(len(scenarios))]
            z = [m.add_var(name=f'emergency_s{i}', lb=0, var_type=CONTINUOUS) for i in range(len(scenarios))]
            m.objective = minimize(cost_build * y + xsum((s['probability'] * (cost_produce * x[i] + cost_emerg * z[i]) for i, s in enumerate(scenarios))))
            for i, s in enumerate(scenarios):
                m += (x[i] <= cap_own * y + cap_lease * (1 - y), f'cap_s{i}')
                m += (x[i] + z[i] >= s['demand'], f'demand_s{i}')
            m.optimize()
            if m.status == OptimizationStatus.OPTIMAL:
                build_flag = int(round(float(y.x or 0)))
                plans = []
                for i, s in enumerate(scenarios):
                    prod = float(x[i].x or 0)
                    emerg = float(z[i].x or 0)
                    sc_cost = cost_produce * prod + cost_emerg * emerg
                    plans.append({'scenario': s['name'], 'probability': s['probability'], 'demand': s['demand'], 'production': round(prod, 2), 'emergency': round(emerg, 2), 'scenario_cost': round(sc_cost, 2)})
                return json.dumps({'status': 'OPTIMAL', 'build_factory': build_flag, 'capacity_used': cap_own if build_flag else cap_lease, 'fixed_cost': cost_build * build_flag, 'expected_op_cost': round(sum((p['probability'] * p['scenario_cost'] for p in plans)), 2), 'expected_cost': round(float(m.objective_value), 2), 'scenario_plans': plans, 'objective': round(float(m.objective_value), 2)})
            else:
                return json.dumps({'status': m.status.name, 'objective': None})
        _spl_result = solve_robust_milp(problem_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_solution_json
  - id: gen_2
    type: GENERATE
    config:
      function: interpret_heuristic
      params:
        - problem
        - heuristic_json
        - milp_json
      prompt_inline: |-
        Compare a naive expected-demand heuristic solution against the MILP optimum.

        Problem: {{in_problem}}

        Heuristic solution (naive, expected demand): {{in_heuristic_json}}
        MILP optimal solution: {{in_milp_json}}

        Explain:
        1. What decision did the heuristic make, and why (based on expected demand)?
        2. What decision did the MILP make?
        3. If they differ: how much does the heuristic cost more than the MILP optimum? Why?
        4. What does this illustrate about scenario-based optimization vs. expected-value reasoning?

        Be precise and show the cost gap in dollars.
      arguments:
        - '@problem'
        - '@heuristic_json'
        - '@solution_json'
    ports:
      - trigger
      - complete
      - in_problem
      - in_heuristic_json
      - in_milp_json
      - out_comparison
  - id: set_7
    type: CONTEXT
    config:
      action: set
      expression: '@in_llm_calls + 1'
    ports:
      - trigger
      - complete
      - in_llm_calls
      - out_llm_calls
  - id: tool_14
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@problem'
        - '@heuristic_table'
        - '@comparison'
        - '@verify_status'
        - '@llm_calls'
      code: |
        def format_report_solver_off(problem: str, heuristic_table: str, comparison: str, verify_status: str, llm_calls: str) -> str:
            return f'=== Robust Supply Chain MILP (solver=OFF / naive heuristic) ===\n\nProblem:\n{problem}\n\nNaive Heuristic Solution:\n{heuristic_table}\n\nHeuristic vs MILP Comparison:\n{comparison}\n\nVerification: {verify_status}\nLLM calls: {llm_calls}'
        _spl_result = format_report_solver_off(problem, heuristic_table, comparison, verify_status, llm_calls)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - heuristic_table
        - comparison
        - verify_status
        - llm_calls
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_heuristic_table
      - in_comparison
      - in_verify_status
      - in_llm_calls
      - out_report
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
