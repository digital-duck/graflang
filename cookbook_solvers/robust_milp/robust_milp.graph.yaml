version: 1.0-graph
workflow:
  name: robust_milp
  inputs:
    - name: problem
      type: TEXT
      default: 'A manufacturer must decide whether to build its own factory (capacity 300 units, one-time cost $4,000) or lease a smaller facility (capacity 150 units, no fixed cost) for Q2 production. Production cost from either: $8/unit. Emergency spot-market sourcing if demand exceeds capacity: $60/unit. Demand is uncertain: Low demand 100 units (30% probability), Normal demand 200 units (50% probability), High demand 300 units (20% probability). Find the capacity investment decision that minimizes expected total cost.'
    - name: use_solver
      type: TEXT
      default: 'true'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_use_solver
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
      - out_solution_json
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
