version: 1.0-graph
workflow:
  name: code_pytest
  inputs:
    - name: spec
      type: TEXT
      default: Write a Python function merge_sorted(a, b) that merges two sorted lists into one sorted list without using sorted() or list.sort(). Both input lists contain integers and are already sorted ascending. The function must run in O(n+m) time.
    - name: max_tries
      type: INTEGER
      default: 3
    - name: out_dir
      type: TEXT
      default: ./cookbook/79_code_pytest/output
  outputs:
    - name: report
      type: TEXT
resources:
  procedures:
    gen_code: ./code_pytest.spl
    gen_tests: ./code_pytest.spl
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_spec
      - out_max_tries
      - out_out_dir
  - id: tool_1
    type: SOLVE
    config:
      tool: time_monotonic
      backend: kernel
      arguments: []
      code: |
        def time_monotonic() -> str:
            """TIME_MONOTONIC() — current value of a monotonic clock, as a string.
            Pair with time_elapsed() to measure elapsed wall-clock time."""
            import time as _time
            return str(_time.monotonic())
        _spl_result = time_monotonic()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_t_start
  - id: tool_2
    type: SOLVE
    config:
      tool: time_now
      backend: kernel
      arguments: []
      code: |
        import datetime

        def time_now() -> str:
            """TIME_NOW() — current local time as a filesystem-safe string:
            YYYY-MM-DD_HH-MM-SS."""
            return datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
        _spl_result = time_now()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_ts_safe
  - id: fork_1
    type: FORK
    ports:
      - trigger
      - branch_1
      - branch_2
  - id: call_1
    type: GENERATE
    config:
      procedure_ref: procedures.gen_code
      arguments:
        - '@spec'
    ports:
      - trigger
      - complete
      - in_spec
      - out_code
  - id: call_2
    type: GENERATE
    config:
      procedure_ref: procedures.gen_tests
      arguments:
        - '@spec'
    ports:
      - trigger
      - complete
      - in_spec
      - out_tests
  - id: join_1
    type: JOIN
    ports:
      - trigger
      - complete
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_tries
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''init'''
    ports:
      - trigger
      - complete
      - out_status
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_tries, @tries) < @in_max_tries
      outputs:
        pytest_result:
          from: tool_3.out_pytest_result
        run_status:
          from: tool_4.out_run_status
        summary:
          from: tool_5.out_summary
        tries:
          from:
            - set_4.out_tries
            - set_3.out_tries
        failure_output:
          from: tool_6.out_failure_output
        code:
          from: gen_1.out_code
      subgraph:
        nodes:
          - id: tool_3
            type: SOLVE
            config:
              tool: run_pytest
              backend: kernel
              arguments:
                - '@code'
                - '@tests'
              code: |
                def run_pytest(code: str, tests: str) -> str:
                    """Execute LLM-generated code against LLM-generated tests. Returns JSON.

                    Both code and tests are written to a temp directory that is removed
                    after the subprocess exits — no filesystem side effects.
                    Returns {"passed": N, "failed": M, "returncode": R, "output": "..."}
                    """
                    import json, re, subprocess, tempfile, os

                    # Strip markdown fences the LLM occasionally emits
                    def _strip(src: str) -> str:
                        src = re.sub(r'^```(?:python)?\s*\n?', '', src.strip(), flags=re.IGNORECASE)
                        return re.sub(r'\n?```\s*$', '', src)
                    code  = _strip(code)
                    tests = _strip(tests)

                    with tempfile.TemporaryDirectory() as tmpdir:
                        with open(os.path.join(tmpdir, "solution.py"), "w") as f:
                            f.write(code)
                        test_src = "from solution import *\n\n" + tests
                        with open(os.path.join(tmpdir, "test_solution.py"), "w") as f:
                            f.write(test_src)

                        proc = subprocess.run(
                            ["python", "-m", "pytest", "test_solution.py",
                             "-v", "--tb=short", "--no-header", "-q"],
                            capture_output=True, text=True, cwd=tmpdir,
                        )
                        out = proc.stdout + proc.stderr
                        passed = failed = 0
                        for line in out.splitlines():
                            pm = re.search(r"(\d+) passed", line)
                            fm = re.search(r"(\d+) failed", line)
                            if pm: passed = int(pm.group(1))
                            if fm: failed = int(fm.group(1))

                        return json.dumps({
                            "passed": passed,
                            "failed": failed,
                            "returncode": proc.returncode,
                            "output": out[-3000:],
                        })
                _spl_result = run_pytest(code, tests)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - tests
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_code
              - in_tests
              - out_pytest_result
          - id: tool_4
            type: SOLVE
            config:
              tool: get_pytest_status
              backend: kernel
              arguments:
                - '@pytest_result'
              code: |
                def get_pytest_status(pytest_json: str) -> str:
                    """Return 'passed' or 'failed' — clean string for EVALUATE branching."""
                    import json
                    try:
                        d = json.loads(pytest_json)
                        if d.get("returncode", 1) == 0 and d.get("failed", 1) == 0 and d.get("passed", 0) > 0:
                            return "passed"
                        return "failed"
                    except Exception:
                        return "failed"
                _spl_result = get_pytest_status(pytest_result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - pytest_json
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_pytest_result
              - out_run_status
          - id: tool_5
            type: SOLVE
            config:
              tool: get_pytest_summary
              backend: kernel
              arguments:
                - '@pytest_result'
              code: |
                def get_pytest_summary(pytest_json: str) -> str:
                    import json
                    try:
                        d = json.loads(pytest_json)
                        return f"{d.get('passed',0)} passed, {d.get('failed',0)} failed (exit {d.get('returncode',1)})"
                    except Exception:
                        return "unknown"
                _spl_result = get_pytest_summary(pytest_result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - pytest_json
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_pytest_result
              - out_summary
          - id: set_3
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: eval_1
            type: EVALUATE
            config:
              condition: '@in_run_status == ''passed'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_run_status
          - id: set_4
            type: CONTEXT
            config:
              action: set
              expression: '@in_max_tries'
            ports:
              - trigger
              - complete
              - in_max_tries
              - out_tries
          - id: tool_6
            type: SOLVE
            config:
              tool: get_pytest_output
              backend: kernel
              arguments:
                - '@pytest_result'
              code: |
                def get_pytest_output(pytest_json: str) -> str:
                    import json
                    try:
                        return json.loads(pytest_json).get("output", pytest_json)
                    except Exception:
                        return pytest_json
                _spl_result = get_pytest_output(pytest_result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - pytest_json
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_pytest_result
              - out_failure_output
          - id: gen_1
            type: GENERATE
            config:
              function: repair_code
              params:
                - spec
                - code
                - test_output
              prompt_inline: |-
                This Python code failed one or more pytest tests.

                Specification:
                {{in_spec}}

                Current code:
                {{in_code}}

                Pytest failure output:
                {{in_test_output}}

                Fix the code so all tests pass. Common causes:
                - Off-by-one error
                - Missing edge case handling (empty input, single element, duplicates)
                - Wrong return type
                - Incorrect algorithm logic

                Output ONLY the corrected Python code — no markdown fences, no commentary.
              arguments:
                - '@spec'
                - '@code'
                - '@failure_output'
            ports:
              - trigger
              - complete
              - in_spec
              - in_code
              - in_test_output
              - out_code
        edges:
          - source: tool_3.complete
            target: tool_4.trigger
            type: triggers
          - source: tool_3.out_pytest_result
            target: tool_4.in_pytest_result
            type: binds
          - source: tool_4.complete
            target: tool_5.trigger
            type: triggers
          - source: tool_3.out_pytest_result
            target: tool_5.in_pytest_result
            type: binds
          - source: tool_5.complete
            target: set_3.trigger
            type: triggers
          - source: set_3.complete
            target: eval_1.trigger
            type: triggers
          - source: tool_4.out_run_status
            target: eval_1.in_run_status
            type: binds
          - source: eval_1.pass
            target: set_4.trigger
            type: triggers
          - source: eval_1.fail
            target: tool_6.trigger
            type: triggers
          - source: tool_3.out_pytest_result
            target: tool_6.in_pytest_result
            type: binds
          - source: tool_6.complete
            target: gen_1.trigger
            type: triggers
          - source: tool_6.out_failure_output
            target: gen_1.in_test_output
            type: binds
    ports:
      - trigger
      - loop
      - exit
      - in_code
      - in_tests
      - in_tries
      - in_max_tries
      - in_spec
      - out_pytest_result
      - out_run_status
      - out_summary
      - out_tries
      - out_failure_output
      - out_code
  - id: tool_7
    type: SOLVE
    config:
      tool: get_pytest_summary
      backend: kernel
      arguments:
        - '@pytest_result'
      code: |
        def get_pytest_summary(pytest_json: str) -> str:
            import json
            try:
                d = json.loads(pytest_json)
                return f"{d.get('passed',0)} passed, {d.get('failed',0)} failed (exit {d.get('returncode',1)})"
            except Exception:
                return "unknown"
        _spl_result = get_pytest_summary(pytest_result)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - pytest_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_pytest_result
      - out_final_summary
  - id: tool_8
    type: SOLVE
    config:
      tool: all_tests_passed
      backend: kernel
      arguments:
        - '@pytest_result'
      code: |
        def all_tests_passed(pytest_json: str) -> bool:
            """ASSERT gate: True only when pytest exits 0 and at least one test passed."""
            import json
            try:
                d = json.loads(pytest_json)
                return (d.get("returncode", 1) == 0
                        and d.get("failed", 1) == 0
                        and d.get("passed", 0) > 0)
            except Exception:
                return False
        _spl_result = all_tests_passed(pytest_result)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - pytest_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_pytest_result
      - out_tool_8
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_8'
    ports:
      - trigger
      - pass
      - fail
      - in_pytest_result
      - in_tool_8
  - id: gen_2
    type: GENERATE
    config:
      function: explain_solution
      params:
        - spec
        - code
        - pytest_json
      prompt_inline: |-
        You are a software engineer. Explain this verified solution to a reader
        who is familiar with Python but not with the specific problem.

        Specification: {{in_spec}}

        Final code:
        {{in_code}}

        Test result summary: {{in_pytest_json}}

        In 3-5 sentences: explain the algorithm, highlight any edge cases handled,
        and confirm what the pytest result proves. Write plain English, no code blocks.
      arguments:
        - '@spec'
        - '@code'
        - '@pytest_result'
    ports:
      - trigger
      - complete
      - in_spec
      - in_code
      - in_pytest_json
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@spec'
        - '@code'
        - '@tests'
        - '@pytest_result'
        - '@explanation'
      code: |
        def format_report(spec: str, code: str, tests: str,
                          pytest_json: str, explanation: str) -> str:
            import json, re
            def _strip_fences(src: str) -> str:
                src = re.sub(r'^```(?:python)?\s*\n?', '', src.strip(), flags=re.IGNORECASE)
                return re.sub(r'\n?```\s*$', '', src)
            code  = _strip_fences(code)
            tests = _strip_fences(tests)
            try:
                d = json.loads(pytest_json)
                summary = f"{d.get('passed',0)} passed / {d.get('failed',0)} failed"
                status  = "VERIFIED" if d.get("returncode", 1) == 0 else "UNVERIFIED"
            except Exception:
                summary, status = "unknown", "UNVERIFIED"

            return "\n".join([
                "# Code Generation Report",
                "",
                f"**Status:** `{status}` — {summary}",
                "",
                f"**Spec:** {spec.strip()}",
                "",
                "## Generated Code",
                "",
                "```python",
                code.strip(),
                "```",
                "",
                "## Generated Tests (from spec, independent of code)",
                "",
                "```python",
                tests.strip(),
                "```",
                "",
                "## Pytest Output",
                "",
                "```",
                d.get("output", "").strip() if isinstance(d, dict) else pytest_json,
                "```",
                "",
                "## Explanation",
                "",
                explanation.strip(),
            ])
        _spl_result = format_report(spec, code, tests, pytest_result, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - spec
        - code
        - tests
        - pytest_json
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_spec
      - in_code
      - in_tests
      - in_pytest_result
      - in_explanation
      - out_report
  - id: tool_10
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/code_pytest_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/code_pytest_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_out_dir
      - in_ts_safe
      - in_report
      - out_out_path
  - id: tool_11
    type: SOLVE
    config:
      tool: time_elapsed
      backend: kernel
      arguments:
        - '@t_start'
      code: |
        def time_elapsed(start_ts: str) -> str:
            """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
            float string from time_monotonic())."""
            import time as _time
            try:
                return f'{_time.monotonic() - float(start_ts):.1f}'
            except Exception:
                return '?'
        _spl_result = time_elapsed(t_start)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - start_ts
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_t_start
      - out_elapsed
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
edges:
  - source: wf_entry.entry
    target: tool_1.trigger
    type: triggers
  - source: tool_1.complete
    target: tool_2.trigger
    type: triggers
  - source: tool_2.complete
    target: fork_1.trigger
    type: triggers
  - source: fork_1.branch_1
    target: call_1.trigger
    type: triggers
  - source: wf_entry.out_spec
    target: call_1.in_spec
    type: binds
  - source: fork_1.branch_2
    target: call_2.trigger
    type: triggers
  - source: wf_entry.out_spec
    target: call_2.in_spec
    type: binds
  - source: call_1.complete
    target: join_1.trigger
    type: triggers
  - source: call_2.complete
    target: join_1.trigger
    type: triggers
  - source: join_1.complete
    target: set_1.trigger
    type: triggers
  - source: set_1.complete
    target: set_2.trigger
    type: triggers
  - source: set_2.complete
    target: loop_1.trigger
    type: triggers
  - source: call_1.out_code
    target: loop_1.in_code
    type: binds
  - source: call_2.out_tests
    target: loop_1.in_tests
    type: binds
  - source: set_1.out_tries
    target: loop_1.in_tries
    type: binds
  - source: wf_entry.out_max_tries
    target: loop_1.in_max_tries
    type: binds
  - source: wf_entry.out_spec
    target: loop_1.in_spec
    type: binds
  - source: loop_1.exit
    target: tool_7.trigger
    type: triggers
  - source: loop_1.out_pytest_result
    target: tool_7.in_pytest_result
    type: binds
  - source: tool_7.complete
    target: tool_8.trigger
    type: triggers
  - source: loop_1.out_pytest_result
    target: tool_8.in_pytest_result
    type: binds
  - source: tool_8.complete
    target: assert_1.trigger
    type: triggers
  - source: loop_1.out_pytest_result
    target: assert_1.in_pytest_result
    type: binds
  - source: tool_8.out_tool_8
    target: assert_1.in_tool_8
    type: binds
  - source: assert_1.pass
    target: gen_2.trigger
    type: triggers
  - source: assert_1.fail
    target: gen_2.trigger
    type: triggers
  - source: wf_entry.out_spec
    target: gen_2.in_spec
    type: binds
  - source: loop_1.out_code
    target: gen_2.in_code
    type: binds
  - source: loop_1.out_pytest_result
    target: gen_2.in_pytest_json
    type: binds
  - source: gen_2.complete
    target: tool_9.trigger
    type: triggers
  - source: wf_entry.out_spec
    target: tool_9.in_spec
    type: binds
  - source: loop_1.out_code
    target: tool_9.in_code
    type: binds
  - source: call_2.out_tests
    target: tool_9.in_tests
    type: binds
  - source: loop_1.out_pytest_result
    target: tool_9.in_pytest_result
    type: binds
  - source: gen_2.out_explanation
    target: tool_9.in_explanation
    type: binds
  - source: tool_9.complete
    target: tool_10.trigger
    type: triggers
  - source: wf_entry.out_out_dir
    target: tool_10.in_out_dir
    type: binds
  - source: tool_2.out_ts_safe
    target: tool_10.in_ts_safe
    type: binds
  - source: tool_9.out_report
    target: tool_10.in_report
    type: binds
  - source: tool_10.complete
    target: tool_11.trigger
    type: triggers
  - source: tool_1.out_t_start
    target: tool_11.in_t_start
    type: binds
  - source: tool_9.out_report
    target: wf_exit.in_report
    type: binds
  - source: tool_11.complete
    target: wf_exit.trigger
    type: triggers
