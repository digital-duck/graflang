  - id: tool_2
    type: SOLVE
    config:
      tool: solve_job_shop
      backend: kernel
      arguments:
        - '@problem_json'
      code: |
        import json

        from typing import Any

        from spl.stdlib import strip_fences as _strip_fences

        def solve_job_shop(problem_json: str) -> str:
            """
            Solve a job-shop scheduling problem using OR-Tools CP-SAT.
            Input: JSON string with keys: jobs, machines, deadline (optional)
            Returns: JSON with keys: status, makespan, schedule, solver_log
            """
            from ortools.sat.python import cp_model
            try:
                data = json.loads(_strip_fences(problem_json))
            except Exception as e:
                return json.dumps({'status': 'PARSE_ERROR', 'error': str(e)})
            jobs_data: list[dict[str, Any]] = data.get('jobs', [])
            deadline: int | None = data.get('deadline')
            if not jobs_data:
                return json.dumps({'status': 'INVALID_INPUT', 'error': 'no jobs'})
            model = cp_model.CpModel()
            horizon = sum((op['duration'] for job in jobs_data for op in job.get('operations', [])))
            all_tasks: dict[tuple[int, int], dict] = {}
            machine_to_intervals: dict[str, list] = {}
            for job_id, job in enumerate(jobs_data):
                for task_id, op in enumerate(job.get('operations', [])):
                    machine = op['machine']
                    duration = int(op['duration'])
                    suffix = f'_j{job_id}_t{task_id}'
                    start_var = model.NewIntVar(0, horizon, f'start{suffix}')
                    end_var = model.NewIntVar(0, horizon, f'end{suffix}')
                    interval_var = model.NewIntervalVar(start_var, duration, end_var, f'interval{suffix}')
                    all_tasks[job_id, task_id] = {'start': start_var, 'end': end_var, 'interval': interval_var, 'machine': machine, 'duration': duration}
                    if machine not in machine_to_intervals:
                        machine_to_intervals[machine] = []
                    machine_to_intervals[machine].append(interval_var)
            for machine, intervals in machine_to_intervals.items():
                model.AddNoOverlap(intervals)
            for job_id, job in enumerate(jobs_data):
                ops = job.get('operations', [])
                for task_id in range(len(ops) - 1):
                    model.Add(all_tasks[job_id, task_id + 1]['start'] >= all_tasks[job_id, task_id]['end'])
            makespan_var = model.NewIntVar(0, horizon, 'makespan')
            model.AddMaxEquality(makespan_var, [all_tasks[job_id, len(job['operations']) - 1]['end'] for job_id, job in enumerate(jobs_data) if job.get('operations')])
            if deadline is not None:
                model.Add(makespan_var <= deadline)
            model.Minimize(makespan_var)
            solver = cp_model.CpSolver()
            solver.parameters.max_time_in_seconds = 30.0
            status_code = solver.Solve(model)
            status_name = solver.StatusName(status_code)
            if status_code not in (cp_model.OPTIMAL, cp_model.FEASIBLE):
                return json.dumps({'status': status_name, 'makespan': None, 'schedule': [], 'solver_log': f'CP-SAT returned {status_name}'})
            makespan = solver.ObjectiveValue()
            schedule = []
            for job_id, job in enumerate(jobs_data):
                for task_id, op in enumerate(job.get('operations', [])):
                    t = all_tasks[job_id, task_id]
                    schedule.append({'job': job.get('name', f'Job{job_id + 1}'), 'operation': task_id + 1, 'machine': op['machine'], 'start': solver.Value(t['start']), 'end': solver.Value(t['end']), 'duration': t['duration']})
            schedule.sort(key=lambda x: (x['machine'], x['start']))
            return json.dumps({'status': status_name, 'makespan': int(makespan), 'schedule': schedule, 'solver_log': f'CP-SAT {status_name}; makespan={int(makespan)}'})
        _spl_result = solve_job_shop(problem_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_solution_json
  - id: tool_3
