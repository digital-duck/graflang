  - id: gen_1
    type: GENERATE
    config:
      function: explain_scip_result_prompt
      params:
        - result_report
        - problem_description
      prompt_inline: |-
        You are a power systems optimization analyst.

        PROBLEM:
        {{in_problem_description}}

        SCIP RESULT:
        {{in_result_report}}

        Explain (≤200 words):
        1. What is a "cutting plane" and why does SCIP use them to tighten the LP relaxation
           before branching?
        2. Why does HiGHS sometimes leave a larger optimality gap than SCIP on this problem?
           What structural properties of unit commitment make it hard?
        3. What is the economic cost of a 5% optimality gap in real grid dispatch?
           (Hint: if annual fuel cost is $2 billion, 5% = $100M/year)
        4. How does SCIP scale to the full ISO-level problem (1000+ generators, 8760 hours/year)?
      arguments:
        - '@result_report'
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_result_report
      - in_problem_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@result_report'
        - '@explanation'
      code: |
        def format_report_solver_on(result_report: str, explanation: str) -> str:
            return f'=== Hard MILP Unit Commitment (r123) | solver=ON ===\n\n{result_report}\n\n── Analyst Explanation ─────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(result_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_report
        - explanation
      tool_returns: TEXT
    ports:
