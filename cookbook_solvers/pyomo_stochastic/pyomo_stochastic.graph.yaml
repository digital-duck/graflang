      - complete
      - in_sp_report
      - in_problem_description
      - out_explanation
  - id: tool_10
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@sp_report'
        - '@explanation'
      code: |
        def format_report_solver_on(sp_report: str, explanation: str) -> str:
            return f'=== Two-Stage Stochastic Programming (r117) | solver=ON ===\n\n{sp_report}\n\n── Operations Research Explanation ─────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(sp_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
