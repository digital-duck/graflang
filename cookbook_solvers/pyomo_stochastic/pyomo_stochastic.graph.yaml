version: 1.0-graph
workflow:
  name: pyomo_stochastic
  inputs:
    - name: use_solver
      type: TEXT
      default: 'true'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_use_solver
  - id: tool_1
    type: SOLVE
    config:
      tool: get_problem_setup
      backend: kernel
      arguments: []
      code: |
        import json

        _DEFAULT_PROBLEM = {'problem_name': 'Seasonal Inventory Stocking', 'description': 'A retailer must order promotional merchandise BEFORE knowing seasonal demand. Demand depends on economic conditions: low, nominal, or high. The order decision is made once for the season (Stage 1). After demand is realized, shortages and excess inventory are handled (Stage 2). Costs: order=$5/unit, shortage=$15/unit (lost sales + expediting), holding=$2/unit (storage + obsolescence). Goal: minimize total expected cost across all demand scenarios.', 'scenarios': [{'name': 'pessimistic', 'demand': 100, 'probability': 0.3}, {'name': 'nominal', 'demand': 200, 'probability': 0.5}, {'name': 'optimistic', 'demand': 300, 'probability': 0.2}], 'costs': {'order': 5, 'shortage': 15, 'holding': 2}, 'capacity': 400, 'known_optimal_qty': 200, 'known_optimal_cost': 1360.0, 'ev_baseline_qty': 190, 'ev_baseline_cost': 1409.0, 'vss': 49.0}

        def get_problem_setup() -> str:
            return json.dumps(_DEFAULT_PROBLEM)
        _spl_result = get_problem_setup()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - out_problem_json
  - id: tool_2
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@problem_json'
        - '''description'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
            Returns '' if key not found or input is not valid JSON.
            """
            try:
                clean = str(json_str).replace('```json', '').replace('```', '').strip()
                obj = json.loads(clean)
                for part in str(key).split('.'):
                    if isinstance(obj, dict):
                        obj = obj.get(part, '')
                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(problem_json, 'description')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
        - key
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_problem_description
  - id: tool_3
    type: SOLVE
    config:
      tool: normalize_bool
      backend: kernel
      arguments:
        - '@use_solver'
      code: |
        def _coerce_bool(value: str) -> str:
            s = str(value).strip()
            if not s:
                return 'false'
            try:
                return 'true' if float(s) != 0 else 'false'
            except ValueError:
                pass
            if s.lower() in ('false', 'no', 'off'):
                return 'false'
            return 'true'

        def normalize_bool(value: str) -> str:
            """NORMALIZE_BOOL(value) — same logic as to_bool; purpose-named for --param flags.
            Accepts any truthy/falsy representation: 'ON', 'YES', '1', '2', 'true' → 'true';
            '0', 'OFF', 'NO', 'false', '' → 'false'.
            """
            return _coerce_bool(value)
        _spl_result = normalize_bool(use_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_use_solver
      - out_use_solver
  - id: eval_1
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''true'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: tool_4
    type: SOLVE
    config:
      tool: solve_two_stage_sp
      backend: kernel
      arguments:
        - '@problem_json'
      code: |
        import json

        def solve_two_stage_sp(problem_json: str) -> str:
            """Formulate and solve the two-stage stochastic program as an Extensive Form.

            The EF duplicates Stage 2 variables for each scenario and optimizes
            jointly, weighted by probability.

            Returns:
              {"status", "order_qty", "expected_cost", "per_scenario", "solver", ...}
            """
            try:
                import pyomo.environ as pyo
            except ImportError:
                return json.dumps({'status': 'ERROR', 'error': 'pyomo not installed — run: pip install pyomo'})
            try:
                prob = json.loads(problem_json)
                scenarios = prob['scenarios']
                c = prob['costs']
                cap = prob['capacity']
                model = pyo.ConcreteModel(name='two_stage_inventory')
                model.order = pyo.Var(domain=pyo.NonNegativeIntegers, bounds=(0, cap))
                snames = [s['name'] for s in scenarios]
                model.shortage = pyo.Var(snames, domain=pyo.NonNegativeReals)
                model.excess = pyo.Var(snames, domain=pyo.NonNegativeReals)
                model.obj = pyo.Objective(expr=c['order'] * model.order + sum((s['probability'] * (c['shortage'] * model.shortage[s['name']] + c['holding'] * model.excess[s['name']]) for s in scenarios)), sense=pyo.minimize)

                def shortage_rule(m, sname):
                    d = next((s['demand'] for s in scenarios if s['name'] == sname))
                    return m.shortage[sname] >= d - m.order

                def excess_rule(m, sname):
                    d = next((s['demand'] for s in scenarios if s['name'] == sname))
                    return m.excess[sname] >= m.order - d
                model.shortage_con = pyo.Constraint(snames, rule=shortage_rule)
                model.excess_con = pyo.Constraint(snames, rule=excess_rule)
                result = None
                solver_name = None
                for candidate in ('glpk', 'cbc', 'highs', 'appsi_highs'):
                    solver = pyo.SolverFactory(candidate)
                    if solver.available():
                        result = solver.solve(model, tee=False)
                        solver_name = candidate
                        break
                if result is None:
                    return json.dumps({'status': 'ERROR', 'error': 'No LP/MIP solver found. Install glpk: conda install -c conda-forge glpk'})
                term_cond = str(result.solver.termination_condition)
                if 'optimal' not in term_cond.lower():
                    return json.dumps({'status': 'ERROR', 'error': f'Solver did not find optimum: {term_cond}'})
                order_qty = int(round(pyo.value(model.order)))
                expected_cost = round(pyo.value(model.obj), 2)
                per_scenario = []
                for s in scenarios:
                    sn = s['name']
                    d = s['demand']
                    p = s['probability']
                    qty = order_qty
                    sh = max(0, d - qty)
                    ex = max(0, qty - d)
                    sc = c['order'] * qty + c['shortage'] * sh + c['holding'] * ex
                    per_scenario.append({'scenario': sn, 'demand': d, 'probability': p, 'order': qty, 'shortage': sh, 'excess': ex, 'scenario_cost': round(sc, 2), 'weighted_cost': round(p * sc, 2)})
                return json.dumps({'status': 'optimal', 'order_qty': order_qty, 'expected_cost': expected_cost, 'per_scenario': per_scenario, 'solver': solver_name, 'costs': c})
            except Exception as e:
                return json.dumps({'status': 'ERROR', 'error': str(e)})
        _spl_result = solve_two_stage_sp(problem_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_result_json
  - id: tool_5
    type: SOLVE
    config:
      tool: sp_optimal
      backend: kernel
      arguments:
        - '@result_json'
      code: |
        import json

        def sp_optimal(result_json: str) -> bool:
            """ASSERT gate: Pyomo solver certified an optimal solution."""
            try:
                return json.loads(result_json).get('status') == 'optimal'
            except Exception:
                return False
        _spl_result = sp_optimal(result_json)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result_json
      - out_tool_5
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_5'
    ports:
      - trigger
      - pass
      - fail
      - in_result_json
      - in_tool_5
  - id: tool_6
    type: SOLVE
    config:
      tool: compute_ev_baseline
      backend: kernel
      arguments:
        - '@problem_json'
      code: |
        import json

        def compute_ev_baseline(problem_json: str) -> str:
            """Compute the LLM-style EV baseline: order the expected demand.

            EV = Expected Value solution — ignores scenario spread, orders the mean.
            Returns the EV order quantity and its expected cost under all scenarios.
            """
            try:
                prob = json.loads(problem_json)
                scenarios = prob['scenarios']
                c = prob['costs']
                ev_qty = round(sum((s['demand'] * s['probability'] for s in scenarios)))
                per_scenario = []
                total_cost = c['order'] * ev_qty
                for s in scenarios:
                    d = s['demand']
                    p = s['probability']
                    sh = max(0, d - ev_qty)
                    ex = max(0, ev_qty - d)
                    sc = c['order'] * ev_qty + c['shortage'] * sh + c['holding'] * ex
                    total_cost += p * (c['shortage'] * sh + c['holding'] * ex)
                    per_scenario.append({'scenario': s['name'], 'demand': d, 'probability': p, 'shortage': sh, 'excess': ex, 'scenario_cost': round(sc, 2), 'weighted_cost': round(p * sc, 2)})
                return json.dumps({'ev_qty': ev_qty, 'expected_cost': round(total_cost, 2), 'per_scenario': per_scenario})
            except Exception as e:
                return json.dumps({'error': str(e), 'ev_qty': 0, 'expected_cost': 0.0})
        _spl_result = compute_ev_baseline(problem_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_baseline_json
  - id: tool_7
    type: SOLVE
    config:
      tool: format_sp_report
      backend: kernel
      arguments:
        - '@result_json'
        - '@baseline_json'
      code: |
        import json

        def format_sp_report(result_json: str, baseline_json: str) -> str:
            """Markdown report comparing stochastic optimum vs EV baseline."""
            try:
                r = json.loads(result_json)
                bl = json.loads(baseline_json)
                c = r.get('costs', {})
                vss = round(bl['expected_cost'] - r['expected_cost'], 2)
                lines = ['## Two-Stage Stochastic Programming — Inventory Stocking', '', f"**Solver:** Pyomo + {r.get('solver', 'glpk')}  ", f"**Status:** {r.get('status', '?')}", '', '### Stage 1 Decision', '', '| Method | Order Quantity | Expected Cost | vs. Optimum |', '|---|---|---|---|', f"| **Pyomo stochastic optimum** | **{r['order_qty']} units** | **${r['expected_cost']:,.0f}** | — |", f"| EV baseline (order E[demand]) | {bl['ev_qty']} units | ${bl['expected_cost']:,.0f} | +${vss:,.0f} worse |", '', f'> **Value of the Stochastic Solution (VSS) = ${vss:,.0f}**', f'> Ordering the expected demand instead of Q* costs ${vss:,.0f} more', f"> because the asymmetric penalties (shortage=${c.get('shortage', 15)}/unit >> holding=${c.get('holding', 2)}/unit) push the optimal quantity above the mean.", '', '### Per-Scenario Breakdown (Stochastic Optimum)', '', '| Scenario | Demand | Prob | Shortage | Excess | Scenario Cost | Weighted |', '|---|---|---|---|---|---|---|']
                for s in r.get('per_scenario', []):
                    lines.append(f"| {s['scenario']} | {s['demand']} | {s['probability']:.1f} | {s['shortage']} | {s['excess']} | ${s['scenario_cost']:,} | ${s['weighted_cost']:,} |")
                lines += ['', '### Per-Scenario Breakdown (EV Baseline — order expected demand)', '', '| Scenario | Demand | Prob | Shortage | Excess | Scenario Cost | Weighted |', '|---|---|---|---|---|---|---|']
                for s in bl.get('per_scenario', []):
                    lines.append(f"| {s['scenario']} | {s['demand']} | {s['probability']:.1f} | {s['shortage']} | {s['excess']} | ${s['scenario_cost']:,} | ${s['weighted_cost']:,} |")
                lines += ['', '### Critical Ratio Insight', '', 'The optimal Q* satisfies: **P(demand ≤ Q*) = (c_shortage − c_order) / (c_shortage + c_holding)**', f"= ({c.get('shortage', 15)} − {c.get('order', 5)}) / ({c.get('shortage', 15)} + {c.get('holding', 2)}) = **0.833**", '', 'This means: stock enough to satisfy demand in **83.3% of scenarios** — much higher than the 50th percentile, because shortages cost 7.5× more than overstock.']
                return '\n'.join(lines)
            except Exception as e:
                return f'(format error: {e})'
        _spl_result = format_sp_report(result_json, baseline_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_json
        - baseline_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result_json
      - in_baseline_json
      - out_sp_report
  - id: tool_8
    type: SOLVE
    config:
