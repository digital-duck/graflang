  - id: gen_2
    type: GENERATE
    config:
      function: reason_stochastic_prompt
      params:
        - problem_description
      prompt_inline: |-
        You are a supply chain consultant advising a retailer on how much seasonal inventory to order.

        SITUATION:
        {{in_problem_description}}

        Without solving a mathematical program, reason through the optimal order quantity:
        1. The expected demand is 0.3×100 + 0.5×200 + 0.2×300 = 190 units. Should you order exactly 190?
        2. Shortages cost $15/unit, overstock costs $2/unit. How does this asymmetry affect the decision?
        3. What is the downside risk of ordering too little vs too much?
        4. Give a concrete order quantity recommendation with your reasoning.

        Think step by step about uncertainty, costs, and risk.
      arguments:
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_problem_description
      - out_llm_strategy
  - id: tool_11
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@llm_strategy'
      code: |
        def format_report_solver_off(llm_strategy: str) -> str:
            return f"=== Two-Stage Stochastic Programming (r117) | solver=OFF ===\n\n── LLM Reasoning Under Uncertainty ─────────────────────────\n{llm_strategy}\n\nNote: LLM applies intuition but typically defaults to ordering the expected\ndemand (Q=190, cost=$1,409). Run --param use_solver=true to see Pyomo's\nstochastic optimum (Q=200, cost=$1,360 — VSS=$49 improvement)."
        _spl_result = format_report_solver_off(llm_strategy)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - llm_strategy
      tool_returns: TEXT
    ports:
