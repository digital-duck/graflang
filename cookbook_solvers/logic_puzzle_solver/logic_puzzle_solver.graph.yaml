version: 1.0-graph
workflow:
  name: logic_puzzle_solver
  inputs:
    - name: problem
      type: TEXT
      default: 'There are 3 houses in a row, numbered 1 to 3 from left to right. Each house has a unique color (Red, Green, Blue), is occupied by a person of a unique nationality (Brit, Swede, Dane), and that person drinks a unique beverage (Tea, Coffee, Milk). Clues: (1) The Brit lives in the Red house. (2) The Swede drinks Tea. (3) The Dane lives in house 1. (4) The owner of the Green house drinks Coffee. (5) The Blue house is house 2. Who drinks Coffee?'
    - name: enable_solver
      type: TEXT
      default: 'true'
    - name: max_tries
      type: INTEGER
      default: 3
    - name: out_dir
      type: TEXT
      default: ./cookbook/82_logic_puzzle_solver/output
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_enable_solver
      - out_max_tries
      - out_out_dir
  - id: tool_1
    type: SOLVE
    config:
      tool: time_monotonic
      backend: kernel
      arguments: []
      code: |
        def time_monotonic() -> str:
            """TIME_MONOTONIC() — current value of a monotonic clock, as a string.
            Pair with time_elapsed() to measure elapsed wall-clock time."""
            import time as _time
            return str(_time.monotonic())
        _spl_result = time_monotonic()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_t_start
  - id: tool_2
    type: SOLVE
    config:
      tool: time_now
      backend: kernel
      arguments: []
      code: |
        import datetime

        def time_now() -> str:
            """TIME_NOW() — current local time as a filesystem-safe string:
            YYYY-MM-DD_HH-MM-SS."""
            return datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
        _spl_result = time_now()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_ts_safe
  - id: tool_3
    type: SOLVE
    config:
      tool: lower
      backend: kernel
      arguments:
        - '@enable_solver'
      code: |
        def lower(value: str) -> str:
            """LOWER(value) — convert to lowercase."""
            return str(value).lower()
        _spl_result = lower(enable_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_enable_solver
      - out_solver_mode
  - id: eval_1
    type: EVALUATE
    config:
      condition: (@in_solver_mode == 'true' OR @in_solver_mode == '1' OR @in_solver_mode == 'yes')
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_solver_mode
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''yes'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''no'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''no'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_1
    type: GENERATE
    config:
      function: solve_directly
      params:
        - problem
      prompt_inline: |-
        Solve this logic puzzle: "{{in_problem}}"

        There is no constraint solver backing you up this time — work through the
        clues yourself, from scratch, in plain English.

        Write a clear walkthrough in under 10 sentences that:
        1. Restates the puzzle
        2. Works through the clues step by step, showing how each one narrows
           down the possibilities
        3. Gives the final answer plainly

        End your response with a line in EXACTLY this format (no extra words):
        Final answer: <value>
      arguments:
        - '@problem'
    ports:
      - trigger
      - complete
      - in_problem
      - out_report
  - id: tool_4
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@report'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_report
      - out_report
  - id: set_3
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_tries
  - id: set_4
    type: CONTEXT
    config:
      action: set
      expression: '''init'''
    ports:
      - trigger
      - complete
      - out_status
  - id: set_5
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_code
  - id: set_6
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
      - out_solution
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_tries, @tries) < @in_max_tries
      outputs:
        tries:
          from:
            - set_7.out_tries
            - set_8.out_tries
            - set_9.out_tries
        code:
          from:
            - gen_2.out_code
            - gen_3.out_code
        solution:
          from:
            - tool_5.out_solution
            - tool_8.out_solution
        status:
          from:
            - tool_6.out_status
            - tool_9.out_status
        error_info:
          from: tool_7.out_error_info
      subgraph:
        nodes:
          - id: eval_3
            type: EVALUATE
            config:
              condition: '@in_status == ''Unique'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_status
          - id: set_7
            type: CONTEXT
            config:
              action: set
              expression: '@in_max_tries'
            ports:
              - trigger
              - complete
              - in_max_tries
              - out_tries
          - id: eval_4
            type: EVALUATE
            config:
              condition: '@in_status == ''init'''
              branch: 2
            ports:
              - trigger
              - pass
              - fail
              - in_status
          - id: gen_2
            type: GENERATE
            config:
              function: formulate_csp_code
              params:
                - problem
              prompt_inline: |-
                You are a constraint-satisfaction expert. Convert this logic puzzle into
                runnable Python code using the `python-constraint` library.

                Rules:
                - `Problem` and `AllDifferentConstraint` are already imported and in scope
                  — do NOT add import statements
                - Model every category (e.g. color, nationality, drink) as one variable
                  PER VALUE, each ranging over the house/position numbers (1..N), e.g.
                      p.addVariable('color_Red', [1,2,3])
                  then add an AllDifferentConstraint over each category's variables so
                  no two values land in the same house
                - Encode every clue as a p.addConstraint(...) call. "X is in house H" ->
                  a constraint fixing that variable to H. "X's house = Y's house" ->
                  a constraint that the two variables are equal. Relative clues
                  ("immediately right of") -> a constraint on the numeric difference.
                - After defining all variables and constraints, call p.getSolutions()
                  and store the result EXACTLY as:
                    _result = {"status": "Unique", "n_solutions": 1, "answer": <the specific
                               value the puzzle asks for>, "houses": {...full assignment...}}
                    (or "status": "NoSolution"/"Ambiguous" with the matching n_solutions,
                    omitting "answer" if there is no unique one)
                - IMPORTANT: p.addConstraint(...) takes EXACTLY TWO arguments — a
                  function/lambda, and a list of the variable NAMES (strings) it applies
                  to, e.g. p.addConstraint(lambda a, b: a == b, ['nation_Brit', 'color_Red'])
                  — never pass a third positional argument to addConstraint
                - The lambda's parameter count must exactly match the length of the
                  variable-name list passed alongside it (one parameter per variable,
                  in the same order); a single-variable constraint takes a 1-argument
                  lambda, e.g. p.addConstraint(lambda a: a == 1, ['nation_Dane'])
                - Output ONLY raw Python code — no markdown fences, no commentary

                Worked example (a DIFFERENT, smaller puzzle — illustrates the API only,
                do not reuse its clues): "2 houses, colors {Red,Blue}, pets {Cat,Dog}.
                The Cat is in house 1. House 2 is not Red." ->
                ```python
                p = Problem()
                colors = ['Red', 'Blue']
                pets = ['Cat', 'Dog']
                for c in colors:
                    p.addVariable(f'color_{c}', [1, 2])
                for a in pets:
                    p.addVariable(f'pet_{a}', [1, 2])
                p.addConstraint(AllDifferentConstraint(), [f'color_{c}' for c in colors])
                p.addConstraint(AllDifferentConstraint(), [f'pet_{a}' for a in pets])
                p.addConstraint(lambda a: a == 1, ['pet_Cat'])
                p.addConstraint(lambda a: a != 2, ['color_Red'])
                solutions = p.getSolutions()
                if len(solutions) == 1:
                    sol = solutions[0]
                    house_of = {}
                    for h in [1, 2]:
                        color = [c for c in colors if sol[f'color_{c}'] == h][0]
                        pet = [a for a in pets if sol[f'pet_{a}'] == h][0]
                        house_of[h] = {"color": color, "pet": pet}
                    _result = {"status": "Unique", "n_solutions": 1,
                               "answer": house_of[1]["color"], "houses": house_of}
                elif len(solutions) == 0:
                    _result = {"status": "NoSolution", "n_solutions": 0}
                else:
                    _result = {"status": "Ambiguous", "n_solutions": len(solutions)}
                ```

                Puzzle: {{in_problem}}
              arguments:
                - '@problem'
            ports:
              - trigger
              - complete
              - in_problem
              - out_code
          - id: tool_5
            type: SOLVE
            config:
              tool: run_constraint
              backend: kernel
              arguments:
                - '@code'
              code: |
                def run_constraint(code: str) -> str:
                    """Execute LLM-generated python-constraint code and return a JSON result.

                    The LLM writes the code; this function is the deterministic oracle.
                    `Problem` and `AllDifferentConstraint` are already in scope. The code
                    must set:
                        _result = {"status": "Unique", "n_solutions": 1, "answer": <value>, ...}
                        _result = {"status": "NoSolution", "n_solutions": 0}
                        _result = {"status": "Ambiguous", "n_solutions": N}   (N > 1)
                    On any error returns {"status": "Error", "error": "<msg>"}.
                    """
                    import json
                    import re
                    from constraint import Problem, AllDifferentConstraint
                    code = re.sub(r'^```(?:python)?\s*\n?', '', code.strip(), flags=re.IGNORECASE)
                    code = re.sub(r'\n?```\s*$', '', code)
                    namespace = {"Problem": Problem, "AllDifferentConstraint": AllDifferentConstraint}
                    try:
                        exec(code, namespace)
                        result = namespace.get("_result")
                        if result is None:
                            return json.dumps({"status": "Error",
                                               "error": "code did not set _result"})
                        return json.dumps(result, default=str)
                    except Exception as e:
                        return json.dumps({"status": "Error", "error": str(e)})
                _spl_result = run_constraint(code)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_code
              - out_solution
          - id: tool_6
            type: SOLVE
            config:
              tool: result_status
              backend: kernel
              arguments:
                - '@solution'
              code: |
                import json

                def result_status(result_json: str) -> str:
                    """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                    result JSON dict, or 'Error' if missing/unparseable."""
                    try:
                        return json.loads(result_json).get('status', 'Error')
                    except Exception:
                        return 'Error'
                _spl_result = result_status(solution)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_solution
              - out_status
          - id: set_8
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: tool_7
            type: SOLVE
            config:
              tool: result_error
              backend: kernel
              arguments:
                - '@solution'
              code: |
                import json

                def result_error(result_json: str) -> str:
                    """RESULT_ERROR(result_json) — extract the 'error' field from a SOLVER
                    result JSON dict (falls back to 'status', then 'unknown error')."""
                    try:
                        d = json.loads(result_json)
                        return d.get('error', d.get('status', 'unknown error'))
                    except Exception:
                        return result_json
                _spl_result = result_error(solution)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_solution
              - out_error_info
          - id: gen_3
            type: GENERATE
            config:
              function: repair_csp_code
              params:
                - problem
                - code
                - error_info
              prompt_inline: |-
                This python-constraint code produced an error.

                Puzzle: {{in_problem}}

                Previous code:
                {{in_code}}

                Error:
                {{in_error_info}}

                Fix the code. Common causes:
                - p.addConstraint(...) called with 3+ positional arguments — it takes
                  EXACTLY TWO: a function/lambda, then a list of variable-name strings
                  (e.g. p.addConstraint(lambda a, b: a == b, ['nation_Brit', 'color_Red']))
                - A variable referenced in a constraint was never added with addVariable
                - Constraint lambda arity does not match the number of variables passed
                  (one lambda parameter per variable name in the list, same order)
                - Missing or duplicate _result assignment
                - Domain values that don't match the number of houses/positions

                Output ONLY the corrected Python code — no markdown fences, no commentary.
              arguments:
                - '@problem'
                - '@code'
                - '@error_info'
            ports:
              - trigger
              - complete
              - in_problem
              - in_code
              - in_error_info
              - out_code
          - id: tool_8
            type: SOLVE
            config:
              tool: run_constraint
              backend: kernel
              arguments:
                - '@code'
              code: |
                def run_constraint(code: str) -> str:
                    """Execute LLM-generated python-constraint code and return a JSON result.

                    The LLM writes the code; this function is the deterministic oracle.
                    `Problem` and `AllDifferentConstraint` are already in scope. The code
                    must set:
                        _result = {"status": "Unique", "n_solutions": 1, "answer": <value>, ...}
                        _result = {"status": "NoSolution", "n_solutions": 0}
                        _result = {"status": "Ambiguous", "n_solutions": N}   (N > 1)
                    On any error returns {"status": "Error", "error": "<msg>"}.
                    """
                    import json
                    import re
                    from constraint import Problem, AllDifferentConstraint
                    code = re.sub(r'^```(?:python)?\s*\n?', '', code.strip(), flags=re.IGNORECASE)
                    code = re.sub(r'\n?```\s*$', '', code)
                    namespace = {"Problem": Problem, "AllDifferentConstraint": AllDifferentConstraint}
                    try:
                        exec(code, namespace)
                        result = namespace.get("_result")
                        if result is None:
                            return json.dumps({"status": "Error",
                                               "error": "code did not set _result"})
                        return json.dumps(result, default=str)
                    except Exception as e:
                        return json.dumps({"status": "Error", "error": str(e)})
                _spl_result = run_constraint(code)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_code
              - out_solution
          - id: tool_9
            type: SOLVE
            config:
              tool: result_status
              backend: kernel
              arguments:
                - '@solution'
              code: |
                import json

                def result_status(result_json: str) -> str:
                    """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                    result JSON dict, or 'Error' if missing/unparseable."""
                    try:
                        return json.loads(result_json).get('status', 'Error')
                    except Exception:
                        return 'Error'
                _spl_result = result_status(solution)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_solution
              - out_status
          - id: set_9
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
        edges:
          - source: eval_3.pass
            target: set_7.trigger
            type: triggers
          - source: eval_3.fail
            target: eval_4.trigger
            type: triggers
          - source: eval_4.pass
            target: gen_2.trigger
            type: triggers
          - source: gen_2.complete
            target: tool_5.trigger
            type: triggers
          - source: gen_2.out_code
            target: tool_5.in_code
            type: binds
          - source: tool_5.complete
            target: tool_6.trigger
            type: triggers
          - source: tool_5.out_solution
            target: tool_6.in_solution
            type: binds
          - source: tool_6.complete
            target: set_8.trigger
            type: triggers
          - source: eval_4.fail
            target: tool_7.trigger
            type: triggers
          - source: tool_7.complete
            target: gen_3.trigger
            type: triggers
          - source: tool_7.out_error_info
            target: gen_3.in_error_info
            type: binds
          - source: gen_3.complete
            target: tool_8.trigger
            type: triggers
          - source: gen_3.out_code
            target: tool_8.in_code
            type: binds
          - source: tool_8.complete
            target: tool_9.trigger
            type: triggers
          - source: tool_8.out_solution
            target: tool_9.in_solution
            type: binds
          - source: tool_9.complete
            target: set_9.trigger
            type: triggers
    ports:
      - trigger
      - loop
      - exit
      - in_status
      - in_max_tries
      - in_problem
      - in_tries
      - in_solution
      - in_code
      - out_tries
      - out_code
      - out_solution
      - out_status
      - out_error_info
  - id: tool_10
    type: SOLVE
    config:
      tool: is_unique
      backend: kernel
      arguments:
        - '@solution'
      code: |
        def is_unique(result_json: str) -> bool:
            """ASSERT gate: True only when the CSP solver found EXACTLY one
            solution consistent with every clue."""
            import json
            try:
                return json.loads(result_json).get("status") == "Unique"
            except Exception:
                return False
        _spl_result = is_unique(solution)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_solution
      - out_tool_10
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_10'
    ports:
      - trigger
      - pass
      - fail
      - in_solution
      - in_tool_10
  - id: gen_4
    type: GENERATE
    config:
      function: interpret_csp_result
      params:
        - problem
        - solution_json
      prompt_inline: |-
        You are a logic-puzzle expert. Interpret this VERIFIED constraint-solver
        result for a general audience.

        Puzzle: {{in_problem}}

        Verified result (JSON, computed exactly by the CSP solver — trust it
        completely, do not re-derive it):
        {{in_solution_json}}

        Provide a concise interpretation (under 100 words):
        1. Restate what the puzzle asks
        2. Give the answer, referencing the exact value from the JSON
        3. One sentence citing a clue that pins it down

        End your response with a line in EXACTLY this format (no extra words):
        Final answer: <value>
      arguments:
        - '@problem'
        - '@solution'
    ports:
      - trigger
      - complete
      - in_problem
      - in_solution_json
      - out_narrative
  - id: tool_11
    type: SOLVE
    config:
      tool: classify_roundtrip
      backend: kernel
      arguments:
        - '@narrative'
        - '@solution'
      code: |
        def classify_roundtrip(narrative: str, result_json: str) -> str:
            """Round-trip check: does the LLM's own 'Final answer: ...' line, in
            its narration of the VERIFIED unique solution, actually match the
            solver's ground truth? Catches the LLM re-deriving (and getting
            wrong) a value it was already handed.

            Returns 'match' / 'mismatch' / 'unverifiable'.
            """
            import re
            import json
            m = re.search(r'final answer\s*:?\s*(.+)', narrative, re.IGNORECASE)
            if not m:
                return "unverifiable"
            llm_val = m.group(1).strip().rstrip('.').lower()
            try:
                truth = json.loads(result_json).get("answer")
            except Exception:
                return "unverifiable"
            if truth is None:
                return "unverifiable"
            truth_str = str(truth).strip().lower()
            if truth_str in llm_val or llm_val in truth_str:
                return "match"
            return "mismatch"
        _spl_result = classify_roundtrip(narrative, solution)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - narrative
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_narrative
      - in_solution
      - out_roundtrip
  - id: tool_12
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@problem'
        - '@code'
        - '@solution'
        - '@narrative'
        - '@roundtrip'
      code: |
        def format_report(problem: str, code: str, solution_json: str,
                          narrative: str, roundtrip: str) -> str:
            import json
            try:
                sol = json.loads(solution_json)
            except Exception:
                sol = {}
            lines = [
                "# Logic Puzzle Report",
                "",
                f"**Puzzle:** {problem.strip()}",
                "",
                f"**CSP solver status:** `{sol.get('status', 'Unknown')}`",
                f"**Solutions found:** `{sol.get('n_solutions', '?')}`",
                f"**Ground-truth answer:** `{sol.get('answer', '?')}`",
                f"**Round-trip check:** `{roundtrip}`",
                "",
                "## Interpretation", "", narrative.strip(),
                "", "## Solver Code (LLM-generated, python-constraint)", "",
                "```python", code.strip(), "```",
            ]
            return "\n".join(lines)
        _spl_result = format_report(problem, code, solution, narrative, roundtrip)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - code
        - solution_json
        - narrative
        - roundtrip
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_code
      - in_solution
      - in_narrative
      - in_roundtrip
      - out_report
  - id: tool_13
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/logic_puzzle_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/logic_puzzle_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
