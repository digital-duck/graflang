  - id: tool_16
    type: SOLVE
    config:
      tool: verify_off_staff
      backend: kernel
      arguments:
        - '@problem'
        - '@claimed_json'
      code: |
        def verify_off_staff(problem: str, claimed_json: str) -> str:
            import json, re
            raw = claimed_json.strip()
            raw = re.sub(r'^```(?:json)?\s*\n?', '', raw, flags=re.IGNORECASE)
            raw = re.sub(r'\n?```\s*$', '', raw)
            try:
                claimed = json.loads(raw)
            except Exception as e:
                return json.dumps({"verdict": "UNPARSEABLE", "notes": f"JSON error: {e}",
                                   "raw_prefix": claimed_json[:120]})

            obj_claimed  = claimed.get("objective")
            assignment   = claimed.get("assignment", {})
            coverage_min = claimed.get("coverage_min", {})
            wage         = claimed.get("wage", {})

            violations = []

            # Normalize: nurse→shift or shift→[nurses]
            shift_nurses: dict = {}
            for k, v in assignment.items():
                if isinstance(v, str):
                    shift_nurses.setdefault(v, []).append(k)
                elif isinstance(v, list):
                    shift_nurses[k] = v

            # Coverage
            for shift, min_n in coverage_min.items():
                count = len(shift_nurses.get(shift, []))
                if count < int(min_n):
                    violations.append(f"{shift}: {count} nurses < required {min_n}")

            # Each nurse at most 1 shift
            nurse_counts: dict = {}
            for shift, nurses in shift_nurses.items():
                for n in nurses:
                    nurse_counts[n] = nurse_counts.get(n, 0) + 1
            for nurse, cnt in nurse_counts.items():
                if cnt > 1:
                    violations.append(f"{nurse} assigned to {cnt} shifts (max 1)")

            # Recompute cost
            if wage and shift_nurses:
                try:
                    recomputed = sum(float(wage.get(s, 0)) * len(ns)
                                    for s, ns in shift_nurses.items())
                    if obj_claimed is not None and abs(recomputed - float(obj_claimed)) > 0.5:
                        violations.append(f"cost mismatch: claimed {obj_claimed} vs computed {recomputed:.2f}")
                except Exception as e:
                    violations.append(f"cost recompute error: {e}")

            if violations:
                return json.dumps({"verdict": "FAIL", "claimed_obj": obj_claimed,
                                   "notes": "; ".join(violations)})
            if not assignment:
                return json.dumps({"verdict": "UNPARSEABLE", "claimed_obj": obj_claimed,
                                   "notes": "no assignment in JSON"})
            return json.dumps({"verdict": "PASS", "claimed_obj": obj_claimed,
                               "notes": "coverage and workload constraints verified"})
        _spl_result = verify_off_staff(problem, claimed_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - claimed_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_claimed_json
      - out_verify_result
