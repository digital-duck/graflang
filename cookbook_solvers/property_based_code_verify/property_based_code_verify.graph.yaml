version: 1.0-graph
workflow:
  name: property_based_code_verify
  inputs:
    - name: spec
      type: TEXT
      default: 'Write a function merge_sorted(a: list[int], b: list[int]) -> list[int] that takes two ALREADY-SORTED lists of integers and returns a single sorted list containing all elements of both (duplicates included).'
    - name: enable_solver
      type: TEXT
      default: 'true'
    - name: max_tries
      type: INTEGER
      default: 3
    - name: out_dir
      type: TEXT
      default: ./cookbook/85_property_based_code_verify/output
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_spec
      - out_enable_solver
      - out_max_tries
      - out_out_dir
  - id: tool_1
    type: SOLVE
    config:
      tool: time_monotonic
      backend: kernel
      arguments: []
      code: |
        def time_monotonic() -> str:
            """TIME_MONOTONIC() — current value of a monotonic clock, as a string.
            Pair with time_elapsed() to measure elapsed wall-clock time."""
            import time as _time
            return str(_time.monotonic())
        _spl_result = time_monotonic()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_t_start
  - id: tool_2
    type: SOLVE
    config:
      tool: time_now
      backend: kernel
      arguments: []
      code: |
        import datetime

        def time_now() -> str:
            """TIME_NOW() — current local time as a filesystem-safe string:
            YYYY-MM-DD_HH-MM-SS."""
            return datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
        _spl_result = time_now()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_ts_safe
  - id: tool_3
    type: SOLVE
    config:
      tool: lower
      backend: kernel
      arguments:
        - '@enable_solver'
      code: |
        def lower(value: str) -> str:
            """LOWER(value) — convert to lowercase."""
            return str(value).lower()
        _spl_result = lower(enable_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_enable_solver
      - out_solver_mode
  - id: eval_1
    type: EVALUATE
    config:
      condition: (@in_solver_mode == 'true' OR @in_solver_mode == '1' OR @in_solver_mode == 'yes')
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_solver_mode
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''yes'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''no'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''no'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_1
    type: GENERATE
    config:
      function: solve_directly
      params:
        - spec
      prompt_inline: |-
        Write a Python implementation for this spec, then review it yourself by
        eye — there is no test runner backing you up this time.

        Spec: {{in_spec}}

        Write the implementation, then in a few sentences self-assess whether you
        believe it is correct and why. State clearly whether you believe it
        passes or fails.
      arguments:
        - '@spec'
    ports:
      - trigger
      - complete
      - in_spec
      - out_report
  - id: tool_4
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@report'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_report
      - out_report
  - id: gen_2
    type: GENERATE
    config:
      function: generate_implementation
      params:
        - spec
      prompt_inline: |-
        Write a Python implementation for this spec:

        {{in_spec}}

        Rules:
        - Output ONLY the function definition(s) — no markdown fences, no example
          usage, no if __name__ == "__main__" block
        - Give the function(s) clear, spec-matching names and full type hints
      arguments:
        - '@spec'
    ports:
      - trigger
      - complete
      - in_spec
      - out_code
  - id: gen_3
    type: GENERATE
    config:
      function: generate_properties
      params:
        - spec
      prompt_inline: |-
        Write Hypothesis property-based tests for this spec — NOT for any
        particular implementation, so write them from the spec alone:

        {{in_spec}}

        Rules:
        - Output ONLY the test code — no markdown fences, no commentary
        - `from hypothesis import given, strategies as st` — assume this import,
          do NOT repeat it in your output
        - The function(s) under test are already importable by name (matching the
          spec) — do NOT redefine or reimplement them, do NOT import them either
        - Write at least 2 distinct @given-decorated property test functions,
          each capturing an invariant that must hold for ALL valid inputs (e.g.
          idempotence, output length, ordering, round-trip of an inverse
          operation, invariance under a transformation) — NOT fixed-example
          assertions like `assert f(2,3) == 5`
        - Use st.integers(), st.lists(...), st.text(), etc. to generate inputs
          matching the spec''s parameter types

        Example shape (for a different spec, illustrating format only):
        ```
        @given(st.lists(st.integers()))
        def test_sort_is_idempotent(xs):
            once = my_sort(xs)
            twice = my_sort(once)
            assert once == twice
        ```
      arguments:
        - '@spec'
    ports:
      - trigger
      - complete
      - in_spec
      - out_properties
  - id: set_3
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_tries
  - id: set_4
    type: CONTEXT
    config:
      action: set
      expression: '''init'''
    ports:
      - trigger
      - complete
      - out_status
  - id: set_5
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
      - out_result
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_tries, @tries) < @in_max_tries
      outputs:
        tries:
          from:
            - set_6.out_tries
            - set_7.out_tries
            - set_8.out_tries
            - set_9.out_tries
        result:
          from:
            - tool_5.out_result
            - tool_8.out_result
        status:
          from:
            - tool_6.out_status
            - tool_9.out_status
        error_info:
          from: tool_7.out_error_info
        properties:
          from: gen_4.out_properties
      subgraph:
        nodes:
          - id: eval_3
            type: EVALUATE
            config:
              condition: '@in_status == ''AllPassed'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_status
          - id: set_6
            type: CONTEXT
            config:
              action: set
              expression: '@in_max_tries'
            ports:
              - trigger
              - complete
              - in_max_tries
              - out_tries
          - id: eval_4
            type: EVALUATE
            config:
              condition: '@in_status == ''Failed'''
              branch: 2
            ports:
              - trigger
              - pass
              - fail
              - in_status
          - id: set_7
            type: CONTEXT
            config:
              action: set
              expression: '@in_max_tries'
            ports:
              - trigger
              - complete
              - in_max_tries
              - out_tries
          - id: eval_5
            type: EVALUATE
            config:
              condition: '@in_status == ''init'''
              branch: 3
            ports:
              - trigger
              - pass
              - fail
              - in_status
          - id: tool_5
            type: SOLVE
            config:
              tool: run_hypothesis
              backend: kernel
              arguments:
                - '@code'
                - '@properties'
              code: |
                def run_hypothesis(code: str, properties: str) -> str:
                    """Execute LLM-generated code against LLM-generated Hypothesis
                    properties in a subprocess. Returns JSON. Both are written to a temp
                    directory that is removed after the subprocess exits — no filesystem
                    side effects.

                    Returns {"status": "AllPassed"/"Failed"/"Error", "passed": N,
                             "failed": M, "returncode": R, "output": "..."}
                    """
                    import json
                    import re
                    import subprocess
                    import tempfile
                    import os

                    def _strip(src: str) -> str:
                        src = re.sub(r'^```(?:python)?\s*\n?', '', src.strip(), flags=re.IGNORECASE)
                        return re.sub(r'\n?```\s*$', '', src)

                    code = _strip(code)
                    properties = _strip(properties)

                    with tempfile.TemporaryDirectory() as tmpdir:
                        with open(os.path.join(tmpdir, "solution.py"), "w") as f:
                            f.write(code)
                        with open(os.path.join(tmpdir, "test_properties.py"), "w") as f:
                            f.write("from solution import *\n" + properties)
                        try:
                            proc = subprocess.run(
                                ["python3", "-m", "pytest", "test_properties.py", "-q",
                                 "--tb=short", "-p", "no:cacheprovider"],
                                cwd=tmpdir, capture_output=True, text=True, timeout=60
                            )
                        except subprocess.TimeoutExpired:
                            return json.dumps({"status": "Error", "error": "Hypothesis run timed out"})
                        except Exception as e:
                            return json.dumps({"status": "Error", "error": str(e)})

                        m = re.search(r'(\d+) passed', proc.stdout)
                        passed = int(m.group(1)) if m else 0
                        m = re.search(r'(\d+) failed', proc.stdout)
                        failed = int(m.group(1)) if m else 0
                        m = re.search(r'(\d+) error', proc.stdout)
                        errored = int(m.group(1)) if m else 0

                        if errored > 0 or (failed == 0 and passed == 0):
                            status = "Error"
                        elif failed == 0:
                            status = "AllPassed"
                        else:
                            status = "Failed"

                        return json.dumps({
                            "status": status, "passed": passed, "failed": failed,
                            "returncode": proc.returncode,
                            "output": (proc.stdout + proc.stderr)[-3000:]
                        })
                _spl_result = run_hypothesis(code, properties)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - properties
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_code
              - in_properties
              - out_result
          - id: tool_6
            type: SOLVE
            config:
              tool: result_status
              backend: kernel
              arguments:
                - '@result'
              code: |
                import json

                def result_status(result_json: str) -> str:
                    """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                    result JSON dict, or 'Error' if missing/unparseable."""
                    try:
                        return json.loads(result_json).get('status', 'Error')
                    except Exception:
                        return 'Error'
                _spl_result = result_status(result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_result
              - out_status
          - id: set_8
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: tool_7
            type: SOLVE
            config:
              tool: result_error
              backend: kernel
              arguments:
                - '@result'
              code: |
                import json

                def result_error(result_json: str) -> str:
                    """RESULT_ERROR(result_json) — extract the 'error' field from a SOLVER
                    result JSON dict (falls back to 'status', then 'unknown error')."""
                    try:
                        d = json.loads(result_json)
                        return d.get('error', d.get('status', 'unknown error'))
                    except Exception:
                        return result_json
                _spl_result = result_error(result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_result
              - out_error_info
          - id: gen_4
            type: GENERATE
            config:
              function: repair_properties
              params:
                - spec
                - properties
                - error_info
              prompt_inline: |-
                This Hypothesis test code produced an ERROR (not a test failure — an
                actual exception in the test file itself, e.g. a bad import or syntax
                error).

                Spec: {{in_spec}}

                Previous test code:
                {{in_properties}}

                Error:
                {{in_error_info}}

                Fix the test code so it runs (do not change what it is designed to check).
                Output ONLY the corrected test code — no markdown fences, no commentary.
              arguments:
                - '@spec'
                - '@properties'
                - '@error_info'
            ports:
              - trigger
              - complete
              - in_spec
              - in_properties
              - in_error_info
              - out_properties
          - id: tool_8
            type: SOLVE
            config:
              tool: run_hypothesis
              backend: kernel
              arguments:
                - '@code'
                - '@properties'
              code: |
                def run_hypothesis(code: str, properties: str) -> str:
                    """Execute LLM-generated code against LLM-generated Hypothesis
                    properties in a subprocess. Returns JSON. Both are written to a temp
                    directory that is removed after the subprocess exits — no filesystem
                    side effects.

                    Returns {"status": "AllPassed"/"Failed"/"Error", "passed": N,
                             "failed": M, "returncode": R, "output": "..."}
                    """
                    import json
                    import re
                    import subprocess
                    import tempfile
                    import os

                    def _strip(src: str) -> str:
                        src = re.sub(r'^```(?:python)?\s*\n?', '', src.strip(), flags=re.IGNORECASE)
                        return re.sub(r'\n?```\s*$', '', src)

                    code = _strip(code)
                    properties = _strip(properties)

                    with tempfile.TemporaryDirectory() as tmpdir:
                        with open(os.path.join(tmpdir, "solution.py"), "w") as f:
                            f.write(code)
                        with open(os.path.join(tmpdir, "test_properties.py"), "w") as f:
                            f.write("from solution import *\n" + properties)
                        try:
                            proc = subprocess.run(
                                ["python3", "-m", "pytest", "test_properties.py", "-q",
                                 "--tb=short", "-p", "no:cacheprovider"],
                                cwd=tmpdir, capture_output=True, text=True, timeout=60
                            )
                        except subprocess.TimeoutExpired:
                            return json.dumps({"status": "Error", "error": "Hypothesis run timed out"})
                        except Exception as e:
                            return json.dumps({"status": "Error", "error": str(e)})

                        m = re.search(r'(\d+) passed', proc.stdout)
                        passed = int(m.group(1)) if m else 0
                        m = re.search(r'(\d+) failed', proc.stdout)
                        failed = int(m.group(1)) if m else 0
                        m = re.search(r'(\d+) error', proc.stdout)
                        errored = int(m.group(1)) if m else 0

                        if errored > 0 or (failed == 0 and passed == 0):
                            status = "Error"
                        elif failed == 0:
                            status = "AllPassed"
                        else:
                            status = "Failed"

                        return json.dumps({
                            "status": status, "passed": passed, "failed": failed,
                            "returncode": proc.returncode,
                            "output": (proc.stdout + proc.stderr)[-3000:]
                        })
                _spl_result = run_hypothesis(code, properties)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - properties
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_code
              - in_properties
              - out_result
          - id: tool_9
            type: SOLVE
            config:
              tool: result_status
              backend: kernel
              arguments:
                - '@result'
              code: |
                import json

                def result_status(result_json: str) -> str:
                    """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                    result JSON dict, or 'Error' if missing/unparseable."""
                    try:
                        return json.loads(result_json).get('status', 'Error')
                    except Exception:
                        return 'Error'
                _spl_result = result_status(result)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - result_json
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_result
              - out_status
          - id: set_9
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
        edges:
          - source: eval_3.pass
            target: set_6.trigger
            type: triggers
          - source: eval_3.fail
            target: eval_4.trigger
            type: triggers
          - source: eval_4.pass
            target: set_7.trigger
            type: triggers
          - source: eval_4.fail
            target: eval_5.trigger
            type: triggers
          - source: eval_5.pass
            target: tool_5.trigger
            type: triggers
          - source: tool_5.complete
            target: tool_6.trigger
            type: triggers
          - source: tool_5.out_result
            target: tool_6.in_result
            type: binds
          - source: tool_6.complete
            target: set_8.trigger
            type: triggers
          - source: eval_5.fail
            target: tool_7.trigger
            type: triggers
          - source: tool_7.complete
            target: gen_4.trigger
            type: triggers
          - source: tool_7.out_error_info
            target: gen_4.in_error_info
            type: binds
          - source: gen_4.complete
            target: tool_8.trigger
            type: triggers
          - source: gen_4.out_properties
            target: tool_8.in_properties
            type: binds
          - source: tool_8.complete
            target: tool_9.trigger
            type: triggers
          - source: tool_8.out_result
            target: tool_9.in_result
            type: binds
          - source: tool_9.complete
            target: set_9.trigger
            type: triggers
    ports:
      - trigger
      - loop
      - exit
      - in_status
      - in_max_tries
      - in_code
      - in_properties
      - in_tries
      - in_result
      - in_spec
      - out_tries
      - out_result
      - out_status
      - out_error_info
      - out_properties
  - id: tool_10
    type: SOLVE
    config:
      tool: all_properties_passed
      backend: kernel
      arguments:
        - '@result'
      code: |
        def all_properties_passed(result_json: str) -> bool:
            """ASSERT gate: True only when Hypothesis found no falsifying example
            for any property across all its generated inputs."""
            import json
            try:
                return json.loads(result_json).get("status") == "AllPassed"
            except Exception:
                return False
        _spl_result = all_properties_passed(result)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result
      - out_tool_10
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_10'
    ports:
      - trigger
      - pass
      - fail
      - in_result
      - in_tool_10
  - id: gen_5
    type: GENERATE
    config:
      function: interpret_hypothesis_result
      params:
        - spec
        - result_json
      prompt_inline: |-
        You are a software testing expert. Interpret this VERIFIED Hypothesis
        property-based test run for a developer.

        Spec: {{in_spec}}

        Verified result (JSON — pytest + Hypothesis actually executed the
        properties against hundreds of generated inputs; trust it completely):
        {{in_result_json}}

        Provide a concise interpretation (under 100 words):
        1. State whether all properties passed or a falsifying example was found
        2. If failed, mention the falsifying input from the output if visible
        3. One sentence on what this means for the implementation''s correctness
      arguments:
        - '@spec'
        - '@result'
    ports:
      - trigger
      - complete
      - in_spec
      - in_result_json
      - out_narrative
  - id: tool_11
    type: SOLVE
    config:
      tool: classify_roundtrip
      backend: kernel
      arguments:
        - '@narrative'
        - '@result'
      code: |
        def classify_roundtrip(narrative: str, result_json: str) -> str:
            """Round-trip check: does the LLM's own narration correctly state
            that all Hypothesis properties passed / the code is verified, and
            does the reported pass count agree with what the JSON says? Catches
            the LLM claiming success when the run actually failed (or vice versa).

            Returns 'match' / 'mismatch' / 'unverifiable'.
            """
            import re
            import json
            try:
                truth = json.loads(result_json)
            except Exception:
                return "unverifiable"
            truth_status = truth.get("status")
            if truth_status is None:
                return "unverifiable"

            text = narrative.lower()
            claims_pass = bool(re.search(r'\b(all\s+properties?\s+pass|verified|no\s+bugs?\s+found|passed)\b', text))
            claims_fail = bool(re.search(r'\b(fail|bug\s+found|falsif|does\s+not\s+hold)\b', text))

            if truth_status == "AllPassed":
                if claims_pass and not claims_fail:
                    return "match"
                if claims_fail:
                    return "mismatch"
                return "unverifiable"
            else:
                if claims_fail:
                    return "match"
                if claims_pass:
                    return "mismatch"
                return "unverifiable"
        _spl_result = classify_roundtrip(narrative, result)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - narrative
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_narrative
      - in_result
      - out_roundtrip
  - id: tool_12
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@spec'
        - '@code'
        - '@properties'
        - '@result'
        - '@narrative'
        - '@roundtrip'
      code: |
        def format_report(spec: str, code: str, properties: str, result_json: str,
                          narrative: str, roundtrip: str) -> str:
            import json
            try:
                res = json.loads(result_json)
            except Exception:
                res = {}
            lines = [
                "# Property-Based Code Verification Report",
                "",
                f"**Spec:** {spec.strip()}",
                "",
                f"**Hypothesis status:** `{res.get('status', 'Unknown')}`",
                f"**Properties passed / failed:** `{res.get('passed', '?')} / {res.get('failed', '?')}`",
                f"**Round-trip check:** `{roundtrip}`",
                "",
                "## Interpretation", "", narrative.strip(),
                "", "## Generated Implementation", "",
                "```python", code.strip(), "```",
                "", "## Generated Hypothesis Properties", "",
                "```python", properties.strip(), "```",
            ]
            return "\n".join(lines)
        _spl_result = format_report(spec, code, properties, result, narrative, roundtrip)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - spec
        - code
        - properties
        - result_json
        - narrative
        - roundtrip
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_spec
      - in_code
      - in_properties
      - in_result
      - in_narrative
      - in_roundtrip
      - out_report
  - id: tool_13
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/property_verify_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/property_verify_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_out_dir
      - in_ts_safe
      - in_report
      - out_out_path
  - id: tool_14
    type: SOLVE
    config:
      tool: time_elapsed
      backend: kernel
      arguments:
        - '@t_start'
      code: |
        def time_elapsed(start_ts: str) -> str:
            """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
            float string from time_monotonic())."""
            import time as _time
            try:
                return f'{_time.monotonic() - float(start_ts):.1f}'
            except Exception:
                return '?'
        _spl_result = time_elapsed(t_start)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - start_ts
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_t_start
      - out_elapsed
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
