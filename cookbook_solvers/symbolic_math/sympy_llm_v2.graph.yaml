  - id: gen_3
    type: GENERATE
    config:
      function: sanity_check_chain
      params:
        - problem
        - trace
      prompt_inline: |-
        A student asked the following question: "{{in_problem}}"

        A symbolic math engine computed this chain of EXACT steps, in order:
        {{in_trace}}

        Your ONLY job is to check whether this chain answers the question that
        was actually asked. Do NOT re-verify the arithmetic — every step above
        is already machine-verified. Check ONLY for plan-level mismatches:

        - Wrong starting expression: step 1 does not operate on the expression
          stated in the problem (changed coefficient, sign, exponent, function)
        - Wrong operation: the problem asks for one operation (e.g. integrate)
          but the chain performs another (e.g. differentiate)
        - Missing final step: the problem asks for a final result (e.g. "solve
          for x") that the chain never reaches
        - Extra steps that change what the final result means

        Reply with EXACTLY one line and nothing else:
          pass
        or
          fail | <one short reason>
      arguments:
        - '@problem'
        - '@trace'
    ports:
      - trigger
      - complete
      - in_problem
      - in_trace
      - out_verdict_raw
  - id: tool_15
    type: SOLVE
    config:
      tool: split_part
      backend: kernel
      arguments:
        - '@verdict_raw'
        - '''|'''
        - '''1'''
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()

        def split_part(value: str, delimiter: str, part: str, trim: str='true') -> str:
            """SPLIT_PART(value, delimiter, part [, trim]) — 1-based part after splitting on delimiter.

            The part comes back whitespace-trimmed by default: delimited protocol
            lines ('a | b') are padded for readability and virtually every caller
            wants the bare field (list_get behaves the same way). Pass trim='false'
            to keep the raw part, padding included.
            """
            parts = str(value).split(str(delimiter))
            idx = int(part) - 1
            if not 0 <= idx < len(parts):
                return ''
            raw = parts[idx]
            if str(trim).strip().lower() in {'false', '0', 'no'}:
                return raw
            return raw.strip()
        _spl_result = split_part(verdict_raw, '|', '1')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
        - delimiter
        - part
        - trim
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_verdict_raw
      - out_verdict
