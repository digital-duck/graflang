version: 1.0-graph
workflow:
  name: math_solver_ab
  inputs:
    - name: problem
      type: TEXT
      default: differentiate 3*x**3 - x, then factor if needed, finally solve for x
    - name: log_dir
      type: TEXT
      default: cookbook/67_symbolic_math/logs-spl
    - name: enable_solver
      type: TEXT
      default: 'true'
  outputs:
    - name: explanation
      type: TEXT
resources:
  procedures:
    solve_chain_step: ./sympy_llm.spl
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_log_dir
      - out_enable_solver
  - id: tool_1
    type: SOLVE
    config:
      tool: lower
      backend: kernel
      arguments:
        - '@enable_solver'
      code: |
        def lower(value: str) -> str:
            """LOWER(value) — convert to lowercase."""
            return str(value).lower()
        _spl_result = lower(enable_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_enable_solver
      - out_solver_mode
  - id: eval_1
    type: EVALUATE
    config:
      condition: (@in_solver_mode == 'true' OR @in_solver_mode == '1' OR @in_solver_mode == 'yes')
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_solver_mode
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''yes'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''no'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''yes'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_1
    type: GENERATE
    config:
      function: decompose_problem
      params:
        - problem
      prompt_inline: |-
        Translate this math problem into an ordered list of symbolic operations.

        Output format — one step per line, NOTHING ELSE:
          <expression>|<operation>

        STRICT OUTPUT RULES (violating any of these causes the pipeline to fail):
        - Plain text output ONLY — no code fences, no backticks, no markdown, no numbering
        - No Python code (no import statements, no variable assignments, no function calls)
        - No prose, no explanations, no blank lines
        - The FIRST step's <expression> is the starting expression in Python/SymPy syntax:
            ** for powers, * for multiplication, sqrt(x), sin(x), exp(x), log(x)
        - Every step AFTER the first must use the literal word PREV as the expression —
            it means "the result of the previous step". NEVER write a new expression
            after the first line.
        - <operation> must be exactly one token from this list:
            solve, diff, integrate, simplify, expand, factor,
            series, apart, limit(x,0), laplace, inverse_laplace,
            trigsimp, summation(n,1,oo), eigenvalues, solve_system,
            dsolve, dsolve_ic
        - dsolve   — general ODE solution (no initial conditions)
        - dsolve_ic — IVP: expression MUST be [Eq(ODE), {y(0): val, ...}]
        - If the problem needs only ONE operation, output exactly one line
        - The expressions in the examples below (exp(x), x**2 - 4, sin(x)/x, ...)
            illustrate the FORMAT only. Your first <expression> must be transcribed
            from the Problem at the bottom — copying an expression from an example
            is a failure.

        CORRECT examples:
          "differentiate e to the x and then simplify the result"
            exp(x)|diff
            PREV|simplify

          "integrate 5*x**4 + 2, then expand the result, then solve for x"
            5*x**4 + 2|integrate
            PREV|expand
            PREV|solve

          "expand (x+1) squared, then factor the expanded form"
            (x + 1)**2|expand
            PREV|factor

          "find the roots of x squared minus 4"
            x**2 - 4|solve

          "find the limit of sin(x)/x as x approaches 0"
            sin(x)/x|limit(x,0)

          "expand sin(x) as a Taylor series around x=0 up to degree 5"
            sin(x)|series

          "find the partial fraction decomposition of 1/(x**2-1)"
            1/(x**2 - 1)|apart

          "find the Laplace transform of exp(-2*t)"
            exp(-2*t)|laplace

          "compute the sum of 1/n**2 from n=1 to infinity"
            1/n**2|summation(n,1,oo)

          "find the eigenvalues of the matrix [[1,2],[3,4]]"
            [[1,2],[3,4]]|eigenvalues

          "solve the system x + y = 5 and x - y = 1"
            [x + y - 5, x - y - 1]|solve_system

          "compute the inverse Laplace transform of s/(s**2+4), then verify"
            s/(s**2 + 4)|inverse_laplace
            PREV|laplace

          "find the general solution to y'(x) = y(x)"
            Eq(y(x).diff(x), y(x))|dsolve

          "solve the ODE y'(x) = y(x) with initial condition y(0) = 1"
            [Eq(y(x).diff(x), y(x)), {y(0): 1}]|dsolve_ic

          "solve the second-order ODE y''(x) - 3*y'(x) + 2*y(x) = 0"
            Eq(y(x).diff(x,2) - 3*y(x).diff(x) + 2*y(x), 0)|dsolve

        INCORRECT examples (DO NOT produce output like this):
          \boxed{sin(x)*cos(x)}|integrate  ← NO: LaTeX wrappers in expressions are forbidden
          ```plaintext              ← NO: code fences are forbidden
          exp(x)|diff
          ```
          x = sp.symbols('x')      ← NO: Python variable assignments are forbidden
          from sympy import diff    ← NO: Python import statements are forbidden
          Step 1: exp(x)|diff       ← NO: labels and numbering are forbidden
          1. exp(x)|diff             ← NO: numbered lists are forbidden
          x**2 - 4|solve             ← NO (as a later line): every line after the
                                        first must be PREV|<operation>
          exp(x)|diff                ← NO (when the problem says something else):
                                        this copies an example instead of the Problem

        Now translate ONLY the problem below. Transcribe its expression EXACTLY —
        same digits, signs, exponents — and use PREV for every step after the first.

        Problem: {{in_problem}}
      arguments:
        - '@problem'
    ports:
      - trigger
      - complete
      - in_problem
      - out_steps_text
  - id: tool_2
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@steps_text'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(steps_text)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_steps_text
      - out_steps_text
  - id: tool_3
    type: SOLVE
    config:
      tool: step_count
      backend: kernel
      arguments:
        - '@steps_text'
      code: |
        def step_count(steps_text: str) -> str:
            """Deterministic, 0-token: counts non-blank lines in the
            decomposed step list (mirrors chunk_plan in recipe 13)."""
            return str(len([line for line in steps_text.splitlines() if line.strip()]))
        _spl_result = step_count(steps_text)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - steps_text
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_steps_text
      - out_n_steps
  - id: eval_3
    type: EVALUATE
    config:
      condition: '@in_n_steps == ''0'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_n_steps
  - id: tool_4
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@log_dir}/chain_trace.md'
        - f'(planning failed — raw decomposition output below)\n{@steps_text}'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{log_dir}/chain_trace.md', f'(planning failed — raw decomposition output below)\n{steps_text}')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_log_dir
      - in_steps_text
      - out_write_file
  - id: set_3
    type: CONTEXT
    config:
      action: set
      expression: 'f''[PLAN FAILURE] The planning step could not decompose "{@in_problem}" into usable operations.\nRaw decomposition output: {@in_steps_text}'''
    ports:
      - trigger
      - complete
      - in_problem
      - in_steps_text
      - out_explanation
  - id: set_4
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_i
  - id: set_5
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_running_expression
  - id: set_6
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_trace
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_i, @i) < int(@in_n_steps)
      outputs:
        step:
          from: tool_5.out_step
        step_summary:
          from: call_1.out_step_summary
        running_expression:
          from: tool_6.out_running_expression
        trace_line:
          from: tool_7.out_trace_line
        step_no:
          from: set_7.out_step_no
        write_file:
          from: tool_8.out_write_file
        trace:
          from: set_8.out_trace
        i:
          from: set_9.out_i
      subgraph:
        nodes:
          - id: tool_5
            type: SOLVE
            config:
              tool: extract_step
              backend: kernel
              arguments:
                - '@steps_text'
                - '@i'
              code: |
                def extract_step(steps_text: str, index: str) -> str:
                    """Deterministic, 0-token: returns the i-th non-blank line of
                    the decomposed step list (mirrors extract_chunk in recipe 13)."""
                    lines = [line.strip() for line in steps_text.splitlines() if line.strip()]
                    i = int(index)
                    return lines[i] if 0 <= i < len(lines) else ""
                _spl_result = extract_step(steps_text, i)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - steps_text
                - index
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_steps_text
              - in_i
              - out_step
          - id: call_1
            type: GENERATE
            config:
              procedure_ref: procedures.solve_chain_step
              arguments:
                - '@step'
                - '@running_expression'
            ports:
              - trigger
              - complete
              - in_step
              - in_running_expression
              - out_step_summary
          - id: tool_6
            type: SOLVE
            config:
              tool: split_part
              backend: kernel
              arguments:
                - '@step_summary'
                - '''|'''
                - '''1'''
              code: |
                def trim(value: str) -> str:
                    """TRIM(value) — remove leading and trailing whitespace."""
                    return str(value).strip()

                def split_part(value: str, delimiter: str, part: str, trim: str='true') -> str:
                    """SPLIT_PART(value, delimiter, part [, trim]) — 1-based part after splitting on delimiter.

                    The part comes back whitespace-trimmed by default: delimited protocol
                    lines ('a | b') are padded for readability and virtually every caller
                    wants the bare field (list_get behaves the same way). Pass trim='false'
                    to keep the raw part, padding included.
                    """
                    parts = str(value).split(str(delimiter))
                    idx = int(part) - 1
                    if not 0 <= idx < len(parts):
                        return ''
                    raw = parts[idx]
                    if str(trim).strip().lower() in {'false', '0', 'no'}:
                        return raw
                    return raw.strip()
                _spl_result = split_part(step_summary, '|', '1')
              result: _spl_result
              out_type: TEXT
              tool_params:
                - value
                - delimiter
                - part
                - trim
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_step_summary
              - out_running_expression
          - id: tool_7
            type: SOLVE
            config:
              tool: split_part
              backend: kernel
              arguments:
                - '@step_summary'
                - '''|'''
                - '''2'''
              code: |
                def trim(value: str) -> str:
                    """TRIM(value) — remove leading and trailing whitespace."""
                    return str(value).strip()

                def split_part(value: str, delimiter: str, part: str, trim: str='true') -> str:
                    """SPLIT_PART(value, delimiter, part [, trim]) — 1-based part after splitting on delimiter.

                    The part comes back whitespace-trimmed by default: delimited protocol
                    lines ('a | b') are padded for readability and virtually every caller
                    wants the bare field (list_get behaves the same way). Pass trim='false'
                    to keep the raw part, padding included.
                    """
                    parts = str(value).split(str(delimiter))
                    idx = int(part) - 1
                    if not 0 <= idx < len(parts):
                        return ''
                    raw = parts[idx]
                    if str(trim).strip().lower() in {'false', '0', 'no'}:
                        return raw
                    return raw.strip()
                _spl_result = split_part(step_summary, '|', '2')
              result: _spl_result
              out_type: TEXT
              tool_params:
                - value
                - delimiter
                - part
                - trim
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_step_summary
              - out_trace_line
          - id: set_7
            type: CONTEXT
            config:
              action: set
              expression: '@in_i + 1'
            ports:
              - trigger
              - complete
              - in_i
              - out_step_no
          - id: eval_4
            type: EVALUATE
            config:
              condition: '@in_running_expression == ''sympy_error'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_running_expression
          - id: tool_8
            type: SOLVE
            config:
              tool: write_file
              backend: kernel
              arguments:
                - f'{@log_dir}/chain_trace.md'
                - f'{@trace}{@step_no}. SOLVER ERROR — {@trace_line}\n'
              code: |
                import pathlib

                def write_file(file_path: str, content: str, mode: str='w') -> str:
                    """WRITE_FILE(file_path, content [, mode]) — write text to a file.

                    mode: 'w' (overwrite, default) or 'a' (append).
                    Creates parent directories automatically.
                    Returns the absolute path written.
                    """
                    p = pathlib.Path(str(file_path).strip())
                    p.parent.mkdir(parents=True, exist_ok=True)
                    m = str(mode).strip().lower()
                    if m not in ('w', 'a'):
                        m = 'w'
                    with p.open(m, encoding='utf-8') as fh:
                        fh.write(str(content))
                    return str(p.resolve())
                _spl_result = write_file(f'{log_dir}/chain_trace.md', f'{trace}{step_no}. SOLVER ERROR — {trace_line}\n')
              result: _spl_result
              out_type: TEXT
              tool_params:
                - file_path
                - content
                - mode
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_log_dir
              - in_trace
              - in_step_no
              - in_trace_line
              - out_write_file
          - id: set_8
            type: CONTEXT
            config:
              action: set
              expression: '@in_trace + f''{@in_step_no}. {@in_trace_line}\n'''
            ports:
              - trigger
              - complete
              - in_trace
              - in_step_no
              - in_trace_line
              - out_trace
          - id: set_9
            type: CONTEXT
            config:
              action: set
              expression: '@in_i + 1'
            ports:
              - trigger
              - complete
              - in_i
              - out_i
        edges:
          - source: tool_5.complete
            target: call_1.trigger
            type: triggers
          - source: tool_5.out_step
            target: call_1.in_step
            type: binds
          - source: call_1.complete
            target: tool_6.trigger
            type: triggers
          - source: call_1.out_step_summary
            target: tool_6.in_step_summary
            type: binds
          - source: tool_6.complete
            target: tool_7.trigger
            type: triggers
          - source: call_1.out_step_summary
            target: tool_7.in_step_summary
            type: binds
          - source: tool_7.complete
            target: set_7.trigger
            type: triggers
          - source: set_7.complete
            target: eval_4.trigger
            type: triggers
          - source: tool_6.out_running_expression
            target: eval_4.in_running_expression
            type: binds
          - source: eval_4.pass
            target: tool_8.trigger
            type: triggers
          - source: set_7.out_step_no
            target: tool_8.in_step_no
            type: binds
          - source: tool_7.out_trace_line
            target: tool_8.in_trace_line
            type: binds
          - source: tool_8.complete
            target: set_8.trigger
            type: triggers
          - source: eval_4.fail
            target: set_8.trigger
            type: triggers
          - source: set_7.out_step_no
            target: set_8.in_step_no
            type: binds
          - source: tool_7.out_trace_line
            target: set_8.in_trace_line
            type: binds
          - source: set_8.complete
            target: set_9.trigger
            type: triggers
    ports:
      - trigger
      - loop
      - exit
      - in_steps_text
      - in_i
      - in_running_expression
      - in_log_dir
      - in_trace
      - in_n_steps
      - out_step
      - out_step_summary
      - out_running_expression
      - out_trace_line
      - out_step_no
      - out_write_file
      - out_trace
      - out_i
  - id: tool_9
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@log_dir}/chain_trace.md'
        - '@trace'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{log_dir}/chain_trace.md', trace)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_log_dir
      - in_trace
      - out_write_file
  - id: gen_2
    type: GENERATE
    config:
      function: explain_chain
      params:
        - problem
        - trace
      prompt_inline: |-
        A student asked: "{{in_problem}}"

        The symbolic math engine computed this chain of EXACT steps, in order:
        {{in_trace}}

        Write a clear, friendly explanation in less than 6 sentences that:
        1. Restates what the problem is asking in plain English
        2. Walks through the chain step by step, in order, stating each exact result
        3. Gives the final answer plainly at the end
        Do not re-derive any step — trust the computed chain above as exact.
      arguments:
        - '@problem'
        - '@trace'
    ports:
      - trigger
      - complete
      - in_problem
      - in_trace
      - out_explanation
  - id: tool_10
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@explanation'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_explanation
      - out_explanation
  - id: eval_5
    type: EVALUATE
    config:
      condition: '@in_explanation == '''''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_explanation
  - id: set_10
    type: CONTEXT
    config:
      action: set
      expression: f'[NARRATION FAILURE] The chain verified correctly but the explanation step returned nothing.\nVerified chain:\n{@in_trace}'
    ports:
      - trigger
      - complete
      - in_trace
      - out_explanation
  - id: tool_11
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@log_dir}/chain_trace.md'
        - '''(solver disabled for this run — no verified chain; the LLM solved it unaided)\n'''
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{log_dir}/chain_trace.md', '(solver disabled for this run — no verified chain; the LLM solved it unaided)\n')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_log_dir
      - out_write_file
  - id: gen_3
    type: GENERATE
    config:
      function: solve_directly
      params:
        - problem
        - number_of_sentences
      prompt_inline: |-
        A student asked: "{{in_problem}}"

        There is NO symbolic math engine backing you up this time — every
        computation must be done correctly by you, from scratch.

        Write a clear, friendly walkthrough in less than {number_of_sentences} sentences that:
        1. Restates what the problem is asking in plain English
        2. Shows your own working, step by step, in order — state the exact
           result of each step as you derive it (do not skip steps)
        3. Gives the final answer plainly at the end

        Show your work. Do not state any result you have not derived above.
      arguments:
        - '@problem'
    ports:
      - trigger
      - complete
      - in_problem
      - out_explanation
  - id: tool_12
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@explanation'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_explanation
      - out_explanation
  - id: eval_6
    type: EVALUATE
    config:
      condition: '@in_explanation == '''''
      branch: 1
    ports:
      - trigger
      - pass
