    target: gen_2.trigger
    type: triggers
  - source: tool_2.out_game_description
    target: gen_2.in_game_description
    type: binds
  - source: gen_2.complete
    target: tool_9.trigger
    type: triggers
  - source: gen_2.out_llm_strategy
    target: tool_9.in_llm_strategy
    type: binds
  - source: tool_8.out_report
    target: wf_exit.in_report
    type: binds
  - source: tool_9.out_report
    target: wf_exit.in_report
