  - id: gen_1
    type: GENERATE
    config:
      function: explain_inference_prompt
      params:
        - inference_report
        - policy_description
      prompt_inline: |-
        You are an insurance compliance analyst. The Prolog inference engine just evaluated 3 customers.

        POLICY:
        {{in_policy_description}}

        INFERENCE RESULT:
        {{in_inference_report}}

        Explain (≤150 words):
        1. Why is carol eligible? Walk through the exact proof chain.
        2. Why is bob NOT eligible? Which fact is missing?
        3. What is the risk of manual rule tracing (solver=OFF) for this policy?
        4. How would adding a 9th rule (e.g. high_value_client → deductible_waived) change the inference?
      arguments:
        - '@inference_report'
        - '@policy_description'
    ports:
      - trigger
      - complete
      - in_inference_report
      - in_policy_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@inference_report'
        - '@explanation'
      code: |
        def format_report_solver_on(inference_report: str, explanation: str) -> str:
            return f'=== Prolog Inference Engine (r105) | solver=ON ===\n\n{inference_report}\n\n── Explanation ─────────────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(inference_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - inference_report
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_inference_report
      - in_explanation
      - out_report
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''false'''
      branch: 2
    ports:
