          parsed = _parse_algo_results([r_markowitz, r_min_var, r_max_sharpe, r_risk_parity, r_hrp, r_cvar], algo_labels)
          buf = io.StringIO()
          writer = csv.writer(buf)
          writer.writerow(['ticker'] + [f'{a}_wt%' for a in algo_labels] + [f'{a}_$' for a in algo_labels])
          for ticker in ticker_list:
              row = [ticker]
              row += [f"{d.get('weights', {}).get(ticker, 0.0) * 100:.2f}" for d in parsed]
              row += [f"{d.get('weights', {}).get(ticker, 0.0) * cap:.0f}" for d in parsed]
              writer.writerow(row)
          return buf.getvalue().strip()
      _spl_result = composition_to_csv(tickers, capital, r_markowitz, r_min_var, r_max_sharpe, r_risk_parity, r_hrp, r_cvar)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - tickers
    - capital
    - r_markowitz
    - r_min_var
    - r_max_sharpe
    - r_risk_parity
    - r_hrp
    - r_cvar
    tool_returns: TEXT
