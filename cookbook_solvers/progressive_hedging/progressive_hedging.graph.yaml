      code: |
        import json

        def format_ph_report(result_json: str) -> str:
            try:
                d = json.loads(result_json)
                conv_str = 'Yes ✓' if d.get('converged') else f"No (residual={d.get('primal_residual_MW', '?')} MW)"
                lines = [f'## Progressive Hedging Report — Battery Storage Investment', '', f"**Scenarios:** {d.get('n_scenarios', '?')}  ", f"**PH iterations:** {d.get('ph_iterations', '?')}  ", f'**Converged:** {conv_str}  ', f"**Primal residual:** {d.get('primal_residual_MW', '?')} MW  ", f"**Solve time:** {d.get('solve_time_sec', '?')}s  ", '', '### Investment Decision', '', '| | PH (stochastic) | EV (mean scenario) |', '|---|---|---|', f"| Capacity (MW) | **{d.get('capacity_MW', '?')}** | {d.get('ev_capacity_MW', '?')} |", f"| Capital cost ($/yr) | ${d.get('capital_cost', '?'):,} | — |", f"| Annual net value (profit − capital, $) | **${-d.get('rp_cost', 0):,}** | ${-d.get('ev_cost', 0):,} |", f"| **Value of Stochastic Solution (VSS)** | **${d.get('vss', '?'):,}** | baseline |", '', 'VSS = RP_profit − EV_profit: the annual dollar gain from solving with', f"all {d.get('n_scenarios', '?')} scenarios vs. optimizing on the mean alone.", 'Positive VSS means the stochastic solution earns more than the EV policy.']
                return '\n'.join(lines)
            except Exception as e:
                return f'(format error: {e})'
        _spl_result = format_ph_report(result_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
