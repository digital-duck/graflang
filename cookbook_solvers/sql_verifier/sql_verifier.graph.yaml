  - id: tool_15
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@out_dir}/sql_verifier_{@ts_safe}.md'
        - '@report'
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{out_dir}/sql_verifier_{ts_safe}.md', report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_out_dir
      - in_ts_safe
      - in_report
      - out_out_path
  - id: tool_16
    type: SOLVE
    config:
      tool: time_elapsed
      backend: kernel
      arguments:
        - '@t_start'
      code: |
        def time_elapsed(start_ts: str) -> str:
            """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
            float string from time_monotonic())."""
            import time as _time
            try:
                return f'{_time.monotonic() - float(start_ts):.1f}'
            except Exception:
                return '?'
        _spl_result = time_elapsed(t_start)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - start_ts
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_t_start
      - out_elapsed
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
