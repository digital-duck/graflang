version: 1.0-graph
workflow:
  name: demand_forecast
  inputs:
    - name: problem
      type: TEXT
      default: Use the default 36-month widget sales dataset.
    - name: use_solver
      type: TEXT
      default: 'true'
    - name: periods
      type: TEXT
      default: '6'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_use_solver
      - out_periods
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''N/A'''
    ports:
      - trigger
      - complete
      - out_verify_status
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
      - out_forecast_json
  - id: set_3
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
