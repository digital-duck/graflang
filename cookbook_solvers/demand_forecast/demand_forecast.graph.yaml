      - complete
      - out_llm_calls
  - id: tool_1
    type: SOLVE
    config:
      tool: normalize_bool
      backend: kernel
      arguments:
        - '@use_solver'
      code: |
        def _coerce_bool(value: str) -> str:
            s = str(value).strip()
            if not s:
                return 'false'
            try:
                return 'true' if float(s) != 0 else 'false'
            except ValueError:
                pass
            if s.lower() in ('false', 'no', 'off'):
                return 'false'
            return 'true'

        def normalize_bool(value: str) -> str:
            """NORMALIZE_BOOL(value) — same logic as to_bool; purpose-named for --param flags.
            Accepts any truthy/falsy representation: 'ON', 'YES', '1', '2', 'true' → 'true';
            '0', 'OFF', 'NO', 'false', '' → 'false'.
            """
            return _coerce_bool(value)
        _spl_result = normalize_bool(use_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_use_solver
      - out_use_solver
  - id: tool_2
    type: SOLVE
    config:
      tool: get_default_problem
      backend: kernel
      arguments: []
      code: |
        import json

        _DEFAULT_PROBLEM = {'description': 'Monthly widget sales — 3 years of historical data with upward trend and Q4 seasonal spike', 'frequency': 'monthly', 'seasonal_period': 12, 'history': [95, 90, 102, 108, 112, 115, 118, 120, 115, 112, 135, 152, 102, 97, 110, 116, 120, 124, 127, 129, 124, 121, 145, 164, 109, 104, 118, 125, 129, 133, 137, 139, 133, 130, 156, 176]}

        def get_default_problem() -> str:
            return json.dumps(_DEFAULT_PROBLEM)
        _spl_result = get_default_problem()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - out_default_problem_json
  - id: eval_1
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''true'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_1
    type: GENERATE
    config:
      function: describe_ts_problem
      params:
        - problem
      prompt_inline: |-
        Describe this time-series forecasting problem as a JSON object.
        Return ONLY a JSON object — no markdown, no prose:
        {{
          "description": "<one-sentence summary>",
          "frequency": "monthly",
          "seasonal_period": 12,
          "history": [<list of numeric values in chronological order>]
        }}

        Rules:
        - history must be a flat list of numbers (no labels, no dates)
        - seasonal_period: 12 for monthly, 4 for quarterly, 7 for daily-weekly
        - if the problem provides raw data, use it exactly

        Problem: {{in_problem}}
      arguments:
        - '@problem'
    ports:
      - trigger
      - complete
      - in_problem
      - out_problem_json
  - id: set_4
    type: CONTEXT
    config:
      action: set
      expression: '@in_llm_calls + 1'
    ports:
      - trigger
      - complete
      - in_llm_calls
      - out_llm_calls
  - id: tool_3
    type: SOLVE
    config:
      tool: fit_structural_ts
      backend: kernel
      arguments:
        - '@problem_json'
        - '@periods'
      code: |
        import json

        from spl.stdlib import strip_fences as _strip_fences

        def fit_structural_ts(problem_json: str, periods: str='6') -> str:
            """Fit statsmodels UnobservedComponents and forecast future periods.

            Uses local-linear-trend + seasonal components (Kalman filter / MLE).
            Holds out the last seasonal_period // 2 observations for RMSE validation.

            Returns:
                {"status": "OK", "forecast": [...], "lower": [...], "upper": [...],
                 "n_periods": int, "rmse_holdout": float, "naive_rmse": float,
                 "beats_naive": bool}
            """
            try:
                import statsmodels.api as sm
                import numpy as np
            except ImportError:
                return json.dumps({'status': 'ERROR', 'error': 'statsmodels not installed — run: pip install statsmodels'})
            try:
                data = json.loads(_strip_fences(problem_json))
            except Exception as e:
                return json.dumps({'status': 'PARSE_ERROR', 'error': str(e)})
            history = [float(v) for v in data.get('history', [])]
            seasonal_period = int(data.get('seasonal_period', 12))
            n_forecast = max(1, int(periods))
            if len(history) < 2 * seasonal_period:
                return json.dumps({'status': 'INSUFFICIENT_DATA', 'error': f'need at least {2 * seasonal_period} observations for seasonal fit'})
            n_holdout = seasonal_period // 2
            train = history[:-n_holdout]
            holdout = history[-n_holdout:]
            try:
                model = sm.tsa.UnobservedComponents(train, level='local linear trend', seasonal=seasonal_period)
                result = model.fit(disp=False)
            except Exception as e:
                return json.dumps({'status': 'FIT_ERROR', 'error': str(e)})
            fc = result.get_forecast(steps=n_holdout + n_forecast)
            mean_all = np.asarray(fc.predicted_mean)
            ci_arr = np.asarray(fc.conf_int())
            lower_all = ci_arr[:, 0]
            upper_all = ci_arr[:, 1]
            holdout_pred = mean_all[:n_holdout]
            forecast = mean_all[n_holdout:]
            lower = lower_all[n_holdout:]
            upper = upper_all[n_holdout:]
            rmse = float(np.sqrt(np.mean((np.array(holdout) - holdout_pred) ** 2)))
            naive_pred = np.full(n_holdout, train[-1])
            naive_rmse = float(np.sqrt(np.mean((np.array(holdout) - naive_pred) ** 2)))
            return json.dumps({'status': 'OK', 'forecast': [round(float(v), 1) for v in forecast], 'lower': [round(float(v), 1) for v in lower], 'upper': [round(float(v), 1) for v in upper], 'n_periods': n_forecast, 'rmse_holdout': round(rmse, 2), 'naive_rmse': round(naive_rmse, 2), 'beats_naive': bool(rmse < naive_rmse)})
        _spl_result = fit_structural_ts(problem_json, periods)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
        - periods
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - in_periods
      - out_forecast_json
  - id: tool_4
    type: SOLVE
    config:
      tool: is_forecast_valid
      backend: kernel
      arguments:
        - '@forecast_json'
      code: |
        import json

        def is_forecast_valid(forecast_json: str) -> bool:
            """ASSERT gate: status==OK and RMSE beats naïve baseline."""
            try:
                d = json.loads(forecast_json)
                return d.get('status') == 'OK' and d.get('beats_naive', False)
            except Exception:
                return False
        _spl_result = is_forecast_valid(forecast_json)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - forecast_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_forecast_json
      - out_tool_4
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_4'
    ports:
      - trigger
      - pass
      - fail
      - in_forecast_json
      - in_tool_4
  - id: tool_5
    type: SOLVE
    config:
      tool: format_forecast_table
      backend: kernel
      arguments:
        - '@forecast_json'
      code: |
        import json

        def format_forecast_table(forecast_json: str) -> str:
            """Format forecast as markdown table with confidence interval."""
            try:
                d = json.loads(forecast_json)
                forecast = d.get('forecast', [])
                lower = d.get('lower', [])
                upper = d.get('upper', [])
                if not forecast:
                    return 'No forecast points.'
                lines = ['| Period | Forecast | Lower 95% | Upper 95% |', '|---|---|---|---|']
                for i, (f, lo, hi) in enumerate(zip(forecast, lower, upper), 1):
                    lines.append(f'| +{i} | {f:.1f} | {lo:.1f} | {hi:.1f} |')
                rmse = d.get('rmse_holdout')
                naive = d.get('naive_rmse')
                if rmse is not None and naive is not None:
                    lines.append(f"\nHold-out RMSE: **{rmse:.2f}** vs naïve baseline {naive:.2f} ({('✓ beats naïve' if d.get('beats_naive') else '✗ does not beat naïve')})")
                return '\n'.join(lines)
            except Exception as e:
                return f'Could not format forecast table: {e}'
        _spl_result = format_forecast_table(forecast_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - forecast_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_forecast_json
      - out_forecast_table
  - id: gen_2
    type: GENERATE
    config:
      function: interpret_forecast
      params:
        - problem
        - forecast_table
      prompt_inline: |-
        Interpret this demand forecast for a supply chain or inventory planner.

        Problem: {{in_problem}}

        Forecast table (statsmodels UnobservedComponents — local linear trend + seasonal):
        {{in_forecast_table}}

        Your interpretation should:
        1. Summarize the overall trend direction.
        2. Identify any seasonal pattern visible in the forecast.
        3. Give a plain-English recommendation for inventory planning based on the forecast.
        4. Note any uncertainty (wide vs. narrow confidence intervals).

        Be concise and practical — one paragraph.
      arguments:
        - '@problem'
        - '@forecast_table'
    ports:
      - trigger
      - complete
      - in_problem
      - in_forecast_table
      - out_interpretation
  - id: set_5
    type: CONTEXT
    config:
      action: set
      expression: '@in_llm_calls + 1'
    ports:
