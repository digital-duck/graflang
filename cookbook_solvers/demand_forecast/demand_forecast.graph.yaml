      - complete
      - in_llm_calls
      - out_llm_calls
  - id: tool_6
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@forecast_json'
        - '''n_periods'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
            Returns '' if key not found or input is not valid JSON.
            """
            try:
                clean = str(json_str).replace('```json', '').replace('```', '').strip()
                obj = json.loads(clean)
                for part in str(key).split('.'):
                    if isinstance(obj, dict):
                        obj = obj.get(part, '')
                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(forecast_json, 'n_periods')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
        - key
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_forecast_json
      - out_n_periods_str
  - id: tool_7
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@problem'
        - '@n_periods_str'
        - '@forecast_table'
        - '@interpretation'
        - '@llm_calls'
      code: |
        def format_report_solver_on(problem: str, n_periods: str, forecast_table: str, interpretation: str, llm_calls: str) -> str:
            return f'=== Demand Forecasting (solver=ON / statsmodels UnobservedComponents) ===\n\nProblem:\n{problem}\n\nForecast ({n_periods} periods ahead):\n{forecast_table}\n\nInterpretation:\n{interpretation}\n\nLLM calls: {llm_calls}'
        _spl_result = format_report_solver_on(problem, n_periods_str, forecast_table, interpretation, llm_calls)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - n_periods
        - forecast_table
        - interpretation
        - llm_calls
      tool_returns: TEXT
    ports:
