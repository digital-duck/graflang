  - id: set_10
    type: CONTEXT
    config:
      action: set
      expression: '@in_llm_calls + 1'
    ports:
      - trigger
      - complete
      - in_llm_calls
      - out_llm_calls
  - id: tool_8
    type: SOLVE
    config:
      tool: compute_utopia_anchors
      backend: kernel
      arguments:
        - '@problem_json'
      code: |
