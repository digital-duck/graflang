  - id: tool_9
    type: SOLVE
    config:
      tool: verify_workforce_off
      backend: kernel
      arguments:
        - '@problem_json'
        - '@solution_json'
      code: |
        import json

        from spl.stdlib import strip_fences as _strip_fences

        def verify_workforce_off(problem_json: str, solution_json: str) -> str:
            """Verify LLM-proposed schedule: integer feasibility, bounds, total, cost/quality/risk.

            Returns {"verdict": "PASS"/"FAIL"/"PARTIAL", "notes": str}
            """
            try:
                problem = json.loads(_strip_fences(problem_json))
                sol = json.loads(_strip_fences(solution_json))
            except Exception as e:
                return json.dumps({'verdict': 'FAIL', 'notes': f'parse error: {e}'})
            shifts = problem.get('shifts', [])
            total_min = int(problem.get('total_min', 30))
            shift_map = {s['name']: s for s in shifts}
            notes = []
            ok = True
            partial = False
            x_vals = {}
            for s in shifts:
                key = f"x{s['name'][0]}"
                val = sol.get(key)
                if val is None:
                    notes.append(f'missing {key}')
                    ok = False
                    x_vals[s['name']] = 0
                    continue
                try:
                    float_val = float(val)
                    int_val = int(round(float_val))
                    if abs(float_val - int_val) > 0.01:
                        notes.append(f'{key}={val} not integer')
                        partial = True
                    x_vals[s['name']] = int_val
                except Exception:
                    notes.append(f'{key} not numeric: {val}')
                    ok = False
                    x_vals[s['name']] = 0
            for s in shifts:
                v = x_vals.get(s['name'], 0)
                if v < s['min'] or v > s['max']:
                    notes.append(f"x{s['name'][0]}={v} out of bounds [{s['min']}, {s['max']}]")
                    ok = False
            total = sum(x_vals.values())
            if total < total_min:
                notes.append(f'total staff {total} < minimum {total_min}')
                ok = False
            recomp_cost = recomp_quality = recomp_risk = None
            if total > 0:
                recomp_cost = sum((shift_map[n]['cost'] * v for n, v in x_vals.items() if n in shift_map))
                recomp_quality = sum((shift_map[n]['quality'] * v for n, v in x_vals.items() if n in shift_map)) / total
                recomp_risk = sum((shift_map[n]['risk'] * v for n, v in x_vals.items() if n in shift_map)) / total
                if sol.get('cost') is not None and abs(float(sol['cost']) - recomp_cost) > 5.0:
                    notes.append(f"cost mismatch: claimed={float(sol['cost']):.0f}, actual={recomp_cost:.0f}")
                    ok = False
                if sol.get('quality') is not None and abs(float(sol['quality']) - recomp_quality) > 0.01:
                    notes.append(f"quality mismatch: claimed={float(sol['quality']):.4f}, actual={recomp_quality:.4f}")
                    partial = True
                if sol.get('risk') is not None and abs(float(sol['risk']) - recomp_risk) > 0.01:
                    notes.append(f"risk mismatch: claimed={float(sol['risk']):.4f}, actual={recomp_risk:.4f}")
                    partial = True
            verdict = 'PASS' if ok and (not partial) else 'PARTIAL' if partial and ok else 'FAIL'
            return json.dumps({'verdict': verdict, 'total_staff': total, 'recomputed_cost': round(recomp_cost, 2) if recomp_cost is not None else None, 'recomputed_quality': round(recomp_quality, 4) if recomp_quality is not None else None, 'recomputed_risk': round(recomp_risk, 4) if recomp_risk is not None else None, 'notes': '; '.join(notes) if notes else 'all checks passed'})
        _spl_result = verify_workforce_off(problem_json, solution_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
        - solution_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - in_solution_json
      - out_verify_result
  - id: tool_10
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@verify_result'
        - '''verdict'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
            Returns '' if key not found or input is not valid JSON.
            """
            try:
                clean = str(json_str).replace('```json', '').replace('```', '').strip()
                obj = json.loads(clean)
                for part in str(key).split('.'):
                    if isinstance(obj, dict):
                        obj = obj.get(part, '')
                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(verify_result, 'verdict')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
        - key
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_verify_result
      - out_verify_status
  - id: tool_11
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@problem'
        - '@anchors_json'
        - '@schedule_text'
        - '@solution_json'
        - '@verify_result'
        - '@llm_calls'
      code: |
        def format_report_solver_off(problem: str, anchors_json: str, schedule_text: str, solution_json: str, verify_result: str, llm_calls: str) -> str:
            return f'=== Platypus MOEA Workforce Scheduling (r121) | solver=OFF ===\n\nProblem:\n{problem}\n\nUtopia Anchors (reference):\n{anchors_json}\n\nLLM Proposed Schedule:\n{schedule_text}\n\nExtracted Schedule (JSON):\n{solution_json}\n\nVerification:\n{verify_result}\n\nLLM calls: {llm_calls}'
        _spl_result = format_report_solver_off(problem, anchors_json, schedule_text, solution_json, verify_result, llm_calls)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - anchors_json
        - schedule_text
        - solution_json
        - verify_result
        - llm_calls
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_anchors_json
      - in_schedule_text
      - in_solution_json
      - in_verify_result
      - in_llm_calls
      - out_report
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
