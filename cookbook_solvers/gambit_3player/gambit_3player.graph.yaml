  - id: gen_1
    type: GENERATE
    config:
      function: explain_3p_nash_prompt
      params:
        - nash_report
        - game_description
      prompt_inline: |-
        You are a game theory analyst. The solver just found Nash equilibria for a 3-firm pricing game.

        GAME DESCRIPTION:
        {{in_game_description}}

        NASH EQUILIBRIUM RESULT:
        {{in_nash_report}}

        Explain (≤200 words):
        1. What is the Nash equilibrium, and what does it mean in business terms?
        2. Why does Standard dominate Premium for every firm, regardless of competitors' choices?
        3. What is the Prisoner's Dilemma gap — the collective cost of rational self-interest?
        4. Why is the 3-player dilemma harder to escape than the 2-player version (r110)?
        5. What real-world mechanisms could sustain Premium pricing across three rivals?
      arguments:
        - '@nash_report'
        - '@game_description'
    ports:
      - trigger
      - complete
      - in_nash_report
      - in_game_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@nash_report'
        - '@explanation'
      code: |
        def format_report_solver_on(nash_report: str, explanation: str) -> str:
            return f'=== Gambit 3-Player Game Theory (r115) | solver=ON ===\n\n{nash_report}\n\n── Business Explanation ────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(nash_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - nash_report
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_nash_report
      - in_explanation
      - out_report
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''false'''
      branch: 2
    ports:
