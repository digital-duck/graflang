version: 1.0-graph
workflow:
  name: supply_sourcing
  inputs:
    - name: problem
      type: TEXT
      default: 'A manufacturer needs 1000 units from 3 suppliers. S1: $10/unit, 95% fill rate, capacity 400 units. S2: $7/unit, 80% fill rate, capacity 500 units. S3: $5/unit, 60% fill rate, capacity 400 units. Find allocations that minimize cost and maximize fill rate.'
    - name: use_solver
      type: TEXT
      default: 'true'
    - name: n_points
      type: TEXT
      default: '8'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_use_solver
      - out_n_points
