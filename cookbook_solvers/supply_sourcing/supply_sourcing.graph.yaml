  - id: tool_4
    type: SOLVE
    config:
      tool: format_pareto_table
      backend: kernel
      arguments:
        - '@front_json'
      code: |
        import json

        def format_pareto_table(front_json: str) -> str:
            """Format Pareto front as a markdown table: Cost ($) | Fill rate (%) | Allocation."""
            try:
                data = json.loads(front_json)
                points = data.get('pareto_front', [])
                if not points:
                    return 'No Pareto-optimal points found.'
                sample_alloc = points[0].get('allocation', {})
                supplier_names = sorted(sample_alloc.keys())
                alloc_header = '  |  '.join(supplier_names)
                lines = [f'| Cost ($) | Fill rate (%) | {alloc_header} |', '|---|---|' + '|'.join(['---'] * len(supplier_names)) + '|']
                for pt in points:
                    cost = f"{pt['cost']:,.2f}"
                    fill = f"{pt['fill_rate'] * 100:.1f}"
                    alloc_vals = '  |  '.join((str(int(pt['allocation'].get(n, 0))) for n in supplier_names))
                    lines.append(f'| {cost} | {fill} | {alloc_vals} |')
                return '\n'.join(lines)
            except Exception as e:
                return f'Could not format Pareto table: {e}'
        _spl_result = format_pareto_table(front_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - front_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_front_json
      - out_front_table
