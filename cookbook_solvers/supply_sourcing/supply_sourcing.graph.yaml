  - id: tool_7
    type: SOLVE
    config:
      tool: verify_sourcing_off
      backend: kernel
      arguments:
        - '@problem_json'
        - '@solution_json'
      code: |
        import json

        from spl.stdlib import strip_fences as _strip_fences

        def verify_sourcing_off(problem_json: str, solution_json: str) -> str:
            """Verify LLM-proposed allocation arithmetic.

            Checks:
            - demand balance: sum(allocation) == demand (±1)
            - capacity: each allocation <= supplier capacity
            - cost: recompute from allocation and compare to claimed
            - fill_rate: recompute and compare to claimed

            Returns {"verdict": "PASS"/"FAIL", "notes": str}
            """
            try:
                problem = json.loads(_strip_fences(problem_json))
                sol = json.loads(_strip_fences(solution_json))
            except Exception as e:
                return json.dumps({'verdict': 'FAIL', 'notes': f'parse error: {e}'})
            suppliers = {s['name']: s for s in problem.get('suppliers', [])}
            demand = float(problem.get('demand', 1000))
            allocation = sol.get('allocation', {})
            notes = []
            ok = True
            total_alloc = sum((float(v) for v in allocation.values()))
            if abs(total_alloc - demand) > 1.0:
                notes.append(f'demand balance: allocated {total_alloc:.1f} vs demanded {demand:.1f}')
                ok = False
            for name, amount in allocation.items():
                amount = float(amount)
                if name in suppliers:
                    cap = float(suppliers[name]['capacity'])
                    if amount > cap + 0.5:
                        notes.append(f'{name}: allocated {amount:.1f} exceeds capacity {cap:.1f}')
                        ok = False
            recomputed_cost = sum((float(suppliers[n]['cost']) * float(v) for n, v in allocation.items() if n in suppliers))
            claimed_cost = sol.get('cost')
            if claimed_cost is not None:
                if abs(float(claimed_cost) - recomputed_cost) > 10.0:
                    notes.append(f'cost mismatch: claimed={float(claimed_cost):.2f}, recomputed={recomputed_cost:.2f}')
                    ok = False
            recomputed_fill = sum((float(suppliers[n]['fill_rate']) * float(v) for n, v in allocation.items() if n in suppliers)) / demand
            claimed_fill = sol.get('fill_rate')
            if claimed_fill is not None:
                if abs(float(claimed_fill) - recomputed_fill) > 0.02:
                    notes.append(f'fill_rate mismatch: claimed={float(claimed_fill):.4f}, recomputed={recomputed_fill:.4f}')
                    ok = False
            return json.dumps({'verdict': 'PASS' if ok else 'FAIL', 'recomputed_cost': round(recomputed_cost, 2), 'recomputed_fill_rate': round(recomputed_fill, 4), 'notes': '; '.join(notes) if notes else 'all checks passed'})
        _spl_result = verify_sourcing_off(problem_json, solution_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
        - solution_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - in_solution_json
      - out_verify_result
