            verify_roundtrip.py script, imported from roundtrip_checks.py so the
            two paths can never silently diverge) rather than comparing against a
            precomputed answer form -- this sidesteps ambiguities like free
            constants in indefinite integrals/ODE solutions or root/eigenvalue
            ordering.

            output_text is the workflow's natural-language narration (@result):
            unused by every check except p015, whose solve_system(...) result can
            render as a multi-line SymPy repr that split_part(@step_summary, "|", ...)
            and LOGGING can garble -- output_text gives check_p015 the same
            narration-text fallback verify_roundtrip.py's post-hoc classify() uses.

            Returns one of: ROUNDTRIP_PASS, ROUNDTRIP_FAIL, UNPARSEABLE, NO_CHECK
            (pid not in the registered 20 T0-T5 problems, e.g. the Lean/T6 arms
            this check does not apply to) -- the same verdict vocabulary
            verify_roundtrip.py's classify() uses, so a live verdict and a
            post-hoc re-check of the same row are directly comparable."""
            import sys, os
            for _cand in (os.path.join(os.getcwd(), "cookbook_solvers", "neurosymbolic"), os.path.join(os.getcwd(), "cookbook", "77_neurosymbolic"), os.getcwd()):
                if _cand not in sys.path:
                    sys.path.insert(0, _cand)
            from roundtrip_checks import classify_from_value
            verdict, _detail = classify_from_value(pid, running_expression, output_text)
            return verdict
        _spl_result = round_trip_check(pid, running_expression, result)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - pid
        - running_expression
        - output_text
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_pid
      - in_running_expression
      - in_result
      - out_roundtrip
  - id: eval_15
    type: EVALUATE
    config:
      condition: '@in_result == '''''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_result
  - id: set_39
    type: CONTEXT
    config:
      action: set
      expression: f'[NARRATION FAILURE] The chain verified correctly but the explanation step returned nothing.\nVerified chain:\n{@in_trace}'
    ports:
      - trigger
      - complete
      - in_trace
      - out_result
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_result
