version: 1.0-graph
workflow:
  name: neurosymbolic_solver
  inputs:
    - name: problem
      type: TEXT
      default: find the Galois group of x**5 - x - 1 over the rationals
    - name: backend
      type: TEXT
      default: sage
    - name: enable_solver
      type: TEXT
      default: 'true'
    - name: max_tries
      type: INT
      default: 3
    - name: log_dir
      type: TEXT
      default: cookbook/77_neurosymbolic/logs-spl
    - name: hostname
      type: TEXT
      default: ''
    - name: pid
      type: TEXT
      default: ''
    - name: thinking_note
      type: TEXT
      default: ''
  outputs:
    - name: result
      type: TEXT
resources:
  procedures:
    solve_chain_step: ./symbolic_math.spl
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_backend
      - out_enable_solver
      - out_max_tries
      - out_log_dir
      - out_hostname
      - out_pid
      - out_thinking_note
  - id: tool_1
    type: SOLVE
    config:
      tool: lower
      backend: kernel
      arguments:
        - '@enable_solver'
      code: |
        def lower(value: str) -> str:
            """LOWER(value) — convert to lowercase."""
            return str(value).lower()
        _spl_result = lower(enable_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_enable_solver
      - out_solver_mode
  - id: tool_2
    type: SOLVE
    config:
      tool: lower
      backend: kernel
      arguments:
        - '@backend'
      code: |
        def lower(value: str) -> str:
            """LOWER(value) — convert to lowercase."""
            return str(value).lower()
        _spl_result = lower(backend)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_backend
      - out_backend_lc
  - id: tool_3
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@backend_lc'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(backend_lc)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_backend_lc
      - out_backend_lc
  - id: eval_1
    type: EVALUATE
    config:
      condition: (@in_solver_mode == 'true' OR @in_solver_mode == '1' OR @in_solver_mode == 'yes')
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_solver_mode
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''yes'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''no'''
    ports:
      - trigger
      - complete
      - out_use_solver
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''no'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: tool_4
    type: SOLVE
    config:
      tool: write_file
      backend: kernel
      arguments:
        - f'{@log_dir}/chain_trace.md'
        - '''(solver disabled for this run — no verified chain; the LLM solved it unaided)\n'''
      code: |
        import pathlib

        def write_file(file_path: str, content: str, mode: str='w') -> str:
            """WRITE_FILE(file_path, content [, mode]) — write text to a file.

            mode: 'w' (overwrite, default) or 'a' (append).
            Creates parent directories automatically.
            Returns the absolute path written.
            """
            p = pathlib.Path(str(file_path).strip())
            p.parent.mkdir(parents=True, exist_ok=True)
            m = str(mode).strip().lower()
            if m not in ('w', 'a'):
                m = 'w'
            with p.open(m, encoding='utf-8') as fh:
                fh.write(str(content))
            return str(p.resolve())
        _spl_result = write_file(f'{log_dir}/chain_trace.md', '(solver disabled for this run — no verified chain; the LLM solved it unaided)\n')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - file_path
        - content
        - mode
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_log_dir
      - out_write_file
  - id: gen_1
    type: GENERATE
    config:
      function: solve_directly
      params:
        - problem
        - thinking_note
      prompt_inline: |-
        {{in_thinking_note}}A student asked: "{{in_problem}}"

        There is NO symbolic math engine or proof assistant backing you up this
        time — every computation and every proof step must be done correctly by
        you, from scratch.

        Write a clear, friendly walkthrough in less than 8 sentences that:
        1. Restates what the problem is asking in plain English
        2. Shows your own working, step by step, in order — state the exact
           result of each step as you derive it (do not skip steps)
        3. Gives the final answer plainly at the end

        Show your work. Do not state any result you have not derived above.
      arguments:
        - '@problem'
        - '@thinking_note'
    ports:
      - trigger
      - complete
      - in_problem
      - in_thinking_note
      - out_result
  - id: tool_5
    type: SOLVE
    config:
      tool: trim
      backend: kernel
      arguments:
        - '@result'
      code: |
        def trim(value: str) -> str:
            """TRIM(value) — remove leading and trailing whitespace."""
            return str(value).strip()
        _spl_result = trim(result)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_result
      - out_result
  - id: eval_3
    type: EVALUATE
    config:
      condition: '@in_result == '''''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_result
  - id: set_3
    type: CONTEXT
    config:
      action: set
      expression: '''[FAILURE] The unaided LLM returned nothing for this problem.'''
    ports:
      - trigger
      - complete
      - out_result
  - id: eval_4
    type: EVALUATE
    config:
      condition: '@in_backend_lc == ''lean'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_backend_lc
  - id: tool_6
    type: SOLVE
    config:
      tool: run_python
      backend: kernel
      arguments:
        - '''from spl3.lean_bridge import LeanREPL; _spl_lean = LeanREPL.mathlib().start(); print("ready")'''
      code: |
        def run_python(code: str, timeout: str='30') -> str:
            """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
            import contextlib, io
            out = io.StringIO()
            try:
                with contextlib.redirect_stdout(out):
                    exec(str(code), globals())
                return out.getvalue().strip()
            except Exception as e:
                return f'Error: {type(e).__name__}: {e}'
        _spl_result = run_python('from spl3.lean_bridge import LeanREPL; _spl_lean = LeanREPL.mathlib().start(); print("ready")')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - code
        - timeout
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_lean_status
  - id: set_4
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_lean_stmt
  - id: set_5
    type: CONTEXT
    config:
      action: set
      expression: '''init'''
    ports:
      - trigger
      - complete
      - out_stmt_ok_lc
  - id: set_6
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_tries
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_tries, @tries) < @in_max_tries
      outputs:
        tries:
          from:
            - set_7.out_tries
            - set_9.out_tries
            - set_11.out_tries
        stmt_raw:
          from:
            - gen_2.out_stmt_raw
            - gen_3.out_stmt_raw
        lean_stmt:
          from:
            - tool_7.out_lean_stmt
            - tool_11.out_lean_stmt
        check_code:
          from:
            - set_8.out_check_code
            - set_10.out_check_code
        stmt_ok:
          from:
            - tool_8.out_stmt_ok
            - tool_12.out_stmt_ok
        lean_feedback:
          from:
            - tool_9.out_lean_feedback
            - tool_13.out_lean_feedback
        stmt_ok_lc:
          from:
            - tool_10.out_stmt_ok_lc
            - tool_14.out_stmt_ok_lc
      subgraph:
        nodes:
          - id: eval_5
            type: EVALUATE
            config:
              condition: '@in_stmt_ok_lc == ''true'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_stmt_ok_lc
          - id: set_7
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: eval_6
            type: EVALUATE
            config:
              condition: '@in_stmt_ok_lc == ''init'''
              branch: 2
            ports:
              - trigger
              - pass
              - fail
              - in_stmt_ok_lc
          - id: gen_2
            type: GENERATE
            config:
              function: formalize_claim
              params:
                - claim
              prompt_inline: |-
                Translate this mathematical claim into a single Lean 4 proposition.
                Mathlib IS imported — use mathlib vocabulary and notation.

                Rules:
                - Output ONLY the proposition — what goes after `example :`. No proof,
                  no `example`, no markdown fences, no commentary.
                - Bind every variable and every typeclass instance explicitly
                  (autoImplicit is off): universes, [Field ...], [AddCommGroup ...],
                  [Module ...], [FiniteDimensional ...] as needed.
                - Prefer the formulation closest to mathlib's own (Real, Nat.Prime,
                  abs, Even, Module.finrank, ...).
                - Example output for "the square of any real number is nonnegative":
                  ∀ a : ℝ, 0 ≤ a ^ 2

                Claim: {{in_problem}}
              arguments:
                - '@problem'
            ports:
              - trigger
              - complete
              - in_problem
              - out_stmt_raw
          - id: tool_7
            type: SOLVE
            config:
              tool: strip_fences
              backend: kernel
              arguments:
                - '@stmt_raw'
              code: |
                def strip_fences(text: str) -> str:
                    """Remove markdown code fences and surrounding noise from LLM output."""
                    import re
                    s = text.strip()
                    # Case 1: entire output wrapped in a single fence block (``` or ~~~, any lang tag)
                    m = re.match(r'^(?:```|~~~)[^\n]*\n(.*?)\n?(?:```|~~~)\s*$', s, re.DOTALL)
                    if m:
                        s = m.group(1)
                    else:
                        # Case 2: stray fence lines scattered through otherwise plain output
                        s = re.sub(r'^(?:```|~~~)[^\n]*$', '', s, flags=re.MULTILINE)
                        s = re.sub(r'\n{2,}', '\n', s)  # collapse blank lines left by removed fences
                    return s.strip().replace("'''", "")
                _spl_result = strip_fences(stmt_raw)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - text
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_stmt_raw
              - out_lean_stmt
          - id: set_8
            type: CONTEXT
            config:
              action: set
              expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
            ports:
              - trigger
              - complete
              - in_lean_stmt
              - out_check_code
          - id: tool_8
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '@check_code'
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                    import contextlib, io
                    out = io.StringIO()
                    try:
                        with contextlib.redirect_stdout(out):
                            exec(str(code), globals())
                        return out.getvalue().strip()
                    except Exception as e:
                        return f'Error: {type(e).__name__}: {e}'
                _spl_result = run_python(check_code)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - timeout
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_check_code
              - out_stmt_ok
          - id: tool_9
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '''print(_spl_lean.feedback)'''
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                    import contextlib, io
                    out = io.StringIO()
                    try:
                        with contextlib.redirect_stdout(out):
                            exec(str(code), globals())
                        return out.getvalue().strip()
                    except Exception as e:
                        return f'Error: {type(e).__name__}: {e}'
                _spl_result = run_python('print(_spl_lean.feedback)')
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - timeout
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - out_lean_feedback
          - id: tool_10
            type: SOLVE
            config:
              tool: lower
              backend: kernel
              arguments:
                - '@stmt_ok'
              code: |
                def lower(value: str) -> str:
                    """LOWER(value) — convert to lowercase."""
                    return str(value).lower()
                _spl_result = lower(stmt_ok)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - value
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_stmt_ok
              - out_stmt_ok_lc
          - id: set_9
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: gen_3
            type: GENERATE
            config:
              function: fix_formalization
              params:
                - claim
                - lean_stmt
                - feedback
              prompt_inline: |-
                This Lean 4 proposition failed to typecheck. Mathlib IS imported.

                Claim (prose): {{in_problem}}
                Attempted proposition: {{in_lean_stmt}}
                Lean's diagnostics:
                {{in_lean_feedback}}

                Output ONLY the corrected proposition (what goes after `example :`).
                No proof, no fences, no commentary. Bind every variable and typeclass
                instance explicitly (autoImplicit is off).
              arguments:
                - '@problem'
                - '@lean_stmt'
                - '@lean_feedback'
            ports:
              - trigger
              - complete
              - in_problem
              - in_lean_stmt
              - in_lean_feedback
              - out_stmt_raw
          - id: tool_11
            type: SOLVE
            config:
              tool: strip_fences
              backend: kernel
              arguments:
                - '@stmt_raw'
              code: |
                def strip_fences(text: str) -> str:
                    """Remove markdown code fences and surrounding noise from LLM output."""
                    import re
                    s = text.strip()
                    # Case 1: entire output wrapped in a single fence block (``` or ~~~, any lang tag)
                    m = re.match(r'^(?:```|~~~)[^\n]*\n(.*?)\n?(?:```|~~~)\s*$', s, re.DOTALL)
                    if m:
                        s = m.group(1)
                    else:
                        # Case 2: stray fence lines scattered through otherwise plain output
                        s = re.sub(r'^(?:```|~~~)[^\n]*$', '', s, flags=re.MULTILINE)
                        s = re.sub(r'\n{2,}', '\n', s)  # collapse blank lines left by removed fences
                    return s.strip().replace("'''", "")
                _spl_result = strip_fences(stmt_raw)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - text
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_stmt_raw
              - out_lean_stmt
          - id: set_10
            type: CONTEXT
            config:
              action: set
              expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
            ports:
              - trigger
              - complete
              - in_lean_stmt
              - out_check_code
          - id: tool_12
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '@check_code'
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                    import contextlib, io
                    out = io.StringIO()
                    try:
                        with contextlib.redirect_stdout(out):
                            exec(str(code), globals())
                        return out.getvalue().strip()
                    except Exception as e:
                        return f'Error: {type(e).__name__}: {e}'
                _spl_result = run_python(check_code)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - timeout
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_check_code
              - out_stmt_ok
          - id: tool_13
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '''print(_spl_lean.feedback)'''
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                    import contextlib, io
                    out = io.StringIO()
                    try:
                        with contextlib.redirect_stdout(out):
                            exec(str(code), globals())
                        return out.getvalue().strip()
                    except Exception as e:
                        return f'Error: {type(e).__name__}: {e}'
                _spl_result = run_python('print(_spl_lean.feedback)')
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - timeout
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - out_lean_feedback
          - id: tool_14
            type: SOLVE
            config:
              tool: lower
              backend: kernel
              arguments:
                - '@stmt_ok'
              code: |
                def lower(value: str) -> str:
                    """LOWER(value) — convert to lowercase."""
                    return str(value).lower()
                _spl_result = lower(stmt_ok)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - value
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_stmt_ok
              - out_stmt_ok_lc
          - id: set_11
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
        edges:
          - source: eval_5.pass
            target: set_7.trigger
            type: triggers
          - source: eval_5.fail
            target: eval_6.trigger
            type: triggers
          - source: eval_6.pass
            target: gen_2.trigger
            type: triggers
          - source: gen_2.complete
            target: tool_7.trigger
            type: triggers
          - source: gen_2.out_stmt_raw
            target: tool_7.in_stmt_raw
            type: binds
          - source: tool_7.complete
            target: set_8.trigger
            type: triggers
          - source: tool_7.out_lean_stmt
            target: set_8.in_lean_stmt
            type: binds
          - source: set_8.complete
            target: tool_8.trigger
            type: triggers
          - source: set_8.out_check_code
            target: tool_8.in_check_code
            type: binds
          - source: tool_8.complete
            target: tool_9.trigger
            type: triggers
          - source: tool_9.complete
            target: tool_10.trigger
            type: triggers
          - source: tool_8.out_stmt_ok
            target: tool_10.in_stmt_ok
            type: binds
          - source: tool_10.complete
            target: set_9.trigger
            type: triggers
          - source: eval_6.fail
            target: gen_3.trigger
            type: triggers
          - source: gen_3.complete
            target: tool_11.trigger
            type: triggers
          - source: gen_3.out_stmt_raw
            target: tool_11.in_stmt_raw
            type: binds
          - source: tool_11.complete
            target: set_10.trigger
            type: triggers
          - source: tool_11.out_lean_stmt
            target: set_10.in_lean_stmt
            type: binds
          - source: set_10.complete
            target: tool_12.trigger
            type: triggers
          - source: set_10.out_check_code
            target: tool_12.in_check_code
            type: binds
          - source: tool_12.complete
            target: tool_13.trigger
            type: triggers
          - source: tool_13.complete
            target: tool_14.trigger
            type: triggers
          - source: tool_12.out_stmt_ok
            target: tool_14.in_stmt_ok
            type: binds
          - source: tool_14.complete
            target: set_11.trigger
            type: triggers
    ports:
      - trigger
      - loop
      - exit
      - in_stmt_ok_lc
      - in_tries
      - in_problem
      - in_lean_stmt
      - in_lean_feedback
      - in_max_tries
      - out_tries
      - out_stmt_raw
      - out_lean_stmt
      - out_check_code
      - out_stmt_ok
      - out_lean_feedback
      - out_stmt_ok_lc
  - id: set_12
    type: CONTEXT
    config:
      action: set
      expression: '''not judged (formalization failed)'''
    ports:
      - trigger
      - complete
      - out_faithful
  - id: set_13
    type: CONTEXT
    config:
      action: set
      expression: '''unverified'''
    ports:
      - trigger
      - complete
      - out_badge
  - id: set_14
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_proof
  - id: set_15
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_tactics
  - id: set_16
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_citation
  - id: eval_7
    type: EVALUATE
    config:
      condition: '@in_stmt_ok_lc == ''true'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_stmt_ok_lc
  - id: set_17
    type: CONTEXT
    config:
      action: set
      expression: '''statement_checked'''
    ports:
      - trigger
      - complete
      - out_badge
  - id: gen_4
    type: GENERATE
    config:
      function: judge_faithfulness
      params:
        - claim
        - lean_stmt
      prompt_inline: |-
        A prose mathematical claim was formalized in Lean 4 (mathlib).

        Prose claim: {{in_claim}}
        Lean proposition: {{in_lean_stmt}}

        Does the Lean proposition say exactly what the prose claims — same
        quantifiers, no vacuous hypotheses, no degenerate specialization?
        Reply with exactly one line: FAITHFUL or UNFAITHFUL, then a dash and
        one short reason.
      arguments:
        - '@problem'
        - '@lean_stmt'
    ports:
      - trigger
      - complete
      - in_claim
      - in_lean_stmt
      - out_faithful
  - id: eval_8
    type: EVALUATE
    config:
      condition: contains(@in_subject, 'UNFAITHFUL')
      branch: 1
