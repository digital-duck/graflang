  - id: gen_1
    type: GENERATE
    config:
      function: explain_optuna_result_prompt
      params:
        - optuna_report
        - problem_description
      prompt_inline: |-
        You are a growth analytics consultant. Optuna just completed a 50-trial TPE optimization.

        PROBLEM:
        {{in_problem_description}}

        OPTUNA RESULT:
        {{in_optuna_report}}

        Explain (≤150 words):
        1. What did Optuna find and how does it compare to the naive guess?
        2. Why is price lower in the optimal solution than the naive guess? (hint: conversion)
        3. Why is trial shorter in the optimal — doesn't longer trial hurt conversion?
        4. What does "non-convex objective" mean here — why can't gradient descent find this?
        5. In what business situations would you use Optuna vs an analytical pricing model?
      arguments:
        - '@optuna_report'
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_optuna_report
      - in_problem_description
      - out_explanation
  - id: tool_9
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@optuna_report'
        - '@explanation'
      code: |
        def format_report_solver_on(optuna_report: str, explanation: str) -> str:
            return f'=== Optuna Black-Box Optimization (r112) | solver=ON ===\n\n{optuna_report}\n\n── Analytics Explanation ───────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(optuna_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - optuna_report
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_optuna_report
      - in_explanation
      - out_report
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''false'''
      branch: 2
    ports:
