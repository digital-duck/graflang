version: 1.0-graph
workflow:
  name: optuna_blackbox
  inputs:
    - name: use_solver
      type: TEXT
      default: 'true'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_use_solver
  - id: tool_1
    type: SOLVE
    config:
      tool: get_default_problem
      backend: kernel
      arguments: []
      code: |
        import json

        import math

        def _ltv_objective(price: float, discount_pct: float, trial_days: int) -> float:
            """Simulate customer lifetime value.

            This is a non-convex, non-analytic function with multiple local optima.
            Represents a simplified churn + conversion model — no gradient available.
            """
            trial_factor = 1.0 - math.exp(-trial_days / 10.0)
            price_factor = math.exp(-0.015 * (price - 30))
            conversion = 0.35 * trial_factor * price_factor
            conversion = max(0.01, min(0.7, conversion))
            monthly_revenue = price * (1 - discount_pct / 100) * (1 - 0.08 * (discount_pct > 20))
            monthly_churn = 0.04 + 0.003 * max(0, price - 50) + 0.002 * max(0, discount_pct - 25)
            monthly_churn = min(monthly_churn, 0.25)
            ltv = conversion * (monthly_revenue / monthly_churn) * 0.85
            return round(ltv, 2)

        _DEFAULT_STRATEGY_PROBLEM = {'problem_name': 'SaaS Pricing Strategy Optimization', 'description': 'Find the optimal combination of monthly_price ($30–$120), annual_discount_pct (0%–40%), and trial_days (3–30) to maximize customer lifetime value (LTV). The LTV model is a black box: it depends on a churn model and conversion funnel with no closed-form gradient.', 'parameters': [{'name': 'monthly_price', 'type': 'float', 'low': 30, 'high': 120}, {'name': 'annual_discount_pct', 'type': 'float', 'low': 0, 'high': 40}, {'name': 'trial_days', 'type': 'int', 'low': 3, 'high': 30}], 'objective': 'maximize LTV (customer lifetime value in $)', 'n_trials': 50, 'naive_baseline': {'monthly_price': 50, 'annual_discount_pct': 20, 'trial_days': 14, 'ltv': None}}

        def get_default_problem() -> str:
            """Return default pricing strategy optimization problem JSON."""
            p = dict(_DEFAULT_STRATEGY_PROBLEM)
            nb = dict(p['naive_baseline'])
            nb['ltv'] = _ltv_objective(nb['monthly_price'], nb['annual_discount_pct'], nb['trial_days'])
            p['naive_baseline'] = nb
            return json.dumps(p)
        _spl_result = get_default_problem()
      result: _spl_result
      out_type: TEXT
      tool_params: []
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - out_problem_json
  - id: tool_2
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@problem_json'
        - '''description'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
            Returns '' if key not found or input is not valid JSON.
            """
            try:
                clean = str(json_str).replace('```json', '').replace('```', '').strip()
                obj = json.loads(clean)
                for part in str(key).split('.'):
                    if isinstance(obj, dict):
                        obj = obj.get(part, '')
                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(problem_json, 'description')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
        - key
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_problem_description
  - id: tool_3
    type: SOLVE
    config:
      tool: normalize_bool
      backend: kernel
      arguments:
        - '@use_solver'
      code: |
        def _coerce_bool(value: str) -> str:
            s = str(value).strip()
            if not s:
                return 'false'
            try:
                return 'true' if float(s) != 0 else 'false'
            except ValueError:
                pass
            if s.lower() in ('false', 'no', 'off'):
                return 'false'
            return 'true'

        def normalize_bool(value: str) -> str:
            """NORMALIZE_BOOL(value) — same logic as to_bool; purpose-named for --param flags.
            Accepts any truthy/falsy representation: 'ON', 'YES', '1', '2', 'true' → 'true';
            '0', 'OFF', 'NO', 'false', '' → 'false'.
            """
            return _coerce_bool(value)
        _spl_result = normalize_bool(use_solver)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - value
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_use_solver
      - out_use_solver
  - id: eval_1
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''true'''
      branch: 1
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: tool_4
    type: SOLVE
    config:
      tool: run_optuna_study
      backend: kernel
      arguments:
        - '@problem_json'
      code: |
        import json

        import math

        def _ltv_objective(price: float, discount_pct: float, trial_days: int) -> float:
            """Simulate customer lifetime value.

            This is a non-convex, non-analytic function with multiple local optima.
            Represents a simplified churn + conversion model — no gradient available.
            """
            trial_factor = 1.0 - math.exp(-trial_days / 10.0)
            price_factor = math.exp(-0.015 * (price - 30))
            conversion = 0.35 * trial_factor * price_factor
            conversion = max(0.01, min(0.7, conversion))
            monthly_revenue = price * (1 - discount_pct / 100) * (1 - 0.08 * (discount_pct > 20))
            monthly_churn = 0.04 + 0.003 * max(0, price - 50) + 0.002 * max(0, discount_pct - 25)
            monthly_churn = min(monthly_churn, 0.25)
            ltv = conversion * (monthly_revenue / monthly_churn) * 0.85
            return round(ltv, 2)

        def run_optuna_study(problem_json: str) -> str:
            """Run an Optuna TPE study to find optimal strategy parameters.

            Returns:
              {"problem_name": str, "best_params": {...}, "best_value": float,
               "naive_value": float, "improvement_pct": float, "n_trials": int,
               "top_trials": [{params, value}], "status": "OK"|"ERROR"}
            """
            try:
                import optuna
                optuna.logging.set_verbosity(optuna.logging.WARNING)
            except ImportError:
                return json.dumps({'status': 'ERROR', 'error': 'optuna not installed — run: pip install optuna'})
            try:
                problem = json.loads(problem_json)
                n_trials = problem.get('n_trials', 50)
                nb = problem['naive_baseline']
                naive_ltv = nb.get('ltv') or _ltv_objective(nb['monthly_price'], nb['annual_discount_pct'], nb['trial_days'])
                param_defs = {p['name']: p for p in problem['parameters']}

                def objective(trial):
                    price = trial.suggest_float('monthly_price', param_defs['monthly_price']['low'], param_defs['monthly_price']['high'])
                    discount = trial.suggest_float('annual_discount_pct', param_defs['annual_discount_pct']['low'], param_defs['annual_discount_pct']['high'])
                    trial_d = trial.suggest_int('trial_days', param_defs['trial_days']['low'], param_defs['trial_days']['high'])
                    return _ltv_objective(price, discount, trial_d)
                study = optuna.create_study(direction='maximize', sampler=optuna.samplers.TPESampler(seed=42))
                study.optimize(objective, n_trials=n_trials, show_progress_bar=False)
                best = study.best_trial
                improvement = round((best.value - naive_ltv) / naive_ltv * 100, 1)
                top5 = sorted(study.trials, key=lambda t: t.value or 0, reverse=True)[:5]
                top_trials = [{'params': t.params, 'ltv': round(t.value or 0, 2)} for t in top5]
                return json.dumps({'problem_name': problem.get('problem_name', 'Problem'), 'best_params': best.params, 'best_value': round(best.value, 2), 'naive_params': {'monthly_price': nb['monthly_price'], 'annual_discount_pct': nb['annual_discount_pct'], 'trial_days': nb['trial_days']}, 'naive_value': round(naive_ltv, 2), 'improvement_pct': improvement, 'n_trials': n_trials, 'top_trials': top_trials, 'status': 'OK'})
            except Exception as e:
                return json.dumps({'status': 'ERROR', 'error': str(e)})
        _spl_result = run_optuna_study(problem_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - out_result_json
  - id: tool_5
    type: SOLVE
    config:
      tool: optimization_improved
      backend: kernel
      arguments:
        - '@result_json'
      code: |
        import json

        def optimization_improved(result_json: str) -> bool:
            """ASSERT gate: Optuna found a result better than the naive baseline."""
            try:
                data = json.loads(result_json)
                return data.get('status') == 'OK' and data.get('improvement_pct', 0) > 0
            except Exception:
                return False
        _spl_result = optimization_improved(result_json)
      result: _spl_result
      out_type: BOOL
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result_json
      - out_tool_5
  - id: assert_1
    type: ASSERT
    config:
      condition: '@in_tool_5'
    ports:
      - trigger
      - pass
      - fail
      - in_result_json
      - in_tool_5
  - id: tool_6
    type: SOLVE
    config:
      tool: format_optuna_report
      backend: kernel
      arguments:
        - '@result_json'
      code: |
        import json

        def format_optuna_report(result_json: str) -> str:
            """Markdown report of Optuna study results."""
            try:
                data = json.loads(result_json)
                bp = data.get('best_params', {})
                np_ = data.get('naive_params', {})
                lines = [f"## Optuna Black-Box Optimization — {data.get('problem_name', 'Problem')}", '', f"**Trials:** {data.get('n_trials', '?')}  ", f"**Best LTV:** ${data.get('best_value', '?')}/customer  ", f"**Naive LTV:** ${data.get('naive_value', '?')}/customer  ", f"**Improvement:** +{data.get('improvement_pct', '?')}%", '', '| Parameter | Naive (LLM guess) | Optuna Best |', '|---|---|---|', f"| monthly_price | ${np_.get('monthly_price', '?')} | ${round(bp.get('monthly_price', 0), 1)} |", f"| annual_discount_pct | {np_.get('annual_discount_pct', '?')}% | {round(bp.get('annual_discount_pct', 0), 1)}% |", f"| trial_days | {np_.get('trial_days', '?')} days | {bp.get('trial_days', '?')} days |", '', '### Top 5 Trials', '', '| Rank | Price | Discount | Trial Days | LTV |', '|---|---|---|---|---|']
                for i, t in enumerate(data.get('top_trials', []), 1):
                    p = t['params']
                    lines.append(f"| {i} | ${round(p.get('monthly_price', 0), 1)} | {round(p.get('annual_discount_pct', 0), 1)}% | {p.get('trial_days', '?')} days | ${t['ltv']} |")
                return '\n'.join(lines)
            except Exception as e:
                return f'(format error: {e})'
        _spl_result = format_optuna_report(result_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - result_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_result_json
      - out_optuna_report
  - id: tool_7
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@result_json'
        - '''improvement_pct'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
