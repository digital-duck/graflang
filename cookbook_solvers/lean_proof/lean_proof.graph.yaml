              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_stmt_raw
              - out_lean_stmt
          - id: set_6
            type: CONTEXT
            config:
              action: set
              expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
            ports:
              - trigger
              - complete
              - in_lean_stmt
              - out_check_code
          - id: tool_7
            type: SOLVE
            config:
