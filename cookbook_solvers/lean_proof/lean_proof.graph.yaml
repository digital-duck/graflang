version: 1.0-graph
workflow:
  name: lean_proof
  inputs:
    - name: claim
      type: TEXT
      default: addition of natural numbers is commutative
    - name: max_tries
      type: INT
      default: 3
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_claim
      - out_max_tries
  - id: tool_1
    type: SOLVE
    config:
      tool: run_python
      backend: kernel
      arguments:
        - '''from spl3.lean_bridge import LeanREPL; _spl_lean = LeanREPL().start(); print("ready")'''
      code: |
        def run_python(code: str, timeout: str='30') -> str:
            """RUN_PYTHON(code [, timeout]) — execute Python code in a subprocess.

            Returns stdout on success, or stderr on failure.
            Timeout is in seconds (default 30).

            Usage in SPL:
                CALL run_python(@code_snippet) INTO @output;

            Security note: executes arbitrary code — use only with trusted input.

            Deprecated: with --kernel (now default), deterministic Python belongs in
            CREATE TOOL_API blocks, which execute in the persistent kernel session and
            share state across calls. This subprocess fallback remains for --no-kernel
            mode only. Scheduled for removal in spl-llm v3.2.
            """
            import subprocess
            import sys
            try:
                result = subprocess.run([sys.executable, '-c', str(code)], capture_output=True, text=True, timeout=float(timeout))
                if result.returncode == 0:
                    return result.stdout.strip()
                return f'Error (exit {result.returncode}):\n{result.stderr.strip()}'
            except subprocess.TimeoutExpired:
                return f'run_python timed out after {timeout}s'
            except Exception as e:
                return f'run_python error: {e}'
        _spl_result = run_python('from spl3.lean_bridge import LeanREPL; _spl_lean = LeanREPL().start(); print("ready")')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - code
        - timeout
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - out_lean_status
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''init'''
    ports:
      - trigger
      - complete
      - out_stmt_ok_lc
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '0'
    ports:
      - trigger
      - complete
      - out_tries
  - id: loop_1
    type: LOOP
    config:
      condition: latest(@in_tries, @tries) < @in_max_tries
      outputs:
        tries:
          from:
            - set_3.out_tries
            - set_5.out_tries
            - set_7.out_tries
        stmt_raw:
          from:
            - gen_1.out_stmt_raw
            - gen_2.out_stmt_raw
        lean_stmt:
          from:
            - tool_2.out_lean_stmt
            - tool_6.out_lean_stmt
        check_code:
          from:
            - set_4.out_check_code
            - set_6.out_check_code
        stmt_ok:
          from:
            - tool_3.out_stmt_ok
            - tool_7.out_stmt_ok
        lean_feedback:
          from:
            - tool_4.out_lean_feedback
            - tool_8.out_lean_feedback
        stmt_ok_lc:
          from:
            - tool_5.out_stmt_ok_lc
            - tool_9.out_stmt_ok_lc
      subgraph:
        nodes:
          - id: eval_1
            type: EVALUATE
            config:
              condition: '@in_stmt_ok_lc == ''true'''
              branch: 1
            ports:
              - trigger
              - pass
              - fail
              - in_stmt_ok_lc
          - id: set_3
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: eval_2
            type: EVALUATE
            config:
              condition: '@in_stmt_ok_lc == ''init'''
              branch: 2
            ports:
              - trigger
              - pass
              - fail
              - in_stmt_ok_lc
          - id: gen_1
            type: GENERATE
            config:
              function: formalize_claim
              params:
                - claim
              prompt_inline: |-
                Translate this mathematical claim into a single Lean 4 proposition.

                Rules:
                - Output ONLY the proposition — what goes after `example :`. No proof,
                  no `example`, no markdown fences, no commentary.
                - Use core Lean 4 types (Nat, Int, List) and notation. Bind every
                  variable explicitly with ∀.
                - Example output:  ∀ n : Nat, n + 0 = n

                Claim: {{in_claim}}
              arguments:
                - '@claim'
            ports:
              - trigger
              - complete
              - in_claim
              - out_stmt_raw
          - id: tool_2
            type: SOLVE
            config:
              tool: strip_fences
              backend: kernel
              arguments:
                - '@stmt_raw'
              code: |
                def strip_fences(text: str) -> str:
                    """Remove markdown code fences and surrounding noise from LLM output."""
                    s = text.strip()
                    if s.startswith("```"):
                        lines = [ln for ln in s.splitlines() if not ln.strip().startswith("```")]
                        s = "\n".join(lines).strip()
                    # one-line statements sometimes arrive with a trailing period
                    return s.rstrip(".").strip().replace("'''", "")
                _spl_result = strip_fences(stmt_raw)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - text
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_stmt_raw
              - out_lean_stmt
          - id: set_4
            type: CONTEXT
            config:
              action: set
              expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
            ports:
              - trigger
              - complete
              - in_lean_stmt
              - out_check_code
          - id: tool_3
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '@check_code'
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """RUN_PYTHON(code [, timeout]) — execute Python code in a subprocess.

                    Returns stdout on success, or stderr on failure.
                    Timeout is in seconds (default 30).

                    Usage in SPL:
                        CALL run_python(@code_snippet) INTO @output;

                    Security note: executes arbitrary code — use only with trusted input.

                    Deprecated: with --kernel (now default), deterministic Python belongs in
                    CREATE TOOL_API blocks, which execute in the persistent kernel session and
                    share state across calls. This subprocess fallback remains for --no-kernel
                    mode only. Scheduled for removal in spl-llm v3.2.
                    """
                    import subprocess
                    import sys
                    try:
                        result = subprocess.run([sys.executable, '-c', str(code)], capture_output=True, text=True, timeout=float(timeout))
                        if result.returncode == 0:
                            return result.stdout.strip()
                        return f'Error (exit {result.returncode}):\n{result.stderr.strip()}'
                    except subprocess.TimeoutExpired:
                        return f'run_python timed out after {timeout}s'
                    except Exception as e:
                        return f'run_python error: {e}'
                _spl_result = run_python(check_code)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - code
                - timeout
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_check_code
              - out_stmt_ok
          - id: tool_4
            type: SOLVE
            config:
              tool: run_python
              backend: kernel
              arguments:
                - '''print(_spl_lean.feedback)'''
              code: |
                def run_python(code: str, timeout: str='30') -> str:
                    """RUN_PYTHON(code [, timeout]) — execute Python code in a subprocess.

                    Returns stdout on success, or stderr on failure.
