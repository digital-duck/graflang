  - id: set_15
    type: CONTEXT
    config:
      action: set
      expression: ''''''
    ports:
      - trigger
      - complete
      - out_citation
  - id: tool_12
    type: SOLVE
    config:
      tool: make_theorem
      backend: kernel
      arguments:
        - '@lean_stmt'
        - '@citation'
      code: |
        def make_theorem(stmt: str, tactics: str) -> str:
            """Assemble the final theorem deterministically: the verified statement
            is spliced in verbatim — the LLM only ever contributes the tactic block,
            so it can never prove a subtly different statement."""
            body = tactics.strip()
            if body.startswith(":="):
                body = body[2:].strip()
            if body == "by" or body.startswith(("by\n", "by ")):
                body = body[2:].strip()
            return f"theorem spl_claim : {stmt} := by\n  {body}"
        _spl_result = make_theorem(lean_stmt, citation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - stmt
        - tactics
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_lean_stmt
      - in_citation
      - out_proof
  - id: set_16
    type: CONTEXT
    config:
      action: set
      expression: f"print(_spl_lean.check(r'''{@in_proof}''')['ok'])"
    ports:
