          - id: tool_5
            type: SOLVE
            config:
              tool: lower
              backend: kernel
              arguments:
                - '@stmt_ok'
              code: |
                def lower(value: str) -> str:
                    """LOWER(value) — convert to lowercase."""
                    return str(value).lower()
                _spl_result = lower(stmt_ok)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - value
              tool_returns: TEXT
              tool_builtin: true
            ports:
              - trigger
              - complete
              - in_stmt_ok
              - out_stmt_ok_lc
          - id: set_5
            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
          - id: gen_2
            type: GENERATE
            config:
              function: fix_formalization
              params:
                - claim
                - lean_stmt
                - feedback
              prompt_inline: |-
                This Lean 4 proposition failed to typecheck.

                Claim (prose): {{in_claim}}
                Attempted proposition: {{in_lean_stmt}}
                Lean's diagnostics:
                {{in_feedback}}

                Output ONLY the corrected proposition (what goes after `example :`).
                No proof, no fences, no commentary. Bind every variable with ∀.
              arguments:
                - '@claim'
                - '@lean_stmt'
                - '@lean_feedback'
            ports:
              - trigger
              - complete
              - in_claim
              - in_lean_stmt
              - in_feedback
              - out_stmt_raw
          - id: tool_6
            type: SOLVE
            config:
