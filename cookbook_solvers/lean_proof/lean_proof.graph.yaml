            type: CONTEXT
            config:
              action: set
              expression: '@in_tries + 1'
            ports:
              - trigger
              - complete
              - in_tries
              - out_tries
        edges:
          - source: eval_1.pass
            target: set_3.trigger
            type: triggers
          - source: eval_1.fail
            target: eval_2.trigger
            type: triggers
          - source: eval_2.pass
            target: gen_1.trigger
            type: triggers
          - source: gen_1.complete
            target: tool_2.trigger
            type: triggers
          - source: gen_1.out_stmt_raw
            target: tool_2.in_stmt_raw
            type: binds
          - source: tool_2.complete
            target: set_4.trigger
            type: triggers
          - source: tool_2.out_lean_stmt
            target: set_4.in_lean_stmt
            type: binds
          - source: set_4.complete
