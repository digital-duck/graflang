  - id: gen_1
    type: GENERATE
    config:
      function: extract_rules_prompt
      params:
        - rules_text
      prompt_inline: |-
        You are a quantitative trading systems engineer. Convert the natural-language trading rules below into a structured JSON object matching this schema exactly. Output JSON only — no explanation, no markdown fences.

        SCHEMA:
        {
          "policy": "<strategy name string>",
          "variables": [
            {"name": "<var_name>", "type": "int", "range": [<min>, <max>]},
            {"name": "<var_name>", "type": "bool"}
          ],
          "entry_rules": [
            {"id": "E1", "desc": "<human description>", <op structure>}
          ],
          "risk_rules": [
            {"id": "R1", "desc": "<human description>", <op structure>}
          ],
          "query": "find_triggering_scenario"
        }

        SUPPORTED OPS:
        - Comparison:  {"op": "gte"|"lte"|"eq"|"neq", "var": "<name>", "value": <number|bool>}
        - Logical:     {"op": "and"|"or", "args": [<rule>, ...]}
        - Negation:    {"op": "not", "arg": <rule>}
        - Implication: {"op": "implies", "condition": <rule>, "then": <rule>}

        VARIABLE CONVENTIONS (use these names when the rule mentions these concepts):
        - RSI (0-100 int): "rsi"
        - Price vs 200-day MA in % × 10 (-100 to 200 int): "price_vs_ma200"
        - Volume / avg_volume × 100 (0-500 int): "volume_ratio"
        - Average daily range % × 10 (0-200 int): "adr_pct"
        - Boolean flags: use descriptive snake_case names (e.g. "earnings_week", "in_uptrend", "fed_day")
        - For other numeric indicators: choose a clear snake_case name with appropriate range

        EXAMPLE:
        Rules text: "Enter when RSI is between 25 and 38, and price is above the 50-day MA. Never trade on Fed announcement days."
        Output:
        {
          "policy": "RSI Pullback Strategy",
          "variables": [
            {"name": "rsi", "type": "int", "range": [0, 100]},
            {"name": "price_vs_ma50", "type": "int", "range": [-100, 200]},
            {"name": "fed_day", "type": "bool"}
          ],
          "entry_rules": [
            {"id": "E1", "desc": "RSI between 25 and 38",
             "op": "and", "args": [
               {"op": "gte", "var": "rsi", "value": 25},
               {"op": "lte", "var": "rsi", "value": 38}
             ]},
            {"id": "E2", "desc": "Price above 50-day MA",
             "op": "gte", "var": "price_vs_ma50", "value": 0}
          ],
          "risk_rules": [
            {"id": "R1", "desc": "No trading on Fed announcement days",
             "op": "eq", "var": "fed_day", "value": false}
          ],
          "query": "find_triggering_scenario"
        }

        NOW CONVERT:
        Trading rules: {{in_rules_text}}
      arguments:
        - '@rules_text'
    ports:
      - trigger
      - complete
      - in_rules_text
      - out_policy_json_raw
  - id: tool_3
    type: SOLVE
    config:
      tool: parse_policy_json
      backend: kernel
      arguments:
        - '@policy_json_raw'
      code: |
        import json

        _DEFAULT_TRADING_POLICY = {'policy': 'Momentum Breakout Strategy v1.0', 'variables': [{'name': 'rsi', 'type': 'int', 'range': [0, 100]}, {'name': 'price_vs_ma200', 'type': 'int', 'range': [-100, 200]}, {'name': 'volume_ratio', 'type': 'int', 'range': [0, 500]}, {'name': 'adr_pct', 'type': 'int', 'range': [0, 200]}, {'name': 'in_uptrend', 'type': 'bool'}, {'name': 'earnings_week', 'type': 'bool'}], 'entry_rules': [{'id': 'E1', 'desc': 'RSI oversold: 28 ≤ RSI ≤ 35 (momentum but not panic)', 'op': 'and', 'args': [{'op': 'gte', 'var': 'rsi', 'value': 28}, {'op': 'lte', 'var': 'rsi', 'value': 35}]}, {'id': 'E2', 'desc': 'Price above 200-day MA (uptrend context)', 'op': 'gte', 'var': 'price_vs_ma200', 'value': 0}, {'id': 'E3', 'desc': 'Volume surge: at least 1.5x average', 'op': 'gte', 'var': 'volume_ratio', 'value': 150}, {'id': 'E4', 'desc': 'Sufficient volatility: ADR% ≥ 2.0', 'op': 'gte', 'var': 'adr_pct', 'value': 20}], 'risk_rules': [{'id': 'R1', 'desc': 'Never enter during earnings week', 'op': 'eq', 'var': 'earnings_week', 'value': False}, {'id': 'R2', 'desc': 'Only enter in confirmed uptrend', 'op': 'eq', 'var': 'in_uptrend', 'value': True}], 'query': 'find_triggering_scenario'}

        def parse_policy_json(json_str: str) -> str:
            """Validate LLM-extracted trading policy JSON; fall back to default on failure."""
            import re
            text = json_str.strip()
            m = re.search('```(?:json)?\\s*([\\s\\S]*?)```', text)
            if m:
                text = m.group(1).strip()
            try:
                policy = json.loads(text)
                if 'variables' not in policy:
                    raise ValueError('missing variables')
                if 'rules' in policy and 'entry_rules' not in policy:
                    policy['entry_rules'] = policy.pop('rules')
                if 'entry_rules' not in policy:
                    raise ValueError('missing entry_rules')
                policy.setdefault('risk_rules', [])
                policy.setdefault('query', 'find_triggering_scenario')
                return json.dumps(policy)
            except Exception:
                return json.dumps(_DEFAULT_TRADING_POLICY)
        _spl_result = parse_policy_json(policy_json_raw)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_policy_json_raw
      - out_policy_json
  - id: tool_4
    type: SOLVE
