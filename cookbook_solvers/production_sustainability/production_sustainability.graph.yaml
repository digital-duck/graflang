  - source: set_2.complete
    target: set_3.trigger
    type: triggers
  - source: set_3.complete
    target: set_4.trigger
    type: triggers
  - source: set_4.complete
    target: tool_1.trigger
    type: triggers
  - source: wf_entry.out_use_solver
    target: tool_1.in_use_solver
    type: binds
  - source: tool_1.complete
    target: eval_1.trigger
    type: triggers
  - source: tool_1.out_use_solver
    target: eval_1.in_use_solver
    type: binds
