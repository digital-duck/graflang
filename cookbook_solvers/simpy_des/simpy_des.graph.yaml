  - id: gen_1
    type: GENERATE
    config:
      function: explain_simulation_prompt
      params:
        - sim_report
        - mmc_report
      prompt_inline: |-
        You are a healthcare operations researcher explaining simulation results.

        SIMULATION RESULT (SimPy DES):
        {{in_sim_report}}

        ANALYTIC BASELINE (M/M/c queuing):
        {{in_mmc_report}}

        Explain (≤200 words):
        1. Why does the simulation show a higher 95th-percentile wait than M/M/c predicts?
           What does "bursty arrivals" mean mathematically (coefficient of variation > 1)?
        2. What is the "inspection paradox" in queuing — why does arriving during a busy period
           feel different from the average utilization?
        3. What operational changes would reduce the 95th-percentile wait the most?
           (Hint: look at which resource has the highest utilization in the simulation)
        4. Why can't you optimize the staffing level from simulation alone — what do you need
           to add to turn a simulation into an optimization?
      arguments:
        - '@sim_report'
        - '@mmc_report'
    ports:
      - trigger
      - complete
      - in_sim_report
      - in_mmc_report
      - out_explanation
  - id: tool_11
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@sim_report'
        - '@mmc_report'
        - '@explanation'
      code: |
        def format_report_solver_on(sim_report: str, mmc_report: str, explanation: str) -> str:
            return f'=== Discrete-Event Simulation — Hospital ED (r124) | solver=ON ===\n\n{sim_report}\n\n── M/M/c Analytic Baseline ─────────────────────────────────\n{mmc_report}\n\n── Analyst Explanation ─────────────────────────────────────\n{explanation}'
        _spl_result = format_report_solver_on(sim_report, mmc_report, explanation)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - sim_report
        - mmc_report
        - explanation
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_sim_report
      - in_mmc_report
      - in_explanation
      - out_report
  - id: eval_2
    type: EVALUATE
    config:
      condition: '@in_use_solver == ''false'''
      branch: 2
    ports:
      - trigger
      - pass
      - fail
      - in_use_solver
  - id: gen_2
    type: GENERATE
    config:
      function: mmc_queuing_prompt
      params:
        - problem_description
      prompt_inline: |-
        You are a hospital operations analyst using classic queuing theory.

        ED PROBLEM:
        {{in_problem_description}}

        Using the M/M/c formula (Poisson arrivals, exponential service, c servers):
        1. Compute or estimate the mean wait time in queue (Wq) using the Erlang-C formula.
           Show the formula: ρ = λ/(c·μ), then compute P0 (idle probability) and Wq.
        2. Estimate the 95th-percentile wait time (assume exponential tail: W_95 ≈ Wq × ln(20)).
        3. Compute triage nurse utilization (ρ_triage) and treatment bay utilization (ρ_bay).
        4. Under what conditions does M/M/c give accurate predictions?
           Why might an ED violate the "Poisson arrivals" assumption?

        Show your calculations. Use: λ=3.2 patients/hour (mean), μ_triage=30/hr, μ_treat=1.5/hr.
      arguments:
        - '@problem_description'
    ports:
      - trigger
      - complete
      - in_problem_description
      - out_llm_mmc
  - id: tool_12
    type: SOLVE
    config:
      tool: format_report_solver_off
      backend: kernel
      arguments:
        - '@llm_mmc'
        - '@mmc_report'
      code: |
        def format_report_solver_off(llm_mmc: str, mmc_report: str) -> str:
            return f'=== Discrete-Event Simulation — Hospital ED (r124) | solver=OFF ===\n\n── M/M/c Analytic Baseline (computed) ─────────────────────\n{mmc_report}\n\n── LLM Queuing Theory Analysis ─────────────────────────────\n{llm_mmc}\n\nNote: Both M/M/c and LLM assume Poisson arrivals. Run --param use_solver=true\nfor SimPy simulation capturing bursty arrivals and lognormal service.'
        _spl_result = format_report_solver_off(llm_mmc, mmc_report)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - llm_mmc
        - mmc_report
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_llm_mmc
      - in_mmc_report
      - out_report
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
edges:
  - source: wf_entry.entry
    target: tool_1.trigger
    type: triggers
  - source: tool_1.complete
    target: tool_2.trigger
    type: triggers
  - source: tool_1.out_problem_json
    target: tool_2.in_problem_json
    type: binds
