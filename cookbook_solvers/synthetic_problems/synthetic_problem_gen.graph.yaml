      - complete
      - in_variants_json
      - out_n_valid
  - id: tool_8
    type: SOLVE
    config:
      tool: batch_solve
      backend: kernel
      arguments:
        - '@variants_json'
        - '@domain'
      code: |
        import json

        def _solve_lp(spec: dict) -> dict:
            """Build and solve an LP/ILP from a structured spec dict via PuLP."""
            import pulp
            sense = pulp.LpMaximize if spec['objective'].get('sense', 'maximize') == 'maximize' else pulp.LpMinimize
            prob = pulp.LpProblem(f"variant_{spec['id']}", sense)
            vtype_map = {'continuous': pulp.LpContinuous, 'integer': pulp.LpInteger, 'binary': pulp.LpBinary}
            lp_vars = {}
            for v in spec['variables']:
                vtype = vtype_map.get(str(v.get('type', 'continuous')).lower(), pulp.LpContinuous)
                lp_vars[v['name']] = pulp.LpVariable(v['name'], lowBound=v.get('lb', 0), upBound=v.get('ub', None), cat=vtype)
            coeffs = spec['objective']['coefficients']
            prob += pulp.lpSum((float(coeffs.get(n, 0)) * lp_vars[n] for n in lp_vars if n in coeffs))
            for c in spec.get('constraints', []):
                lhs = pulp.lpSum((float(c['lhs'].get(n, 0)) * lp_vars[n] for n in lp_vars if n in c['lhs']))
                rhs = float(c['rhs'])
                op = c.get('op', '<=')
                if op == '<=':
                    prob += lhs <= rhs
                elif op == '>=':
                    prob += lhs >= rhs
                else:
                    prob += lhs == rhs
            prob.solve(pulp.PULP_CBC_CMD(msg=False))
            status = pulp.LpStatus[prob.status]
            if status == 'Optimal':
                raw_obj = pulp.value(prob.objective)
                obj = round(float(raw_obj) if isinstance(raw_obj, float) else 0.0, 4)
                vals = {n: round(float(v) if isinstance((v := pulp.value(lp_vars[n])), float) else 0.0, 4) for n in lp_vars}
                return {'status': 'OPTIMAL', 'objective': obj, 'variables': vals}
            return {'status': status, 'objective': None, 'variables': {}}

        def _solve_supply_sourcing(spec: dict) -> dict:
            """Solve a supply-sourcing cost-minimization problem via PuLP."""
            import pulp
            suppliers = spec['suppliers']
            demand = float(spec['total_demand'])
            prob = pulp.LpProblem('supply_sourcing', pulp.LpMinimize)
            x = {s['name']: pulp.LpVariable(f"x_{s['name']}", lowBound=0, upBound=float(s['capacity'])) for s in suppliers}
            prob += pulp.lpSum((float(s['cost']) * x[s['name']] for s in suppliers))
            prob += pulp.lpSum((x[s['name']] for s in suppliers)) == demand
            prob.solve(pulp.PULP_CBC_CMD(msg=False))
            if pulp.LpStatus[prob.status] == 'Optimal':
                alloc = {s['name']: round(float(v) if isinstance((v := pulp.value(x[s['name']])), float) else 0.0, 2) for s in suppliers}
                raw_cost = pulp.value(prob.objective)
                cost = round(float(raw_cost) if isinstance(raw_cost, float) else 0.0, 2)
                fill = round(sum((float(s['fill_rate']) * alloc[s['name']] for s in suppliers)) / demand, 4)
                return {'status': 'OPTIMAL', 'objective': cost, 'fill_rate': fill, 'allocation': alloc}
            return {'status': pulp.LpStatus[prob.status], 'objective': None}

        def batch_solve(variants_json: str, domain: str) -> str:
            """Solve all parsed variants; route by domain.

            Returns:
              {"status": "OK", "n_total": int, "n_optimal": int, "n_failed": int, "results": [...]}
            """
            try:
                data = json.loads(variants_json)
                variants = data.get('variants', [])
                results = []
                for v in variants:
                    dom = v.get('domain', domain).lower()
                    try:
                        sol = _solve_supply_sourcing(v) if 'supply' in dom else _solve_lp(v)
                        results.append({'id': v['id'], 'domain': dom, 'problem_text': v.get('problem_text', ''), 'solver_status': sol['status'], 'optimal': sol.get('objective'), 'variables': sol.get('variables', {}), 'fill_rate': sol.get('fill_rate')})
                    except Exception as e:
                        results.append({'id': v['id'], 'domain': dom, 'problem_text': v.get('problem_text', ''), 'solver_status': 'ERROR', 'error': str(e), 'optimal': None, 'variables': {}})
                n_ok = sum((1 for r in results if r['solver_status'] == 'OPTIMAL'))
                return json.dumps({'status': 'OK', 'n_total': len(results), 'n_optimal': n_ok, 'n_failed': len(results) - n_ok, 'results': results})
            except Exception as e:
                return json.dumps({'status': 'ERROR', 'error': str(e), 'n_total': 0, 'n_optimal': 0, 'n_failed': 0, 'results': []})
        _spl_result = batch_solve(variants_json, domain)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - variants_json
        - domain
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_variants_json
      - in_domain
      - out_results_json
