  - id: tool_11
    type: SOLVE
    config:
      tool: format_test_suite
      backend: kernel
      arguments:
        - '@results_json'
      code: |
        import json

        def format_test_suite(results_json: str) -> str:
            """Format batch-solve results as a markdown table."""
            try:
                data = json.loads(results_json)
                results = data.get('results', [])
                lines = [f"**{data.get('n_optimal', 0)}/{data.get('n_total', 0)} variants solved optimally**", '', '| ID | Domain | Status | Optimal | Problem (excerpt) |', '|---|---|---|---|---|']
                for r in results:
                    excerpt = r['problem_text'][:80].replace('|', '/')
                    opt = str(r['optimal']) if r['optimal'] is not None else '—'
                    fill = f"  fill={r['fill_rate']:.2%}" if r.get('fill_rate') else ''
                    lines.append(f"| {r['id']} | {r['domain']} | {r['solver_status']} | {opt}{fill} | {excerpt}… |")
                return '\n'.join(lines)
            except Exception as e:
                return f'(format error: {e})'
        _spl_result = format_test_suite(results_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - results_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_results_json
      - out_suite_table
  - id: tool_12
    type: SOLVE
    config:
      tool: save_test_suite
      backend: kernel
      arguments:
        - '@results_json'
        - '@domain'
      code: |
        import json

        import os

        from datetime import datetime

        def save_test_suite(results_json: str, domain: str) -> str:
            """Persist test suite JSON to cookbook-solver/109_synthetic_problems/output/."""
            try:
                out_dir = os.path.join(os.getcwd(), 'cookbook-solver', '109_synthetic_problems', 'output')
                os.makedirs(out_dir, exist_ok=True)
                ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
                path = os.path.join(out_dir, f'{domain.lower()}_{ts}.json')
                with open(path, 'w') as f:
                    json.dump(json.loads(results_json), f, indent=2)
                return path
            except Exception as e:
                return f'save error: {e}'
        _spl_result = save_test_suite(results_json, domain)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - results_json
        - domain
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_results_json
      - in_domain
      - out_suite_path
  - id: gen_3
    type: GENERATE
    config:
      function: analyze_difficulty
      params:
        - suite_table
        - domain
        - n_variants
        - n_size
      prompt_inline: |-
        You are a benchmark analyst reviewing a synthetic test suite for {{in_domain}} problems.

        Test suite: {{in_n_variants}} variants at n_size={{in_n_size}} (each problem has {{in_n_size}} decision variables).
        This mirrors the r78 ablation scale levels — n05/n10/n20 stress-test LLM constraint-mapping.

        {{in_suite_table}}

        Write a concise analysis (≤200 words) covering:
        1. What fraction solved optimally — and what caused failures (infeasible formulation,
           unbounded, solver error)?
        2. Difficulty at this size: is n_size={{in_n_size}} too easy (all trivial) or too hard
           (many failures)? What does that predict about solver=OFF correctness at this scale?
        3. Which variant would best stress-test an LLM's NL→decomposition ability and why?
        4. Recommended next n_size: should the next batch go larger (scale up), smaller
           (find the crossover), or stay here with varied constraint tightness?
      arguments:
        - '@suite_table'
        - '@domain'
        - '@n_variants'
        - '@n_size'
    ports:
      - trigger
      - complete
      - in_suite_table
      - in_domain
      - in_n_variants
      - in_n_size
      - out_analysis
  - id: tool_13
    type: SOLVE
    config:
      tool: format_report
      backend: kernel
      arguments:
        - '@domain'
        - '@n_size'
        - '@n_variants'
        - '@n_valid'
        - '@n_ok'
        - '@n_total'
        - '@attempts'
        - '@suite_path'
        - '@suite_table'
        - '@analysis'
      code: |
        def format_report(domain: str, n_size: str, n_variants: str, n_valid: str, n_ok: str, n_total: str, attempts: str, suite_path: str, suite_table: str, analysis: str) -> str:
            return f'=== Synthetic Problem Generator (r109) ===\n\nDomain      : {domain}\nn_size      : {n_size} decision variables per problem\nRequested   : {n_variants} variants\nGenerated   : {n_valid} valid variants\nSolved      : {n_ok}/{n_total} optimally\nRepair loops: {attempts}\nSaved to    : {suite_path}\n\n── Test Suite ──────────────────────────────────────────────\n{suite_table}\n\n── Difficulty Analysis ─────────────────────────────────────\n{analysis}'
        _spl_result = format_report(domain, n_size, n_variants, n_valid, n_ok, n_total, attempts, suite_path, suite_table, analysis)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - domain
        - n_size
        - n_variants
        - n_valid
        - n_ok
        - n_total
        - attempts
        - suite_path
        - suite_table
        - analysis
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_domain
      - in_n_size
      - in_n_variants
      - in_n_valid
      - in_n_ok
      - in_n_total
      - in_attempts
      - in_suite_path
      - in_suite_table
      - in_analysis
      - out_report
  - id: wf_exit
    type: OUTPUT
    ports:
      - trigger
      - exit
      - in_report
