              backend: kernel
              arguments:
                - '@variants_json'
              code: |
                import json

                def get_parse_errors(variants_json: str) -> str:
                    """Return error summary for the repair-loop prompt."""
                    try:
                        data = json.loads(variants_json)
                        errors = data.get('errors', [])
                        return '; '.join(errors) if errors else f"status={data.get('status')}"
                    except Exception:
                        return 'JSON parse error'
                _spl_result = get_parse_errors(variants_json)
              result: _spl_result
              out_type: TEXT
              tool_params:
                - variants_json
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_variants_json
              - out_parse_error
          - id: gen_2
