          - id: tool_5
            type: SOLVE
            config:
              tool: has_valid_variants
              backend: kernel
              arguments:
                - '@variants_json'
              code: |
                import json

                def has_valid_variants(variants_json: str) -> bool:
                    """ASSERT gate: at least 1 variant parsed successfully."""
                    try:
                        return json.loads(variants_json).get('n_valid', 0) >= 1
                    except Exception:
                        return False
                _spl_result = has_valid_variants(variants_json)
              result: _spl_result
              out_type: BOOL
              tool_params:
                - variants_json
              tool_returns: TEXT
            ports:
              - trigger
              - complete
              - in_variants_json
              - out_tool_5
        edges:
          - source: tool_2.complete
            target: gen_2.trigger
            type: triggers
          - source: tool_2.out_parse_error
            target: gen_2.in_errors
            type: binds
          - source: gen_2.complete
            target: tool_3.trigger
            type: triggers
          - source: gen_2.out_variants_raw
            target: tool_3.in_variants_raw
            type: binds
          - source: tool_3.complete
            target: set_8.trigger
            type: triggers
          - source: set_8.complete
            target: tool_5.trigger
            type: triggers
          - source: tool_3.out_variants_json
            target: tool_5.in_variants_json
            type: binds
    ports:
      - trigger
      - loop
      - exit
      - in_variants_json
      - in_variants_raw
      - in_domain
      - in_attempts
      - in_tool_4
      - in_parse_error
      - out_parse_error
      - out_variants_raw
      - out_variants_json
      - out_attempts
      - out_tool_5
  - id: tool_6
    type: SOLVE
    config:
      tool: has_valid_variants
