  - id: tool_9
    type: SOLVE
    config:
      tool: verify_workforce_off
      backend: kernel
      arguments:
        - '@problem_json'
        - '@solution_json'
      code: |
        import json

        from spl.stdlib import strip_fences as _strip_fences

        def verify_workforce_off(problem_json: str, solution_json: str) -> str:
            """Verify LLM-proposed schedule.

            Checks:
            - integer feasibility: xD, xE, xN are integers
            - bounds: each in [min, max]
            - total: xD+xE+xN >= total_min
            - cost, quality, risk: recompute and check vs claimed

            Returns {"verdict": "PASS"/"FAIL"/"PARTIAL", "notes": str}
            """
            try:
                problem = json.loads(_strip_fences(problem_json))
                sol = json.loads(_strip_fences(solution_json))
            except Exception as e:
                return json.dumps({'verdict': 'FAIL', 'notes': f'parse error: {e}'})
            shifts = problem.get('shifts', [])
            total_min = int(problem.get('total_min', 30))
            notes = []
            ok = True
            partial = False
            shift_map = {s['name']: s for s in shifts}
            short_map = {s['name'][0]: s['name'] for s in shifts}
            x_vals = {}
            for s in shifts:
                key = f"x{s['name'][0]}"
                val = sol.get(key)
                if val is None:
                    notes.append(f'missing {key} in solution')
                    ok = False
                    x_vals[s['name']] = 0
                    continue
                try:
                    float_val = float(val)
                    int_val = int(round(float_val))
                    if abs(float_val - int_val) > 0.01:
                        notes.append(f'{key}={val} is not an integer')
                        partial = True
                    x_vals[s['name']] = int_val
                except Exception:
                    notes.append(f'{key} is not numeric: {val}')
                    ok = False
                    x_vals[s['name']] = 0
            for s in shifts:
                name = s['name']
                v = x_vals.get(name, 0)
                if v < s['min'] or v > s['max']:
                    notes.append(f"x{name[0]}={v} out of bounds [{s['min']}, {s['max']}]")
                    ok = False
            total = sum(x_vals.values())
            if total < total_min:
                notes.append(f'total staff {total} < minimum {total_min}')
                ok = False
            if total > 0:
                recomp_cost = sum((shift_map[n]['cost'] * v for n, v in x_vals.items() if n in shift_map))
                recomp_quality = sum((shift_map[n]['quality'] * v for n, v in x_vals.items() if n in shift_map)) / total
                recomp_risk = sum((shift_map[n]['risk'] * v for n, v in x_vals.items() if n in shift_map)) / total
                claimed_cost = sol.get('cost')
                claimed_quality = sol.get('quality')
                claimed_risk = sol.get('risk')
                if claimed_cost is not None and abs(float(claimed_cost) - recomp_cost) > 5.0:
                    notes.append(f'cost mismatch: claimed={float(claimed_cost):.0f}, recomputed={recomp_cost:.0f}')
                    ok = False
                if claimed_quality is not None and abs(float(claimed_quality) - recomp_quality) > 0.01:
                    notes.append(f'quality mismatch: claimed={float(claimed_quality):.4f}, recomputed={recomp_quality:.4f}')
                    partial = True
                if claimed_risk is not None and abs(float(claimed_risk) - recomp_risk) > 0.01:
                    notes.append(f'risk mismatch: claimed={float(claimed_risk):.4f}, recomputed={recomp_risk:.4f}')
                    partial = True
            verdict = 'PASS' if ok and (not partial) else 'PARTIAL' if partial and ok else 'FAIL'
            return json.dumps({'verdict': verdict, 'total_staff': total, 'recomputed_cost': round(recomp_cost, 2) if total > 0 else None, 'recomputed_quality': round(recomp_quality, 4) if total > 0 else None, 'recomputed_risk': round(recomp_risk, 4) if total > 0 else None, 'notes': '; '.join(notes) if notes else 'all checks passed'})
        _spl_result = verify_workforce_off(problem_json, solution_json)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem_json
        - solution_json
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem_json
      - in_solution_json
      - out_verify_result
  - id: tool_10
    type: SOLVE
    config:
      tool: json_get
      backend: kernel
      arguments:
        - '@verify_result'
        - '''verdict'''
      code: |
        import json

        def json_get(json_str: str, key: str) -> str:
            """JSON_GET(json, key) — extract a top-level key from a JSON object string.
            Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
            ```json code fences before parsing, so raw LLM output works directly.
            Returns '' if key not found or input is not valid JSON.
            """
            try:
                clean = str(json_str).replace('```json', '').replace('```', '').strip()
                obj = json.loads(clean)
                for part in str(key).split('.'):
                    if isinstance(obj, dict):
                        obj = obj.get(part, '')
                    else:
                        return ''
                return str(obj) if obj != '' else ''
            except (json.JSONDecodeError, TypeError):
                return ''
        _spl_result = json_get(verify_result, 'verdict')
      result: _spl_result
      out_type: TEXT
      tool_params:
        - json_str
        - key
      tool_returns: TEXT
      tool_builtin: true
    ports:
      - trigger
      - complete
      - in_verify_result
      - out_verify_status
