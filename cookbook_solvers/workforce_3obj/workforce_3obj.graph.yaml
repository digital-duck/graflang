  - id: tool_7
    type: SOLVE
    config:
      tool: format_report_solver_on
      backend: kernel
      arguments:
        - '@problem'
        - '@anchors_json'
        - '@n_points_str'
        - '@surface_table'
        - '@interpretation'
        - '@llm_calls'
      code: |
        def format_report_solver_on(problem: str, anchors_json: str, n_points_str: str, surface_table: str, interpretation: str, llm_calls: str) -> str:
            return f'=== Workforce 3-Objective Scheduling (solver=ON / NSGA-II) ===\n\nProblem:\n{problem}\n\nUtopia Anchors (per-objective best):\n{anchors_json}\n\nPareto Surface ({n_points_str} non-dominated points):\n{surface_table}\n\nInterpretation:\n{interpretation}\n\nLLM calls: {llm_calls}'
        _spl_result = format_report_solver_on(problem, anchors_json, n_points_str, surface_table, interpretation, llm_calls)
      result: _spl_result
      out_type: TEXT
      tool_params:
        - problem
        - anchors_json
        - n_points_str
        - surface_table
        - interpretation
        - llm_calls
      tool_returns: TEXT
    ports:
      - trigger
      - complete
      - in_problem
      - in_anchors_json
      - in_n_points_str
      - in_surface_table
      - in_interpretation
      - in_llm_calls
      - out_report
