version: 1.0-graph
workflow:
  name: workforce_3obj
  inputs:
    - name: problem
      type: TEXT
      default: 'A service center runs 3 shift types. Day shift: $100/employee, 0.90 service quality, 0.10 fatigue risk, min 10 max 20 staff. Evening shift: $130/employee, 1.00 quality, 0.25 risk, min 10 max 20. Night shift: $160/employee, 0.70 quality, 0.40 risk, min 10 max 20. Total minimum: 30 staff. Find staffing plans that minimize cost, maximize quality, and minimize fatigue risk simultaneously.'
    - name: use_solver
      type: TEXT
      default: 'true'
    - name: n_gen
      type: TEXT
      default: '50'
    - name: pop_size
      type: TEXT
      default: '100'
  outputs:
    - name: report
      type: TEXT
nodes:
  - id: wf_entry
    type: INPUT
    ports:
      - entry
      - out_problem
      - out_use_solver
      - out_n_gen
      - out_pop_size
  - id: set_1
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
      - trigger
      - complete
      - out_problem_json
  - id: set_2
    type: CONTEXT
    config:
      action: set
      expression: '''{}'''
    ports:
