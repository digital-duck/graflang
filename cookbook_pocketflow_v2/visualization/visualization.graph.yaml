version: 1.0-graph
workflow:
  name: order_fulfillment
  inputs:
  - name: order_data
    type: TEXT
    default: '{"payment":{"card_number":"4111111111111111","expiry":"12/26","cvv":"123","amount":99.99},"items":[{"name":"SPL Book","sku":"SPL-001","qty":1,"available":true}],"shipping_address":"123 Main St, San Francisco, CA 94105"}'
  - name: max_payment_retries
    type: INTEGER
    default: 3
  outputs:
  - name: order_status
    type: TEXT
resources:
  procedures:
    payment_workflow: ./visualization.spl
    inventory_workflow: ./visualization.spl
    shipping_workflow: ./visualization.spl
steps:
- call_1:
    node: GENERATE
    in:
      order_data: $in.order_data
      max_payment_retries: $in.max_payment_retries
    out: payment_result
    procedure_ref: procedures.payment_workflow
    arguments:
    - '@order_data'
    - '@max_payment_retries'
- call_2:
    node: GENERATE
    in:
      order_data: $in.order_data
    out: inventory_result
    procedure_ref: procedures.inventory_workflow
    arguments:
    - '@order_data'
- json_get:
    node: SOLVE
    in:
      inventory_result: call_2
    out: reservation_id
    tool: json_get
    backend: kernel
    arguments:
    - '@inventory_result'
    - "'reservation_id'"
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(inventory_result, 'reservation_id')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
- call_3:
    node: GENERATE
    in:
      order_data: $in.order_data
      reservation_id: json_get
    out: shipping_result
    procedure_ref: procedures.shipping_workflow
    arguments:
    - '@order_data'
    - '@reservation_id'
- build_order_status:
    node: SOLVE
    in:
      payment_result: call_1
      inventory_result: call_2
      shipping_result: call_3
    out: order_status
    tool: build_order_status
    backend: kernel
    arguments:
    - '@payment_result'
    - '@inventory_result'
    - '@shipping_result'
    code: |
      import json
      def build_order_status(payment_result: str, inventory_result: str, shipping_result: str) -> str:
          def safe_parse(s):
              try:
                  return json.loads(s)
              except Exception:
                  return {"raw": s}
          try:
              return json.dumps({
                  "payment": safe_parse(payment_result),
                  "inventory": safe_parse(inventory_result),
                  "shipping": safe_parse(shipping_result),
                  "order_status": "complete"
              }, indent=2)
          except Exception as e:
              return f"error: {e}"
      _spl_result = build_order_status(payment_result, inventory_result, shipping_result)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - payment_result
    - inventory_result
    - shipping_result
    tool_returns: TEXT
- wf_exit:
    output: build_order_status
