[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graflang"                     # pip install graflang; the Python package is `graphlang`
version = "0.1.0"
description = "GraphLang: a physics-inspired, topologically grounded language for self-revising agentic workflows (runner: grafr, compiler: grafc)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Wen Gong"}]
keywords = ["graph-lang", "agentic-ai", "interaction-nets", "topology", "llm", "cedar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "networkx>=3.2",
    "jsonschema>=4.20",
    "cedarpy>=4.8",           # the official Cedar engine: GUARD and MUTATE policy checks
    "dd-llm>=0.1.0",          # LLM adapters (claude_cli, ollama, openai, ...); zero core dependencies
    "rich>=13.7",
]

[project.optional-dependencies]
spl = ["spl-llm>=3.4"]        # only for SPL procedure_ref nodes (runs SPL.py workflows); plain GENERATE needs just dd-llm
openai = ["dd-llm[openai]>=0.1.0"]        # SDKs for the hosted providers; claude_cli needs none
anthropic = ["dd-llm[anthropic]>=0.1.0"]
gemini = ["dd-llm[gemini]>=0.1.0"]
grafc = ["jinja2>=3.1"]       # the Rust code generator (grafc) renders templates
dev = ["pytest>=7.4"]

[project.scripts]
grafr = "graphlang.grafr.cli:main"
grafc = "graphlang.grafc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphlang*"]

[tool.setuptools.package-data]
graphlang = ["schema/*.json", "policies/*.cedar", "grafc/rust_gen/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
