[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graflang"                     # pip install graflang; the Python package is `graphlang`
version = "0.1.1"
description = "GraphLang: a physics-inspired, topologically grounded language for self-revising agentic workflows (one command line: `graf`)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Wen Gong"}]
keywords = ["graph-lang", "agentic-ai", "interaction-nets", "topology", "llm", "cedar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "networkx>=3.2",
    "jsonschema>=4.20",
    "cedarpy>=4.8",           # the official Cedar engine: GUARD and MUTATE policy checks
    "dd-llm[openai]>=0.2.0",  # LLM adapters; [openai] = the SDK that ollama, openrouter, openai, deepseek, qwen speak (claude_cli needs none)
    "rich>=13.7",
    "dd-logging>=0.2.0",      # timestamped text/JSONL run logs (shared with SPL.py)
    "zinet>=0.2.1",           # graph drawing (graf vis), and the graph algorithms shared with graph-code and work-graph
]

[project.optional-dependencies]
edit = ["streamlit>=1.30"]   # `graf vis --edit`, the workflow editor
kernel = ["jupyter_client>=8", "ipykernel>=6"]   # `backend: kernel` on SOLVE nodes
spl = ["spl-llm>=3.4"]        # only for SPL procedure_ref nodes (runs SPL.py workflows); plain GENERATE needs just dd-llm
anthropic = ["dd-llm[anthropic]>=0.2.0"]
gemini = ["dd-llm[gemini]>=0.2.0"]
vis = ["zinet[pyvis]>=0.2.1"]     # `graf vis --engine pyvis`
graphify = ["zinet[graphify]>=0.2.1"]  # `graf vis --engine graphify`
grafc = ["jinja2>=3.1"]       # the Rust code generator (`graf compile`) renders templates
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/digital-duck/graflang"
Repository = "https://github.com/digital-duck/graflang"
Issues = "https://github.com/digital-duck/graflang/issues"
Changelog = "https://github.com/digital-duck/graflang/blob/main/CHANGELOG.md"

[project.scripts]
graf = "graphlang.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphlang*"]

[tool.setuptools.package-data]
graphlang = ["schema/*.json", "policies/*.cedar", "grafc/rust_gen/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls a real LLM (claude_cli, default claude-sonnet-5-5); skipped by default, run with --mode llm"]
