version: 1.0-graph
workflow:
  name: majority_vote
  inputs:
  - name: question
    type: TEXT
    default: What is 15% of 240?
  outputs:
  - name: answer
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_question
- id: fork_1
  type: FORK
  ports:
  - trigger
  - branch_1
  - branch_2
  - branch_3
- id: gen_1
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: |-
      Answer the following reasoning question carefully and concisely.
      State only your final answer — no explanation or preamble.

      Question: {{in_question}}
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans1
- id: gen_2
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: |-
      Answer the following reasoning question carefully and concisely.
      State only your final answer — no explanation or preamble.

      Question: {{in_question}}
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans2
- id: gen_3
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: |-
      Answer the following reasoning question carefully and concisely.
      State only your final answer — no explanation or preamble.

      Question: {{in_question}}
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans3
- id: join_1
  type: JOIN
  ports:
  - trigger
  - complete
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: '@in_ans1 + ''\n'' + @in_ans2 + ''\n'' + @in_ans3'
  ports:
  - trigger
  - complete
  - in_ans1
  - in_ans2
  - in_ans3
  - out_collected
- id: tool_1
  type: SOLVE
  config:
    tool: tally_votes
    backend: kernel
    arguments:
    - '@collected'
    code: |
      import json
      from collections import Counter

      def tally_votes(answers: str) -> str:
          try:
              items = [a.strip() for a in answers.split("\n") if a.strip()]
              if not items:
                  return json.dumps({"winner": "", "first_candidate": "", "consensus": "no"})
              counts = Counter(items)
              most_common = counts.most_common()
              top_count = most_common[0][1]
              top_candidates = [v for v, c in most_common if c == top_count]
              consensus = "yes" if len(top_candidates) == 1 else "no"
              return json.dumps({
                  "winner": most_common[0][0],
                  "first_candidate": top_candidates[0],
                  "consensus": consensus
              })
          except Exception as e:
              return f"error: {e}"
      _spl_result = tally_votes(collected)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - answers
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_collected
  - out_tally
- id: tool_2
  type: SOLVE
  config:
    tool: json_get
    backend: kernel
    arguments:
    - '@tally'
    - '''consensus'''
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(tally, 'consensus')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_tally
  - out_consensus
- id: eval_1
  type: EVALUATE
  config:
    condition: contains(@in_subject, 'yes')
    branch: 1
  ports:
  - trigger
  - pass
  - fail
  - in_subject
