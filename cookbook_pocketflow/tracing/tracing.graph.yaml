- id: tool_18
  type: SOLVE
  config:
    tool: langfuse_finalize_trace
    backend: kernel
    arguments:
    - '@trace_id'
    code: |
      def langfuse_finalize_trace(trace_id: str) -> str:
          try:
              from langfuse import Langfuse
              lf = Langfuse()
              lf.flush()
              return f"trace_finalized:{trace_id}"
          except Exception as e:
              return f"error: {e}"
      _spl_result = langfuse_finalize_trace(trace_id)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - trace_id
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_trace_id
  - out_finalize_result
