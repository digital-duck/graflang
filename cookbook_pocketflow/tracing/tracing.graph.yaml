version: 1.0-graph
workflow:
  name: pocketflow_langfuse_trace
  inputs:
  - name: flow_name
    type: TEXT
    default: pocketflow
  - name: node_list
    type: TEXT
    default: node_a,node_b,node_c
  - name: flow_inputs
    type: TEXT
    default: '{}'
  - name: max_nodes
    type: INTEGER
    default: 10
  outputs:
  - name: trace_summary
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_flow_name
  - out_node_list
  - out_flow_inputs
  - out_max_nodes
- id: tool_1
  type: SOLVE
  config:
    tool: apply_trace_decorator
    backend: kernel
    arguments:
    - '@flow_name'
    code: |
      import json, time
      def apply_trace_decorator(flow_name: str) -> str:
          try:
              trace_id = f"{flow_name}_{int(time.time() * 1000)}"
              return json.dumps({"status": "ok", "trace_id": trace_id})
          except Exception as e:
              return json.dumps({"status": "error", "exception": str(e)})
      _spl_result = apply_trace_decorator(flow_name)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - flow_name
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_flow_name
  - out_decorator_result
- id: tool_2
  type: SOLVE
  config:
    tool: json_get
    backend: kernel
    arguments:
    - '@decorator_result'
    - '''trace_id'''
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(decorator_result, 'trace_id')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_decorator_result
  - out_trace_id
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '''ok'''
  ports:
  - trigger
  - complete
  - out_flow_status
- id: set_3
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_trace_summary
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_nodes
    outputs:
      current_node:
        from: tool_3.out_current_node
      no_more:
        from: tool_4.out_no_more
      i:
        from:
        - set_4.out_i
        - set_7.out_i
        - set_10.out_i
        - set_13.out_i
        - set_15.out_i
      prep_result:
        from: tool_5.out_prep_result
      log_out:
        from:
        - tool_8.out_log_out
        - tool_12.out_log_out
        - tool_16.out_log_out
        - tool_17.out_log_out
      phase_status:
        from:
        - tool_7.out_phase_status
        - tool_11.out_phase_status
        - tool_15.out_phase_status
      flow_status:
        from:
        - set_5.out_flow_status
        - set_8.out_flow_status
        - set_11.out_flow_status
      trace_summary:
        from:
        - set_6.out_trace_summary
        - set_9.out_trace_summary
        - set_12.out_trace_summary
        - set_14.out_trace_summary
      exec_result:
        from: tool_9.out_exec_result
      post_result:
        from: tool_13.out_post_result
    subgraph:
      nodes:
      - id: tool_3
        type: SOLVE
        config:
          tool: list_get
          backend: kernel
          arguments:
          - '@node_list'
          - '@i'
          - ''','''
          code: |
            import json

            def list_get(value: str, index: str, delimiter: str=',') -> str:
                """LIST_GET(value, index, delimiter) — 1-based element from a JSON array
                or, if value isn't valid JSON, a delimited list."""
                s = str(value).strip()
                idx = int(index) - 1
                if s.startswith('[') and s.endswith(']'):
                    try:
                        parts = json.loads(s)
                        return str(parts[idx]) if 0 <= idx < len(parts) else ''
                    except (json.JSONDecodeError, TypeError):
                        pass
                parts = s.split(str(delimiter))
                return parts[idx].strip() if 0 <= idx < len(parts) else ''
            _spl_result = list_get(node_list, i, ',')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          - index
          - delimiter
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_node_list
        - in_i
        - out_current_node
      - id: tool_4
        type: SOLVE
        config:
          tool: isblank
          backend: kernel
          arguments:
          - '@current_node'
          code: |
            def isblank(value: str) -> str:
                """ISBLANK(value) — returns 'true' if value is empty or only whitespace."""
                return 'true' if str(value).strip() == '' else 'false'
            _spl_result = isblank(current_node)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_current_node
        - out_no_more
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(@in_subject, 'true')
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_subject
      - id: set_4
        type: CONTEXT
        config:
          action: set
          expression: '@in_max_nodes'
        ports:
        - trigger
        - complete
        - in_max_nodes
        - out_i
      - id: tool_5
        type: SOLVE
        config:
          tool: run_prep
          backend: kernel
          arguments:
          - '@current_node'
          - '@flow_inputs'
          code: |
            import json, time
            def run_prep(node_name: str, inputs: str) -> str:
                try:
                    start = time.time()
                    timing_ms = round((time.time() - start) * 1000, 2)
                    return json.dumps({"status": "ok", "phase": "prep", "node": node_name,
                                       "result": f"prep:{node_name}", "timing_ms": timing_ms, "inputs": inputs})
                except Exception as e:
                    return json.dumps({"status": "error", "phase": "prep", "node": node_name, "exception": str(e)})
            _spl_result = run_prep(current_node, flow_inputs)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - node_name
          - inputs
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_current_node
        - in_flow_inputs
        - out_prep_result
      - id: tool_6
        type: SOLVE
        config:
          tool: langfuse_log
          backend: kernel
          arguments:
          - '@current_node'
          - '''prep'''
          - '@prep_result'
          code: |
            import json
            def langfuse_log(node_name: str, phase: str, payload_json: str) -> str:
                try:
                    from langfuse import Langfuse
                    payload = json.loads(payload_json)
                    lf = Langfuse()
                    span = lf.span(
                        name=f"{node_name}.{phase}",
                        input={"inputs": payload.get("inputs")},
                        metadata={"timing_ms": payload.get("timing_ms")}
                    )
                    span.end(output=payload.get("result"))
                    return "logged"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = langfuse_log(current_node, 'prep', prep_result)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - node_name
          - phase
          - payload_json
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_current_node
        - in_prep_result
        - out_log_out
