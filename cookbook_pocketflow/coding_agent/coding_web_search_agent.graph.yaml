          backend: kernel
          arguments:
          - '@test_dir'
          code: |
            import subprocess

            def run_test_suite(test_dir: str) -> str:
                try:
                    result = subprocess.run(
                        ['python', '-m', 'pytest', test_dir, '-v', '--tb=short'],
                        capture_output=True,
                        text=True,
                        timeout=120
                    )
                    output = result.stdout + result.stderr
                    return output.strip() or "no output"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = run_test_suite(test_dir)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - test_dir
          tool_returns: TEXT
