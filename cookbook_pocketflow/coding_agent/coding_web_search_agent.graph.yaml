                        subindent = '  ' * (level + 1)
                        for fname in files:
                            result.append(f"{subindent}{os.path.join(root, fname)}")
                    return '\n'.join(result) or "empty directory"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = list_project_files(action_args)
