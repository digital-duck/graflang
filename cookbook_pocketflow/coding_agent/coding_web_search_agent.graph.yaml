            Current file content:
            {{in_current_content}}

            Test suite that must pass:
            {{in_test_suite}}

            Prior action history (what you''ve tried):
            {{in_action_history}}

            Write the complete, corrected content for {{in_action_file}}.
            Implement every stub or missing function. Do not truncate the file.
            Return ONLY the raw file content — no markdown fences, no explanation.
          arguments:
          - '@action_file'
          - '@current_content'
          - '@test_suite'
          - '@action_history'
        ports:
        - trigger
        - complete
        - in_action_file
        - in_current_content
        - in_test_suite
        - in_action_history
        - out_patched_content
      - id: tool_9
        type: SOLVE
        config:
          tool: write_file
          backend: kernel
          arguments:
          - '@action_file'
          - '@patched_content'
          - '''w'''
          code: |
            import pathlib

            def write_file(file_path: str, content: str, mode: str='w') -> str:
                """WRITE_FILE(file_path, content [, mode]) — write text to a file.

                mode: 'w' (overwrite, default) or 'a' (append).
                Creates parent directories automatically.
                Returns the absolute path written.
                """
                p = pathlib.Path(str(file_path).strip())
                p.parent.mkdir(parents=True, exist_ok=True)
                m = str(mode).strip().lower()
                if m not in ('w', 'a'):
                    m = 'w'
                with p.open(m, encoding='utf-8') as fh:
                    fh.write(str(content))
                return str(p.resolve())
            _spl_result = write_file(action_file, patched_content, 'w')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - file_path
          - content
          - mode
          tool_returns: TEXT
          tool_builtin: true
        ports:
