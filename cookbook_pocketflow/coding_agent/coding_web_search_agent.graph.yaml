version: 1.0-graph
workflow:
  name: coding_agent
  inputs:
  - name: project_dir
    type: TEXT
    default: cookbook_pocketflow/coding_agent
  - name: test_dir
    type: TEXT
    default: cookbook_pocketflow/coding_agent/tests
  - name: test_suite
    type: TEXT
    default: |-
      def test_basic():
          from src.solution import two_sum
          assert two_sum([2, 7, 11, 15], 9) == [0, 1]

      def test_middle():
          from src.solution import two_sum
          assert two_sum([3, 2, 4], 6) == [1, 2]

      def test_duplicate():
          from src.solution import two_sum
          assert two_sum([3, 3], 6) == [0, 1]
  - name: skeleton_file
    type: TEXT
    default: cookbook_pocketflow/coding_agent/src/solution.py
  - name: max_iterations
    type: INTEGER
    default: 10
  outputs:
  - name: final_report
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_project_dir
  - out_test_dir
  - out_test_suite
  - out_skeleton_file
  - out_max_iterations
- id: tool_1
  type: SOLVE
  config:
    tool: list_project_files
    backend: kernel
    arguments:
    - '@project_dir'
    code: |
      import os

      def list_project_files(directory: str) -> str:
          try:
              if not directory or directory.lower() in ('none', ''):
                  directory = '.'
              result = []
              for root, dirs, files in os.walk(directory):
                  dirs[:] = [d for d in dirs if not d.startswith('.')]
                  level = root.replace(directory, '').count(os.sep)
                  indent = '  ' * level
                  result.append(f"{indent}{os.path.basename(root)}/")
                  subindent = '  ' * (level + 1)
                  for fname in files:
                      result.append(f"{subindent}{os.path.join(root, fname)}")
              return '\n'.join(result) or "empty directory"
          except Exception as e:
              return f"error: {e}"
      _spl_result = list_project_files(project_dir)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - directory
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_project_dir
  - out_codebase_structure
- id: tool_2
  type: SOLVE
  config:
    tool: read_file
    backend: kernel
    arguments:
    - '@skeleton_file'
    code: |
      import pathlib

      def read_file(file_path: str) -> str:
          """READ_FILE(file_path) — read entire text file and return its content.

          Raises FileNotFoundError (propagated as SPL FileNotFound) if path missing.
          """
          p = pathlib.Path(str(file_path).strip())
          return p.read_text(encoding='utf-8')
      _spl_result = read_file(skeleton_file)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - file_path
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_skeleton_file
  - out_skeleton_functions
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_action_history
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: set_3
  type: CONTEXT
  config:
    action: set
    expression: '''incomplete'''
  ports:
  - trigger
  - complete
  - out_status
- id: set_4
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_last_test_output
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_iterations
    outputs:
      action_decision:
        from: gen_1.out_action_decision
      action_type:
        from: tool_3.out_action_type
      action_file:
        from: tool_4.out_action_file
      action_args:
        from: tool_5.out_action_args
      ran_tests:
        from:
        - set_5.out_ran_tests
        - set_7.out_ran_tests
      action_result:
        from:
        - tool_6.out_action_result
        - tool_7.out_action_result
        - tool_9.out_action_result
        - tool_10.out_action_result
        - set_8.out_action_result
      current_content:
        from: tool_8.out_current_content
      patched_content:
        from: gen_2.out_patched_content
      last_test_output:
        from: set_6.out_last_test_output
      action_history:
        from: tool_11.out_action_history
      tests_gate:
        from: tool_12.out_tests_gate
      status:
        from: set_9.out_status
      i:
        from:
        - set_10.out_i
        - set_11.out_i
        - set_12.out_i
    subgraph:
      nodes:
      - id: gen_1
        type: GENERATE
        config:
          function: select_action
          params:
          - action_history
          - codebase_structure
          - skeleton_functions
          - test_suite
          prompt_inline: |-
            You are an autonomous coding agent implementing missing functions so a failing test suite passes.

            Codebase structure:
            {{in_codebase_structure}}

            Skeleton functions (stubs to implement):
            {{in_skeleton_functions}}

            Test suite (must all pass):
            {{in_test_suite}}

            Action history so far:
            {{in_action_history}}

            Select the single most useful next action. Available actions:
              inspect   — list files in a directory to explore the codebase
              read      — read a specific file''s contents
              patch     — write a corrected implementation to a file
              run_tests — execute the test suite to check progress

            Respond in exactly this format:
            ACTION: <inspect|read|patch|run_tests>
            FILE: <file path, or none>
            ARGS: <directory path for inspect, or none>
            REASON: <one-line justification>
          arguments:
          - '@action_history'
          - '@codebase_structure'
          - '@skeleton_functions'
          - '@test_suite'
        ports:
        - trigger
        - complete
        - in_action_history
        - in_codebase_structure
        - in_skeleton_functions
        - in_test_suite
        - out_action_decision
      - id: tool_3
        type: SOLVE
        config:
          tool: parse_field
          backend: kernel
          arguments:
          - '@action_decision'
          - '''ACTION'''
          code: |
            def parse_field(text: str, field: str) -> str:
                try:
                    for line in text.split('\n'):
                        stripped = line.strip()
                        if stripped.upper().startswith(field.upper() + ':'):
                            return stripped.split(':', 1)[1].strip()
                    return ""
                except Exception as e:
                    return f"error: {e}"
            _spl_result = parse_field(action_decision, 'ACTION')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - text
          - field
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_action_decision
        - out_action_type
      - id: tool_4
        type: SOLVE
        config:
          tool: parse_field
          backend: kernel
          arguments:
          - '@action_decision'
          - '''FILE'''
          code: |
            def parse_field(text: str, field: str) -> str:
