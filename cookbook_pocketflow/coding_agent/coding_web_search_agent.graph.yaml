        type: SOLVE
        config:
          tool: append_history
          backend: kernel
          arguments:
          - '@action_history'
          - '@action_type'
          - '@action_result'
          code: |
            def append_history(history: str, action: str, result: str) -> str:
                try:
                    snippet = result[:600] + ('...' if len(result) > 600 else '')
                    entry = f"\n[{action}]\n{snippet}\n"
                    return history + entry
                except Exception as e:
                    return history + f"\n[error appending history: {e}]\n"
            _spl_result = append_history(action_history, action_type, action_result)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - history
          - action
          - result
          tool_returns: TEXT
        ports:
