      - id: tool_12
        type: SOLVE
        config:
          tool: check_tests_pass
          backend: kernel
          arguments:
          - '@last_test_output'
          code: |
            import re

            def check_tests_pass(test_output: str) -> str:
                try:
                    if re.search(r'\d+ failed', test_output):
                        return "fail"
                    if re.search(r'\d+ error', test_output):
                        return "fail"
                    if re.search(r'\d+ passed', test_output):
                        return "pass"
                    return "fail"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = check_tests_pass(last_test_output)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - test_output
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_last_test_output
        - out_tests_gate
      - id: eval_6
