- id: tool_11
  type: SOLVE
  config:
    tool: path_join
    backend: kernel
    arguments:
    - '@out_dir'
    - '''screening_report.md'''
    code: |
      import pathlib

      def path_join(*parts: str) -> str:
          """PATH_JOIN(part1, part2, ...) — join path segments with OS separator.

          Returns the joined path as a string.
          """
          return str(pathlib.Path(*[str(p).strip() for p in parts]))
      _spl_result = path_join(out_dir, 'screening_report.md')
    result: _spl_result
