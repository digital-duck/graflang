version: 1.0-graph
workflow:
  name: batch_image_filter
  inputs:
  - name: images
    type: TEXT
    default: img1.jpg,img2.jpg,img3.jpg
  - name: filters
    type: TEXT
    default: grayscale,blur,sepia
  - name: max_images
    type: INTEGER
    default: 3
  - name: max_filters
    type: INTEGER
    default: 3
  - name: output_dir
    type: TEXT
    default: output/
  outputs:
  - name: log
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_images
  - out_filters
  - out_max_images
  - out_max_filters
  - out_output_dir
- id: tool_1
  type: SOLVE
  config:
    tool: make_dir
    backend: kernel
    arguments:
    - '@output_dir'
    code: |
      import pathlib

      def make_dir(dir_path: str) -> str:
          """MAKE_DIR(dir_path) — create directory (and parents) if not present.

          Returns the absolute path of the directory.
          """
          p = pathlib.Path(str(dir_path).strip()).expanduser()
          p.mkdir(parents=True, exist_ok=True)
          return str(p.resolve())
      _spl_result = make_dir(output_dir)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - dir_path
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_output_dir
  - out_dir_ok
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_log
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: loop_2
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_images
    outputs:
      image:
        from: tool_2.out_image
      j:
        from: loop_1.out_j
      filter:
        from: loop_1.out_filter
      result:
        from: loop_1.out_result
      log:
        from: loop_1.out_log
      i:
        from: set_6.out_i
    subgraph:
      nodes:
      - id: tool_2
        type: SOLVE
        config:
          tool: list_get
          backend: kernel
          arguments:
          - '@images'
          - '@i'
          - ''','''
          code: |
            import json

            def list_get(value: str, index: str, delimiter: str=',') -> str:
                """LIST_GET(value, index, delimiter) — 1-based element from a JSON array
                or, if value isn't valid JSON, a delimited list."""
                s = str(value).strip()
                idx = int(index) - 1
                if s.startswith('[') and s.endswith(']'):
                    try:
                        parts = json.loads(s)
                        return str(parts[idx]) if 0 <= idx < len(parts) else ''
                    except (json.JSONDecodeError, TypeError):
                        pass
                parts = s.split(str(delimiter))
                return parts[idx].strip() if 0 <= idx < len(parts) else ''
            _spl_result = list_get(images, i, ',')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          - index
          - delimiter
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_images
        - in_i
        - out_image
      - id: set_3
        type: CONTEXT
        config:
          action: set
          expression: '0'
        ports:
        - trigger
        - complete
        - out_j
      - id: loop_1
        type: LOOP
        config:
          condition: latest(@in_j, @j) < @in_max_filters
          outputs:
            filter:
              from: tool_3.out_filter
            result:
              from: tool_4.out_result
            log:
              from: set_4.out_log
            j:
              from: set_5.out_j
          subgraph:
            nodes:
            - id: tool_3
              type: SOLVE
              config:
                tool: list_get
                backend: kernel
                arguments:
                - '@filters'
                - '@j'
                - ''','''
                code: |
                  import json

                  def list_get(value: str, index: str, delimiter: str=',') -> str:
                      """LIST_GET(value, index, delimiter) — 1-based element from a JSON array
                      or, if value isn't valid JSON, a delimited list."""
                      s = str(value).strip()
                      idx = int(index) - 1
                      if s.startswith('[') and s.endswith(']'):
                          try:
                              parts = json.loads(s)
                              return str(parts[idx]) if 0 <= idx < len(parts) else ''
                          except (json.JSONDecodeError, TypeError):
                              pass
                      parts = s.split(str(delimiter))
                      return parts[idx].strip() if 0 <= idx < len(parts) else ''
                  _spl_result = list_get(filters, j, ',')
                result: _spl_result
                out_type: TEXT
                tool_params:
                - value
                - index
                - delimiter
                tool_returns: TEXT
                tool_builtin: true
              ports:
              - trigger
              - complete
              - in_filters
              - in_j
              - out_filter
            - id: tool_4
              type: SOLVE
              config:
                tool: apply_image_filter
                backend: kernel
                arguments:
                - '@image'
                - '@filter'
                - '@output_dir'
                code: |
                  import os
                  import numpy as np
                  from PIL import Image, ImageFilter

                  def apply_image_filter(image_path: str, filter_name: str, output_dir: str) -> str:
                      try:
                          os.makedirs(output_dir.strip(), exist_ok=True)
                          img = Image.open(image_path.strip())
                          fn = filter_name.strip().lower()
                          if fn == "grayscale":
                              result = img.convert("L").convert("RGB")
                          elif fn == "blur":
                              result = img.filter(ImageFilter.GaussianBlur(radius=2))
                          elif fn == "sepia":
                              arr = np.array(img.convert("RGB"), dtype=np.float32)
                              r = np.clip(arr[:,:,0]*0.393 + arr[:,:,1]*0.769 + arr[:,:,2]*0.189, 0, 255)
                              g = np.clip(arr[:,:,0]*0.349 + arr[:,:,1]*0.686 + arr[:,:,2]*0.168, 0, 255)
                              b = np.clip(arr[:,:,0]*0.272 + arr[:,:,1]*0.534 + arr[:,:,2]*0.131, 0, 255)
                              result = Image.fromarray(np.stack([r, g, b], axis=2).astype(np.uint8))
                          else:
                              return f"error: unknown filter ''{fn}''"
                          base = os.path.splitext(os.path.basename(image_path.strip()))[0]
                          ext  = os.path.splitext(image_path.strip())[1] or ".jpg"
                          out_path = os.path.join(output_dir.strip(), f"{base}_{fn}{ext}")
                          result.save(out_path)
                          return f"ok: {out_path}"
                      except Exception as e:
                          return f"error: {e}"
                  _spl_result = apply_image_filter(image, filter, output_dir)
                result: _spl_result
                out_type: TEXT
                tool_params:
                - image_path
                - filter_name
                - output_dir
                tool_returns: TEXT
              ports:
              - trigger
              - complete
              - in_image
              - in_filter
              - in_output_dir
              - out_result
            - id: set_4
              type: CONTEXT
              config:
                action: set
                expression: '@in_log + @in_result + ''\n'''
              ports:
              - trigger
              - complete
              - in_log
              - in_result
              - out_log
            - id: set_5
              type: CONTEXT
              config:
                action: set
                expression: '@in_j + 1'
              ports:
              - trigger
              - complete
              - in_j
              - out_j
            edges:
            - source: tool_3.complete
              target: tool_4.trigger
              type: triggers
            - source: tool_3.out_filter
              target: tool_4.in_filter
              type: binds
            - source: tool_4.complete
              target: set_4.trigger
              type: triggers
            - source: tool_4.out_result
              target: set_4.in_result
              type: binds
            - source: set_4.complete
              target: set_5.trigger
              type: triggers
        ports:
        - trigger
        - loop
        - exit
        - in_filters
        - in_j
        - in_image
        - in_output_dir
        - in_log
        - in_max_filters
        - out_filter
        - out_result
        - out_log
        - out_j
      - id: set_6
        type: CONTEXT
        config:
          action: set
          expression: '@in_i + 1'
        ports:
        - trigger
        - complete
        - in_i
        - out_i
      edges:
      - source: tool_2.complete
        target: set_3.trigger
        type: triggers
      - source: set_3.complete
        target: loop_1.trigger
        type: triggers
      - source: set_3.out_j
        target: loop_1.in_j
        type: binds
      - source: tool_2.out_image
        target: loop_1.in_image
        type: binds
      - source: loop_1.exit
        target: set_6.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_images
  - in_i
  - in_filters
  - in_output_dir
  - in_log
  - in_max_filters
  - in_max_images
  - out_image
  - out_j
  - out_filter
  - out_result
  - out_log
  - out_i
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_log
edges:
- source: wf_entry.entry
  target: tool_1.trigger
  type: triggers
- source: wf_entry.out_output_dir
  target: tool_1.in_output_dir
  type: binds
- source: tool_1.complete
  target: set_1.trigger
  type: triggers
- source: set_1.complete
  target: set_2.trigger
  type: triggers
- source: set_2.complete
  target: loop_2.trigger
  type: triggers
- source: wf_entry.out_images
  target: loop_2.in_images
  type: binds
- source: set_2.out_i
  target: loop_2.in_i
  type: binds
- source: wf_entry.out_filters
  target: loop_2.in_filters
  type: binds
- source: wf_entry.out_output_dir
  target: loop_2.in_output_dir
  type: binds
- source: set_1.out_log
  target: loop_2.in_log
  type: binds
- source: wf_entry.out_max_filters
  target: loop_2.in_max_filters
  type: binds
- source: wf_entry.out_max_images
  target: loop_2.in_max_images
  type: binds
- source: loop_2.out_log
  target: wf_exit.in_log
  type: binds
- source: loop_2.exit
  target: wf_exit.trigger
  type: triggers
