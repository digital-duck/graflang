version: 1.0-graph
workflow:
  name: deep_research
  inputs:
  - name: topic
    type: TEXT
    default: Recent advances in quantum error correction
  - name: out
    type: TEXT
    default: output/report.txt
  outputs:
  - name: report
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_topic
  - out_out
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_loop_count
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_feedback
- id: set_3
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_notes
- id: set_4
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_report
- id: gen_1
  type: GENERATE
  config:
    function: planner
    params:
    - topic
    - feedback
    prompt_inline: |-
      You are a research planner. Given the research topic: {{in_topic}}
      And previous iteration feedback (if any): {{in_feedback}}

      Generate exactly 3 specific, diverse search queries to gather comprehensive information.
      Format your response as:
      QUERY_1: <first search query>
      QUERY_2: <second search query>
      QUERY_3: <third search query>
    arguments:
    - '@topic'
    - '@feedback'
  ports:
  - trigger
  - complete
  - in_topic
  - in_feedback
  - out_queries
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_loop_count, @loop_count) < 3
    outputs:
      report:
        from:
        - gen_2.out_report
        - gen_11.out_report
      loop_count:
        from:
        - set_5.out_loop_count
        - set_6.out_loop_count
        - set_7.out_loop_count
      query1:
        from: gen_3.out_query1
      query2:
        from: gen_4.out_query2
      query3:
        from: gen_5.out_query3
      result1:
        from: tool_1.out_result1
      result2:
        from: tool_2.out_result2
      result3:
        from: tool_3.out_result3
      note1:
        from: gen_6.out_note1
      note2:
        from: gen_7.out_note2
      note3:
        from: gen_8.out_note3
      notes:
        from: gen_9.out_notes
      decision:
        from: gen_10.out_decision
      feedback:
        from: gen_12.out_feedback
      queries:
        from: gen_13.out_queries
    subgraph:
      nodes:
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(str(@in_loop_count), '2')
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_loop_count
      - id: gen_2
        type: GENERATE
        config:
          function: write_concise_report
          params:
          - topic
          - notes
          prompt_inline: |-
            Write a concise, well-structured research report on the following topic: {{in_topic}}

            Use these accumulated research notes as your source material: {{in_notes}}

            The report should include key findings, important insights, and a clear conclusion.
            Be comprehensive yet concise.
          arguments:
          - '@topic'
          - '@notes'
        ports:
        - trigger
        - complete
        - in_topic
        - in_notes
        - out_report
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '3'
        ports:
        - trigger
        - complete
        - out_loop_count
      - id: gen_3
        type: GENERATE
        config:
          function: extract_query
          params:
          - queries
          - position
          prompt_inline: |-
            From this list of search queries:
            {{in_queries}}

            Extract and return only the search query at position {{in_position}}.
            For example, if position is 1, return the text after "QUERY_1: ".
            Return only the query text with no prefix or extra formatting.
          arguments:
          - '@queries'
          - '1'
          phases:
            pre:
              defaults:
                in_position: 1
        ports:
        - trigger
        - complete
        - in_position
        - in_queries
        - out_query1
      - id: gen_4
        type: GENERATE
        config:
          function: extract_query
          params:
          - queries
          - position
          prompt_inline: |-
            From this list of search queries:
            {{in_queries}}

            Extract and return only the search query at position {{in_position}}.
            For example, if position is 1, return the text after "QUERY_1: ".
            Return only the query text with no prefix or extra formatting.
          arguments:
          - '@queries'
          - '2'
          phases:
            pre:
              defaults:
                in_position: 2
        ports:
        - trigger
        - complete
        - in_position
        - in_queries
        - out_query2
      - id: gen_5
        type: GENERATE
        config:
          function: extract_query
          params:
          - queries
          - position
          prompt_inline: |-
            From this list of search queries:
            {{in_queries}}

            Extract and return only the search query at position {{in_position}}.
            For example, if position is 1, return the text after "QUERY_1: ".
            Return only the query text with no prefix or extra formatting.
          arguments:
          - '@queries'
          - '3'
          phases:
            pre:
              defaults:
                in_position: 3
        ports:
        - trigger
        - complete
        - in_position
        - in_queries
        - out_query3
      - id: fork_1
        type: FORK
        ports:
        - trigger
        - branch_1
        - branch_2
        - branch_3
      - id: tool_1
        type: SOLVE
        config:
          tool: web_search
          backend: kernel
          arguments:
          - '@query1'
          code: |
            import re

            def web_search(query: str) -> str:
                """WEB_SEARCH(query) — search the web via DuckDuckGo, return top-5 results.

                Accepts a plain query string or a YAML/prefixed decision block:
                    'search: what is quantum computing'   → extracts the query after 'search:'
                    'search_query: ...'                   → extracts the search_query field

                Usage in SPL:
                    CALL web_search(@query) INTO @results;
                    CALL web_search(@decision) INTO @results;

                Requires: pip install ddgs   (or pip install duckduckgo_search)
                """
                import warnings
                try:
                    from ddgs import DDGS
                except ImportError:
                    try:
                        from duckduckgo_search import DDGS
                    except ImportError:
                        return 'web_search unavailable: install ddgs (pip install ddgs)'
                q = str(query).strip()
                m = re.search('search_query\\s*:\\s*["\\\']?([^"\\\'\\n]+)["\\\']?', q)
                if not m:
                    m = re.search('^search\\s*:\\s*(.+)$', q, re.MULTILINE | re.IGNORECASE)
                if not m:
                    m = re.search('(?<!\\w)query\\s*:\\s*["\\\']?([^"\\\'\\n]+)["\\\']?', q)
                if m:
                    q = m.group(1).strip()
                try:
                    with warnings.catch_warnings():
                        warnings.simplefilter('ignore', RuntimeWarning)
                        results = DDGS().text(q, max_results=5)
                    if not results:
                        return f'No results found for: {q}'
                    lines = []
                    for i, r in enumerate(results, 1):
                        title = r.get('title', '')
                        url = r.get('href', '')
                        body = r.get('body', '')
                        lines.append(f'[{i}] {title}\n    URL: {url}\n    {body}')
                    return '\n\n'.join(lines)
                except Exception as e:
                    return f'Search error: {e}'
            _spl_result = web_search(query1)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - query
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_query1
        - out_result1
