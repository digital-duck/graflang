version: 1.0-graph
workflow:
  name: react_agent
  inputs:
  - name: query
    type: TEXT
  - name: tools_available
    type: TEXT
    default: web_search, run_python, calculate
  - name: max_iterations
    type: INTEGER
    default: 10
  outputs:
  - name: final_answer
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_query
  - out_tools_available
  - out_max_iterations
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_history
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_iterations
    outputs:
      action_json:
        from: gen_1.out_action_json
      observation:
        from: tool_1.out_observation
      history:
        from: set_3.out_history
      sufficiency:
        from: gen_2.out_sufficiency
      i:
        from:
        - set_4.out_i
        - set_5.out_i
    subgraph:
      nodes:
      - id: gen_1
        type: GENERATE
        config:
          function: reason_and_act
          params:
          - query
          - history
          - tools_available
          prompt_inline: |-
            You are a ReAct (Reason + Act) agent solving a query step by step.

            Query: {{in_query}}

            Conversation history so far:
            {{in_history}}

            Available tools: {{in_tools_available}}

            Reason carefully about what you still need to know, then choose the best next action.
            Respond with JSON only — no extra text:
            {{
              "thought": "<your step-by-step reasoning>",
              "tool": "<one of: web_search | run_python | calculate | none>",
              "args": {{<tool-specific key-value arguments>}}
            }}

            Argument formats by tool:
              web_search  → {{"query": "<search terms>"}}
              run_python  → {{"code": "<python code to run>"}}
              calculate   → {{"expression": "<math expression>"}}
              none        → {{"answer": "<your complete answer, if ready>"}}
          arguments:
          - '@query'
          - '@history'
          - '@tools_available'
        ports:
        - trigger
        - complete
        - in_query
        - in_history
        - in_tools_available
        - out_action_json
      - id: tool_1
        type: SOLVE
        config:
          tool: dispatch_tool
          backend: kernel
          arguments:
          - '@action_json'
          code: |
            import json, subprocess, urllib.request, urllib.parse

            def dispatch_tool(action_json: str) -> str:
                try:
                    spec = json.loads(action_json)
                    tool = spec.get("tool", "").lower().strip()
                    args = spec.get("args", {})

                    if tool == "web_search":
                        query = args.get("query", "")
                        url = "https://html.duckduckgo.com/html/?q=" + urllib.parse.quote(query)
                        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                        with urllib.request.urlopen(req, timeout=10) as r:
                            return r.read().decode("utf-8", errors="ignore")[:2000]

                    elif tool == "run_python":
                        code = args.get("code", "")
                        result = subprocess.run(
                            ["python3", "-c", code],
                            capture_output=True, text=True, timeout=10
                        )
                        return (result.stdout or result.stderr or "No output").strip()

                    elif tool == "calculate":
                        expr = args.get("expression", "")
                        safe = {"__builtins__": {}, "abs": abs, "round": round,
                                "min": min, "max": max, "sum": sum, "len": len}
                        return str(eval(expr, safe))

                    elif tool in ("none", "answer", "final_answer"):
                        return args.get("answer", "Ready to synthesize answer")

                    else:
                        return f"error: unknown tool ''{tool}''"

                except json.JSONDecodeError as e:
                    return f"error: invalid JSON — {e}"
                except Exception as e:
                    return f"error: {e}"
            _spl_result = dispatch_tool(action_json)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - action_json
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_action_json
        - out_observation
      - id: set_3
        type: CONTEXT
        config:
          action: set
          expression: '@in_history + ''\n[Thought+Action]: '' + @in_action_json +
            ''\n[Observation]: '' + @in_observation'
        ports:
        - trigger
        - complete
        - in_history
        - in_action_json
        - in_observation
        - out_history
      - id: gen_2
        type: GENERATE
        config:
          function: check_answer_sufficient
          params:
          - query
          - history
          prompt_inline: |-
            Review the research history and judge whether we now have enough information to give a complete, accurate answer.

            Query: {{in_query}}

            Research history:
            {{in_history}}

            Reply with exactly one word: "yes" if sufficient, "no" if more investigation is needed.
          arguments:
          - '@query'
          - '@history'
        ports:
        - trigger
        - complete
        - in_query
        - in_history
        - out_sufficiency
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(@in_subject, 'yes')
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_subject
      - id: set_4
        type: CONTEXT
        config:
          action: set
          expression: '@in_max_iterations'
        ports:
        - trigger
        - complete
        - in_max_iterations
        - out_i
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '@in_i + 1'
        ports:
        - trigger
        - complete
        - in_i
        - out_i
      edges:
      - source: gen_1.complete
        target: tool_1.trigger
        type: triggers
      - source: gen_1.out_action_json
        target: tool_1.in_action_json
        type: binds
      - source: tool_1.complete
        target: set_3.trigger
        type: triggers
      - source: gen_1.out_action_json
        target: set_3.in_action_json
        type: binds
      - source: tool_1.out_observation
        target: set_3.in_observation
        type: binds
      - source: set_3.complete
        target: gen_2.trigger
        type: triggers
      - source: set_3.out_history
        target: gen_2.in_history
        type: binds
      - source: gen_2.complete
        target: eval_1.trigger
        type: triggers
      - source: gen_2.out_sufficiency
        target: eval_1.in_subject
        type: binds
      - source: eval_1.pass
        target: set_4.trigger
        type: triggers
      - source: eval_1.fail
        target: set_5.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_query
  - in_history
  - in_tools_available
  - in_max_iterations
  - in_i
  - out_action_json
  - out_observation
  - out_history
  - out_sufficiency
  - out_i
- id: gen_3
  type: GENERATE
  config:
    function: synthesize_final_answer
    params:
    - query
    - history
    prompt_inline: |-
      Synthesize a comprehensive final answer based on all research and observations collected.

      Original query: {{in_query}}

      Research history:
      {{in_history}}

      Provide a clear, accurate, and well-structured answer that fully addresses the query.
    arguments:
    - '@query'
    - '@history'
  ports:
  - trigger
  - complete
  - in_query
  - in_history
  - out_final_answer
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_final_answer
edges:
- source: wf_entry.entry
  target: set_1.trigger
  type: triggers
- source: set_1.complete
  target: set_2.trigger
  type: triggers
- source: set_2.complete
  target: loop_1.trigger
  type: triggers
- source: wf_entry.out_query
  target: loop_1.in_query
  type: binds
- source: set_1.out_history
  target: loop_1.in_history
  type: binds
- source: wf_entry.out_tools_available
  target: loop_1.in_tools_available
  type: binds
- source: wf_entry.out_max_iterations
  target: loop_1.in_max_iterations
  type: binds
- source: set_2.out_i
  target: loop_1.in_i
  type: binds
- source: loop_1.exit
  target: gen_3.trigger
  type: triggers
- source: wf_entry.out_query
  target: gen_3.in_query
  type: binds
- source: loop_1.out_history
  target: gen_3.in_history
  type: binds
- source: gen_3.out_final_answer
  target: wf_exit.in_final_answer
  type: binds
- source: gen_3.complete
  target: wf_exit.trigger
  type: triggers
