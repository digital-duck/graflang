version: 1.0-graph
workflow:
  name: react_a2a_agent
  inputs:
  - name: request_json
    type: TEXT
    default: '{"jsonrpc":"2.0","method":"tasks/send","id":"1","params":{"question":"What
      is the capital of France?"}}'
  - name: max_iterations
    type: INTEGER
    default: 5
  outputs:
  - name: response_json
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_request_json
  - out_max_iterations
- id: tool_1
  type: SOLVE
  config:
    tool: parse_jsonrpc_request
    backend: kernel
    arguments:
    - '@request_json'
    code: |
      import json
      def parse_jsonrpc_request(request_json: str) -> str:
          try:
              obj = json.loads(request_json)
              params = obj.get("params", {})
              if isinstance(params, dict):
                  return params.get("question", params.get("query", json.dumps(params)))
              elif isinstance(params, list) and params:
                  return str(params[0])
              return str(params)
          except Exception as e:
              return f"error: {e}"
      _spl_result = parse_jsonrpc_request(request_json)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - request_json
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_request_json
  - out_question
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: ''''''
  ports:
  - trigger
  - complete
  - out_context
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_iterations
    outputs:
      reasoning:
        from: gen_1.out_reasoning
      query:
        from: tool_2.out_query
      raw_results:
        from: tool_3.out_raw_results
      observation:
        from: tool_4.out_observation
      context:
        from: set_3.out_context
      i:
        from:
        - set_4.out_i
        - set_5.out_i
    subgraph:
      nodes:
      - id: gen_1
        type: GENERATE
        config:
          function: reason
          params:
          - question
          - context
          prompt_inline: |-
            You are a ReAct agent. Analyze the question and all gathered context, then reason step by step.

              Question: {{in_question}}
              Context so far: {{in_context}}

              Think through what you already know and what gaps remain.
              End your response with exactly one of these two lines:
                NEED_MORE_INFO: <specific search query to run next>
                HAVE_ENOUGH: <brief summary of key facts you have>
          arguments:
          - '@question'
          - '@context'
        ports:
        - trigger
        - complete
        - in_question
        - in_context
        - out_reasoning
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(@in_subject, 'NEED_MORE_INFO')
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_subject
      - id: tool_2
        type: SOLVE
        config:
          tool: extract_search_query
          backend: kernel
          arguments:
          - '@reasoning'
          code: |
            def extract_search_query(reasoning: str) -> str:
                try:
                    for line in reasoning.split("\n"):
                        if "NEED_MORE_INFO:" in line:
                            return line.split("NEED_MORE_INFO:", 1)[1].strip()
                    return reasoning
                except Exception as e:
                    return f"error: {e}"
            _spl_result = extract_search_query(reasoning)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - reasoning
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_reasoning
        - out_query
      - id: tool_3
        type: SOLVE
        config:
          tool: web_search
          backend: kernel
          arguments:
          - '@query'
          code: |
            import re

            def web_search(query: str) -> str:
                """WEB_SEARCH(query) — search the web via DuckDuckGo, return top-5 results.

                Accepts a plain query string or a YAML/prefixed decision block:
                    'search: what is quantum computing'   → extracts the query after 'search:'
                    'search_query: ...'                   → extracts the search_query field

                Usage in SPL:
                    CALL web_search(@query) INTO @results;
                    CALL web_search(@decision) INTO @results;

                Requires: pip install ddgs   (or pip install duckduckgo_search)
                """
                import warnings
                try:
                    from ddgs import DDGS
                except ImportError:
                    try:
                        from duckduckgo_search import DDGS
                    except ImportError:
                        return 'web_search unavailable: install ddgs (pip install ddgs)'
                q = str(query).strip()
                m = re.search('search_query\\s*:\\s*["\\\']?([^"\\\'\\n]+)["\\\']?', q)
                if not m:
                    m = re.search('^search\\s*:\\s*(.+)$', q, re.MULTILINE | re.IGNORECASE)
                if not m:
                    m = re.search('(?<!\\w)query\\s*:\\s*["\\\']?([^"\\\'\\n]+)["\\\']?', q)
                if m:
                    q = m.group(1).strip()
                try:
                    with warnings.catch_warnings():
                        warnings.simplefilter('ignore', RuntimeWarning)
                        results = DDGS().text(q, max_results=5)
                    if not results:
                        return f'No results found for: {q}'
                    lines = []
                    for i, r in enumerate(results, 1):
                        title = r.get('title', '')
                        url = r.get('href', '')
                        body = r.get('body', '')
                        lines.append(f'[{i}] {title}\n    URL: {url}\n    {body}')
                    return '\n\n'.join(lines)
                except Exception as e:
                    return f'Search error: {e}'
            _spl_result = web_search(query)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - query
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_query
        - out_raw_results
      - id: tool_4
        type: SOLVE
        config:
          tool: parse_search_results
          backend: kernel
          arguments:
          - '@raw_results'
          code: |
            def parse_search_results(raw_results: str) -> str:
                try:
                    lines = [ln.strip() for ln in raw_results.split("\n") if ln.strip()]
                    return "\n".join(lines[:20])
                except Exception as e:
                    return f"error: {e}"
            _spl_result = parse_search_results(raw_results)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - raw_results
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_raw_results
        - out_observation
      - id: set_3
        type: CONTEXT
        config:
          action: set
          expression: '@in_context + ''\n[Search: '' + @in_query + '']\n'' + @in_observation'
        ports:
        - trigger
        - complete
        - in_context
        - in_query
        - in_observation
        - out_context
      - id: set_4
        type: CONTEXT
        config:
          action: set
          expression: '@in_i + 1'
        ports:
        - trigger
        - complete
        - in_i
        - out_i
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '@in_max_iterations'
        ports:
        - trigger
        - complete
        - in_max_iterations
        - out_i
      edges:
      - source: gen_1.complete
        target: eval_1.trigger
        type: triggers
      - source: gen_1.out_reasoning
        target: eval_1.in_subject
        type: binds
      - source: eval_1.pass
        target: tool_2.trigger
        type: triggers
      - source: gen_1.out_reasoning
        target: tool_2.in_reasoning
        type: binds
      - source: tool_2.complete
        target: tool_3.trigger
        type: triggers
      - source: tool_2.out_query
        target: tool_3.in_query
        type: binds
      - source: tool_3.complete
        target: tool_4.trigger
        type: triggers
      - source: tool_3.out_raw_results
        target: tool_4.in_raw_results
        type: binds
      - source: tool_4.complete
        target: set_3.trigger
        type: triggers
      - source: tool_2.out_query
        target: set_3.in_query
        type: binds
      - source: tool_4.out_observation
        target: set_3.in_observation
        type: binds
      - source: set_3.complete
        target: set_4.trigger
        type: triggers
      - source: eval_1.fail
        target: set_5.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_question
  - in_context
  - in_i
  - in_max_iterations
  - out_reasoning
  - out_query
  - out_raw_results
  - out_observation
  - out_context
  - out_i
- id: gen_2
  type: GENERATE
  config:
    function: synthesize_answer
    params:
    - question
    - context
    prompt_inline: |-
      You are a helpful assistant. Using the question and all gathered evidence,
        write a comprehensive, accurate, and well-structured final answer.

        Question: {{in_question}}
        Evidence: {{in_context}}
    arguments:
    - '@question'
    - '@context'
  ports:
  - trigger
  - complete
  - in_question
  - in_context
  - out_answer
- id: tool_5
  type: SOLVE
  config:
    tool: build_jsonrpc_response
    backend: kernel
    arguments:
    - '@request_json'
    - '@answer'
    code: |
      import json
      def build_jsonrpc_response(request_json: str, answer: str) -> str:
          try:
              obj = json.loads(request_json)
              rid = obj.get("id", 1)
              return json.dumps({"jsonrpc": "2.0", "id": rid, "result": {"answer": answer}})
          except Exception as e:
              return json.dumps({"jsonrpc": "2.0", "id": 1, "result": {"answer": answer}})
      _spl_result = build_jsonrpc_response(request_json, answer)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - request_json
    - answer
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_request_json
  - in_answer
  - out_response_json
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_response_json
edges:
- source: wf_entry.entry
  target: tool_1.trigger
  type: triggers
- source: wf_entry.out_request_json
  target: tool_1.in_request_json
  type: binds
- source: tool_1.complete
  target: set_1.trigger
  type: triggers
- source: set_1.complete
  target: set_2.trigger
  type: triggers
- source: set_2.complete
  target: loop_1.trigger
  type: triggers
- source: tool_1.out_question
  target: loop_1.in_question
  type: binds
- source: set_1.out_context
  target: loop_1.in_context
  type: binds
- source: set_2.out_i
  target: loop_1.in_i
  type: binds
- source: wf_entry.out_max_iterations
  target: loop_1.in_max_iterations
  type: binds
- source: loop_1.exit
  target: gen_2.trigger
  type: triggers
- source: tool_1.out_question
  target: gen_2.in_question
  type: binds
- source: loop_1.out_context
  target: gen_2.in_context
  type: binds
- source: gen_2.complete
  target: tool_5.trigger
  type: triggers
- source: wf_entry.out_request_json
  target: tool_5.in_request_json
  type: binds
- source: gen_2.out_answer
  target: tool_5.in_answer
  type: binds
- source: tool_5.out_response_json
  target: wf_exit.in_response_json
  type: binds
- source: tool_5.complete
  target: wf_exit.trigger
  type: triggers
