version: 1.0-graph
workflow:
  name: csv_batch_stats
  inputs:
  - name: csv_path
    type: TEXT
    default: cookbook_pocketflow/batch_node/data/sales.csv
  - name: chunk_size
    type: TEXT
    default: '500'
  - name: column
    type: TEXT
    default: amount
  - name: max_iterations
    type: INTEGER
    default: 10000
  outputs:
  - name: result
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_csv_path
  - out_chunk_size
  - out_column
  - out_max_iterations
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: '''0'''
  ports:
  - trigger
  - complete
  - out_offset
- id: set_2
  type: CONTEXT
  config:
    action: set
    expression: '''0'''
  ports:
  - trigger
  - complete
  - out_running_total
- id: set_3
  type: CONTEXT
  config:
    action: set
    expression: '''0'''
  ports:
  - trigger
  - complete
  - out_running_count
- id: set_4
  type: CONTEXT
  config:
    action: set
    expression: '0'
  ports:
  - trigger
  - complete
  - out_i
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_iterations
    outputs:
      chunk:
        from: tool_1.out_chunk
      chunk_empty:
        from: tool_2.out_chunk_empty
      i:
        from:
        - set_5.out_i
        - set_6.out_i
      chunk_stats:
        from: tool_3.out_chunk_stats
      chunk_sum:
        from: tool_4.out_chunk_sum
      chunk_count:
        from: tool_5.out_chunk_count
      acc:
        from: tool_6.out_acc
      running_total:
        from: tool_7.out_running_total
      running_count:
        from: tool_8.out_running_count
      offset:
        from: tool_9.out_offset
    subgraph:
      nodes:
      - id: tool_1
        type: SOLVE
        config:
          tool: read_csv_chunk
          backend: kernel
          arguments:
          - '@csv_path'
          - '@chunk_size'
          - '@offset'
          code: |
            import csv, io
            def read_csv_chunk(csv_path: str, chunk_size: str, offset: str) -> str:
                try:
                    n = int(chunk_size)
                    off = int(offset)
                    with open(csv_path, newline='', encoding='utf-8') as f:
                        reader = csv.reader(f)
                        header = next(reader, None)
                        if header is None:
                            return ""
                        rows = list(reader)
                    chunk = rows[off:off + n]
                    if not chunk:
                        return ""
                    buf = io.StringIO()
                    writer = csv.writer(buf)
                    writer.writerow(header)
                    writer.writerows(chunk)
                    return buf.getvalue()
                except Exception as e:
                    return f"error: {e}"
            _spl_result = read_csv_chunk(csv_path, chunk_size, offset)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - csv_path
          - chunk_size
          - offset
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_csv_path
        - in_chunk_size
        - in_offset
        - out_chunk
      - id: tool_2
        type: SOLVE
        config:
          tool: isblank
          backend: kernel
          arguments:
          - '@chunk'
          code: |
            def isblank(value: str) -> str:
                """ISBLANK(value) — returns 'true' if value is empty or only whitespace."""
                return 'true' if str(value).strip() == '' else 'false'
            _spl_result = isblank(chunk)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_chunk
        - out_chunk_empty
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(@in_subject, 'true')
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_subject
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '@in_max_iterations'
        ports:
        - trigger
        - complete
        - in_max_iterations
        - out_i
      - id: tool_3
        type: SOLVE
        config:
          tool: compute_chunk_stats
          backend: kernel
          arguments:
          - '@chunk'
          - '@column'
          code: |
            import csv, io, json
            def compute_chunk_stats(chunk_csv: str, column: str) -> str:
                try:
                    reader = csv.DictReader(io.StringIO(chunk_csv))
                    total = 0.0
                    count = 0
                    for row in reader:
                        raw = row.get(column, "").strip()
                        if raw:
                            total += float(raw)
                            count += 1
                    avg = total / count if count > 0 else 0.0
                    return json.dumps({"sum": round(total, 4), "count": count, "avg": round(avg, 4)})
                except Exception as e:
                    return f"error: {e}"
            _spl_result = compute_chunk_stats(chunk, column)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - chunk_csv
          - column
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_chunk
        - in_column
        - out_chunk_stats
      - id: tool_4
        type: SOLVE
        config:
          tool: json_get
          backend: kernel
          arguments:
          - '@chunk_stats'
          - '''sum'''
          code: |
            import json

            def json_get(json_str: str, key: str) -> str:
                """JSON_GET(json, key) — extract a top-level key from a JSON object string.
                Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
                ```json code fences before parsing, so raw LLM output works directly.
                Returns '' if key not found or input is not valid JSON.
                """
                try:
                    clean = str(json_str).replace('```json', '').replace('```', '').strip()
                    obj = json.loads(clean)
                    for part in str(key).split('.'):
                        if isinstance(obj, dict):
                            obj = obj.get(part, '')
                        else:
                            return ''
                    return str(obj) if obj != '' else ''
                except (json.JSONDecodeError, TypeError):
                    return ''
            _spl_result = json_get(chunk_stats, 'sum')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - json_str
          - key
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_chunk_stats
        - out_chunk_sum
      - id: tool_5
        type: SOLVE
        config:
          tool: json_get
          backend: kernel
          arguments:
          - '@chunk_stats'
          - '''count'''
          code: |
            import json

            def json_get(json_str: str, key: str) -> str:
                """JSON_GET(json, key) — extract a top-level key from a JSON object string.
                Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
                ```json code fences before parsing, so raw LLM output works directly.
                Returns '' if key not found or input is not valid JSON.
                """
                try:
                    clean = str(json_str).replace('```json', '').replace('```', '').strip()
                    obj = json.loads(clean)
                    for part in str(key).split('.'):
                        if isinstance(obj, dict):
                            obj = obj.get(part, '')
                        else:
                            return ''
                    return str(obj) if obj != '' else ''
                except (json.JSONDecodeError, TypeError):
                    return ''
            _spl_result = json_get(chunk_stats, 'count')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - json_str
          - key
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_chunk_stats
        - out_chunk_count
      - id: tool_6
        type: SOLVE
        config:
          tool: accumulate_totals
          backend: kernel
          arguments:
          - '@running_total'
          - '@running_count'
          - '@chunk_sum'
          - '@chunk_count'
          code: |
            import json
            def accumulate_totals(running_total: str, running_count: str, chunk_sum: str, chunk_count: str) -> str:
                try:
                    new_total = float(running_total) + float(chunk_sum)
                    new_count = int(running_count) + int(chunk_count)
                    return json.dumps({"total": round(new_total, 4), "count": new_count})
                except Exception as e:
                    return f"error: {e}"
            _spl_result = accumulate_totals(running_total, running_count, chunk_sum, chunk_count)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - running_total
          - running_count
          - chunk_sum
          - chunk_count
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_running_total
        - in_running_count
        - in_chunk_sum
        - in_chunk_count
        - out_acc
      - id: tool_7
        type: SOLVE
        config:
          tool: json_get
          backend: kernel
          arguments:
          - '@acc'
          - '''total'''
          code: |
            import json

            def json_get(json_str: str, key: str) -> str:
                """JSON_GET(json, key) — extract a top-level key from a JSON object string.
                Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
                ```json code fences before parsing, so raw LLM output works directly.
                Returns '' if key not found or input is not valid JSON.
                """
                try:
                    clean = str(json_str).replace('```json', '').replace('```', '').strip()
                    obj = json.loads(clean)
                    for part in str(key).split('.'):
                        if isinstance(obj, dict):
                            obj = obj.get(part, '')
                        else:
                            return ''
                    return str(obj) if obj != '' else ''
                except (json.JSONDecodeError, TypeError):
                    return ''
            _spl_result = json_get(acc, 'total')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - json_str
          - key
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_acc
        - out_running_total
      - id: tool_8
        type: SOLVE
        config:
          tool: json_get
          backend: kernel
          arguments:
          - '@acc'
          - '''count'''
          code: |
            import json

            def json_get(json_str: str, key: str) -> str:
                """JSON_GET(json, key) — extract a top-level key from a JSON object string.
                Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
                ```json code fences before parsing, so raw LLM output works directly.
                Returns '' if key not found or input is not valid JSON.
                """
                try:
                    clean = str(json_str).replace('```json', '').replace('```', '').strip()
                    obj = json.loads(clean)
                    for part in str(key).split('.'):
                        if isinstance(obj, dict):
                            obj = obj.get(part, '')
                        else:
                            return ''
                    return str(obj) if obj != '' else ''
                except (json.JSONDecodeError, TypeError):
                    return ''
            _spl_result = json_get(acc, 'count')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - json_str
          - key
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_acc
        - out_running_count
      - id: tool_9
        type: SOLVE
        config:
          tool: advance_offset
          backend: kernel
          arguments:
          - '@offset'
          - '@chunk_size'
          code: |
            def advance_offset(offset: str, chunk_size: str) -> str:
                try:
                    return str(int(offset) + int(chunk_size))
                except Exception as e:
                    return f"error: {e}"
            _spl_result = advance_offset(offset, chunk_size)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - offset
          - chunk_size
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_offset
        - in_chunk_size
        - out_offset
      - id: set_6
        type: CONTEXT
        config:
          action: set
          expression: '@in_i + 1'
        ports:
        - trigger
        - complete
        - in_i
        - out_i
      edges:
      - source: tool_1.complete
        target: tool_2.trigger
        type: triggers
      - source: tool_1.out_chunk
        target: tool_2.in_chunk
        type: binds
      - source: tool_2.complete
        target: eval_1.trigger
        type: triggers
      - source: tool_2.out_chunk_empty
        target: eval_1.in_subject
        type: binds
      - source: eval_1.pass
        target: set_5.trigger
        type: triggers
      - source: eval_1.fail
        target: tool_3.trigger
        type: triggers
      - source: tool_1.out_chunk
        target: tool_3.in_chunk
        type: binds
      - source: tool_3.complete
        target: tool_4.trigger
        type: triggers
      - source: tool_3.out_chunk_stats
        target: tool_4.in_chunk_stats
        type: binds
      - source: tool_4.complete
        target: tool_5.trigger
        type: triggers
      - source: tool_3.out_chunk_stats
        target: tool_5.in_chunk_stats
        type: binds
      - source: tool_5.complete
        target: tool_6.trigger
        type: triggers
      - source: tool_4.out_chunk_sum
        target: tool_6.in_chunk_sum
        type: binds
      - source: tool_5.out_chunk_count
        target: tool_6.in_chunk_count
        type: binds
      - source: tool_6.complete
        target: tool_7.trigger
        type: triggers
      - source: tool_6.out_acc
        target: tool_7.in_acc
        type: binds
      - source: tool_7.complete
        target: tool_8.trigger
        type: triggers
      - source: tool_6.out_acc
        target: tool_8.in_acc
        type: binds
      - source: tool_8.complete
        target: tool_9.trigger
        type: triggers
      - source: tool_9.complete
        target: set_6.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_csv_path
  - in_chunk_size
  - in_offset
  - in_max_iterations
  - in_column
  - in_running_total
  - in_running_count
  - in_i
  - out_chunk
  - out_chunk_empty
  - out_i
  - out_chunk_stats
  - out_chunk_sum
  - out_chunk_count
  - out_acc
  - out_running_total
  - out_running_count
  - out_offset
- id: tool_10
  type: SOLVE
  config:
    tool: format_results
    backend: kernel
    arguments:
    - '@running_total'
    - '@running_count'
    code: |
      def format_results(total: str, count: str) -> str:
          try:
              t = float(total)
              c = int(count)
              avg = t / c if c > 0 else 0.0
              return (
                  "=== CSV Aggregation Results ===\n"
                  f"Total Sales : {t:,.2f}\n"
                  f"Row Count   : {c:,}\n"
                  f"Average     : {avg:,.2f}"
              )
          except Exception as e:
              return f"error: {e}"
      _spl_result = format_results(running_total, running_count)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - total
    - count
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_running_total
  - in_running_count
  - out_result
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_result
edges:
- source: wf_entry.entry
  target: set_1.trigger
  type: triggers
- source: set_1.complete
  target: set_2.trigger
  type: triggers
- source: set_2.complete
  target: set_3.trigger
  type: triggers
- source: set_3.complete
  target: set_4.trigger
  type: triggers
- source: set_4.complete
  target: loop_1.trigger
  type: triggers
- source: wf_entry.out_csv_path
  target: loop_1.in_csv_path
  type: binds
- source: wf_entry.out_chunk_size
  target: loop_1.in_chunk_size
  type: binds
- source: set_1.out_offset
  target: loop_1.in_offset
  type: binds
- source: wf_entry.out_max_iterations
  target: loop_1.in_max_iterations
  type: binds
- source: wf_entry.out_column
  target: loop_1.in_column
  type: binds
- source: set_2.out_running_total
  target: loop_1.in_running_total
  type: binds
- source: set_3.out_running_count
  target: loop_1.in_running_count
  type: binds
- source: set_4.out_i
  target: loop_1.in_i
  type: binds
- source: loop_1.exit
  target: tool_10.trigger
  type: triggers
- source: loop_1.out_running_total
  target: tool_10.in_running_total
  type: binds
- source: loop_1.out_running_count
  target: tool_10.in_running_count
  type: binds
- source: tool_10.out_result
  target: wf_exit.in_result
  type: binds
- source: tool_10.complete
  target: wf_exit.trigger
  type: triggers
