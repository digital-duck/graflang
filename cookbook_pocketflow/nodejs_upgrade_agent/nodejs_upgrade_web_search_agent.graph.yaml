        from: tool_8.out_file_path
      file_result:
        from: call_1.out_file_result
      files_changed:
        from: set_3.out_files_changed
      _:
        from: set_4.out__
      idx:
        from: set_5.out_idx
    subgraph:
      nodes:
      - id: tool_8
        type: SOLVE
        config:
          tool: list_get
          backend: kernel
          arguments:
          - '@all_files'
          - '@idx + 1'
          code: |
            import json

            def list_get(value: str, index: str, delimiter: str=',') -> str:
                """LIST_GET(value, index, delimiter) — 1-based element from a JSON array
                or, if value isn't valid JSON, a delimited list."""
                s = str(value).strip()
                idx = int(index) - 1
                if s.startswith('[') and s.endswith(']'):
                    try:
                        parts = json.loads(s)
                        return str(parts[idx]) if 0 <= idx < len(parts) else ''
                    except (json.JSONDecodeError, TypeError):
                        pass
                parts = s.split(str(delimiter))
                return parts[idx].strip() if 0 <= idx < len(parts) else ''
            _spl_result = list_get(all_files, idx + 1)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          - index
          - delimiter
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_all_files
        - in_idx
        - out_file_path
      - id: call_1
        type: GENERATE
        config:
          procedure_ref: procedures.upgrade_file
          arguments:
          - '@file_path'
          - '@upgrade_plan'
        ports:
        - trigger
        - complete
        - in_file_path
        - in_upgrade_plan
        - out_file_result
      - id: eval_1
        type: EVALUATE
        config:
          condition: '@in_file_result == ''updated'''
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_file_result
      - id: set_3
        type: CONTEXT
        config:
          action: set
          expression: '@in_files_changed + 1'
        ports:
        - trigger
        - complete
        - in_files_changed
        - out_files_changed
      - id: set_4
        type: CONTEXT
        config:
          action: set
          expression: ''''''
        ports:
        - trigger
        - complete
        - out__
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '@in_idx + 1'
        ports:
        - trigger
        - complete
        - in_idx
        - out_idx
      edges:
      - source: tool_8.complete
        target: call_1.trigger
        type: triggers
      - source: tool_8.out_file_path
        target: call_1.in_file_path
        type: binds
      - source: call_1.complete
        target: eval_1.trigger
        type: triggers
      - source: call_1.out_file_result
