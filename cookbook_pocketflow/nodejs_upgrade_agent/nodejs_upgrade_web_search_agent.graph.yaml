version: 1.0-graph
workflow:
  name: nodejs_upgrade_agent
  inputs:
  - name: project_dir
    type: TEXT
  - name: target_node
    type: TEXT
    default: '20'
  - name: max_heal_attempts
    type: TEXT
    default: '5'
  - name: report_path
    type: TEXT
    default: upgrade_report.md
  - name: template_path
    type: TEXT
    default: ''
  outputs:
  - name: report
    type: TEXT
resources:
  procedures:
    upgrade_file: ./nodejs_upgrade_web_search_agent.spl
    npm_validate_and_heal: ./nodejs_upgrade_web_search_agent.spl
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_project_dir
  - out_target_node
  - out_max_heal_attempts
  - out_report_path
  - out_template_path
- id: tool_1
  type: SOLVE
  config:
    tool: scan_source_files
    backend: kernel
    arguments:
    - '@project_dir'
    code: |
      import json, os
      from pathlib import Path

      _EXTS = {".js", ".ts", ".jsx", ".tsx", ".mjs", ".cjs"}
      _SKIP = {"node_modules", ".git", "dist", "build", ".next", "coverage"}

      def scan_source_files(project_dir):
          root = Path(project_dir)
          files = []
          for p in root.rglob("*"):
              if p.suffix in _EXTS and not any(s in p.parts for s in _SKIP):
                  files.append(str(p))
          return json.dumps(sorted(files))
      _spl_result = scan_source_files(project_dir)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - project_dir
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_project_dir
  - out_all_files
- id: tool_2
  type: SOLVE
  config:
    tool: read_package_json
    backend: kernel
    arguments:
    - '@project_dir'
    code: |
      import json
      from pathlib import Path

      def read_package_json(project_dir):
          pkg = Path(project_dir) / "package.json"
          if not pkg.exists():
              return json.dumps({"error": f"package.json not found in {project_dir}"})
          return pkg.read_text(encoding="utf-8")
      _spl_result = read_package_json(project_dir)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - project_dir
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_project_dir
  - out_pkg_json
- id: tool_3
  type: SOLVE
  config:
    tool: list_outdated
    backend: kernel
    arguments:
    - '@project_dir'
    code: |
      import subprocess, json

      def list_outdated(project_dir):
          result = subprocess.run(
              ["npm", "outdated", "--json"],
              cwd=project_dir, capture_output=True, text=True
          )
          # npm outdated exits non-zero when packages are outdated — that's expected
          try:
              data = json.loads(result.stdout) if result.stdout.strip() else {}
          except json.JSONDecodeError:
              data = {"raw": result.stdout}
          return json.dumps(data)
      _spl_result = list_outdated(project_dir)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - project_dir
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_project_dir
  - out_outdated
- id: tool_4
  type: SOLVE
  config:
    tool: list_count
    backend: kernel
    arguments:
    - '@all_files'
    code: |
      import json

      def list_count(json_list):
          return str(len(json.loads(json_list)))
      _spl_result = list_count(all_files)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_list
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_all_files
  - out_file_count
- id: tool_5
  type: SOLVE
  config:
    tool: detect_project_type
    backend: kernel
    arguments:
    - '@pkg_json'
    code: |
      import json

      _FRAMEWORK_SIGNALS = [
          # (dep_key_substring, project_type)
          ("next",            "nextjs"),
          ("nuxt",            "nuxtjs"),
          ("@angular/core",   "angular"),
          ("react-scripts",   "react-cra"),
          ("react",           "react"),
          ("vue",             "vue"),
          ("svelte",          "svelte"),
          ("@nestjs/core",    "nestjs"),
          ("express",         "express"),
          ("fastify",         "fastify"),
          ("koa",             "koa"),
          ("electron",        "electron"),
      ]

      def detect_project_type(pkg_json):
          try:
              pkg = json.loads(pkg_json)
          except json.JSONDecodeError:
              return "unknown"
          all_deps = {
              **pkg.get("dependencies", {}),
              **pkg.get("devDependencies", {}),
          }
          for signal, ptype in _FRAMEWORK_SIGNALS:
              if any(signal in k for k in all_deps):
                  return ptype
          # check scripts for clues
          scripts = pkg.get("scripts", {})
          if any("angular" in v for v in scripts.values()):
              return "angular"
          if any("react" in v for v in scripts.values()):
              return "react"
          return "node"   # generic Node.js backend
      _spl_result = detect_project_type(pkg_json)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - pkg_json
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_pkg_json
  - out_project_type
- id: tool_6
  type: SOLVE
  config:
    tool: load_upgrade_template
    backend: kernel
    arguments:
    - '@template_path'
    - '@project_type'
    code: |
      from pathlib import Path

      _DEFAULTS = {
          "react":     "Focus on: React API changes, hooks deprecations, JSX transform, peer dep conflicts.",
          "react-cra": "Focus on: react-scripts version, webpack config changes, polyfill removals.",
          "nextjs":    "Focus on: App Router migration, getServerSideProps deprecations, Image/Link API changes.",
          "angular":   "Focus on: ng update path, RxJS version alignment, standalone component migration, strict mode.",
          "vue":       "Focus on: Options API vs Composition API, vue-router & vuex/pinia alignment.",
          "nuxtjs":    "Focus on: Nuxt 3 migration, auto-imports, nitro engine changes.",
          "svelte":    "Focus on: Svelte 4/5 syntax changes, SvelteKit routing changes.",
          "nestjs":    "Focus on: module/decorator API changes, platform-express/fastify alignment.",
          "express":   "Focus on: middleware signature changes, error handler arity, router API.",
          "electron":  "Focus on: contextBridge, preload script isolation, Node.js version alignment.",
          "node":      "Focus on: Node.js built-in API changes, ESM/CJS interop, crypto/buffer deprecations.",
      }

      def load_upgrade_template(template_path, project_type):
          p = Path(template_path)
          if template_path and p.exists():
              return p.read_text(encoding="utf-8")
          return _DEFAULTS.get(project_type, _DEFAULTS["node"])
      _spl_result = load_upgrade_template(template_path, project_type)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - template_path
    - project_type
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_template_path
  - in_project_type
  - out_analysis_template
- id: gen_1
  type: GENERATE
  config:
    function: analyze_breaking_changes
    params:
    - pkg_json
    - outdated
    - target_node
    - project_type
    - analysis_template
    prompt_inline: |-
      You are a Node.js upgrade specialist.

      Project type: {{in_project_type}}

      Upgrade guidance for this project type:
      {{in_analysis_template}}

      Current package.json:
      {{in_pkg_json}}

      Outdated packages (npm outdated --json):
      {{in_outdated}}

      Target Node.js version: {{in_target_node}}

      Produce a structured upgrade plan in YAML:

      breaking_changes:
        - package: <name>
          from: <version>
          to: <version>
          breaking_apis: [<list of changed APIs>]
          migration_notes: <one-line summary>

      recommended_script: <npm install command with exact pinned versions>
    arguments:
    - '@pkg_json'
    - '@outdated'
    - '@target_node'
    - '@project_type'
    - '@analysis_template'
  ports:
  - trigger
  - complete
  - in_pkg_json
  - in_outdated
  - in_target_node
  - in_project_type
  - in_analysis_template
  - out_upgrade_plan
- id: tool_7
  type: SOLVE
  config:
    tool: run_npm
    backend: kernel
    arguments:
    - '@project_dir'
    - '''install'''
    code: |
      import subprocess, json

      def run_npm(project_dir, cmd):
          args = ["npm"] + cmd.split()
          result = subprocess.run(
              args, cwd=project_dir, capture_output=True, text=True, timeout=300
          )
          return json.dumps({
              "exit_code": result.returncode,
              "stdout": result.stdout[-4000:],   # cap to avoid token explosion
              "stderr": result.stderr[-2000:],
              "ok": result.returncode == 0
          })
      _spl_result = run_npm(project_dir, 'install')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - project_dir
    - cmd
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_project_dir
  - out_pre_install
- id: set_1
  type: CONTEXT
