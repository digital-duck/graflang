        - set_12.out_i
        - set_15.out_i
      best_solution:
        from: set_13.out_best_solution
      best_test_results:
        from: set_14.out_best_test_results
      failure_analysis:
        from: gen_3.out_failure_analysis
      revision_decision:
        from: gen_4.out_revision_decision
      solution:
        from:
        - gen_5.out_solution
        - gen_7.out_solution
      tests:
        from: gen_6.out_tests
    subgraph:
      nodes:
      - id: tool_1
        type: SOLVE
        config:
          tool: run_tests
          backend: kernel
          arguments:
          - '@solution'
          - '@tests'
          code: |
            import json
            import concurrent.futures
            import traceback

            def run_tests(solution: str, tests: str) -> str:
                try:
                    namespace = {}
                    try:
                        exec(compile(solution + "\n\n" + tests, "<combined>", "exec"), namespace)
                    except Exception as e:
                        return json.dumps({
                            "all_passed": "false",
                            "passed": 0,
                            "failed": 1,
                            "details": [{"test": "setup", "status": "error", "message": str(e)}]
                        })

                    test_fns = {name: fn for name, fn in namespace.items()
                                if callable(fn) and name.startswith("test_")}

                    if not test_fns:
                        return json.dumps({
                            "all_passed": "false",
                            "passed": 0,
                            "failed": 1,
                            "details": [{"test": "discovery", "status": "error",
                                         "message": "No test_ functions found in test code"}]
                        })

                    def run_one(item):
                        name, fn = item
                        try:
                            fn()
                            return {"test": name, "status": "passed", "message": ""}
                        except AssertionError as e:
                            return {"test": name, "status": "failed", "message": str(e)}
                        except Exception as e:
                            return {"test": name, "status": "error", "message": traceback.format_exc()}

                    with concurrent.futures.ThreadPoolExecutor() as executor:
                        results = list(executor.map(run_one, test_fns.items()))

                    passed = sum(1 for r in results if r["status"] == "passed")
                    failed = len(results) - passed
                    return json.dumps({
                        "all_passed": "true" if failed == 0 else "false",
                        "passed": passed,
                        "failed": failed,
                        "details": results
                    })
                except Exception as e:
                    return json.dumps({
                        "all_passed": "false",
                        "passed": 0,
                        "failed": 1,
                        "details": [{"test": "runner", "status": "error", "message": str(e)}]
                    })
            _spl_result = run_tests(solution, tests)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - solution
          - tests
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_solution
        - in_tests
        - out_test_results
      - id: tool_2
        type: SOLVE
        config:
          tool: json_get
          backend: kernel
          arguments:
          - '@test_results'
          - '''all_passed'''
          code: |
            import json

            def json_get(json_str: str, key: str) -> str:
                """JSON_GET(json, key) — extract a top-level key from a JSON object string.
                Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
                ```json code fences before parsing, so raw LLM output works directly.
                Returns '' if key not found or input is not valid JSON.
                """
                try:
                    clean = str(json_str).replace('```json', '').replace('```', '').strip()
                    obj = json.loads(clean)
                    for part in str(key).split('.'):
                        if isinstance(obj, dict):
                            obj = obj.get(part, '')
                        else:
                            return ''
                    return str(obj) if obj != '' else ''
                except (json.JSONDecodeError, TypeError):
                    return ''
            _spl_result = json_get(test_results, 'all_passed')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - json_str
          - key
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_test_results
        - out_all_passed
      - id: eval_1
        type: EVALUATE
        config:
          condition: contains(@in_subject, 'true')
