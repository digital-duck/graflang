- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_i, @i) < @in_max_iterations
    outputs:
      test_results:
        from: tool_1.out_test_results
      all_passed:
        from: tool_2.out_all_passed
      status:
        from: set_11.out_status
      i:
