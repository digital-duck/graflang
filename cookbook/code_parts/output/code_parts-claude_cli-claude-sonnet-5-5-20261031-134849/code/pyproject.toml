[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "translator_bot"
version = "0.1.0"
description = "Streamlit translation chatbot"
requires-python = ">=3.9"
dependencies = ["streamlit"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["translator_bot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
