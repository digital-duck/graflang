# Lifted from SPL.py cookbook-pocketflow/056_majority_vote/majority_vote.spl by spl2graph; kept as an R1 acceptance sample (see readme.md).
version: 1.0-graph
workflow:
  name: majority_vote
  inputs:
  - name: question
    type: TEXT
    default: What is 15% of 240?
  outputs:
  - name: answer
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_question
- id: fork_1
  type: FORK
  ports:
  - trigger
  - branch_1
  - branch_2
  - branch_3
- id: gen_1
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: 'Answer the following reasoning question carefully and concisely.

      State only your final answer — no explanation or preamble.


      Question: {{in_question}}'
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans1
- id: gen_2
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: 'Answer the following reasoning question carefully and concisely.

      State only your final answer — no explanation or preamble.


      Question: {{in_question}}'
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans2
- id: gen_3
  type: GENERATE
  config:
    function: attempt_reasoning
    params:
    - question
    prompt_inline: 'Answer the following reasoning question carefully and concisely.

      State only your final answer — no explanation or preamble.


      Question: {{in_question}}'
    arguments:
    - '@question'
  ports:
  - trigger
  - complete
  - in_question
  - out_ans3
- id: join_1
  type: JOIN
  ports:
  - trigger
  - complete
- id: set_1
  type: CONTEXT
  config:
    action: set
    expression: '@in_ans1 + ''\n'' + @in_ans2 + ''\n'' + @in_ans3'
  ports:
  - trigger
  - complete
  - in_ans1
  - in_ans2
  - in_ans3
  - out_collected
- id: tool_1
  type: SOLVE
  config:
    tool: tally_votes
    backend: kernel
    arguments:
    - '@collected'
    code: "import json\nfrom collections import Counter\n\ndef tally_votes(answers:\
      \ str) -> str:\n    try:\n        items = [a.strip() for a in answers.split(\"\
      \\n\") if a.strip()]\n        if not items:\n            return json.dumps({\"\
      winner\": \"\", \"first_candidate\": \"\", \"consensus\": \"no\"})\n       \
      \ counts = Counter(items)\n        most_common = counts.most_common()\n    \
      \    top_count = most_common[0][1]\n        top_candidates = [v for v, c in\
      \ most_common if c == top_count]\n        consensus = \"yes\" if len(top_candidates)\
      \ == 1 else \"no\"\n        return json.dumps({\n            \"winner\": most_common[0][0],\n\
      \            \"first_candidate\": top_candidates[0],\n            \"consensus\"\
      : consensus\n        })\n    except Exception as e:\n        return f\"error:\
      \ {e}\"\n_spl_result = tally_votes(collected)\n"
    result: _spl_result
    out_type: TEXT
    tool_params:
    - answers
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_collected
  - out_tally
- id: tool_2
  type: SOLVE
  config:
    tool: json_get
    backend: kernel
    arguments:
    - '@tally'
    - '''consensus'''
    code: "import json\n\ndef json_get(json_str: str, key: str) -> str:\n    \"\"\"\
      JSON_GET(json, key) — extract a top-level key from a JSON object string.\n \
      \   Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown\n\
      \    ```json code fences before parsing, so raw LLM output works directly.\n\
      \    Returns '' if key not found or input is not valid JSON.\n    \"\"\"\n \
      \   try:\n        clean = str(json_str).replace('```json', '').replace('```',\
      \ '').strip()\n        obj = json.loads(clean)\n        for part in str(key).split('.'):\n\
      \            if isinstance(obj, dict):\n                obj = obj.get(part,\
      \ '')\n            else:\n                return ''\n        return str(obj)\
      \ if obj != '' else ''\n    except (json.JSONDecodeError, TypeError):\n    \
      \    return ''\n_spl_result = json_get(tally, 'consensus')\n"
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_tally
  - out_consensus
- id: eval_1
  type: EVALUATE
  config:
    condition: contains(@in_subject, 'yes')
    branch: 1
  ports:
  - trigger
  - pass
  - fail
  - in_subject
- id: tool_3
  type: SOLVE
  config:
    tool: json_get
    backend: kernel
    arguments:
    - '@tally'
    - '''winner'''
    code: "import json\n\ndef json_get(json_str: str, key: str) -> str:\n    \"\"\"\
      JSON_GET(json, key) — extract a top-level key from a JSON object string.\n \
      \   Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown\n\
      \    ```json code fences before parsing, so raw LLM output works directly.\n\
      \    Returns '' if key not found or input is not valid JSON.\n    \"\"\"\n \
      \   try:\n        clean = str(json_str).replace('```json', '').replace('```',\
      \ '').strip()\n        obj = json.loads(clean)\n        for part in str(key).split('.'):\n\
      \            if isinstance(obj, dict):\n                obj = obj.get(part,\
      \ '')\n            else:\n                return ''\n        return str(obj)\
      \ if obj != '' else ''\n    except (json.JSONDecodeError, TypeError):\n    \
      \    return ''\n_spl_result = json_get(tally, 'winner')\n"
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_tally
  - out_answer
- id: tool_4
  type: SOLVE
  config:
    tool: json_get
    backend: kernel
    arguments:
    - '@tally'
    - '''first_candidate'''
    code: "import json\n\ndef json_get(json_str: str, key: str) -> str:\n    \"\"\"\
      JSON_GET(json, key) — extract a top-level key from a JSON object string.\n \
      \   Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown\n\
      \    ```json code fences before parsing, so raw LLM output works directly.\n\
      \    Returns '' if key not found or input is not valid JSON.\n    \"\"\"\n \
      \   try:\n        clean = str(json_str).replace('```json', '').replace('```',\
      \ '').strip()\n        obj = json.loads(clean)\n        for part in str(key).split('.'):\n\
      \            if isinstance(obj, dict):\n                obj = obj.get(part,\
      \ '')\n            else:\n                return ''\n        return str(obj)\
      \ if obj != '' else ''\n    except (json.JSONDecodeError, TypeError):\n    \
      \    return ''\n_spl_result = json_get(tally, 'first_candidate')\n"
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_tally
  - out_answer
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_answer
edges:
- source: wf_entry.entry
  target: fork_1.trigger
  type: triggers
- source: fork_1.branch_1
  target: gen_1.trigger
  type: triggers
- source: wf_entry.out_question
  target: gen_1.in_question
