- source: fork_1.branch_2
  target: gen_2.trigger
  type: triggers
- source: wf_entry.out_question
  target: gen_2.in_question
  type: binds
- source: fork_1.branch_3
  target: gen_3.trigger
  type: triggers
- source: wf_entry.out_question
  target: gen_3.in_question
  type: binds
- source: gen_1.complete
