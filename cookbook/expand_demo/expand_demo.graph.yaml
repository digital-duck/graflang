version: "1.0-graph"

# One template applied to a graph of concepts: each concept is explained by the `explain` part after its prerequisites,
# and independent concepts run side by side with `--workers 2`.
#   graf run cookbook/expand_demo/expand_demo.graph.yaml --workers 2
#   graf expand cookbook/expand_demo/expand_demo.graph.yaml     # the nodes and edges it stands for
#   graf vis cookbook/expand_demo/expand_demo.graph.yaml

workflow:
  name: "expand_demo"
  inputs:
    - {name: "audience", type: "TEXT", default: "curious beginners"}
  outputs:
    - {name: "explanations", type: "JSON"}

resources:
  parts:
    explain: "./sub_graph/explain.graph.yaml"

expand:
  part: parts.explain
  over: ./concepts.data.yaml
  with: {concept: title}
  shared: [audience]
  pass: {from: text, to: context}
  result: text
