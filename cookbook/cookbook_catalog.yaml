# GraphLang cookbook catalog: the single source of truth for every recipe graph.
#
# Graph-first: each entry names a *.graph.yaml; what a graph needs and what it takes as input is read from
# the graph itself (`graf info`), and run_all.py (this folder) runs, validates and documents recipes from this
# file. The tables in README.md are generated from it (`python cookbook/run_all.py --write-readme`).
#
# Fields
#   id           suite.folder[.graph]   unique; `--ids` filters on it (shell-style globs)
#   suite        cookbook | pocketflow | solvers
#   graph        path of the graph, from the repo root
#   workflow     the workflow's own name (workflow.name in the graph)
#   category     free label (basics, agentic, retrieval, ... or solver)
#   description  one line
#   needs        what a run needs, machine-checked by `run_all.py --check`:
#                  llm (a model call), kernel (a Jupyter kernel for SOLVE), sagemath (that kernel), spl (SPL.py importable,
#                  for procedure_ref), stdin (waits for keyboard input: not run by default)
#   requires     free-text needs, as the recipe readme states them        (optional)
#   calls        free-text count of model calls                           (optional)
#   inputs       the workflow inputs, with defaults                       (read from the graph)
#   params       --param values run_all.py passes                         (optional)
#   bind         a --bind file                                            (optional)
#   args         extra `graf run` arguments, e.g. --kernel-name sagemath  (optional)
#   status       validated  the owner ran it and checked the output
#                ran        completed under run_all.py; the output is not reviewed
#                lifted     lifted from SPL, passes `graf validate`, not run yet
#                new        passes `graf validate`, not run yet
#                broken     known not to run (see `note`)
#   validated    who/when/with what, for status: validated
#   note         anything a user should know before running
#   active       true = part of the default batch run (`python cookbook/run_all.py --run`)
