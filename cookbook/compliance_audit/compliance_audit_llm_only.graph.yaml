version: "1.0-graph"

# BASELINE for compliance_audit: the same audit with an LLM only, to compare side by side. The LLM itself judges whether the
# document may go to the destination (prompts/judge.md carries the policy as prose); a failing document is redacted (same
# prompt as compliance_audit), and judged again once. The same Cedar guard decides the release; anything that cannot be shown
# compliant ends at `escalated`. No rule engine: compare it with compliance_audit.graph.yaml (see the readme).

workflow:
  name: "compliance_audit_llm_only"
  inputs:
    - {name: "document", type: "TEXT"}         # the text itself, or the path of a text file (read by load_document)
    - {name: "destination", type: "TEXT"}     # the four destinations named in prompts/judge.md are external
  outputs:
    - {name: "safe_document", type: "TEXT"}
    - {name: "audit", type: "TEXT"}

resources:
  prompts:
    judge: "./prompts/judge.md"
    redact: "./prompts/redact.md"
  policies:
    release_policy: "./policies/release_policy.cedar"

nodes:
  - id: "wf_entry"
    type: "INPUT"
    ports: ["entry", "out_document", "out_destination"]

  # 0. The document: a literal text is kept, a file path is replaced by the file's text (procedures/load_document.py)
  - id: "load_document"
    type: "SOLVE"
    config:
      backend: "subprocess"
      command: ["python3", "-I", "procedures/load_document.py"]
      parse: {tool: "procedures/load_document.py:parse"}      # the whole text, not one line
      out_type: "TEXT"
      timeout: 30
      label: "Load the document"
    ports: ["trigger", "complete", "in_document", "out_text"]

  # 1. The LLM decides: may this document go to this destination? Returns JSON {compliant, violated, facts}
  - id: "judge"
    type: "GENERATE"
    config: {prompt_ref: "prompts.judge", label: "Judge the document"}
    ports: ["trigger", "complete", "in_document", "in_destination", "out_verdict"]

  - id: "compliant_first"
    type: "EVALUATE"
    config: {condition: "json_get(@in_verdict, 'compliant') == TRUE", label: "Compliant?"}
    ports: ["trigger", "pass", "fail", "in_verdict"]

  # 2. Remediation (the same prompt as compliance_audit), then the LLM judges the redacted text
  - id: "redact"
    type: "GENERATE"
    config: {prompt_ref: "prompts.redact", label: "Redact"}
    ports: ["trigger", "complete", "in_document", "in_verdict", "out_redacted"]

  - id: "judge_again"
    type: "GENERATE"
    config: {prompt_ref: "prompts.judge", label: "Judge the redacted text"}
    ports: ["trigger", "complete", "in_document", "in_destination", "out_verdict"]

  - id: "compliant_second"
    type: "EVALUATE"
    config: {condition: "json_get(@in_verdict, 'compliant') == TRUE", label: "Compliant now?"}
    ports: ["trigger", "pass", "fail", "in_verdict"]

  # 3. Runtime authorization (Cedar): the same policy as compliance_audit
  - id: "release_guard"
    type: "GUARD"
    config:
      policy_ref: "policies.release_policy"
      principal: 'Service::"compliance-workflow"'
      action: 'Action::"release_document"'
      resource: 'Destination::"target"'
      context_mapping:
        compliant: "json_get(@in_verdict, 'compliant') == TRUE"
        is_external: "json_get(@in_verdict, 'facts.is_external') == TRUE"
      label: "May it be released?"
    ports: ["trigger", "allow", "deny", "in_verdict"]

  - id: "audit_released"
    type: "SOLVE"
    config:
      expression: "'released to ' + @in_destination + ' (LLM judge)'"
      label: "Audit note: released"
    ports: ["trigger", "complete", "in_destination", "out_audit"]

  - id: "audit_escalated"
    type: "SOLVE"
    config:
      expression: "'ESCALATED to a human reviewer, not released. Violated: ' + str(json_get(@in_verdict, 'violated'))"
      label: "Audit note: escalated"
    ports: ["trigger", "complete", "in_verdict", "out_audit"]

  - id: "released"
    type: "OUTPUT"
    config: {risky: true}        # the document leaves here; `graf validate` checks that only release_guard.allow reaches it
    ports: ["trigger", "exit", "in_safe_document", "in_audit"]

  - id: "escalated"
    type: "OUTPUT"
    ports: ["trigger", "exit", "in_audit"]

edges:
  # first pass
  - {source: "wf_entry.entry",           target: "load_document.trigger",   type: "triggers"}
  - {source: "wf_entry.out_document",    target: "load_document.in_document", type: "binds"}
  - {source: "load_document.complete",   target: "judge.trigger",           type: "triggers"}
  - {source: "load_document.out_text",   target: "judge.in_document",       type: "binds"}
  - {source: "wf_entry.out_destination", target: "judge.in_destination",    type: "binds"}
  - {source: "judge.complete",           target: "compliant_first.trigger", type: "triggers"}
  - {source: "judge.out_verdict",        target: "compliant_first.in_verdict", type: "binds"}

  # compliant on the first pass: straight to the guard
  - {source: "compliant_first.pass",     target: "release_guard.trigger",   type: "triggers"}
  - {source: "judge.out_verdict",        target: "release_guard.in_verdict", type: "binds"}

  # not compliant: redact, judge the redacted text
  - {source: "compliant_first.fail",     target: "redact.trigger",          type: "triggers"}
  - {source: "load_document.out_text",   target: "redact.in_document",      type: "binds"}
  - {source: "judge.out_verdict",        target: "redact.in_verdict",       type: "binds"}
  - {source: "redact.complete",          target: "judge_again.trigger",     type: "triggers"}
  - {source: "redact.out_redacted",      target: "judge_again.in_document", type: "binds"}
  - {source: "wf_entry.out_destination", target: "judge_again.in_destination", type: "binds"}
  - {source: "judge_again.complete",     target: "compliant_second.trigger", type: "triggers"}
  - {source: "judge_again.out_verdict",  target: "compliant_second.in_verdict", type: "binds"}
  - {source: "compliant_second.pass",    target: "release_guard.trigger",   type: "triggers"}
  - {source: "judge_again.out_verdict",  target: "release_guard.in_verdict", type: "binds"}   # the newer verdict wins
  - {source: "compliant_second.fail",    target: "audit_escalated.trigger", type: "triggers"}
  - {source: "judge.out_verdict",        target: "audit_escalated.in_verdict", type: "binds"}
  - {source: "judge_again.out_verdict",  target: "audit_escalated.in_verdict", type: "binds"}   # the newer verdict wins

  # the guard decides
  - {source: "release_guard.allow",      target: "audit_released.trigger",  type: "triggers"}
  - {source: "wf_entry.out_destination", target: "audit_released.in_destination", type: "binds"}
  - {source: "audit_released.complete",  target: "released.trigger",        type: "triggers"}
  - {source: "load_document.out_text",   target: "released.in_safe_document", type: "binds"}
  - {source: "redact.out_redacted",      target: "released.in_safe_document", type: "binds"}   # the redacted text wins if there is one
  - {source: "audit_released.out_audit", target: "released.in_audit",       type: "binds"}
  - {source: "release_guard.deny",       target: "audit_escalated.trigger", type: "triggers"}
  - {source: "audit_escalated.complete", target: "escalated.trigger",       type: "triggers"}
  - {source: "audit_escalated.out_audit", target: "escalated.in_audit",     type: "binds"}
