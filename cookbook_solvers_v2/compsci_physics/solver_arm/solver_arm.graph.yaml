version: 1.0-graph
workflow:
  name: solver_arm
  inputs:
  - name: max_tries
    type: INTEGER
  - name: problem
    type: TEXT
  - name: out_dir
    type: TEXT
  - name: ts_safe
    type: TEXT
  outputs:
  - name: report
    type: TEXT
steps:
- set_tries:
    node: CONTEXT
    out: tries
    action: set
    expression: '0'
- set_status:
    node: CONTEXT
    out: status
    action: set
    expression: "'init'"
- set_code:
    node: CONTEXT
    out: code
    action: set
    expression: "''"
- set_solution:
    node: CONTEXT
    out: solution
    action: set
    expression: "'{}'"
nodes:
- id: loop_1
  type: LOOP
  config:
    condition: latest(@in_tries, @tries) < @in_max_tries
    state:
      tries:
        from:
        - set_7.out_tries
        - set_8.out_tries
        - set_9.out_tries
      code:
        from:
        - gen_2.out_code
        - gen_3.out_code
      solution:
        from:
        - tool_5.out_solution
        - tool_8.out_solution
      status:
        from:
        - tool_6.out_status
        - tool_9.out_status
      error_info:
        from: tool_7.out_error_info
    subgraph:
      nodes:
      - id: eval_3
        type: EVALUATE
        config:
          condition: "@in_status == 'OK'"
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_status
      - id: set_7
        type: CONTEXT
        config:
          action: set
          expression: '@in_max_tries'
        ports:
        - trigger
        - complete
        - in_max_tries
        - out_tries
      - id: eval_4
        type: EVALUATE
        config:
          condition: "@in_status == 'init'"
          branch: 2
        ports:
        - trigger
        - pass
        - fail
        - in_status
      - id: gen_2
        type: GENERATE
        config:
          function: formulate_conservation_code
          params:
          - problem
          prompt_inline: |-
            You are a physicist. Convert this 1-D collision word problem into
            runnable Python code using NumPy.

            Rules:
            - `np` (NumPy) is already imported — do NOT add import statements
            - Work in SI units throughout (kg, m/s)
            - Solve for the final velocities using the appropriate physics
              (conservation of momentum always applies; if the collision is
              elastic, kinetic energy is ALSO conserved — use the standard
              1-D elastic collision formulas; if perfectly inelastic, the
              objects move together after collision)
            - Store the result EXACTLY as:
                _result = {
                    "m1": <mass of object 1, kg>, "m2": <mass of object 2, kg>,
                    "v1i": <initial velocity of object 1, m/s>,
                    "v2i": <initial velocity of object 2, m/s>,
                    "v1f": <your computed final velocity of object 1, m/s>,
                    "v2f": <your computed final velocity of object 2, m/s>,
                    "elastic": true or false (True if the problem is an elastic
                               collision, False if perfectly inelastic)
                }
            - Output ONLY raw Python code — no markdown fences, no commentary

            Problem: {{in_problem}}
          arguments:
          - '@problem'
        ports:
        - trigger
        - complete
        - in_problem
        - out_code
      - id: tool_5
        type: SOLVE
        config:
          tool: run_conservation_check
          backend: kernel
          arguments:
          - '@code'
          code: |
            def run_conservation_check(code: str) -> str:
                """Execute LLM-generated NumPy code and INDEPENDENTLY recompute the
                conservation invariants from the values the code reports — the code
                is never trusted to grade its own homework.

                The LLM's code must set:
                    _result = {"m1": .., "m2": .., "v1i": .., "v2i": ..,
                               "v1f": .., "v2f": .., "elastic": true|false}
                (1-D collision along a single axis; SI units throughout).

                This function then independently computes:
                    p_before = m1*v1i + m2*v2i
                    p_after  = m1*v1f + m2*v2f
                    ke_before = 0.5*m1*v1i^2 + 0.5*m2*v2i^2
                    ke_after  = 0.5*m1*v1f^2 + 0.5*m2*v2f^2
                and reports whether each is conserved within 1% relative tolerance.
                Momentum must ALWAYS be conserved; energy must be conserved only
                when the problem states an elastic collision.
                """
                import json
                import re
                import numpy as np
                code = re.sub(r'^```(?:python)?\s*\n?', '', code.strip(), flags=re.IGNORECASE)
                code = re.sub(r'\n?```\s*$', '', code)
                namespace = {"np": np}
                try:
                    exec(code, namespace)
                    r = namespace.get("_result")
                    if r is None:
                        return json.dumps({"status": "Error", "error": "code did not set _result"})
                    m1, m2 = float(r["m1"]), float(r["m2"])
                    v1i, v2i = float(r["v1i"]), float(r["v2i"])
                    v1f, v2f = float(r["v1f"]), float(r["v2f"])
                    elastic = bool(r.get("elastic", False))

                    p_before = m1 * v1i + m2 * v2i
                    p_after = m1 * v1f + m2 * v2f
                    ke_before = 0.5 * m1 * v1i ** 2 + 0.5 * m2 * v2i ** 2
                    ke_after = 0.5 * m1 * v1f ** 2 + 0.5 * m2 * v2f ** 2

                    def _rel_ok(a, b, tol=0.01):
                        denom = max(abs(a), 1e-9)
                        return abs(a - b) / denom < tol

                    momentum_ok = _rel_ok(p_before, p_after)
                    energy_ok = _rel_ok(ke_before, ke_after) if elastic else True

                    status = "OK" if (momentum_ok and energy_ok) else "Error"
                    out = {
                        "status": status,
                        "answer": round(v1f, 4),
                        "answer2": round(v2f, 4),
                        "unit": "m/s",
                        "p_before": round(p_before, 4), "p_after": round(p_after, 4),
                        "ke_before": round(ke_before, 4), "ke_after": round(ke_after, 4),
                        "momentum_conserved": momentum_ok,
                        "energy_conserved": energy_ok if elastic else "not_applicable",
                        "elastic": elastic,
                    }
                    if status == "Error":
                        reasons = []
                        if not momentum_ok:
                            reasons.append(f"momentum NOT conserved ({p_before:.4f} -> {p_after:.4f})")
                        if elastic and not energy_ok:
                            reasons.append(f"kinetic energy NOT conserved ({ke_before:.4f} -> {ke_after:.4f})")
                        out["error"] = "; ".join(reasons)
                    return json.dumps(out, default=str)
                except Exception as e:
                    return json.dumps({"status": "Error", "error": str(e)})
            _spl_result = run_conservation_check(code)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_code
        - out_solution
      - id: tool_6
        type: SOLVE
        config:
          tool: result_status
          backend: kernel
          arguments:
          - '@solution'
          code: |
            import json

            def result_status(result_json: str) -> str:
                """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                result JSON dict, or 'Error' if missing/unparseable."""
                try:
                    return json.loads(result_json).get('status', 'Error')
                except Exception:
                    return 'Error'
            _spl_result = result_status(solution)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - result_json
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_solution
        - out_status
      - id: set_8
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      - id: tool_7
        type: SOLVE
        config:
          tool: result_error
          backend: kernel
          arguments:
          - '@solution'
          code: |
            import json

            def result_error(result_json: str) -> str:
                """RESULT_ERROR(result_json) — extract the 'error' field from a SOLVER
                result JSON dict (falls back to 'status', then 'unknown error')."""
                try:
                    d = json.loads(result_json)
                    return d.get('error', d.get('status', 'unknown error'))
                except Exception:
                    return result_json
            _spl_result = result_error(solution)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - result_json
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_solution
        - out_error_info
      - id: gen_3
        type: GENERATE
        config:
          function: repair_conservation_code
          params:
          - problem
          - code
          - error_info
          prompt_inline: |-
            This physics code produced a conservation-law violation or an error.

            Problem: {{in_problem}}

            Previous code:
            {{in_code}}

            Error:
            {{in_error_info}}

            Fix the code. Common causes:
            - Momentum not conserved: double-check m1*v1i + m2*v2i == m1*v1f + m2*v2f
            - For an ELASTIC collision, kinetic energy must ALSO be conserved — use
              the standard formulas:
                v1f = ((m1-m2)*v1i + 2*m2*v2i) / (m1+m2)
                v2f = ((m2-m1)*v2i + 2*m1*v1i) / (m1+m2)
            - For a PERFECTLY INELASTIC collision, both objects share one final
              velocity: v1f = v2f = (m1*v1i + m2*v2i) / (m1+m2), and set elastic=False
            - A sign error on velocity direction is the most common mistake
            - Missing or duplicate _result assignment

            Output ONLY the corrected Python code — no markdown fences, no commentary.
          arguments:
          - '@problem'
          - '@code'
          - '@error_info'
        ports:
        - trigger
        - complete
        - in_problem
        - in_code
        - in_error_info
        - out_code
      - id: tool_8
        type: SOLVE
        config:
          tool: run_conservation_check
          backend: kernel
          arguments:
          - '@code'
          code: |
            def run_conservation_check(code: str) -> str:
                """Execute LLM-generated NumPy code and INDEPENDENTLY recompute the
                conservation invariants from the values the code reports — the code
                is never trusted to grade its own homework.

                The LLM's code must set:
                    _result = {"m1": .., "m2": .., "v1i": .., "v2i": ..,
                               "v1f": .., "v2f": .., "elastic": true|false}
                (1-D collision along a single axis; SI units throughout).

                This function then independently computes:
                    p_before = m1*v1i + m2*v2i
                    p_after  = m1*v1f + m2*v2f
                    ke_before = 0.5*m1*v1i^2 + 0.5*m2*v2i^2
                    ke_after  = 0.5*m1*v1f^2 + 0.5*m2*v2f^2
                and reports whether each is conserved within 1% relative tolerance.
                Momentum must ALWAYS be conserved; energy must be conserved only
                when the problem states an elastic collision.
                """
                import json
                import re
                import numpy as np
                code = re.sub(r'^```(?:python)?\s*\n?', '', code.strip(), flags=re.IGNORECASE)
                code = re.sub(r'\n?```\s*$', '', code)
                namespace = {"np": np}
                try:
                    exec(code, namespace)
                    r = namespace.get("_result")
                    if r is None:
                        return json.dumps({"status": "Error", "error": "code did not set _result"})
                    m1, m2 = float(r["m1"]), float(r["m2"])
                    v1i, v2i = float(r["v1i"]), float(r["v2i"])
                    v1f, v2f = float(r["v1f"]), float(r["v2f"])
                    elastic = bool(r.get("elastic", False))

                    p_before = m1 * v1i + m2 * v2i
                    p_after = m1 * v1f + m2 * v2f
                    ke_before = 0.5 * m1 * v1i ** 2 + 0.5 * m2 * v2i ** 2
                    ke_after = 0.5 * m1 * v1f ** 2 + 0.5 * m2 * v2f ** 2

                    def _rel_ok(a, b, tol=0.01):
                        denom = max(abs(a), 1e-9)
                        return abs(a - b) / denom < tol

                    momentum_ok = _rel_ok(p_before, p_after)
                    energy_ok = _rel_ok(ke_before, ke_after) if elastic else True

                    status = "OK" if (momentum_ok and energy_ok) else "Error"
                    out = {
                        "status": status,
                        "answer": round(v1f, 4),
                        "answer2": round(v2f, 4),
                        "unit": "m/s",
                        "p_before": round(p_before, 4), "p_after": round(p_after, 4),
                        "ke_before": round(ke_before, 4), "ke_after": round(ke_after, 4),
                        "momentum_conserved": momentum_ok,
                        "energy_conserved": energy_ok if elastic else "not_applicable",
                        "elastic": elastic,
                    }
                    if status == "Error":
                        reasons = []
                        if not momentum_ok:
                            reasons.append(f"momentum NOT conserved ({p_before:.4f} -> {p_after:.4f})")
                        if elastic and not energy_ok:
                            reasons.append(f"kinetic energy NOT conserved ({ke_before:.4f} -> {ke_after:.4f})")
                        out["error"] = "; ".join(reasons)
                    return json.dumps(out, default=str)
                except Exception as e:
                    return json.dumps({"status": "Error", "error": str(e)})
            _spl_result = run_conservation_check(code)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_code
        - out_solution
      - id: tool_9
        type: SOLVE
        config:
          tool: result_status
          backend: kernel
          arguments:
          - '@solution'
          code: |
            import json

            def result_status(result_json: str) -> str:
                """RESULT_STATUS(result_json) — extract the 'status' field from a SOLVER
                result JSON dict, or 'Error' if missing/unparseable."""
                try:
                    return json.loads(result_json).get('status', 'Error')
                except Exception:
                    return 'Error'
            _spl_result = result_status(solution)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - result_json
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_solution
        - out_status
      - id: set_9
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      edges:
      - source: eval_3.pass
        target: set_7.trigger
        type: triggers
      - source: eval_3.fail
        target: eval_4.trigger
        type: triggers
      - source: eval_4.pass
        target: gen_2.trigger
        type: triggers
      - source: gen_2.complete
        target: tool_5.trigger
        type: triggers
      - source: gen_2.out_code
        target: tool_5.in_code
        type: binds
      - source: tool_5.complete
        target: tool_6.trigger
        type: triggers
      - source: tool_5.out_solution
        target: tool_6.in_solution
        type: binds
      - source: tool_6.complete
        target: set_8.trigger
        type: triggers
      - source: eval_4.fail
        target: tool_7.trigger
        type: triggers
      - source: tool_7.complete
        target: gen_3.trigger
        type: triggers
      - source: tool_7.out_error_info
        target: gen_3.in_error_info
        type: binds
      - source: gen_3.complete
        target: tool_8.trigger
        type: triggers
      - source: gen_3.out_code
        target: tool_8.in_code
        type: binds
      - source: tool_8.complete
        target: tool_9.trigger
        type: triggers
      - source: tool_8.out_solution
        target: tool_9.in_solution
        type: binds
      - source: tool_9.complete
        target: set_9.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_status
  - in_max_tries
  - in_problem
  - in_tries
  - in_solution
  - in_code
  - out_tries
  - out_code
  - out_solution
  - out_status
  - out_error_info
- id: tool_10
  type: SOLVE
  config:
    tool: result_ok
    backend: kernel
    arguments:
    - '@solution'
    code: |
      import json

      def result_ok(result_json: str) -> bool:
          """RESULT_OK(result_json) — ASSERT gate: True only when result_json's
          'status' field is exactly "OK"."""
          try:
              return json.loads(result_json).get('status') == 'OK'
          except Exception:
              return False
      _spl_result = result_ok(solution)
    result: _spl_result
    out_type: BOOL
    tool_params:
    - result_json
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_solution
  - out_tool_10
- id: assert_1
  type: ASSERT
  config:
    condition: '@in_tool_10'
  ports:
  - trigger
  - pass
  - fail
  - in_solution
  - in_tool_10
- id: gen_4
  type: GENERATE
  config:
    function: interpret_conservation_result
    params:
    - problem
    - solution_json
    prompt_inline: |-
      You are a physicist. Interpret this VERIFIED, conservation-checked
      collision result for a general audience.

      Problem: {{in_problem}}

      Verified result (JSON, independently recomputed to confirm momentum
      and, if applicable, kinetic energy are conserved — trust it completely,
      do not re-derive it):
      {{in_solution_json}}

      Provide a concise interpretation (under 100 words):
      1. Restate what the problem asks
      2. State object 1's final velocity, referencing the exact value from the JSON
      3. One sentence confirming which conservation law(s) were verified

      End your response with a line in EXACTLY this format (no extra words,
      number only, no unit):
      Final answer: <value>
    arguments:
    - '@problem'
    - '@solution'
  ports:
  - trigger
  - complete
  - in_problem
  - in_solution_json
  - out_narrative
- id: tool_11
  type: SOLVE
  config:
    tool: classify_roundtrip
    backend: kernel
    arguments:
    - '@narrative'
    - '@solution'
    code: |
      def classify_roundtrip(narrative: str, result_json: str) -> str:
          """Round-trip check: does the LLM's own 'Final answer: ...' line, in
          its narration of the VERIFIED conserved result, match the ground-truth
          final velocity of object 1 (within 0.5% relative tolerance)?

          Returns 'match' / 'mismatch' / 'unverifiable'.
          """
          import re
          import json
          m = re.search(r'final answer\s*:?\s*(.+)', narrative, re.IGNORECASE)
          if not m:
              return "unverifiable"
          llm_val = m.group(1).strip().rstrip('.').lower()
          try:
              truth = json.loads(result_json).get("answer")
          except Exception:
              return "unverifiable"
          if truth is None:
              return "unverifiable"

          def _num(s):
              try:
                  return float(re.sub(r'[^0-9.\-]', '', str(s)))
              except Exception:
                  return None

          ln, tn = _num(llm_val), _num(truth)
          if ln is None or tn is None:
              return "unverifiable"
          if tn == 0:
              return "match" if abs(ln) < 1e-6 else "mismatch"
          rel_err = abs(ln - tn) / abs(tn)
          return "match" if rel_err < 0.005 else "mismatch"
      _spl_result = classify_roundtrip(narrative, solution)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - narrative
    - result_json
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_narrative
  - in_solution
  - out_roundtrip
- id: tool_12
  type: SOLVE
  config:
    tool: format_report
    backend: kernel
    arguments:
    - '@problem'
    - '@code'
    - '@solution'
    - '@narrative'
    - '@roundtrip'
    code: |
      def format_report(problem: str, code: str, solution_json: str,
                        narrative: str, roundtrip: str) -> str:
          import json
          try:
              sol = json.loads(solution_json)
          except Exception:
              sol = {}
          lines = [
              "# Physics Conservation Check Report",
              "",
              f"**Problem:** {problem.strip()}",
              "",
              f"**Verifier status:** `{sol.get('status', 'Unknown')}`",
              f"**Final velocity (object 1):** `{sol.get('answer', '?')} {sol.get('unit', '')}`",
              f"**Momentum conserved:** `{sol.get('momentum_conserved', '?')}` "
              f"({sol.get('p_before', '?')} -> {sol.get('p_after', '?')})",
              f"**Energy conserved:** `{sol.get('energy_conserved', '?')}` "
              f"({sol.get('ke_before', '?')} -> {sol.get('ke_after', '?')})",
              f"**Round-trip check:** `{roundtrip}`",
              "",
              "## Interpretation", "", narrative.strip(),
              "", "## Solver Code (LLM-generated, NumPy)", "",
              "```python", code.strip(), "```",
          ]
          return "\n".join(lines)
      _spl_result = format_report(problem, code, solution, narrative, roundtrip)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - problem
    - code
    - solution_json
    - narrative
    - roundtrip
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_problem
  - in_code
  - in_solution
  - in_narrative
  - in_roundtrip
  - out_report
- id: tool_13
  type: SOLVE
  config:
    tool: write_file
    backend: kernel
    arguments:
    - f'{@out_dir}/physics_{@ts_safe}.md'
    - '@report'
    code: |
      import pathlib

      def write_file(file_path: str, content: str, mode: str='w') -> str:
          """WRITE_FILE(file_path, content [, mode]) — write text to a file.

          mode: 'w' (overwrite, default) or 'a' (append).
          Creates parent directories automatically.
          Returns the absolute path written.
          """
          p = pathlib.Path(str(file_path).strip())
          p.parent.mkdir(parents=True, exist_ok=True)
          m = str(mode).strip().lower()
          if m not in ('w', 'a'):
              m = 'w'
          with p.open(m, encoding='utf-8') as fh:
              fh.write(str(content))
          return str(p.resolve())
      _spl_result = write_file(f'{out_dir}/physics_{ts_safe}.md', report)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - file_path
    - content
    - mode
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_out_dir
  - in_ts_safe
  - in_report
  - out_out_path
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_report
