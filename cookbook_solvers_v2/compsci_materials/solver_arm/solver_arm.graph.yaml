      - id: set_9
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      edges:
      - source: eval_3.pass
        target: set_7.trigger
        type: triggers
      - source: eval_3.fail
        target: eval_4.trigger
        type: triggers
      - source: eval_4.pass
        target: gen_2.trigger
        type: triggers
      - source: gen_2.complete
        target: tool_5.trigger
        type: triggers
      - source: gen_2.out_code
        target: tool_5.in_code
        type: binds
      - source: tool_5.complete
        target: tool_6.trigger
        type: triggers
      - source: tool_5.out_solution
        target: tool_6.in_solution
        type: binds
      - source: tool_6.complete
        target: set_8.trigger
        type: triggers
      - source: eval_4.fail
        target: tool_7.trigger
        type: triggers
      - source: tool_7.complete
        target: gen_3.trigger
        type: triggers
      - source: tool_7.out_error_info
        target: gen_3.in_error_info
        type: binds
      - source: gen_3.complete
        target: tool_8.trigger
        type: triggers
      - source: gen_3.out_code
        target: tool_8.in_code
        type: binds
      - source: tool_8.complete
        target: tool_9.trigger
        type: triggers
      - source: tool_8.out_solution
        target: tool_9.in_solution
        type: binds
      - source: tool_9.complete
        target: set_9.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_status
  - in_max_tries
  - in_problem
  - in_tries
  - in_solution
  - in_code
  - out_tries
  - out_code
  - out_solution
  - out_status
  - out_error_info
- id: tool_10
  type: SOLVE
  config:
    tool: result_ok
    backend: kernel
    arguments:
    - '@solution'
    code: |
      import json

      def result_ok(result_json: str) -> bool:
          """RESULT_OK(result_json) — ASSERT gate: True only when result_json's
          'status' field is exactly "OK"."""
          try:
              return json.loads(result_json).get('status') == 'OK'
          except Exception:
              return False
      _spl_result = result_ok(solution)
    result: _spl_result
    out_type: BOOL
    tool_params:
    - result_json
    tool_returns: TEXT
    tool_builtin: true
  ports:
  - trigger
  - complete
  - in_solution
  - out_tool_10
- id: assert_1
  type: ASSERT
  config:
    condition: '@in_tool_10'
  ports:
  - trigger
  - pass
  - fail
  - in_solution
  - in_tool_10
- id: gen_4
  type: GENERATE
  config:
    function: interpret_materials_result
    params:
    - problem
    - solution_json
    prompt_inline: |-
      You are a materials scientist. Interpret this VERIFIED crystal-structure
      result for a general audience.

      Problem: {{in_problem}}

      Verified result (JSON, independently confirmed: the claimed crystal
      system''s symmetry constraints hold, and the density was independently
      recomputed from the raw lattice parameters — trust it completely, do
      not re-derive it):
      {{in_solution_json}}

      Provide a concise interpretation (under 100 words):
      1. Restate the crystal system and unit-cell volume
      2. State the theoretical density, referencing the exact value from the JSON
      3. One sentence on why this cross-check (symmetry + independent
         density recomputation) matters for materials data quality

      End your response with a line in EXACTLY this format (no extra words,
      number only, no unit):
      Final answer: <value>
    arguments:
    - '@problem'
    - '@solution'
  ports:
  - trigger
  - complete
  - in_problem
  - in_solution_json
  - out_narrative
- id: tool_11
  type: SOLVE
  config:
    tool: classify_roundtrip
    backend: kernel
    arguments:
    - '@narrative'
    - '@solution'
    code: |
      def classify_roundtrip(narrative: str, result_json: str) -> str:
          """Round-trip check: does the LLM's own 'Final answer: ...' line, in
          its narration of the VERIFIED result, match the ground-truth
          theoretical density (within 1% relative tolerance)?

          Returns 'match' / 'mismatch' / 'unverifiable'.
          """
          import re
          import json
          m = re.search(r'final answer\s*:?\s*(.+)', narrative, re.IGNORECASE)
          if not m:
              return "unverifiable"
          llm_val = m.group(1).strip().rstrip('.').lower()
          try:
              truth = json.loads(result_json).get("answer")
          except Exception:
              return "unverifiable"
          if truth is None:
              return "unverifiable"

          def _num(s):
              try:
                  return float(re.sub(r'[^0-9.\-]', '', str(s)))
              except Exception:
                  return None

          ln, tn = _num(llm_val), _num(truth)
          if ln is None or tn is None:
              return "unverifiable"
          if tn == 0:
              return "match" if abs(ln) < 1e-6 else "mismatch"
          rel_err = abs(ln - tn) / abs(tn)
          return "match" if rel_err < 0.01 else "mismatch"
      _spl_result = classify_roundtrip(narrative, solution)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - narrative
    - result_json
    tool_returns: TEXT
  ports:
  - trigger
  - complete
  - in_narrative
  - in_solution
  - out_roundtrip
- id: tool_12
  type: SOLVE
  config:
    tool: format_report
    backend: kernel
    arguments:
    - '@problem'
    - '@code'
    - '@solution'
    - '@narrative'
    - '@roundtrip'
    code: |
      def format_report(problem: str, code: str, solution_json: str,
                        narrative: str, roundtrip: str) -> str:
          import json
          try:
              sol = json.loads(solution_json)
          except Exception:
              sol = {}
          lines = [
              "# Crystal Structure Check Report",
              "",
              f"**Problem:** {problem.strip()}",
              "",
              f"**Verifier status:** `{sol.get('status', 'Unknown')}`",
              f"**Theoretical density:** `{sol.get('answer', '?')} {sol.get('unit', '')}`",
              f"**Crystal system:** `{sol.get('system', '?')}` "
              f"(symmetry_ok={sol.get('symmetry_ok', '?')})",
              f"**Unit cell volume:** `{sol.get('volume_ang3', '?')} Å³`",
              f"**Round-trip check:** `{roundtrip}`",
              "",
              "## Interpretation", "", narrative.strip(),
              "", "## Solver Code (LLM-generated, Python)", "",
              "```python", code.strip(), "```",
          ]
          return "\n".join(lines)
      _spl_result = format_report(problem, code, solution, narrative, roundtrip)
    result: _spl_result
    out_type: TEXT
