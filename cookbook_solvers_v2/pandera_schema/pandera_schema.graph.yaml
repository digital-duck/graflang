version: 1.0-graph
workflow:
  name: pandera_schema
  inputs:
  - name: schema_description
    type: TEXT
    default: 'Employee payroll CSV: 200 rows, columns employee_id (int), name (str), department (str), salary (float), hire_year (int). Imported from HR system monthly export.'
  - name: data_csv
    type: TEXT
    default: demo
  - name: use_solver
    type: TEXT
    default: 'true'
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    prepare: ./prepare/prepare.graph.yaml
    solver_arm: ./solver_arm/solver_arm.graph.yaml
    llm_only: ./llm_only/llm_only.graph.yaml
steps:
- prepare:
    use: parts.prepare
    in:
      use_solver: $in.use_solver
    out:
    - use_solver
    - schema_json
- solver_on:
    evaluate: |-
      @in_use_solver == 'true'
    in:
      use_solver: prepare
    out: []
    branch: 1
- solver_arm:
    use: parts.solver_arm
    in:
      schema_json: prepare.schema_json
      data_csv: $in.data_csv
    out: report
- solver_off:
    evaluate: |-
      @in_use_solver == 'false'
    in:
      use_solver: prepare
    out: []
    'on': solver_on.fail
    branch: 2
- llm_only:
    use: parts.llm_only
    in:
      schema_description: $in.schema_description
    out: report
- wf_exit:
    output:
    - solver_arm
    - llm_only
    'on':
    - solver_off.fail
    - solver_arm
    - llm_only
