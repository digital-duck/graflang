version: 1.0-graph
workflow:
  name: code_pytest
  inputs:
  - name: spec
    type: TEXT
    default: Write a Python function merge_sorted(a, b) that merges two sorted lists into one sorted list without using sorted() or list.sort(). Both input lists contain integers and are already sorted ascending. The function must run in O(n+m) time.
  - name: max_tries
    type: INTEGER
    default: 3
  - name: out_dir
    type: TEXT
    default: ./cookbook/79_code_pytest/output
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    drafts: ./drafts/drafts.graph.yaml
    repair: ./repair/repair.graph.yaml
steps:
- time_monotonic:
    node: SOLVE
    out: t_start
    tool: time_monotonic
    backend: kernel
    arguments: []
    code: |
      def time_monotonic() -> str:
          """TIME_MONOTONIC() — current value of a monotonic clock, as a string.
          Pair with time_elapsed() to measure elapsed wall-clock time."""
          import time as _time
          return str(_time.monotonic())
      _spl_result = time_monotonic()
    result: _spl_result
    out_type: TEXT
    tool_params: []
    tool_returns: TEXT
    tool_builtin: true
- time_now:
    node: SOLVE
    out: ts_safe
    tool: time_now
    backend: kernel
    arguments: []
    code: |
      import datetime

      def time_now() -> str:
          """TIME_NOW() — current local time as a filesystem-safe string:
          YYYY-MM-DD_HH-MM-SS."""
          return datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
      _spl_result = time_now()
    result: _spl_result
    out_type: TEXT
    tool_params: []
    tool_returns: TEXT
    tool_builtin: true
- drafts:
    use: parts.drafts
    in:
      spec: $in.spec
    out:
    - code
    - tests
- repair:
    use: parts.repair
    in:
      max_tries: $in.max_tries
      spec: $in.spec
      out_dir: $in.out_dir
      ts_safe: time_now
      code: drafts
      tests: drafts.tests
    out: report
- time_elapsed:
    node: SOLVE
    in:
      t_start: time_monotonic
    out: elapsed
    tool: time_elapsed
    backend: kernel
    arguments:
    - |-
      @t_start
    code: |
      def time_elapsed(start_ts: str) -> str:
          """TIME_ELAPSED(start_ts) — seconds elapsed since start_ts (a monotonic
          float string from time_monotonic())."""
          import time as _time
          try:
              return f'{_time.monotonic() - float(start_ts):.1f}'
          except Exception:
              return '?'
      _spl_result = time_elapsed(t_start)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - start_ts
    tool_returns: TEXT
    tool_builtin: true
- wf_exit:
    output: repair
