version: 1.0-graph
workflow:
  name: shapely_geo
  inputs:
  - name: zones_description
    type: TEXT
    default: Maplewood city has 3 delivery zones. Zone A (North, Alice) covers the upper-left. Zone B (South-West, Bob) covers the lower-left. Zone C (East, Carol) covers the right side. The zones appear to cover most of the city but there may be overlaps and gaps near the northeast corner.
  - name: use_solver
    type: TEXT
    default: 'true'
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    prepare: ./prepare/prepare.graph.yaml
    solver_arm: ./solver_arm/solver_arm.graph.yaml
    llm_only: ./llm_only/llm_only.graph.yaml
steps:
- prepare:
    use: parts.prepare
    in:
      use_solver: $in.use_solver
    out:
    - use_solver
    - zones_json
- solver_on:
    evaluate: |-
      @in_use_solver == 'true'
    in:
      use_solver: prepare
    out: []
    branch: 1
- solver_arm:
    use: parts.solver_arm
    in:
      zones_json: prepare.zones_json
      zones_description: $in.zones_description
    out: report
- solver_off:
    evaluate: |-
      @in_use_solver == 'false'
    in:
      use_solver: prepare
    out: []
    'on': solver_on.fail
    branch: 2
- llm_only:
    use: parts.llm_only
    in:
      zones_description: $in.zones_description
    out: report
- wf_exit:
    output:
    - solver_arm
    - llm_only
    'on':
    - solver_off.fail
    - solver_arm
    - llm_only
