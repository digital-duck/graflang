version: 1.0-graph
workflow:
  name: data_quality
  inputs:
  - name: data_description
    type: TEXT
    default: 'Sales transactions dataset: 500 rows, columns transaction_id, amount, customer_id, region, date. Data imported from POS systems across 4 regions over the past 6 months.'
  - name: data_csv
    type: TEXT
    default: demo
  - name: use_solver
    type: TEXT
    default: 'true'
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    prepare: ./prepare/prepare.graph.yaml
    solver_arm: ./solver_arm/solver_arm.graph.yaml
    llm_only: ./llm_only/llm_only.graph.yaml
steps:
- prepare:
    use: parts.prepare
    in:
      use_solver: $in.use_solver
    out:
    - use_solver
    - suite_json
- solver_on:
    evaluate: |-
      @in_use_solver == 'true'
    in:
      use_solver: prepare
    out: []
    branch: 1
- solver_arm:
    use: parts.solver_arm
    in:
      suite_json: prepare.suite_json
      data_csv: $in.data_csv
      data_description: $in.data_description
    out: report
- solver_off:
    evaluate: |-
      @in_use_solver == 'false'
    in:
      use_solver: prepare
    out: []
    'on': solver_on.fail
    branch: 2
- llm_only:
    use: parts.llm_only
    in:
      data_description: $in.data_description
    out: report
- wf_exit:
    output:
    - solver_arm
    - llm_only
    'on':
    - solver_off.fail
    - solver_arm
    - llm_only
