- explain_sp_result:
    generate: |-
      You are an operations research analyst explaining two-stage stochastic programming to a business audience.

      PROBLEM:
      {{in_problem_description}}

      SOLVER RESULT:
      {{in_sp_report}}

      Explain (≤200 words):
      1. What does "two-stage stochastic programming" mean in plain terms for this inventory problem?
      2. Why did the solver choose Q=200 rather than the expected demand of 190?
         (Hint: explain the critical ratio and asymmetric costs.)
      3. What is the Value of the Stochastic Solution (VSS), and what does it tell managers?
      4. Where else does this "decide now, adapt later" pattern apply?
         (e.g., energy dispatch, clinical trials, financial hedging)
    in:
      sp_report: format_sp_report
      problem_description: $in.problem_description
    out: explanation
    function: explain_sp_result_prompt
    params:
    - sp_report
    - problem_description
    arguments:
    - '@sp_report'
    - '@problem_description'
- format_report_solver_on:
    node: SOLVE
    in:
      sp_report: format_sp_report
      explanation: explain_sp_result
    out: report
    tool: format_report_solver_on
    backend: kernel
    arguments:
    - '@sp_report'
    - '@explanation'
    code: |
      def format_report_solver_on(sp_report: str, explanation: str) -> str:
          return f'=== Two-Stage Stochastic Programming (r117) | solver=ON ===\n\n{sp_report}\n\n── Operations Research Explanation ─────────────────────────\n{explanation}'
      _spl_result = format_report_solver_on(sp_report, explanation)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - sp_report
    - explanation
    tool_returns: TEXT
- wf_exit:
    output: format_report_solver_on
