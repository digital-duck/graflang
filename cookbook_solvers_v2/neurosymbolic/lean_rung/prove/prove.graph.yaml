        - set_28.out_check_code
      proof_ok:
        from:
        - tool_23.out_proof_ok
        - tool_28.out_proof_ok
      lean_feedback:
        from:
        - tool_24.out_lean_feedback
        - tool_29.out_lean_feedback
      proof_ok_lc:
        from:
        - tool_25.out_proof_ok_lc
        - tool_30.out_proof_ok_lc
    subgraph:
      nodes:
      - id: eval_10
        type: EVALUATE
        config:
          condition: "@in_proof_ok_lc == 'true'"
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_proof_ok_lc
      - id: set_25
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      - id: eval_11
        type: EVALUATE
        config:
          condition: "@in_proof_ok_lc == 'init'"
          branch: 2
        ports:
        - trigger
        - pass
        - fail
        - in_proof_ok_lc
      - id: gen_5
        type: GENERATE
        config:
          function: write_tactics
          params:
          - lean_stmt
          prompt_inline: |-
            Write a Lean 4 tactic proof for this proposition. Mathlib IS imported.

              {{in_lean_stmt}}

            Rules:
            - Output ONLY the tactic script — what goes after `:= by`. No fences,
              no commentary, no restatement of the proposition, nothing after the
              final tactic.
            - Mathlib tactics are available: simp, ring, linarith, nlinarith,
              norm_num, positivity, omega, decide, aesop, field_simp, plus core
              intro, induction, cases, calc, exact.
            - Prefer closing with a named mathlib lemma via `exact` when one fits
              (e.g. `exact sq_nonneg a`, `exact abs_add a b`).
            - Example output for `∀ a : ℝ, 0 ≤ a ^ 2`:  intro a; positivity
          arguments:
          - '@lean_stmt'
        ports:
        - trigger
        - complete
        - in_lean_stmt
        - out_tactics_raw
      - id: tool_21
        type: SOLVE
        config:
          tool: strip_fences
          backend: kernel
          arguments:
          - '@tactics_raw'
          code: |
            def strip_fences(text: str) -> str:
                """Remove markdown code fences and surrounding noise from LLM output."""
                import re
                s = text.strip()
                # Case 1: entire output wrapped in a single fence block (``` or ~~~, any lang tag)
                m = re.match(r'^(?:```|~~~)[^\n]*\n(.*?)\n?(?:```|~~~)\s*$', s, re.DOTALL)
                if m:
                    s = m.group(1)
                else:
                    # Case 2: stray fence lines scattered through otherwise plain output
                    s = re.sub(r'^(?:```|~~~)[^\n]*$', '', s, flags=re.MULTILINE)
                    s = re.sub(r'\n{2,}', '\n', s)  # collapse blank lines left by removed fences
                return s.strip().replace("'''", "")
            _spl_result = strip_fences(tactics_raw)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - text
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_tactics_raw
        - out_tactics
      - id: tool_22
        type: SOLVE
        config:
          tool: make_theorem
          backend: kernel
          arguments:
          - '@lean_stmt'
          - '@tactics'
          code: |
            def make_theorem(stmt: str, tactics: str) -> str:
                """Assemble the final theorem deterministically: the verified statement
                is spliced in verbatim — the LLM only ever contributes the tactic block,
                so it can never prove a subtly different statement (recipe 67's lesson)."""
                body = tactics.strip()
                if body.startswith(":="):
                    body = body[2:].strip()
                if body == "by" or body.startswith(("by\n", "by ")):
                    body = body[2:].strip()
                return f"theorem spl_claim : {stmt} := by\n  {body}"
            _spl_result = make_theorem(lean_stmt, tactics)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - stmt
          - tactics
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_lean_stmt
        - in_tactics
        - out_proof
      - id: set_26
        type: CONTEXT
        config:
          action: set
          expression: f"print(_spl_lean.check(r'''{@in_proof}''')['ok'])"
        ports:
        - trigger
        - complete
        - in_proof
        - out_check_code
      - id: tool_23
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - '@check_code'
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python(check_code)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_check_code
        - out_proof_ok
      - id: tool_24
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - "'print(_spl_lean.feedback)'"
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python('print(_spl_lean.feedback)')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - out_lean_feedback
      - id: tool_25
        type: SOLVE
        config:
          tool: lower
          backend: kernel
          arguments:
          - '@proof_ok'
          code: |
            def lower(value: str) -> str:
                """LOWER(value) — convert to lowercase."""
                return str(value).lower()
            _spl_result = lower(proof_ok)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_proof_ok
        - out_proof_ok_lc
      - id: set_27
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      - id: gen_6
        type: GENERATE
        config:
          function: repair_tactics
          params:
          - lean_stmt
          - tactics
          - feedback
          prompt_inline: |-
            This Lean 4 tactic proof failed. Mathlib IS imported.

            Proposition: {{in_lean_stmt}}
