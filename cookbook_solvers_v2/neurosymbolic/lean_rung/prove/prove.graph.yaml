  name: prove
  inputs:
  - name: max_tries
    type: INT
  - name: lean_stmt
    type: TEXT
  - name: tactics
    type: TEXT
  - name: lean_feedback
    type: TEXT
  - name: proof
    type: TEXT
  - name: check_code
    type: TEXT
  - name: proof_ok_lc
    type: TEXT
  - name: prove_loop_proof_ok_lc
    type: TEXT
  - name: prove_loop_tactics
    type: TEXT
  - name: prove_loop_lean_feedback
    type: TEXT
  - name: prove_loop_proof
    type: TEXT
  - name: prove_loop_check_code
    type: TEXT
  - name: proof_ok
    type: TEXT
  outputs:
  - name: proof
    type: TEXT
  - name: set_proof_2_proof
    type: TEXT
  - name: badge
    type: TEXT
steps:
- set_tries_2:
    node: CONTEXT
    out: tries
    action: set
    expression: '0'
- set_badge_4:
    node: CONTEXT
    out: badge
    on: []
    action: set
    expression: "'machine_proved'"
- set_proof_2:
    node: CONTEXT
    out: proof
    on: []
    action: set
    expression: "''"
nodes:
- id: prove_loop
  type: LOOP
  config:
    condition: latest(@in_tries, @tries) < @in_max_tries
    state:
      tries:
        from:
        - set_25.out_tries
        - set_27.out_tries
        - set_29.out_tries
      tactics_raw:
        from:
        - gen_5.out_tactics_raw
        - gen_6.out_tactics_raw
      tactics:
        from:
        - tool_21.out_tactics
        - tool_26.out_tactics
      proof:
        from:
        - tool_22.out_proof
        - tool_27.out_proof
      check_code:
