version: 1.0-graph
workflow:
  name: sympy_llm_v2_prepare
  inputs:
  - name: enable_solver
    type: TEXT
  outputs:
  - name: use_solver
    type: TEXT
  - name: set_use_solver_2_use_solver
    type: TEXT
steps:
- lower:
    node: SOLVE
    in:
      enable_solver: $in.enable_solver
    out: solver_mode
    tool: lower
    backend: kernel
    arguments:
    - '@enable_solver'
    code: |
      def lower(value: str) -> str:
          """LOWER(value) — convert to lowercase."""
          return str(value).lower()
      _spl_result = lower(enable_solver)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - value
    tool_returns: TEXT
    tool_builtin: true
- solver_on:
    evaluate: >-
      (@in_solver_mode == 'true' OR @in_solver_mode == '1' OR @in_solver_mode
      == 'yes')
    in:
      solver_mode: lower
    out: []
    branch: 1
- set_use_solver:
    node: CONTEXT
    out: use_solver
    action: set
    expression: "'yes'"
- set_use_solver_2:
    node: CONTEXT
    out: use_solver
    on: solver_on.fail
    action: set
    expression: "'no'"
- wf_exit:
    output:
      use_solver: set_use_solver
      set_use_solver_2_use_solver: set_use_solver_2
    on:
    - set_use_solver
    - set_use_solver_2
