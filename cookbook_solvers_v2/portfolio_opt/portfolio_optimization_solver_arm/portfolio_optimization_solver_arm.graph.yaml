- allocate_capital:
    node: SOLVE
    in:
      optimization_json:
      - optimize_by_algorithm
      - optimize_by_algorithm_2
      capital: $in.capital
    out: allocation_json
    on:
    - set_opt_status
    - assert_is_optimized
    - assert_is_optimized.fail
    tool: allocate_capital
    backend: kernel
    arguments:
    - '@optimization_json'
    - '@capital'
    code: |
      import json

      def allocate_capital(optimization_json: str, capital: float) -> str:
          """
          Convert optimal weights to dollar allocations for a given capital amount.
          Returns JSON: {tickers: [{ticker, weight_pct, dollars, shares_approx}], total}
          """
          capital = float(capital)
          try:
              data = json.loads(optimization_json)
              weights = data.get('weights', {})
              if not weights:
                  return json.dumps({'error': 'no weights in optimization result'})
              allocations = []
              for ticker, weight in sorted(weights.items(), key=lambda x: -x[1]):
                  dollars = round(weight * capital, 2)
                  allocations.append({'ticker': ticker, 'weight_pct': round(weight * 100, 2), 'dollars': dollars})
              return json.dumps({'capital': capital, 'allocations': allocations, 'expected_annual_return': data.get('expected_return'), 'annual_volatility': data.get('annual_volatility'), 'sharpe_ratio': data.get('sharpe_ratio')})
          except Exception as e:
              return json.dumps({'error': str(e)})
      _spl_result = allocate_capital(optimization_json, capital)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - optimization_json
    - capital
    tool_returns: TEXT
