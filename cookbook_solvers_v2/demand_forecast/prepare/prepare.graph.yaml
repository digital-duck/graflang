version: 1.0-graph
workflow:
  name: prepare
  inputs:
  - name: use_solver
    type: TEXT
  outputs:
  - name: use_solver
    type: TEXT
  - name: default_problem_json
    type: TEXT
  - name: llm_calls
    type: TEXT
steps:
- set_verify_status:
    node: CONTEXT
    out: verify_status
    action: set
    expression: "'N/A'"
- set_forecast_json:
    node: CONTEXT
    out: forecast_json
    action: set
    expression: "'{}'"
- set_llm_calls:
    node: CONTEXT
    out: llm_calls
    action: set
    expression: '0'
- normalize_bool:
    node: SOLVE
    in:
      use_solver: $in.use_solver
    out: use_solver
    tool: normalize_bool
    backend: kernel
    arguments:
    - '@use_solver'
    code: |
      def _coerce_bool(value: str) -> str:
          s = str(value).strip()
          if not s:
              return 'false'
          try:
              return 'true' if float(s) != 0 else 'false'
          except ValueError:
              pass
          if s.lower() in ('false', 'no', 'off'):
              return 'false'
          return 'true'

      def normalize_bool(value: str) -> str:
          """NORMALIZE_BOOL(value) — same logic as to_bool; purpose-named for --param flags.
          Accepts any truthy/falsy representation: 'ON', 'YES', '1', '2', 'true' → 'true';
          '0', 'OFF', 'NO', 'false', '' → 'false'.
          """
          return _coerce_bool(value)
      _spl_result = normalize_bool(use_solver)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - value
    tool_returns: TEXT
    tool_builtin: true
- get_default_problem:
    node: SOLVE
    out: default_problem_json
    tool: get_default_problem
    backend: kernel
    arguments: []
    code: |
      import json

      _DEFAULT_PROBLEM = {'description': 'Monthly widget sales — 3 years of historical data with upward trend and Q4 seasonal spike', 'frequency': 'monthly', 'seasonal_period': 12, 'history': [95, 90, 102, 108, 112, 115, 118, 120, 115, 112, 135, 152, 102, 97, 110, 116, 120, 124, 127, 129, 124, 121, 145, 164, 109, 104, 118, 125, 129, 133, 137, 139, 133, 130, 156, 176]}

      def get_default_problem() -> str:
          return json.dumps(_DEFAULT_PROBLEM)
      _spl_result = get_default_problem()
    result: _spl_result
    out_type: TEXT
    tool_params: []
    tool_returns: TEXT
- wf_exit:
    output:
      use_solver: normalize_bool
      default_problem_json: get_default_problem
      llm_calls: set_llm_calls
