                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(result_json, 'vss')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
- explain_ph_result:
    generate: |-
      You are a stochastic optimization researcher explaining Progressive Hedging.

      PROBLEM:
      {{in_problem_description}}

      PH RESULT:
      {{in_ph_report}}

      Explain (≤200 words):
      1. What is non-anticipativity and why must a two-stage stochastic program enforce it?
         (Stage 1 decisions must be made before observing which scenario occurs.)
      2. How does Progressive Hedging enforce non-anticipativity via a penalty term ρ?
         What happens to individual scenario solutions as ρ → ∞?
      3. What is the Value of Stochastic Solution (VSS) shown in the report?
         What does it mean economically for battery investment decisions?
      4. When would you use PH decomposition vs. solving the full extensive form directly?
         (Hint: memory, parallelism, number of scenarios)
    in:
      ph_report: format_ph_report
      problem_description: $in.problem_description
    out: explanation
    function: explain_ph_result_prompt
    params:
    - ph_report
    - problem_description
    arguments:
    - '@ph_report'
    - '@problem_description'
- format_report_solver_on:
    node: SOLVE
    in:
      ph_report: format_ph_report
      explanation: explain_ph_result
    out: report
    tool: format_report_solver_on
    backend: kernel
    arguments:
    - '@ph_report'
    - '@explanation'
    code: |
      def format_report_solver_on(ph_report: str, explanation: str) -> str:
          return f'=== Progressive Hedging — Battery Storage (r125) | solver=ON ===\n\n{ph_report}\n\n── Analyst Explanation ─────────────────────────────────────\n{explanation}'
      _spl_result = format_report_solver_on(ph_report, explanation)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - ph_report
    - explanation
    tool_returns: TEXT
- wf_exit:
    output: format_report_solver_on
