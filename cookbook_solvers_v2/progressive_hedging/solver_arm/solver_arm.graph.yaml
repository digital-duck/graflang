version: 1.0-graph
workflow:
  name: solver_arm
  inputs:
  - name: problem_json
    type: TEXT
  - name: problem_description
    type: TEXT
  outputs:
  - name: report
    type: TEXT
steps:
- solve_with_ph:
    node: SOLVE
    in:
      problem_json: $in.problem_json
    out: result_json
    tool: solve_with_ph
    backend: kernel
    arguments:
    - '@problem_json'
    code: |
      import json

      import time

      from concurrent.futures import ThreadPoolExecutor

      _INVESTMENT = {'capital_cost_per_MW': 8000, 'max_capacity_MW': 100.0, 'charge_efficiency': 0.92, 'discharge_efficiency': 0.92, 'max_cycles_per_day': 2.0}

      _N_HOURS = 24

      def solve_with_ph(problem_json: str) -> str:
          """Progressive Hedging decomposition across all scenarios.

          Implements the standard PH algorithm:
            1. Initialize: solve each scenario independently (x0_s = optimal Stage1_s)
            2. Average: x_bar = weighted mean of all x0_s
            3. Update multipliers: w_s += rho * (x_s - x_bar)
            4. Re-solve each scenario with augmented Lagrangian penalty
            5. Repeat until max |x_s - x_bar| < tolerance

          Returns: rp_cost (recourse problem), ev_cost, vss, capacity_MW, convergence.
          """
          try:
              from scipy.optimize import minimize_scalar as _
          except ImportError:
              return json.dumps({'status': 'ERROR', 'error': 'scipy not installed — pip install scipy'})
          pyo = None
          p = json.loads(problem_json)
          scenarios = p['scenarios']
          inv = _INVESTMENT
          rho = inv['capital_cost_per_MW'] / 250.0 * 5.0
          max_iter = 30
          tol = 0.5
          t0 = time.time()
          x = [_solve_scenario_subproblem(sc, inv, x_bar=None, w_s=0.0, rho=rho, pyo=pyo) for sc in scenarios]
          capacities = [xi['capacity_MW'] for xi in x]
          w = [0.0] * len(scenarios)
          primal_residual = float('inf')
          iter_count = 0
          for iteration in range(max_iter):
              x_bar = sum(capacities) / len(capacities)
              for s in range(len(scenarios)):
                  w[s] += rho * (capacities[s] - x_bar)
              primal_residual = max((abs(capacities[s] - x_bar) for s in range(len(scenarios))))
              iter_count = iteration + 1
              if primal_residual < tol:
                  break

              def solve_s(args):
                  s_idx, sc, ws = args
                  result = _solve_scenario_subproblem(sc, inv, x_bar=x_bar, w_s=ws, rho=rho, pyo=pyo)
                  return (s_idx, result)
              with ThreadPoolExecutor(max_workers=4) as pool:
                  results = list(pool.map(solve_s, [(s, scenarios[s], w[s]) for s in range(len(scenarios))]))
              for s_idx, result in results:
                  capacities[s_idx] = result['capacity_MW']
                  x[s_idx] = result
          x_bar_final = sum(capacities) / len(capacities)
          final_capacity = x_bar_final if primal_residual < tol * 10 else x_bar_final
          rp_daily_op = sum((sc['probability'] * _compute_scenario_cost(sc, inv, final_capacity) for sc in scenarios))
          capital = inv['capital_cost_per_MW'] * final_capacity
          rp_total = round(rp_daily_op * 250 + capital, 0)
          ev_capacity, ev_total_cost = _solve_ev_policy(scenarios, inv)
          ev_total = round(ev_total_cost, 0)
          vss = round(ev_total - rp_total, 0)
          return json.dumps({'status': 'OK', 'converged': primal_residual < tol * 10, 'primal_residual_MW': round(primal_residual, 2), 'ph_iterations': iter_count, 'capacity_MW': round(final_capacity, 1), 'rp_cost': rp_total, 'ev_cost': ev_total, 'vss': vss, 'capital_cost': round(capital, 0), 'solve_time_sec': round(time.time() - t0, 1), 'n_scenarios': len(scenarios), 'ev_capacity_MW': round(ev_capacity, 1)})

      def _solve_scenario_subproblem(sc: dict, inv: dict, x_bar, w_s: float, rho: float, pyo) -> dict:
          """Solve one scenario's subproblem with PH augmented Lagrangian.

          Uses scipy linprog (LP) directly — avoids Pyomo/HiGHS thread-safety issues.
          The inner battery dispatch problem is a linear program (given cap is fixed).
          We solve: min_{cap} [daily_cap_cost * cap + PH_penalty(cap) - R*(cap)]
          where R*(cap) = optimal revenue at fixed capacity, solved analytically via
          greedy merit-order dispatch (linear in cap, so R*(cap) = r_rate * cap).
          """
          from scipy.optimize import minimize_scalar
          prices = sc['price_per_MWh']
          cap_cost_daily = inv['capital_cost_per_MW'] / 250.0
          max_cap = inv['max_capacity_MW']
          eff_c = inv['charge_efficiency']
          eff_d = inv['discharge_efficiency']
          sorted_asc = sorted(prices)
          sorted_desc = sorted(prices, reverse=True)
          rev_rate = 0.0
          T = len(prices)
          n_hours = min(T // 2, 12)
          for i in range(n_hours):
              buy_price = sorted_asc[i]
              sell_price = sorted_desc[i]
              cycle_spread = eff_c * eff_d * sell_price - buy_price
              if cycle_spread > 0:
                  rev_rate += cycle_spread
          lin_coeff = cap_cost_daily - rev_rate + (w_s if x_bar is not None else 0.0)
          quad_coeff = rho / 2.0 if x_bar is not None else 0.0
          x_bar_val = x_bar if x_bar is not None else 0.0
          if quad_coeff > 0:

              def obj_fn(cap):
                  return lin_coeff * cap + quad_coeff * (cap - x_bar_val) ** 2
              res = minimize_scalar(obj_fn, bounds=(0.0, max_cap), method='bounded')
              cap_val = float(res.x)
          else:
              cap_val = 0.0 if lin_coeff >= 0 else max_cap
          return {'capacity_MW': round(max(0.0, min(max_cap, cap_val)), 2), 'scenario_id': sc['id']}

      def _rev_rate(prices: list, eff_c: float, eff_d: float) -> float:
          """Net revenue rate ($/MW/day) from optimal multi-cycle dispatch.

          Pairs cheapest hours with most expensive; each pair earns
          eff_c * eff_d * sell_price - buy_price per MW per cycle.
          Cycles accumulate until spread turns negative.
          """
          sorted_asc = sorted(prices)
          sorted_desc = sorted(prices, reverse=True)
          T = len(prices)
          rate = 0.0
          for i in range(T // 2):
              spread = eff_c * eff_d * sorted_desc[i] - sorted_asc[i]
              if spread > 0:
                  rate += spread
              else:
                  break
          return rate

      def _compute_scenario_cost(sc: dict, inv: dict, capacity: float) -> float:
          """Compute optimal operating cost for a scenario given fixed capacity.

          Uses same multi-cycle revenue model as _solve_scenario_subproblem so
          EV and PH results are directly comparable.
          """
          prices = sc['price_per_MWh']
          eff_c = inv['charge_efficiency']
          eff_d = inv['discharge_efficiency']
          rate = _rev_rate(prices, eff_c, eff_d)
          return -(rate * capacity)

      def _solve_ev_policy(scenarios: list, inv: dict) -> tuple:
          """Deterministic EV: solve with mean-scenario revenue rate."""
          n = len(scenarios)
          T = _N_HOURS
          mean_prices = [sum((sc['price_per_MWh'][t] for sc in scenarios)) / n for t in range(T)]
          eff_c = inv['charge_efficiency']
          eff_d = inv['discharge_efficiency']
          ev_rate = _rev_rate(mean_prices, eff_c, eff_d)
          cap_cost_daily = inv['capital_cost_per_MW'] / 250.0
          ev_cap = inv['max_capacity_MW'] if ev_rate > cap_cost_daily else 0.0
          ev_annual_op = sum((sc['probability'] * _compute_scenario_cost(sc, inv, ev_cap) for sc in scenarios)) * 250
          ev_capital = inv['capital_cost_per_MW'] * ev_cap
          return (ev_cap, ev_annual_op + ev_capital)
      _spl_result = solve_with_ph(problem_json)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - problem_json
    tool_returns: TEXT
- ph_converged:
    node: SOLVE
    in:
      result_json: solve_with_ph
    out: tool_5
    tool: ph_converged
    backend: kernel
    arguments:
    - '@result_json'
    code: |
      import json

      def ph_converged(result_json: str) -> bool:
          """ASSERT: PH ran to convergence and RP cost < EV cost (stochastic better)."""
          try:
              d = json.loads(result_json)
              if d.get('status') != 'OK':
                  return False
              return d.get('rp_cost', 1000000000.0) <= d.get('ev_cost', 0) + 1.0
          except Exception:
              return False
      _spl_result = ph_converged(result_json)
    result: _spl_result
    out_type: BOOL
    tool_params:
    - result_json
    tool_returns: TEXT
- assert_ph_converged:
    assert: '@in_tool_5'
    in:
      result_json: solve_with_ph
      tool_5: ph_converged
    out: []
- format_ph_report:
    node: SOLVE
    in:
      result_json: solve_with_ph
    out: ph_report
    on:
    - assert_ph_converged
    - assert_ph_converged.fail
    tool: format_ph_report
    backend: kernel
    arguments:
    - '@result_json'
    code: |
      import json

      def format_ph_report(result_json: str) -> str:
          try:
              d = json.loads(result_json)
              conv_str = 'Yes ✓' if d.get('converged') else f"No (residual={d.get('primal_residual_MW', '?')} MW)"
              lines = [f'## Progressive Hedging Report — Battery Storage Investment', '', f"**Scenarios:** {d.get('n_scenarios', '?')}  ", f"**PH iterations:** {d.get('ph_iterations', '?')}  ", f'**Converged:** {conv_str}  ', f"**Primal residual:** {d.get('primal_residual_MW', '?')} MW  ", f"**Solve time:** {d.get('solve_time_sec', '?')}s  ", '', '### Investment Decision', '', '| | PH (stochastic) | EV (mean scenario) |', '|---|---|---|', f"| Capacity (MW) | **{d.get('capacity_MW', '?')}** | {d.get('ev_capacity_MW', '?')} |", f"| Capital cost ($/yr) | ${d.get('capital_cost', '?'):,} | — |", f"| Annual net value (profit − capital, $) | **${-d.get('rp_cost', 0):,}** | ${-d.get('ev_cost', 0):,} |", f"| **Value of Stochastic Solution (VSS)** | **${d.get('vss', '?'):,}** | baseline |", '', 'VSS = RP_profit − EV_profit: the annual dollar gain from solving with', f"all {d.get('n_scenarios', '?')} scenarios vs. optimizing on the mean alone.", 'Positive VSS means the stochastic solution earns more than the EV policy.']
              return '\n'.join(lines)
          except Exception as e:
              return f'(format error: {e})'
      _spl_result = format_ph_report(result_json)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - result_json
    tool_returns: TEXT
- json_get_2:
    node: SOLVE
    in:
      result_json: solve_with_ph
    out: rp_cost
    tool: json_get
    backend: kernel
    arguments:
    - '@result_json'
    - "'rp_cost'"
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(result_json, 'rp_cost')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
- json_get_3:
