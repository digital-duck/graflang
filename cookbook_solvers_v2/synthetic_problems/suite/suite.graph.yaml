version: 1.0-graph
workflow:
  name: suite
  inputs:
  - name: domain
    type: TEXT
  - name: n_variants
    type: TEXT
  - name: n_size
    type: TEXT
  - name: attempts
    type: TEXT
  - name: parse_error
    type: TEXT
  - name: variants_json
    type: TEXT
  - name: variants_raw
    type: TEXT
  - name: tool_4
    type: TEXT
  outputs:
  - name: report
    type: TEXT
nodes:
- id: wf_entry
  type: INPUT
  ports:
  - entry
  - out_domain
  - out_n_variants
  - out_n_size
  - out_attempts
  - out_parse_error
  - out_variants_json
  - out_variants_raw
  - out_tool_4
- id: loop_1
  type: LOOP
  config:
    condition: NOT latest(@in_tool_4, @tool_5) AND latest(@in_attempts, @attempts) < 3
    state:
      parse_error:
        from: tool_2.out_parse_error
      variants_raw:
        from: gen_2.out_variants_raw
      variants_json:
        from: tool_3.out_variants_json
      attempts:
        from: set_8.out_attempts
      tool_5:
        from: tool_5.out_tool_5
    subgraph:
      nodes:
      - id: tool_2
        type: SOLVE
        config:
          tool: get_parse_errors
          backend: kernel
          arguments:
          - |-
            @variants_json
          code: |
            import json

            def get_parse_errors(variants_json: str) -> str:
                """Return error summary for the repair-loop prompt."""
                try:
                    data = json.loads(variants_json)
                    errors = data.get('errors', [])
                    return '; '.join(errors) if errors else f"status={data.get('status')}"
                except Exception:
                    return 'JSON parse error'
            _spl_result = get_parse_errors(variants_json)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - variants_json
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_variants_json
        - out_parse_error
      - id: gen_2
        type: GENERATE
        config:
          function: repair_variants_prompt
          params:
          - variants_raw
          - errors
          prompt_inline: |-
            The previous JSON output had these validation errors:
            {{in_errors}}

            Here was your output:
            {{in_variants_raw}}

            Fix the JSON so every variant object has all required fields.
            Return ONLY the corrected JSON array — no prose.
          arguments:
          - |-
            @variants_raw
          - |-
            @parse_error
        ports:
        - trigger
        - complete
        - in_variants_raw
        - in_errors
        - out_variants_raw
      - id: tool_3
        type: SOLVE
        config:
          tool: parse_variants
          backend: kernel
          arguments:
          - |-
            @variants_raw
          - |-
            @domain
          code: |
            import json

            import re

            def _extract_json(text: str):
                """Pull the first JSON array or object from fenced or raw text."""
                for pat in ['```(?:json)?\\s*([\\[{].*?)\\s*```', '((?:\\[|\\{)(?:.|\\n)*(?:\\]|\\}))']:
                    m = re.search(pat, text, re.DOTALL)
                    if m:
                        try:
                            return json.loads(m.group(1))
                        except json.JSONDecodeError:
                            continue
                raise ValueError('No parseable JSON found in LLM output')

            _REQUIRED = {'lp': {'id', 'problem_text', 'variables', 'objective', 'constraints'}, 'ilp': {'id', 'problem_text', 'variables', 'objective', 'constraints'}, 'supply-sourcing': {'id', 'problem_text', 'suppliers', 'total_demand'}}

            def parse_variants(variants_raw: str, domain: str) -> str:
                """Parse LLM-generated variant JSON and validate required fields.

                Returns:
                  {"status": "OK"|"EMPTY"|"PARSE_ERROR", "n_valid": int, "n_errors": int,
                   "errors": [str], "variants": [dict]}
                """
                try:
                    data = _extract_json(variants_raw)
                    if isinstance(data, dict):
                        data = data.get('variants', [data])
                    dom_key = domain.lower().replace(' ', '-')
                    required = _REQUIRED.get(dom_key, _REQUIRED['lp'])
                    valid, errors = ([], [])
                    for i, v in enumerate(data):
                        vid = v.get('id', f'v{i + 1:03d}')
                        v['id'] = vid
                        missing = required - set(v.keys())
                        if missing:
                            errors.append(f'{vid}: missing {sorted(missing)}')
                        else:
                            v['domain'] = dom_key
                            valid.append(v)
                    return json.dumps({'status': 'OK' if valid else 'EMPTY', 'n_valid': len(valid), 'n_errors': len(errors), 'errors': errors, 'variants': valid})
                except Exception as e:
                    return json.dumps({'status': 'PARSE_ERROR', 'error': str(e), 'n_valid': 0, 'n_errors': 1, 'errors': [str(e)], 'variants': []})
            _spl_result = parse_variants(variants_raw, domain)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - variants_raw
          - domain
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_variants_raw
        - in_domain
        - out_variants_json
      - id: set_8
        type: CONTEXT
        config:
          action: set
          expression: |-
            @in_attempts + 1
        ports:
        - trigger
        - complete
        - in_attempts
        - out_attempts
      - id: tool_5
        type: SOLVE
        config:
          tool: has_valid_variants
          backend: kernel
          arguments:
          - |-
            @variants_json
          code: |
            import json

            def has_valid_variants(variants_json: str) -> bool:
                """ASSERT gate: at least 1 variant parsed successfully."""
                try:
                    return json.loads(variants_json).get('n_valid', 0) >= 1
                except Exception:
                    return False
            _spl_result = has_valid_variants(variants_json)
          result: _spl_result
          out_type: BOOL
          tool_params:
          - variants_json
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_variants_json
        - out_tool_5
      edges:
      - source: tool_2.complete
        target: gen_2.trigger
        type: triggers
      - source: tool_2.out_parse_error
        target: gen_2.in_errors
        type: binds
      - source: gen_2.complete
        target: tool_3.trigger
        type: triggers
      - source: gen_2.out_variants_raw
        target: tool_3.in_variants_raw
        type: binds
      - source: tool_3.complete
        target: set_8.trigger
        type: triggers
      - source: set_8.complete
        target: tool_5.trigger
        type: triggers
      - source: tool_3.out_variants_json
        target: tool_5.in_variants_json
        type: binds
  ports:
  - trigger
  - loop
  - exit
  - in_variants_json
  - in_variants_raw
  - in_domain
  - in_attempts
  - in_tool_4
  - in_parse_error
  - out_parse_error
  - out_variants_raw
  - out_variants_json
  - out_attempts
  - out_tool_5
- id: tool_6
  type: SOLVE
  config:
    tool: has_valid_variants
    backend: kernel
    arguments:
    - |-
      @variants_json
    code: |
      import json

      def has_valid_variants(variants_json: str) -> bool:
          """ASSERT gate: at least 1 variant parsed successfully."""
          try:
              return json.loads(variants_json).get('n_valid', 0) >= 1
          except Exception:
              return False
      _spl_result = has_valid_variants(variants_json)
    result: _spl_result
    out_type: BOOL
    tool_params:
