version: 1.0-graph
workflow:
  name: llm_only
  inputs:
  - name: problem
    type: TEXT
  - name: llm_calls
    type: TEXT
  outputs:
  - name: report
    type: TEXT
steps:
- solve_directly_js:
    generate: |-
      You are an expert operations researcher. Solve this job-shop scheduling problem.

      Problem: {{in_problem}}

      Job-shop rules:
      - Each job has a fixed sequence of operations on specific machines.
      - Each machine handles only one job at a time (no overlap).
      - Operations within a job must run in order (no preemption).
      - Goal: minimise the total makespan (time to finish all jobs).

      Steps:
      1. List all jobs, their operation sequences, and durations.
      2. Build a schedule using a dispatching heuristic (FIFO, SPT, or NEH).
      3. Show the Gantt chart as a text table (machine vs time slots).
      4. State the makespan.
      5. Verify no machine overlap and no precedence violation.
    in:
      problem: $in.problem
    out: llm_schedule
    function: solve_directly_js
    params:
    - problem
    arguments:
    - '@problem'
- set_llm_calls_4:
    node: CONTEXT
    in:
      llm_calls: $in.llm_calls
    out: llm_calls
    action: set
    expression: '@in_llm_calls + 1'
- extract_solution_json_js:
    generate: |-
      Convert this job-shop schedule description to JSON.
      Return ONLY a JSON object — no markdown:
      {{
        "makespan": <integer>,
        "schedule": [
          {{"job": "Job1", "operation": 1, "machine": "M1", "start": 0, "end": 3, "duration": 3}},
          ...
        ]
      }}

      Problem: {{in_problem}}
      Schedule description:
      {{in_schedule_text}}
    in:
      problem: $in.problem
      schedule_text: solve_directly_js
    out: solution_json
    function: extract_solution_json_js
    params:
    - problem
    - schedule_text
    arguments:
    - '@problem'
    - '@llm_schedule'
- set_llm_calls_5:
    node: CONTEXT
    in:
      llm_calls: set_llm_calls_4
    out: llm_calls
    action: set
    expression: '@in_llm_calls + 1'
- extract_job_structure_2:
    generate: |-
      Extract this job-shop scheduling problem into JSON.
      Return ONLY a JSON object — no markdown, no prose:
      {{
        "jobs": [
          {{"name": "Job1", "operations": [
            {{"machine": "M1", "duration": 3}},
            {{"machine": "M2", "duration": 2}}
          ]}},
          ...
        ],
        "machines": ["M1", "M2", ...],
        "deadline": null
      }}

      Rules:
      - Each operation must specify exactly one machine and an integer duration.
      - Operations within a job are in the required processing order.
      - deadline is null unless the problem states one.

      Problem: {{in_problem}}
    in:
      problem: $in.problem
    out: problem_json
    function: extract_job_structure
    params:
    - problem
    arguments:
    - '@problem'
- set_llm_calls_6:
    node: CONTEXT
    in:
      llm_calls: set_llm_calls_5
    out: llm_calls
    action: set
    expression: '@in_llm_calls + 1'
- verify_job_shop:
    node: SOLVE
    in:
      problem_json: extract_job_structure_2
      solution_json: extract_solution_json_js
    out: verify_result
    tool: verify_job_shop
    backend: kernel
    arguments:
    - '@problem_json'
    - '@solution_json'
    code: |
      import json

      def verify_job_shop(problem_json: str, solution_json: str) -> str:
          """
          Back-substitution verifier for solver=OFF path.
          Checks: precedence constraints, no-overlap on machines, correct makespan.
          """
          try:
              problem = json.loads(problem_json)
              sol = json.loads(solution_json)
          except Exception as e:
              return json.dumps({'verdict': 'UNPARSEABLE', 'notes': str(e)})
          schedule: list[dict] = sol.get('schedule', [])
          if not schedule:
              return json.dumps({'verdict': 'UNPARSEABLE', 'notes': 'empty schedule'})
          jobs_data = problem.get('jobs', [])
          notes: list[str] = []
          ok = True
          machine_ops: dict[str, list[dict]] = {}
          for entry in schedule:
              m = entry['machine']
              machine_ops.setdefault(m, []).append(entry)
          for machine, ops in machine_ops.items():
              ops_sorted = sorted(ops, key=lambda x: x['start'])
              for i in range(len(ops_sorted) - 1):
                  a, b = (ops_sorted[i], ops_sorted[i + 1])
                  if a['end'] > b['start']:
                      notes.append(f"overlap on {machine}: {a['job']}[{a['start']},{a['end']}) vs {b['job']}[{b['start']},{b['end']})")
                      ok = False
          for job in jobs_data:
              job_name = job.get('name', '')
              job_ops = [e for e in schedule if e['job'] == job_name]
              job_ops.sort(key=lambda x: x['operation'])
              for i in range(len(job_ops) - 1):
                  if job_ops[i]['end'] > job_ops[i + 1]['start']:
                      notes.append(f"precedence violated for {job_name}: op{i + 1} ends {job_ops[i]['end']} > op{i + 2} starts {job_ops[i + 1]['start']}")
                      ok = False
          claimed_makespan = sol.get('makespan')
          actual_makespan = max((e['end'] for e in schedule), default=0)
          if claimed_makespan is not None and int(claimed_makespan) != actual_makespan:
              notes.append(f'makespan mismatch: claimed={claimed_makespan}, actual={actual_makespan}')
              ok = False
          return json.dumps({'verdict': 'PASS' if ok else 'FAIL', 'claimed_makespan': claimed_makespan, 'actual_makespan': actual_makespan, 'notes': '; '.join(notes) if notes else 'all constraints satisfied'})
      _spl_result = verify_job_shop(problem_json, solution_json)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - problem_json
    - solution_json
    tool_returns: TEXT
- json_get_2:
    node: SOLVE
    in:
      verify_result: verify_job_shop
    out: verify_status
    tool: json_get
    backend: kernel
    arguments:
    - '@verify_result'
    - "'verdict'"
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(verify_result, 'verdict')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
- json_get_3:
    node: SOLVE
    in:
      solution_json: extract_solution_json_js
    out: makespan_str
    tool: json_get
    backend: kernel
    arguments:
    - '@solution_json'
    - "'makespan'"
    code: |
      import json

      def json_get(json_str: str, key: str) -> str:
          """JSON_GET(json, key) — extract a top-level key from a JSON object string.
          Supports dot notation: 'a.b' extracts json['a']['b']. Strips markdown
          ```json code fences before parsing, so raw LLM output works directly.
          Returns '' if key not found or input is not valid JSON.
          """
          try:
              clean = str(json_str).replace('```json', '').replace('```', '').strip()
              obj = json.loads(clean)
              for part in str(key).split('.'):
                  if isinstance(obj, dict):
                      obj = obj.get(part, '')
                  else:
                      return ''
              return str(obj) if obj != '' else ''
          except (json.JSONDecodeError, TypeError):
              return ''
      _spl_result = json_get(solution_json, 'makespan')
    result: _spl_result
    out_type: TEXT
    tool_params:
    - json_str
    - key
    tool_returns: TEXT
    tool_builtin: true
- format_report_solver_off:
    node: SOLVE
    in:
      problem: $in.problem
      llm_schedule: solve_directly_js
      solution_json: extract_solution_json_js
      verify_result: verify_job_shop
      llm_calls: set_llm_calls_6
    out: report
    tool: format_report_solver_off
    backend: kernel
    arguments:
    - '@problem'
    - '@llm_schedule'
    - '@solution_json'
    - '@verify_result'
    - '@llm_calls'
    code: |
      def format_report_solver_off(problem: str, llm_schedule: str, solution_json: str, verify_result: str, llm_calls: str) -> str:
          return f'=== Job-Shop Scheduling (solver=OFF / LLM direct) ===\n\nProblem:\n{problem}\n\nLLM Schedule:\n{llm_schedule}\n\nExtracted Schedule (JSON):\n{solution_json}\n\nVerification:\n{verify_result}\n\nLLM calls: {llm_calls}'
      _spl_result = format_report_solver_off(problem, llm_schedule, solution_json, verify_result, llm_calls)
    result: _spl_result
    out_type: TEXT
    tool_params:
    - problem
    - llm_schedule
    - solution_json
    - verify_result
    - llm_calls
    tool_returns: TEXT
- wf_exit:
    output: format_report_solver_off
