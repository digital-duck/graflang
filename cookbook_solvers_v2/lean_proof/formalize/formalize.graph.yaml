version: 1.0-graph
workflow:
  name: formalize
  inputs:
  - name: claim
    type: TEXT
  - name: max_tries
    type: INT
  - name: stmt_ok_lc
    type: TEXT
  - name: tries
    type: TEXT
  outputs:
  - name: badge
    type: TEXT
  - name: stmt_ok_lc
    type: TEXT
  - name: lean_stmt
    type: TEXT
  - name: lean_feedback
    type: TEXT
  - name: proof
    type: TEXT
  - name: check_code
    type: TEXT
  - name: faithful
    type: TEXT
  - name: citation
    type: TEXT
steps:
- set_faithful:
    node: CONTEXT
    out: faithful
    on: []
    action: set
    expression: |-
      'not judged (formalization failed)'
- set_badge:
    node: CONTEXT
    out: badge
    action: set
    expression: "'unverified'"
- set_proof:
    node: CONTEXT
    out: proof
    action: set
    expression: "''"
- set_citation:
    node: CONTEXT
    out: citation
    action: set
    expression: "''"
nodes:
- id: formalize_loop
  type: LOOP
  config:
    condition: latest(@in_tries, @tries) < @in_max_tries
    state:
      tries:
        from:
        - set_3.out_tries
        - set_5.out_tries
        - set_7.out_tries
      stmt_raw:
        from:
        - gen_1.out_stmt_raw
        - gen_2.out_stmt_raw
      lean_stmt:
        from:
        - tool_2.out_lean_stmt
        - tool_6.out_lean_stmt
      check_code:
        from:
        - set_4.out_check_code
        - set_6.out_check_code
      stmt_ok:
        from:
        - tool_3.out_stmt_ok
        - tool_7.out_stmt_ok
      lean_feedback:
        from:
        - tool_4.out_lean_feedback
        - tool_8.out_lean_feedback
      stmt_ok_lc:
        from:
        - tool_5.out_stmt_ok_lc
        - tool_9.out_stmt_ok_lc
    subgraph:
      nodes:
      - id: eval_1
        type: EVALUATE
        config:
          condition: "@in_stmt_ok_lc == 'true'"
          branch: 1
        ports:
        - trigger
        - pass
        - fail
        - in_stmt_ok_lc
      - id: set_3
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      - id: eval_2
        type: EVALUATE
        config:
          condition: "@in_stmt_ok_lc == 'init'"
          branch: 2
        ports:
        - trigger
        - pass
        - fail
        - in_stmt_ok_lc
      - id: gen_1
        type: GENERATE
        config:
          function: formalize_claim
          params:
          - claim
          prompt_inline: |-
            Translate this mathematical claim into a single Lean 4 proposition.

            Rules:
            - Output ONLY the proposition — what goes after `example :`. No proof,
              no `example`, no markdown fences, no commentary.
            - Use core Lean 4 types (Nat, Int, List) and notation. Bind every
              variable explicitly with ∀.
            - Example output:  ∀ n : Nat, n + 0 = n

            Claim: {{in_claim}}
          arguments:
          - '@claim'
        ports:
        - trigger
        - complete
        - in_claim
        - out_stmt_raw
      - id: tool_2
        type: SOLVE
        config:
          tool: strip_fences
          backend: kernel
          arguments:
          - '@stmt_raw'
          code: |
            def strip_fences(text: str) -> str:
                """Remove markdown code fences and surrounding noise from LLM output."""
                s = text.strip()
                if s.startswith("```"):
                    lines = [ln for ln in s.splitlines() if not ln.strip().startswith("```")]
                    s = "\n".join(lines).strip()
                # one-line statements sometimes arrive with a trailing period
                return s.rstrip(".").strip().replace("'''", "")
            _spl_result = strip_fences(stmt_raw)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - text
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_stmt_raw
        - out_lean_stmt
      - id: set_4
        type: CONTEXT
        config:
          action: set
          expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
        ports:
        - trigger
        - complete
        - in_lean_stmt
        - out_check_code
      - id: tool_3
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - '@check_code'
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python(check_code)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_check_code
        - out_stmt_ok
      - id: tool_4
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - "'print(_spl_lean.feedback)'"
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python('print(_spl_lean.feedback)')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - out_lean_feedback
      - id: tool_5
        type: SOLVE
        config:
          tool: lower
          backend: kernel
          arguments:
          - '@stmt_ok'
          code: |
            def lower(value: str) -> str:
                """LOWER(value) — convert to lowercase."""
                return str(value).lower()
            _spl_result = lower(stmt_ok)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_stmt_ok
        - out_stmt_ok_lc
      - id: set_5
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      - id: gen_2
        type: GENERATE
        config:
          function: fix_formalization
          params:
          - claim
          - lean_stmt
          - feedback
          prompt_inline: |-
            This Lean 4 proposition failed to typecheck.

            Claim (prose): {{in_claim}}
            Attempted proposition: {{in_lean_stmt}}
            Lean's diagnostics:
            {{in_lean_feedback}}

            Output ONLY the corrected proposition (what goes after `example :`).
            No proof, no fences, no commentary. Bind every variable with ∀.
          arguments:
          - '@claim'
          - '@lean_stmt'
          - '@lean_feedback'
        ports:
        - trigger
        - complete
        - in_claim
        - in_lean_stmt
        - in_lean_feedback
        - out_stmt_raw
      - id: tool_6
        type: SOLVE
        config:
          tool: strip_fences
          backend: kernel
          arguments:
          - '@stmt_raw'
          code: |
            def strip_fences(text: str) -> str:
                """Remove markdown code fences and surrounding noise from LLM output."""
                s = text.strip()
                if s.startswith("```"):
                    lines = [ln for ln in s.splitlines() if not ln.strip().startswith("```")]
                    s = "\n".join(lines).strip()
                # one-line statements sometimes arrive with a trailing period
                return s.rstrip(".").strip().replace("'''", "")
            _spl_result = strip_fences(stmt_raw)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - text
          tool_returns: TEXT
        ports:
        - trigger
        - complete
        - in_stmt_raw
        - out_lean_stmt
      - id: set_6
        type: CONTEXT
        config:
          action: set
          expression: f"print(_spl_lean.statement_ok(r'''{@in_lean_stmt}'''))"
        ports:
        - trigger
        - complete
        - in_lean_stmt
        - out_check_code
      - id: tool_7
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - '@check_code'
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python(check_code)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_check_code
        - out_stmt_ok
      - id: tool_8
        type: SOLVE
        config:
          tool: run_python
          backend: kernel
          arguments:
          - "'print(_spl_lean.feedback)'"
          code: |
            def run_python(code: str, timeout: str='30') -> str:
                """Run Python code in this kernel session (state is shared with the other kernel nodes of the run) and return what it prints."""
                import contextlib, io
                out = io.StringIO()
                try:
                    with contextlib.redirect_stdout(out):
                        exec(str(code), globals())
                    return out.getvalue().strip()
                except Exception as e:
                    return f'Error: {type(e).__name__}: {e}'
            _spl_result = run_python('print(_spl_lean.feedback)')
          result: _spl_result
          out_type: TEXT
          tool_params:
          - code
          - timeout
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - out_lean_feedback
      - id: tool_9
        type: SOLVE
        config:
          tool: lower
          backend: kernel
          arguments:
          - '@stmt_ok'
          code: |
            def lower(value: str) -> str:
                """LOWER(value) — convert to lowercase."""
                return str(value).lower()
            _spl_result = lower(stmt_ok)
          result: _spl_result
          out_type: TEXT
          tool_params:
          - value
          tool_returns: TEXT
          tool_builtin: true
        ports:
        - trigger
        - complete
        - in_stmt_ok
        - out_stmt_ok_lc
      - id: set_7
        type: CONTEXT
        config:
          action: set
          expression: '@in_tries + 1'
        ports:
        - trigger
        - complete
        - in_tries
        - out_tries
      edges:
      - source: eval_1.pass
        target: set_3.trigger
        type: triggers
      - source: eval_1.fail
        target: eval_2.trigger
        type: triggers
      - source: eval_2.pass
        target: gen_1.trigger
        type: triggers
      - source: gen_1.complete
        target: tool_2.trigger
        type: triggers
      - source: gen_1.out_stmt_raw
        target: tool_2.in_stmt_raw
        type: binds
      - source: tool_2.complete
        target: set_4.trigger
        type: triggers
      - source: tool_2.out_lean_stmt
        target: set_4.in_lean_stmt
        type: binds
      - source: set_4.complete
        target: tool_3.trigger
        type: triggers
      - source: set_4.out_check_code
        target: tool_3.in_check_code
        type: binds
      - source: tool_3.complete
        target: tool_4.trigger
        type: triggers
      - source: tool_4.complete
        target: tool_5.trigger
        type: triggers
      - source: tool_3.out_stmt_ok
        target: tool_5.in_stmt_ok
        type: binds
      - source: tool_5.complete
        target: set_5.trigger
        type: triggers
      - source: eval_2.fail
        target: gen_2.trigger
        type: triggers
      - source: gen_2.complete
        target: tool_6.trigger
        type: triggers
      - source: gen_2.out_stmt_raw
        target: tool_6.in_stmt_raw
        type: binds
      - source: tool_6.complete
        target: set_6.trigger
        type: triggers
      - source: tool_6.out_lean_stmt
        target: set_6.in_lean_stmt
        type: binds
      - source: set_6.complete
        target: tool_7.trigger
        type: triggers
      - source: set_6.out_check_code
        target: tool_7.in_check_code
        type: binds
      - source: tool_7.complete
        target: tool_8.trigger
        type: triggers
      - source: tool_8.complete
        target: tool_9.trigger
        type: triggers
      - source: tool_7.out_stmt_ok
        target: tool_9.in_stmt_ok
        type: binds
      - source: tool_9.complete
        target: set_7.trigger
        type: triggers
  ports:
  - trigger
  - loop
  - exit
  - in_stmt_ok_lc
  - in_tries
  - in_claim
  - in_lean_stmt
  - in_lean_feedback
  - in_max_tries
  - out_tries
  - out_stmt_raw
  - out_lean_stmt
  - out_check_code
  - out_stmt_ok
  - out_lean_feedback
  - out_stmt_ok_lc
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_badge
  - in_stmt_ok_lc
  - in_lean_stmt
  - in_lean_feedback
  - in_proof
  - in_check_code
  - in_faithful
  - in_citation
edges:
- source: formalize_loop.exit
  target: set_faithful.trigger
  type: triggers
- source: wf_entry.entry
  target: formalize_loop.trigger
  type: triggers
- source: set_citation.complete
  target: wf_exit.trigger
  type: triggers
- source: wf_entry.out_claim
  target: formalize_loop.in_claim
  type: binds
- source: wf_entry.out_max_tries
  target: formalize_loop.in_max_tries
  type: binds
- source: wf_entry.out_stmt_ok_lc
  target: formalize_loop.in_stmt_ok_lc
  type: binds
- source: wf_entry.out_tries
  target: formalize_loop.in_tries
  type: binds
- source: set_badge.out_badge
  target: wf_exit.in_badge
  type: binds
- source: formalize_loop.out_stmt_ok_lc
  target: wf_exit.in_stmt_ok_lc
  type: binds
- source: formalize_loop.out_lean_stmt
  target: wf_exit.in_lean_stmt
  type: binds
- source: formalize_loop.out_lean_feedback
  target: wf_exit.in_lean_feedback
  type: binds
- source: set_proof.out_proof
  target: wf_exit.in_proof
  type: binds
- source: formalize_loop.out_check_code
  target: wf_exit.in_check_code
  type: binds
- source: set_faithful.out_faithful
  target: wf_exit.in_faithful
  type: binds
- source: set_citation.out_citation
  target: wf_exit.in_citation
  type: binds
