- id: proof_ok
  type: EVALUATE
  config:
    condition: "@in_proof_ok_lc == 'true'"
    branch: 1
  ports:
  - trigger
  - pass
  - fail
  - in_proof_ok_lc
- id: wf_exit
  type: OUTPUT
  ports:
  - trigger
  - exit
  - in_badge
  - in_proof
  - in_prove_loop_proof
edges:
- source: set_tries_2.complete
  target: prove_loop.trigger
  type: triggers
- source: set_tries_2.out_tries
  target: prove_loop.in_tries
  type: binds
- source: prove_loop.exit
  target: proof_ok.trigger
  type: triggers
- source: prove_loop.out_proof_ok_lc
  target: proof_ok.in_proof_ok_lc
  type: binds
- source: proof_ok.pass
  target: set_badge_3.trigger
  type: triggers
- source: proof_ok.fail
  target: set_proof_2.trigger
  type: triggers
- source: set_badge_3.complete
  target: wf_exit.trigger
  type: triggers
- source: set_proof_2.complete
  target: wf_exit.trigger
  type: triggers
- source: wf_entry.out_max_tries
