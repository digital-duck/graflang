version: 1.0-graph
workflow:
  name: judge
  inputs:
  - name: claim
    type: TEXT
  - name: lean_stmt
    type: TEXT
  outputs:
  - name: badge
    type: TEXT
  - name: faithful
    type: TEXT
steps:
- judge_faithfulness:
    generate: |-
      A prose mathematical claim was formalized in Lean 4.

      Prose claim: {{in_claim}}
      Lean proposition: {{in_lean_stmt}}

      Does the Lean proposition say exactly what the prose claims — same
      quantifiers, no vacuous hypotheses, no degenerate specialization?
      Reply with exactly one line: FAITHFUL or UNFAITHFUL, then a dash and
      one short reason.
    in:
      claim: $in.claim
      lean_stmt: $in.lean_stmt
    out: faithful
    function: judge_faithfulness
    params:
    - claim
    - lean_stmt
    arguments:
    - '@claim'
    - '@lean_stmt'
- set_badge_2:
    node: CONTEXT
    out: badge
    action: set
    expression: "'statement_checked'"
- wf_exit:
    output:
      badge: set_badge_2
      faithful: judge_faithfulness
