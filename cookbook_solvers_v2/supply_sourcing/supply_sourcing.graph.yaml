version: 1.0-graph
workflow:
  name: supply_sourcing
  inputs:
  - name: problem
    type: TEXT
    default: 'A manufacturer needs 1000 units from 3 suppliers. S1: $10/unit, 95% fill rate, capacity 400 units. S2: $7/unit, 80% fill rate, capacity 500 units. S3: $5/unit, 60% fill rate, capacity 400 units. Find allocations that minimize cost and maximize fill rate.'
  - name: use_solver
    type: TEXT
    default: 'true'
  - name: n_points
    type: TEXT
    default: '8'
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    prepare: ./prepare/prepare.graph.yaml
    solver_arm: ./solver_arm/solver_arm.graph.yaml
    llm_only: ./llm_only/llm_only.graph.yaml
steps:
- prepare:
    use: parts.prepare
    in:
      use_solver: $in.use_solver
    out:
    - use_solver
    - llm_calls
- solver_on:
    evaluate: |-
      @in_use_solver == 'true'
    in:
      use_solver: prepare
    out: []
    branch: 1
- solver_arm:
    use: parts.solver_arm
    in:
      problem: $in.problem
      llm_calls: prepare.llm_calls
      n_points: $in.n_points
    out: report
- llm_only:
    use: parts.llm_only
    in:
      problem: $in.problem
      llm_calls: prepare.llm_calls
    out: report
    'on': solver_on.fail
- wf_exit:
    output:
    - solver_arm
    - llm_only
    'on':
    - solver_arm
    - llm_only
