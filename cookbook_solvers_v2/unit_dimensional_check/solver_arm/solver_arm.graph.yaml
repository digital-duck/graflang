  type: triggers
- source: loop_1.out_solution
  target: assert_1.in_solution
  type: binds
- source: tool_10.out_tool_10
  target: assert_1.in_tool_10
  type: binds
- source: assert_1.pass
  target: gen_4.trigger
  type: triggers
- source: assert_1.fail
  target: gen_4.trigger
  type: triggers
- source: loop_1.out_solution
  target: gen_4.in_solution_json
  type: binds
- source: gen_4.complete
  target: tool_11.trigger
  type: triggers
- source: gen_4.out_narrative
  target: tool_11.in_narrative
  type: binds
- source: loop_1.out_solution
  target: tool_11.in_solution
  type: binds
- source: tool_11.complete
  target: tool_12.trigger
  type: triggers
- source: loop_1.out_code
  target: tool_12.in_code
  type: binds
- source: loop_1.out_solution
  target: tool_12.in_solution
  type: binds
- source: gen_4.out_narrative
  target: tool_12.in_narrative
  type: binds
- source: tool_11.out_roundtrip
  target: tool_12.in_roundtrip
  type: binds
- source: tool_12.complete
