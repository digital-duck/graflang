version: 1.0-graph
workflow:
  name: robust_milp
  inputs:
  - name: problem
    type: TEXT
    default: 'A manufacturer must decide whether to build its own factory (capacity 300 units, one-time cost $4,000) or lease a smaller facility (capacity 150 units, no fixed cost) for Q2 production. Production cost from either: $8/unit. Emergency spot-market sourcing if demand exceeds capacity: $60/unit. Demand is uncertain: Low demand 100 units (30% probability), Normal demand 200 units (50% probability), High demand 300 units (20% probability). Find the capacity investment decision that minimizes expected total cost.'
  - name: use_solver
    type: TEXT
    default: 'true'
  outputs:
  - name: report
    type: TEXT
resources:
  parts:
    prepare: ./prepare/prepare.graph.yaml
    solver_arm: ./solver_arm/solver_arm.graph.yaml
    llm_only: ./llm_only/llm_only.graph.yaml
steps:
- prepare:
    use: parts.prepare
    in:
      problem: $in.problem
      use_solver: $in.use_solver
    out:
    - use_solver
    - problem_json
    - llm_calls
- solver_on:
    evaluate: |-
      @in_use_solver == 'true'
    in:
      use_solver: prepare
    out: []
    branch: 1
- solver_arm:
    use: parts.solver_arm
    in:
      problem_json: prepare.problem_json
      problem: $in.problem
      llm_calls: prepare.llm_calls
    out: report
- llm_only:
    use: parts.llm_only
    in:
      problem_json: prepare.problem_json
      problem: $in.problem
      llm_calls: prepare.llm_calls
    out: report
    'on': solver_on.fail
- wf_exit:
    output:
    - solver_arm
    - llm_only
    'on':
    - solver_arm
    - llm_only
