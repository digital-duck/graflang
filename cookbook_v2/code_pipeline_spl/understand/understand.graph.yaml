version: "1.0-graph"
workflow:
  name: understand
  description: Asks a model whether the spec is clear enough to build from. Ends in the error exit `vague` when it is not.
  inputs:
    - {name: spec, type: TEXT}
  outputs:
    - {name: analysis, type: TEXT}
  errors:
    - {name: vague, code: E_SPEC_VAGUE, description: the analysis did not find the spec clear enough}
resources:
  procedures:
    analyze_spec: ./00_analyze_spec.spl
steps:
  - analyze: {node: GENERATE, procedure_ref: procedures.analyze_spec, llm: "ollama:gemma3", in: {spec: $in.spec}, out: analysis}
  - clear:   {evaluate: "contains(@in_analysis, '[READY]')", in: {analysis: analyze.analysis}}
  - ready:   {output: {analysis: analyze.analysis}, on: clear.pass}
  - vague:   {output: {analysis: analyze.analysis}, on: clear.fail, exit: vague}
