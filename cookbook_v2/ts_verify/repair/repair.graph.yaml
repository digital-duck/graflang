version: "1.0-graph"
workflow:
  name: repair
  description: Each round the model writes the function (on a retry it sees its last attempt and what failed), tsc type-checks it, and a restricted Node process runs the test cases. Stops when the cases pass or after max_cycles.
  inputs:
    - {name: spec, type: TEXT}
    - {name: function, type: TEXT}
    - {name: cases, type: TEXT}
    - {name: check_types, type: BOOL, default: true}
    - {name: max_cycles, type: INTEGER, default: 3}
  outputs:
    - {name: final_code, type: TEXT}
    - {name: passed, type: BOOL}
    - {name: attempts, type: JSON}
    - {name: type_report, type: TEXT}
    - {name: case_report, type: TEXT}
resources:
  prompts:
    write_ts: ./prompts/write_ts.md
steps:
  - repair:
      loop: "@in_max_cycles"
      while: "NOT @passed AND @cycle < @in_max_cycles"
      in: {spec: $in.spec, function: $in.function, cases: $in.cases, check_types: $in.check_types, max_cycles: $in.max_cycles}
      state:
        final_code: {from: write.code}
        prior_code: {from: write.code}
        type_report: {from: typecheck.check}
        case_report: {from: run_cases.run}
      out:
        passed: {fired: tests_ok.pass}
        attempts: {collect: write.code}
      steps:
        - write: {generate: prompts.write_ts, in: {spec: $loop.spec, function: $loop.function, prior_code: $loop.prior_code, type_report: $loop.type_report, case_report: $loop.case_report}, out: code, label: Write the TypeScript}
        - typecheck:
            node: SOLVE
            in: {code: write.code, function: $loop.function, check_types: $loop.check_types}
            ports: [trigger, complete, in_code, in_function, in_check_types, out_check]
            out: check
            backend: subprocess
            command: ["node", "tools/typecheck.mjs"]
            parse: first_line
            out_type: TEXT
            timeout: 60
            label: Type-check with tsc
        - types_ok: {evaluate: "json_get(@in_check, 'ok') == TRUE", in: {check: typecheck.check}}
        - run_cases:
            node: SOLVE
            on: types_ok.pass
            in: {code: write.code, function: $loop.function, cases: $loop.cases}
            ports: [trigger, complete, in_code, in_function, in_cases, out_run]
            out: run
            backend: subprocess
            command: ["node", "tools/run_cases.mjs"]
            parse: first_line
            out_type: TEXT
            timeout: 60
            label: Run the test cases
        - tests_ok: {evaluate: "json_get(@in_run, 'ok') == TRUE", in: {run: run_cases.run}}
  - done: {output: {final_code: repair.final_code, passed: repair.passed, attempts: repair.attempts, type_report: repair.type_report, case_report: repair.case_report}}
