version: "1.0-graph"
workflow:
  name: appraise
  description: Runs the finished product once on the plan's demo (offline, in a container, with a stand-in for any model) and has a model judge the output against each deliverable's quality bar. A rejected product is reworked (the defects go to a developer pass, the project is checked again) and appraised again, up to max_appraisals rounds.
  inputs:
    - {name: spec, type: TEXT}
    - {name: plan, type: TEXT}
    - {name: files, type: JSON}
    - {name: report, type: TEXT}
    - {name: lang, type: TEXT, default: python}
    - {name: reference, type: TEXT, default: ""}
    - {name: smoke, type: TEXT, default: ""}
    - {name: max_appraisals, type: INTEGER, default: 2}
  outputs:
    - {name: code, type: TEXT}                  # every file of the project with its `=== FILE: path ===` line
    - {name: files, type: JSON}
    - {name: report, type: TEXT}                # the last verification of the whole project
    - {name: appraisal, type: TEXT}             # the last verdict: [ACCEPTED], or [REWORK] with the defects
resources:
  prompts:
    appraise: ./prompts/appraise.md
    rework: ./prompts/rework.md
steps:
  - appraisals:
      loop: "@in_max_appraisals"
      while: "NOT @accepted"
      in: {spec: $in.spec, plan: $in.plan, files: $in.files, report: $in.report, lang: $in.lang, reference: $in.reference, smoke: $in.smoke, max_appraisals: $in.max_appraisals}
      state:
        files: {from: merge.files}                       # the project, as reworked
        report: {from: note.result}                      # its last verification
        appraisal: {from: judge.verdict, init: ""}
      out:
        accepted: {fired: ok.pass}
      steps:
        - demo:
            node: SOLVE
            in: {files: $loop.files, plan: $loop.plan}
            ports: [trigger, complete, in_files, in_plan, out_demo]
            out: demo
            backend: subprocess
            command: ["python", "tools/run_demo.py"]                      # looked up inside the image; /work is this recipe's folder, read-only
            container: {image: "graflang-verify:py3.12", memory_mb: 1024, cpus: 2, pids: 256}      # no network, read-only root
            parse: first_line
            out_type: TEXT
            timeout: 400
            label: Run the demo on the finished project
        - judge:   {generate: prompts.appraise, in: {spec: $loop.spec, plan: $loop.plan, demo: demo.demo}, out: verdict, label: Judge the output against the quality bars}
        - ok:      {evaluate: "contains(@in_verdict, '[ACCEPTED]')", in: {verdict: judge.verdict}}
        # rejected: show a developer the project, the demo output and the defects, once; check the result
        - view:
            node: SOLVE
            on: ok.fail
            in: {files: $loop.files}
            ports: [trigger, complete, in_files, out_text]
            out: text
            backend: subprocess
            command: ["python3", "-I", "tools/render_files.py"]
            out_type: JSON
            timeout: 30
            label: The project as text
        - rework:  {generate: prompts.rework, in: {spec: $loop.spec, plan: $loop.plan, lang: $loop.lang, reference: $loop.reference, project: view.text, demo: demo.demo, defects: judge.verdict}, out: reply, label: Rework the product}
        - merge:
            node: SOLVE
            in: {text: rework.reply, lang: $loop.lang, spec: $loop.spec, files: $loop.files}
            ports: [trigger, complete, in_text, in_lang, in_spec, in_files, out_files]
            out: files
            backend: subprocess
            command: ["python3", "-I", "tools/collect_files.py"]
            out_type: JSON
            timeout: 30
            label: Apply the rework
        - verify:
            node: SOLVE
            in: {files: merge.files, lang: $loop.lang, smoke: $loop.smoke}
            ports: [trigger, complete, in_files, in_lang, in_smoke, out_check]
            out: check
            backend: subprocess
            command: ["python", "tools/verify_project.py"]
            container: {image: "graflang-verify:py3.12", memory_mb: 1024, cpus: 2, pids: 256}
            parse: first_line
            out_type: TEXT
            timeout: 600
            label: Run the reworked project
        - note:    {solve: "json_get(@in_check, 'report')", in: {check: verify.check}, on: verify, out: result}
  - render:
      node: SOLVE
      in: {files: appraisals.files}
      ports: [trigger, complete, in_files, out_text]
      out: text
      backend: subprocess
      command: ["python3", "-I", "tools/render_files.py"]
      out_type: JSON
      timeout: 30
  - code: {solve: "json_get(@in_text, 'text')", in: {text: render.text}, out: code}
  - done: {output: {code: code.code, files: appraisals.files, report: appraisals.report, appraisal: appraisals.appraisal}}
