version: "1.0-graph"
workflow:
  name: build
  description: Writes the project as a folder of files, has a model review it, then rounds of improve, split into files, and run (syntax, imports, the project's own tests, an optional smoke test) until the checks pass or max_cycles is reached.
  inputs:
    - {name: spec, type: TEXT}
    - {name: lang, type: TEXT, default: python}
    - {name: reference, type: TEXT, default: ""}
    - {name: smoke, type: TEXT, default: ""}
    - {name: max_cycles, type: INTEGER, default: 3}
  outputs:
    - {name: code, type: TEXT}                  # the model's last reply: every file with its `=== FILE: path ===` line
    - {name: files, type: JSON}                 # the same as a mapping of path to text (what is written to .graf/codes/<run>/)
    - {name: report, type: TEXT}                # what the last verification found; starts with [PASSED] or [FAILED]
resources:
  prompts:
    write_code: ./prompts/write_code.md
    review_code: ./prompts/review_code.md
    improve_code: ./prompts/improve_code.md
steps:
  - write:  {generate: prompts.write_code, in: {spec: $in.spec, lang: $in.lang, prior_code: "", prior_test: "", reference: $in.reference}, out: code, label: Write the project}
  - review: {generate: prompts.review_code, in: {code: write.code, lang: $in.lang}, out: feedback, label: Review it}
  - repair:
      loop: "@in_max_cycles"
      while: "NOT @passed"
      in: {spec: $in.spec, lang: $in.lang, reference: $in.reference, smoke: $in.smoke, max_cycles: $in.max_cycles, feedback: review.feedback, code: write.code}
      state:
        code: {from: improve.code}                  # the reply of the latest round, read by the next round
        test_result: {from: report.result}          # what verification said about it
        files: {from: collect.files}
      out:
        passed: {fired: ok.pass}
      steps:
        - improve: {generate: prompts.improve_code, in: {spec: $loop.spec, code: $loop.code, feedback: $loop.feedback, test_result: $loop.test_result, lang: $loop.lang, reference: $loop.reference}, out: code, label: Improve it}
        - collect:
            node: SOLVE
            in: {text: improve.code, lang: $loop.lang, spec: $loop.spec}
            ports: [trigger, complete, in_text, in_lang, in_spec, out_files]
            out: files
            backend: subprocess
            command: ["python3", "-I", "tools/collect_files.py"]
            out_type: JSON
            timeout: 30
            label: Split the reply into the project's files
        - verify:
            node: SOLVE
            in: {files: collect.files, lang: $loop.lang, smoke: $loop.smoke}
            ports: [trigger, complete, in_files, in_lang, in_smoke, out_check]
            out: check
            backend: subprocess
            command: ["python3", "-I", "tools/verify_project.py"]
            parse: first_line
            out_type: TEXT
            timeout: 600
            label: "Run the project: syntax, imports, tests, smoke"
        - ok:     {evaluate: "json_get(@in_check, 'passed') == TRUE", in: {check: verify.check}}
        - report: {solve: "json_get(@in_check, 'report')", in: {check: verify.check}, on: verify}
  - done: {output: {code: repair.code, files: repair.files, report: repair.test_result}}
