version: "1.0-graph"
workflow:
  name: finish
  description: Documents the code and, when check_closure is on, derives a spec back from the code and has a model judge whether it still matches the original.
  inputs:
    - {name: code, type: TEXT}
    - {name: spec, type: TEXT}
    - {name: check_closure, type: BOOL, default: true}
  outputs:
    - {name: docs, type: TEXT}
resources:
  prompts: {document: ./prompts/document.md, extract_spec: ./prompts/extract_spec.md, judge: ./prompts/judge.md}
steps:
  - document: {generate: prompts.document, in: {code: $in.code, spec: $in.spec}, out: docs}
  - closure:  {evaluate: "@in_check_closure == TRUE", in: {check_closure: $in.check_closure}}
  - extract:  {generate: prompts.extract_spec, on: closure.pass, in: {code: $in.code}, out: extracted_spec}
  - judge:    {generate: prompts.judge, on: closure.pass, in: {orig_spec: $in.spec, derived_spec: extract.extracted_spec}, out: closure_report}
  - merge:    {node: CONTEXT, action: append, target_key: final_docs, in: {base: document.docs, appendage: judge.closure_report}, out: merged}
  - checked:  {output: {docs: merge.merged}}
  - skipped:  {output: {docs: document.docs}, on: closure.fail}
