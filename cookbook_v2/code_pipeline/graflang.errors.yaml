errors:
  - code: E_PLAN_VAGUE
    description: no usable build plan came out of the specification
    cause: after max_plan_rounds drafts the plan checker still found it not specific enough (or the planner said the specification cannot be planned)
    remedy: say what the program is called, what it takes and returns, and the cases that matter; or raise max_plan_rounds; the last draft and what was wrong with it are in the run's nodes/
